ew weeks.","questions":[{"num":1,"prompt":"What is the main idea?","choices":[{"label":"A","text":"Kelp is a tree that grows in deep tropical water."},{"label":"B","text":"Kelp forests are productive habitats supported by physical features and relationships among species."},{"label":"C","text":"Sea urchins are the only animals in kelp forests."},{"label":"D","text":"Scientists have stopped studying coastal habitats."}],"answer":"B","explanation":"The passage explains kelp structure, ecological relationships, threats, and restoration.","strand":"Main Idea"},{"num":2,"prompt":"What is the function of a holdfast?","choices":[{"label":"A","text":"It carries soil into the water."},{"label":"B","text":"It produces gas for sea otters."},{"label":"C","text":"It anchors kelp to rock."},{"label":"D","text":"It measures the temperature."}],"answer":"C","explanation":"The second paragraph defines holdfasts as anchors.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, “barren” most nearly means—","choices":[{"label":"A","text":"filled with young kelp"},{"label":"B","text":"protected from waves"},{"label":"C","text":"too deep for sunlight"},{"label":"D","text":"nearly empty of living growth"}],"answer":"D","explanation":"An urchin barren is described as nearly bare.","strand":"Vocabulary"},{"num":4,"prompt":"Why can sea otters help a kelp forest remain healthy?","choices":[{"label":"A","text":"They eat sea urchins that might otherwise destroy too much kelp."},{"label":"B","text":"They plant kelp seeds in the rock."},{"label":"C","text":"They bring warmer water into the forest."},{"label":"D","text":"They prevent all storms from reaching the coast."}],"answer":"A","explanation":"Otter predation can keep urchin numbers under control.","strand":"Inference"},{"num":5,"prompt":"Which conclusion is best supported by the final paragraph?","choices":[{"label":"A","text":"Kelp restoration should be judged over time and in relation to several conditions."},{"label":"B","text":"Water temperature has little effect on kelp recovery."},{"label":"C","text":"Young kelp can grow only when otters are present."},{"label":"D","text":"Removing urchins always restores a kelp forest immediately."}],"answer":"A","explanation":"The paragraph stresses that restoration depends on multiple conditions and should be evaluated across seasons."}]},{"title":"A Room for Every Reader","text":"For much of history, books were costly and difficult to copy. Private collections belonged mainly to rulers, religious institutions, universities, or wealthy families. A person who wanted to read a particular book might have no way to reach it.\n\nSubscription libraries offered one solution. Members paid a fee that allowed them to borrow from a shared collection. These libraries increased access, but the fee still excluded many people. During the nineteenth century, reformers in several countries began supporting public libraries funded by communities and open to all residents.\n\nEarly public libraries were not all alike. Some allowed visitors to browse shelves, while others required readers to request a title from a librarian. Many created separate rooms for newspapers, reference books, or children. Librarians developed catalog systems so a book could be located even as collections grew.\n\nSupporters argued that libraries helped workers continue learning after their school years. Critics worried that communities would spend money on books few people used, or that popular stories would distract readers from serious study. Libraries responded by tracking circulation, offering lectures, and choosing collections that mixed practical information, literature, history, and entertainment.\n\nOver time, public libraries expanded their role. They delivered books to rural areas, taught reading classes, and created children’s programs. Today, many lend digital materials and provide internet access, meeting rooms, or tools. Yet the central idea remains similar to the one promoted by early reformers: useful information should not belong only to people who can afford a private collection. A public library turns a community’s resources into a room—physical or digital—where every reader is invited. Some early libraries carried boxes of books to distant neighborhoods or used traveling book wagons. These services showed that access depended not only on owning books, but also on finding practical ways to bring them to readers.\n\nThe meaning of access has continued to change. A building may be open to everyone, yet a reader can still face barriers if materials are unavailable in a needed language, if technology is difficult to use, or if transportation is limited. Modern librarians therefore think not only about what a collection contains, but also about who can realistically make use of it.","questions":[{"num":1,"prompt":"Which statement best expresses the central idea?","choices":[{"label":"A","text":"Private libraries were always open to everyone."},{"label":"B","text":"Popular stories caused most libraries to close."},{"label":"C","text":"Public libraries developed to make shared information available to a wider community."},{"label":"D","text":"Catalog systems made books more expensive."}],"answer":"C","explanation":"The passage traces expanding public access to books and information.","strand":"Main Idea"},{"num":2,"prompt":"How did subscription libraries differ from later public libraries?","choices":[{"label":"A","text":"They contained only newspapers."},{"label":"B","text":"They never allowed borrowing."},{"label":"C","text":"They were funded by all residents."},{"label":"D","text":"They required members to pay a fee."}],"answer":"D","explanation":"The second paragraph states that subscription members paid.","strand":"Supporting Ideas"},{"num":3,"prompt":"The word “circulation” most nearly refers to—","choices":[{"label":"A","text":"the borrowing and return of materials"},{"label":"B","text":"the movement of air in a room"},{"label":"C","text":"the printing of new books"},{"label":"D","text":"the order of a lecture program"}],"answer":"A","explanation":"Libraries tracked how their materials were used and borrowed.","strand":"Vocabulary"},{"num":4,"prompt":"Why does the author mention critics’ concerns?","choices":[{"label":"A","text":"To prove communities refused to buy books"},{"label":"B","text":"To show that early public libraries had to explain and demonstrate their value"},{"label":"C","text":"To argue that fiction should be removed"},{"label":"D","text":"To describe how catalogs were invented"}],"answer":"B","explanation":"The concerns are followed by library responses.","strand":"Organization/Logic"},{"num":5,"prompt":"What does the final paragraph add to the passage?","choices":[{"label":"A","text":"It explains why subscription libraries were cheaper."},{"label":"B","text":"It broadens the idea of access beyond simply opening a building."},{"label":"C","text":"It proves digital libraries are better than physical ones."},{"label":"D","text":"It argues that libraries should stop lending books."}],"answer":"B","explanation":"The final paragraph shows that true access also depends on language, technology, transportation, and usability."}]},{"title":"Mapping the Sound of a Neighborhood","text":"When students at Harbor School began studying sound, they first measured obvious noises: a ringing bell, a passing bus, and music from a speaker. Then their teacher asked a harder question. Which parts of the neighborhood were quiet, and which were noisy throughout the day?\n\nThe class divided a map into small sections. Teams visited each location at the same three times—morning, midday, and late afternoon. A sound meter recorded volume in decibels. Students also wrote down the source of each sound, such as traffic, construction, birds, conversation, or wind.\n\nThe first map was confusing. One team had stood beside a wall that reflected sound, while another had measured from inside a doorway. The class created a clearer procedure: hold the meter at the same height, stand away from large surfaces, and record for exactly one minute. They repeated the survey.\n\nPatterns appeared. Streets near the highway stayed loud all day. The playground was noisy at midday but quiet after school. A small park was usually calm, except when landscaping equipment operated on Thursday morning. Students learned that a single measurement could be misleading.\n\nThe class shared the map with a neighborhood planning group. The students did not claim that every loud place was harmful. A busy market, for example, was noisy because people gathered there. Instead, they suggested planting shrubs near one apartment building and changing the time when delivery trucks used a narrow street. Their project showed how careful data collection can turn an everyday experience into useful evidence for community decisions. The students also recorded wind and weather because rain or strong gusts could change a reading. By repeating measurements on several days, they could separate a lasting sound pattern from a brief event that happened only once. They then marked uncertain results for another visit before sharing the map.\n\nThe project also taught the students that data do not automatically explain what should be done. A loud market and a loud construction site might produce similar readings, yet residents may value one and complain about the other. The numbers helped describe conditions; community discussions were still needed to decide which changes would actually improve daily life.","questions":[{"num":1,"prompt":"What was the main goal of the class project?","choices":[{"label":"A","text":"To prove that all neighborhood noise was harmful"},{"label":"B","text":"To compare three brands of sound meters"},{"label":"C","text":"To eliminate sound from the school playground"},{"label":"D","text":"To identify sound patterns across locations and times in the neighborhood"}],"answer":"D","explanation":"The students mapped how sound changed by place and time.","strand":"Main Idea"},{"num":2,"prompt":"Why did the class repeat its first survey?","choices":[{"label":"A","text":"Different measuring methods made the original results difficult to compare."},{"label":"B","text":"The first map had been lost."},{"label":"C","text":"The neighborhood group demanded louder results."},{"label":"D","text":"Students forgot to record any sound sources."}],"answer":"A","explanation":"They standardized height, location, and time after noticing inconsistency.","strand":"Supporting Ideas"},{"num":3,"prompt":"The word “misleading” most nearly means—","choices":[{"label":"A","text":"extremely precise"},{"label":"B","text":"likely to create a wrong impression"},{"label":"C","text":"easy to repeat"},{"label":"D","text":"too quiet to measure"}],"answer":"B","explanation":"One measurement could give an inaccurate impression of typical conditions.","strand":"Vocabulary"},{"num":4,"prompt":"What can be inferred about the Thursday park measurement?","choices":[{"label":"A","text":"The park was always the loudest location."},{"label":"B","text":"Landscaping occurred every afternoon."},{"label":"C","text":"It represented a temporary event rather than the park’s usual sound level."},{"label":"D","text":"The meter could not record machinery."}],"answer":"C","explanation":"The passage says the park was usually calm except during landscaping.","strand":"Inference"},{"num":5,"prompt":"What limitation of the sound data does the final paragraph emphasize?","choices":[{"label":"A","text":"The meters could not record traffic."},{"label":"B","text":"The students measured too few locations."},{"label":"C","text":"Weather never affects sound readings."},{"label":"D","text":"Similar sound levels can have different meanings to a community."}],"answer":"D","explanation":"The same measured loudness can come from activities people value differently, so data alone do not decide policy."}]},{"title":"Pictures Built from Pieces","text":"A mosaic is an image made from many small pieces fitted together. The pieces, called tesserae, may be stone, glass, shell, ceramic, or other materials. From nearby, a mosaic can look like a collection of separate shapes. From farther away, colors and lines combine into figures, patterns, or entire scenes.\n\nMosaic artists plan carefully before attaching any pieces. They may draw the design at full size and divide it into sections. Large areas of background can be filled with fairly regular pieces, while faces, hands, and curved objects require smaller or specially shaped tesserae. The direction of the pieces can suggest movement. Rows that bend around a fish, for example, can make the water appear to flow.\n\nAncient mosaics have survived on floors and walls in many regions. Roman artists created scenes of animals, food, theater, and daily life. Byzantine artists often used colored glass and gold-backed pieces on walls and ceilings. Because the pieces reflected light from slightly different angles, figures seemed to shimmer as a viewer moved.\n\nMaking a durable mosaic requires more than arranging color. The surface beneath it must be stable. Mortar holds the pieces, and grout fills the narrow spaces between them. Outdoor mosaics must also withstand rain, heat, and freezing temperatures.\n\nContemporary artists use mosaics in parks, transit stations, schools, and community murals. Some projects invite hundreds of people to create individual tiles that become part of one image. This method suits the art especially well. A mosaic depends on differences: each piece keeps its own shape and color, yet also contributes to a larger design that no single piece could create alone. Artists often test several color arrangements before setting the pieces in mortar. A shade that looks too bright by itself may blend perfectly when surrounded by neighboring pieces and viewed from across a large room.\n\nThis difference between close-up and distant viewing creates a special design problem. An artist must judge each tessera as an individual object and as part of a larger pattern. A line that appears jagged from a few inches away may look smooth across a room. Experienced mosaicists therefore step back repeatedly while working, testing whether local choices support the image as a whole.","questions":[{"num":1,"prompt":"What is the passage mainly about?","choices":[{"label":"A","text":"How mosaic artists combine materials, planning, and technique to create images"},{"label":"B","text":"Why mosaics can be made only from glass"},{"label":"C","text":"How to remove old floors from buildings"},{"label":"D","text":"Why paintings last longer than mosaics"}],"answer":"A","explanation":"The passage explains design, materials, history, construction, and modern uses.","strand":"Main Idea"},{"num":2,"prompt":"How can the direction of tesserae affect an image?","choices":[{"label":"A","text":"It determines whether mortar will dry."},{"label":"B","text":"It can create an impression of motion or flow."},{"label":"C","text":"It makes every piece the same size."},{"label":"D","text":"It prevents viewers from seeing color."}],"answer":"B","explanation":"The fish example shows rows suggesting flowing water.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, “durable” most nearly means—","choices":[{"label":"A","text":"easy to carry"},{"label":"B","text":"quick to finish"},{"label":"C","text":"able to last despite wear or weather"},{"label":"D","text":"soft enough to bend"}],"answer":"C","explanation":"A durable mosaic withstands outdoor conditions.","strand":"Vocabulary"},{"num":4,"prompt":"Why did Byzantine mosaics seem to shimmer?","choices":[{"label":"A","text":"They were placed under moving water."},{"label":"B","text":"Artists repainted them every day."},{"label":"C","text":"The grout changed color when viewers moved."},{"label":"D","text":"Glass and gold-backed pieces reflected light at different angles."}],"answer":"D","explanation":"The third paragraph describes the changing reflections.","strand":"Supporting Ideas"},{"num":5,"prompt":"Why does the author mention stepping back from a mosaic while working?","choices":[{"label":"A","text":"To explain how artists keep mortar from drying."},{"label":"B","text":"To show that large tesserae are always better than small ones."},{"label":"C","text":"To show that a piece can look different alone than it does in the complete image."},{"label":"D","text":"To prove mosaics must be viewed from far away."}],"answer":"C","explanation":"Stepping back lets the artist judge how individual choices contribute to the larger design."}]},{"title":"The Long Way Around","text":"When the robotics club’s cart stopped in front of the auditorium, Jamal immediately blamed the left wheel. The cart had turned in circles during its final test, and the left wheel squeaked each time it moved.\n\n“We only have twenty minutes before the demonstration,” said Priya. “Let’s replace it.”\n\nJamal reached for the toolbox, but Elena knelt beside the cart. “A squeak tells us something is rubbing,” she said. “It doesn’t prove the wheel is causing the turning.” She placed two strips of tape on the floor and asked Jamal to push the cart forward without using its motor. It rolled nearly straight.\n\nNext, they lifted the cart so the wheels could spin freely. Priya switched on the motor. The left wheel turned quickly; the right one moved in short jerks. Jamal checked the wires and found them firmly connected. Elena noticed that a loop of ribbon from a decoration had slipped around the right axle.\n\nThey cut away the ribbon. Both wheels spun smoothly, but the cart still drifted slightly. The club adjusted the speed setting for the right motor, then tested the cart along the taped lines. This time it traveled straight to the auditorium doors.\n\nAfter the demonstration, Jamal admitted that replacing the squeaky wheel would have used most of their remaining time without solving the real problem. Elena pointed out that the squeak had not been useless; it had simply drawn their attention to the wrong side. “The quickest solution,” she said, “is not always the first idea. Sometimes the quickest route is the one that checks the evidence.”\n\nJamal laughed. “So the long way around was actually shorter.” The club wrote the cause and the successful fix in its project notebook. At the next meeting, members used the record to create a checklist for testing movement, wiring, decorations, and motor speed before future demonstrations.\n\nAt later meetings, the checklist did not replace thinking. It simply gave the club a disciplined starting point. Members still had to decide which observation mattered most and when a new clue justified changing direction. The lesson from the cart was not that every problem has a fixed sequence, but that evidence should guide the sequence of questions.","questions":[{"num":1,"prompt":"What is the central conflict in the story?","choices":[{"label":"A","text":"The club has forgotten where the auditorium is."},{"label":"B","text":"The club must determine why the cart turns in circles before the demonstration."},{"label":"C","text":"Jamal refuses to attend the demonstration."},{"label":"D","text":"Elena wants to remove all decorations."}],"answer":"B","explanation":"The time-limited troubleshooting drives the story.","strand":"Main Idea"},{"num":2,"prompt":"What evidence showed that the left wheel was probably not the main cause?","choices":[{"label":"A","text":"The left wheel made a squeak."},{"label":"B","text":"Priya wanted to replace it."},{"label":"C","text":"The cart rolled nearly straight when pushed without the motor."},{"label":"D","text":"The auditorium doors were open."}],"answer":"C","explanation":"The manual test separated the wheels from the motor problem.","strand":"Supporting Ideas"},{"num":3,"prompt":"The word “drifted” most nearly means—","choices":[{"label":"A","text":"stopped without warning"},{"label":"B","text":"made a loud sound"},{"label":"C","text":"rolled backward rapidly"},{"label":"D","text":"moved gradually away from a straight course"}],"answer":"D","explanation":"After the ribbon was removed, the cart still moved slightly off course.","strand":"Vocabulary"},{"num":4,"prompt":"Why was the squeak “not useless”?","choices":[{"label":"A","text":"It encouraged investigation, even though it pointed attention toward the wrong wheel."},{"label":"B","text":"It caused the ribbon to wrap around the axle."},{"label":"C","text":"It proved the left wheel needed replacement."},{"label":"D","text":"It made the demonstration more entertaining."}],"answer":"A","explanation":"The clue mattered but was interpreted too quickly.","strand":"Inference"},{"num":5,"prompt":"What does the final paragraph suggest about the checklist?","choices":[{"label":"A","text":"It is useful only when a wheel squeaks."},{"label":"B","text":"It guarantees the same solution for every problem."},{"label":"C","text":"It replaces the need for observation."},{"label":"D","text":"It provides a starting structure, but evidence still determines what to do next."}],"answer":"D","explanation":"The checklist organizes the investigation, but members still have to interpret new evidence."}]}],"minutes":25},"math":{"questions":[{"num":1,"prompt":"What is 154 × 9?","choices":[{"label":"A","text":"1232"},{"label":"B","text":"1386"},{"label":"C","text":"1540"},{"label":"D","text":"1377"}],"answer":"B","explanation":"154 × 9 = 1386."},{"num":2,"prompt":"What is 480 ÷ 8?","choices":[{"label":"A","text":"52"},{"label":"B","text":"61"},{"label":"C","text":"60"},{"label":"D","text":"59"}],"answer":"C","explanation":"480 ÷ 8 = 60."},{"num":3,"prompt":"What is the value of 10 + 5 × 2?","choices":[{"label":"A","text":"20"},{"label":"B","text":"30"},{"label":"C","text":"25"},{"label":"D","text":"52"}],"answer":"A","explanation":"Multiply first: 5×2=10; then add 10 to get 20."},{"num":4,"prompt":"What is 3/4 + 1/4?","choices":[{"label":"A","text":"1"},{"label":"B","text":"1/2"},{"label":"C","text":"1/4"},{"label":"D","text":"3/4"}],"answer":"A","explanation":"Use a common denominator; the sum is 1."},{"num":5,"prompt":"What is 1,428 ÷ 14?","choices":[{"label":"A","text":"92"},{"label":"B","text":"102"},{"label":"C","text":"112"},{"label":"D","text":"120"}],"answer":"B","explanation":"14×102=1,428."},{"num":6,"prompt":"Which decimal is equivalent to 7/20?","choices":[{"label":"A","text":"0.07"},{"label":"B","text":"0.7"},{"label":"C","text":"0.35"},{"label":"D","text":"3.5"}],"answer":"C","explanation":"7/20=35/100=0.35."},{"num":7,"prompt":"What is 3/4 + 2/3?","choices":[{"label":"A","text":"5/7"},{"label":"B","text":"1 1/12"},{"label":"C","text":"1 7/12"},{"label":"D","text":"1 5/12"}],"answer":"D","explanation":"9/12+8/12=17/12=1 5/12."},{"num":8,"prompt":"What is 2 1/5 - 3/5?","choices":[{"label":"A","text":"1 3/5"},{"label":"B","text":"1 2/5"},{"label":"C","text":"1 4/5"},{"label":"D","text":"2 2/5"}],"answer":"A","explanation":"2 1/5=1 6/5; subtract 3/5."},{"num":9,"prompt":"What is 6.4 × 0.5?","choices":[{"label":"A","text":"0.32"},{"label":"B","text":"3.2"},{"label":"C","text":"3.7"},{"label":"D","text":"32"}],"answer":"B","explanation":"Multiplying by one-half gives half of 6.4."},{"num":10,"prompt":"What is 15% of 80?","choices":[{"label":"A","text":"8"},{"label":"B","text":"15"},{"label":"C","text":"12"},{"label":"D","text":"20"}],"answer":"C","explanation":"10% is 8 and 5% is 4; total 12."},{"num":11,"prompt":"Evaluate 24 ÷ 6 + 5 × 3.","choices":[{"label":"A","text":"17"},{"label":"B","text":"27"},{"label":"C","text":"35"},{"label":"D","text":"19"}],"answer":"D","explanation":"Divide and multiply first: 4+15."},{"num":12,"prompt":"If 3x - 5 = 19, what is x?","choices":[{"label":"A","text":"8"},{"label":"B","text":"6"},{"label":"C","text":"7"},{"label":"D","text":"13"}],"answer":"A","explanation":"Add 5 to get 24; divide by 3."},{"num":13,"prompt":"Simplify 4a + 3a - 2.","choices":[{"label":"A","text":"7a + 2"},{"label":"B","text":"7a - 2"},{"label":"C","text":"12a - 2"},{"label":"D","text":"7a"}],"answer":"B","explanation":"Combine like terms."},{"num":14,"prompt":"The rule is y = 2x + 5. Which ordered pair follows the rule?","choices":[{"label":"A","text":"(3, 9)"},{"label":"B","text":"(5, 12)"},{"label":"C","text":"(4, 13)"},{"label":"D","text":"(6, 15)"}],"answer":"C","explanation":"2(4)+5=13."},{"num":15,"prompt":"Which inequality is true when n = 7?","choices":[{"label":"A","text":"2n > 15"},{"label":"B","text":"n + 5 > 13"},{"label":"C","text":"4n < 25"},{"label":"D","text":"3n > 20"}],"answer":"D","explanation":"3×7=21>20; the others are false."},{"num":16,"prompt":"A parallelogram has base 14 cm and height 6 cm. What is its area?","choices":[{"label":"A","text":"84 cm²"},{"label":"B","text":"40 cm²"},{"label":"C","text":"42 cm²"},{"label":"D","text":"168 cm²"}],"answer":"A","explanation":"Area=base×height."},{"num":17,"prompt":"A rectangular prism has length 8, width 5, and height 3. What is its volume?","choices":[{"label":"A","text":"40"},{"label":"B","text":"120 cubic units"},{"label":"C","text":"80"},{"label":"D","text":"240"}],"answer":"B","explanation":"8×5×3=120."},{"num":18,"prompt":"What is the measure of a straight angle?","choices":[{"label":"A","text":"90°"},{"label":"B","text":"270°"},{"label":"C","text":"180°"},{"label":"D","text":"360°"}],"answer":"C","explanation":"A straight angle is 180°."},{"num":19,"prompt":"A square has area 121 square units. What is its side length?","choices":[{"label":"A","text":"22 units"},{"label":"B","text":"30 units"},{"label":"C","text":"60.5 units"},{"label":"D","text":"11 units"}],"answer":"D","explanation":"11×11=121."},{"num":20,"prompt":"Which pair of lines will never meet?","choices":[{"label":"A","text":"Parallel lines"},{"label":"B","text":"Intersecting lines"},{"label":"C","text":"Perpendicular lines"},{"label":"D","text":"Two rays with the same endpoint"}],"answer":"A","explanation":"Parallel lines stay the same distance apart."},{"num":21,"prompt":"How many feet are in 3 1/2 yards?","choices":[{"label":"A","text":"6.5 feet"},{"label":"B","text":"10.5 feet"},{"label":"C","text":"9.5 feet"},{"label":"D","text":"12 feet"}],"answer":"B","explanation":"Each yard has 3 feet: 3.5×3."},{"num":22,"prompt":"A jug contains 2.75 liters. How many milliliters is that?","choices":[{"label":"A","text":"275 mL"},{"label":"B","text":"2,075 mL"},{"label":"C","text":"2,750 mL"},{"label":"D","text":"27,500 mL"}],"answer":"C","explanation":"Multiply liters by 1,000."},{"num":23,"prompt":"A suitcase weighs 6 kilograms 350 grams. How many grams is that?","choices":[{"label":"A","text":"635 grams"},{"label":"B","text":"6,035 grams"},{"label":"C","text":"63,500 grams"},{"label":"D","text":"6,350 grams"}],"answer":"D","explanation":"6 kilograms=6,000 grams; add 350."},{"num":24,"prompt":"A room is 9 m by 7 m. A 3 m by 2 m rug covers part of the floor. How many square meters are uncovered?","choices":[{"label":"A","text":"57 m²"},{"label":"B","text":"51 m²"},{"label":"C","text":"63 m²"},{"label":"D","text":"69 m²"}],"answer":"A","explanation":"Room area 63 minus rug area 6."},{"num":25,"prompt":"A movie begins at 1:58 P.M. and lasts 2 hours 17 minutes. When does it end?","choices":[{"label":"A","text":"3:15 P.M."},{"label":"B","text":"4:15 P.M."},{"label":"C","text":"4:05 P.M."},{"label":"D","text":"4:25 P.M."}],"answer":"B","explanation":"1:58 + 2:17 = 4:15."},{"num":26,"prompt":"What is the median of 4, 7, 9, 11, 15, and 20?","choices":[{"label":"A","text":"9"},{"label":"B","text":"11"},{"label":"C","text":"10"},{"label":"D","text":"12"}],"answer":"C","explanation":"Average the two middle values 9 and 11."},{"num":27,"prompt":"A bag has 3 red, 4 blue, and 5 yellow tiles. What is the probability of not choosing yellow?","choices":[{"label":"A","text":"5/12"},{"label":"B","text":"7/5"},{"label":"C","text":"5/7"},{"label":"D","text":"7/12"}],"answer":"D","explanation":"Seven of twelve tiles are not yellow."},{"num":28,"prompt":"The data are 6, 7, 7, 8, 10, 10, 10, 12. What is the mode?","choices":[{"label":"A","text":"10"},{"label":"B","text":"7"},{"label":"C","text":"8"},{"label":"D","text":"12"}],"answer":"A","explanation":"10 appears most often."},{"num":29,"prompt":"A table lists 18 visitors Monday, 24 Tuesday, 21 Wednesday, and 27 Thursday. What is the mean?","choices":[{"label":"A","text":"21"},{"label":"B","text":"22.5"},{"label":"C","text":"22"},{"label":"D","text":"23"}],"answer":"B","explanation":"Total 90 divided by 4.","visual":"<div class=\"lower-table-wrap\"><table class=\"lower-data-table\"><thead><tr><th>Day</th><th>Visitors</th></tr></thead><tbody><tr><td>Mon</td><td>18</td></tr><tr><td>Tue</td><td>24</td></tr><tr><td>Wed</td><td>21</td></tr><tr><td>Thu</td><td>27</td></tr></tbody></table></div>"},{"num":30,"prompt":"A spinner has 10 equal sections numbered 1 to 10. What is the probability of a number greater than 7?","choices":[{"label":"A","text":"1/5"},{"label":"B","text":"7/10"},{"label":"C","text":"3/10"},{"label":"D","text":"3/7"}],"answer":"C","explanation":"The favorable numbers are 8, 9, and 10."}],"minutes":30},"essay":{"prompt":"Imagine that your community can create one new place especially for young people. Describe the place and explain how it would help the community.","guidance":"Make your idea clear, support it with reasons and examples, and organize your response into paragraphs.","minutes":30},"difficulty":{"label":"Developing","score":2,"description":"More context clues, multi-step reasoning, and less direct answer choices."}},"lower-test3":{"title":"Lower Level Practice Test #3","verbal":{"minutes":20,"questions":[{"num":1,"prompt":"ALLEVIATE:","choices":[{"label":"A","text":"relieve"},{"label":"B","text":"intensify"},{"label":"C","text":"measure"},{"label":"D","text":"postpone"}],"answer":"A","explanation":"To alleviate is to make pain or a problem less severe.","part":"Synonyms"},{"num":2,"prompt":"CANDID:","choices":[{"label":"A","text":"hostile"},{"label":"B","text":"honest"},{"label":"C","text":"formal"},{"label":"D","text":"uncertain"}],"answer":"B","explanation":"Candid means honest and direct.","part":"Synonyms"},{"num":3,"prompt":"COHERENT:","choices":[{"label":"A","text":"colorful"},{"label":"B","text":"fragile"},{"label":"C","text":"random"},{"label":"D","text":"logical"}],"answer":"D","explanation":"Coherent ideas are logically connected and easy to follow.","part":"Synonyms"},{"num":4,"prompt":"DELIBERATE:","choices":[{"label":"A","text":"rapid"},{"label":"B","text":"temporary"},{"label":"C","text":"intentional"},{"label":"D","text":"accidental"}],"answer":"C","explanation":"Deliberate means done intentionally and with thought.","part":"Synonyms"},{"num":5,"prompt":"ELUSIVE:","choices":[{"label":"A","text":"hard to find"},{"label":"B","text":"protected"},{"label":"C","text":"ordinary"},{"label":"D","text":"obvious"}],"answer":"A","explanation":"Elusive describes something difficult to find, catch, or understand.","part":"Synonyms"},{"num":6,"prompt":"FORMIDABLE:","choices":[{"label":"A","text":"harmless"},{"label":"B","text":"challenging"},{"label":"C","text":"minor"},{"label":"D","text":"pleasant"}],"answer":"B","explanation":"Formidable means difficult or impressive enough to inspire respect.","part":"Synonyms"},{"num":7,"prompt":"INEVITABLE:","choices":[{"label":"A","text":"unavoidable"},{"label":"B","text":"optional"},{"label":"C","text":"secret"},{"label":"D","text":"unlikely"}],"answer":"A","explanation":"Inevitable means certain to happen or impossible to avoid.","part":"Synonyms"},{"num":8,"prompt":"LUCID:","choices":[{"label":"A","text":"lengthy"},{"label":"B","text":"silent"},{"label":"C","text":"clear"},{"label":"D","text":"confusing"}],"answer":"C","explanation":"Lucid means clear and easy to understand.","part":"Synonyms"},{"num":9,"prompt":"METHODICAL:","choices":[{"label":"A","text":"sudden"},{"label":"B","text":"vague"},{"label":"C","text":"reckless"},{"label":"D","text":"orderly"}],"answer":"D","explanation":"Methodical means done in a careful, organized way.","part":"Synonyms"},{"num":10,"prompt":"NOVEL:","choices":[{"label":"A","text":"ordinary"},{"label":"B","text":"ancient"},{"label":"C","text":"repeated"},{"label":"D","text":"original"}],"answer":"D","explanation":"Novel can mean new and original.","part":"Synonyms"},{"num":11,"prompt":"OBSCURE:","choices":[{"label":"A","text":"precise"},{"label":"B","text":"unclear"},{"label":"C","text":"famous"},{"label":"D","text":"obvious"}],"answer":"B","explanation":"Obscure can mean unclear or difficult to understand.","part":"Synonyms"},{"num":12,"prompt":"PERSIST:","choices":[{"label":"A","text":"continue"},{"label":"B","text":"hesitate"},{"label":"C","text":"divide"},{"label":"D","text":"abandon"}],"answer":"A","explanation":"To persist is to continue despite difficulty.","part":"Synonyms"},{"num":13,"prompt":"RELEVANT:","choices":[{"label":"A","text":"applicable"},{"label":"B","text":"unrelated"},{"label":"C","text":"remote"},{"label":"D","text":"decorative"}],"answer":"A","explanation":"Relevant means closely connected to the matter being considered.","part":"Synonyms"},{"num":14,"prompt":"RESILIENT:","choices":[{"label":"A","text":"careless"},{"label":"B","text":"adaptable"},{"label":"C","text":"temporary"},{"label":"D","text":"brittle"}],"answer":"B","explanation":"Resilient means able to recover or adjust after difficulty.","part":"Synonyms"},{"num":15,"prompt":"SUBSTANTIAL:","choices":[{"label":"A","text":"considerable"},{"label":"B","text":"tiny"},{"label":"C","text":"uncertain"},{"label":"D","text":"vertical"}],"answer":"A","explanation":"Substantial means large or important in amount.","part":"Synonyms"},{"num":16,"prompt":"TENTATIVE:","choices":[{"label":"A","text":"forceful"},{"label":"B","text":"final"},{"label":"C","text":"obvious"},{"label":"D","text":"uncertain"}],"answer":"D","explanation":"Tentative means not fully decided or certain.","part":"Synonyms"},{"num":17,"prompt":"VERIFY:","choices":[{"label":"A","text":"guess"},{"label":"B","text":"conceal"},{"label":"C","text":"confirm"},{"label":"D","text":"reverse"}],"answer":"C","explanation":"To verify is to check and confirm that something is true.","part":"Synonyms"},{"num":18,"prompt":"The nurse placed a cool cloth on the athlete's forehead to _____ some of the discomfort caused by the heat.","choices":[{"label":"A","text":"measure"},{"label":"B","text":"intensify"},{"label":"C","text":"alleviate"},{"label":"D","text":"record"}],"answer":"C","explanation":"To alleviate discomfort is to reduce it.","part":"Sentence Completion"},{"num":19,"prompt":"Lena gave a _____ answer, admitting that she had forgotten to complete her part of the project.","choices":[{"label":"A","text":"ornate"},{"label":"B","text":"candid"},{"label":"C","text":"vague"},{"label":"D","text":"hostile"}],"answer":"B","explanation":"An honest, direct answer is candid.","part":"Sentence Completion"},{"num":20,"prompt":"The explanation was _____ because each idea followed logically from the one before it.","choices":[{"label":"A","text":"coherent"},{"label":"B","text":"fragile"},{"label":"C","text":"random"},{"label":"D","text":"secret"}],"answer":"A","explanation":"A logically connected explanation is coherent.","part":"Sentence Completion"},{"num":21,"prompt":"The team made a _____ choice to test the slower design first, even though the faster one looked more exciting.","choices":[{"label":"A","text":"accidental"},{"label":"B","text":"careless"},{"label":"C","text":"temporary"},{"label":"D","text":"deliberate"}],"answer":"D","explanation":"A choice made intentionally after thought is deliberate.","part":"Sentence Completion"},{"num":22,"prompt":"The animal remained _____; researchers saw tracks but never managed to photograph it.","choices":[{"label":"A","text":"obvious"},{"label":"B","text":"common"},{"label":"C","text":"elusive"},{"label":"D","text":"tame"}],"answer":"C","explanation":"Something difficult to find is elusive.","part":"Sentence Completion"},{"num":23,"prompt":"Completing the mountain route in one day was a _____ challenge even for experienced hikers.","choices":[{"label":"A","text":"formidable"},{"label":"B","text":"minor"},{"label":"C","text":"pleasant"},{"label":"D","text":"ordinary"}],"answer":"A","explanation":"A formidable challenge is difficult and demanding.","part":"Sentence Completion"},{"num":24,"prompt":"Once the crack spread through the thin ice, further damage became almost _____.","choices":[{"label":"A","text":"secret"},{"label":"B","text":"inevitable"},{"label":"C","text":"unlikely"},{"label":"D","text":"optional"}],"answer":"B","explanation":"Given the spreading crack, more damage was difficult to avoid.","part":"Sentence Completion"},{"num":25,"prompt":"The scientist rewrote the paragraph so that a younger audience would find it more _____.","choices":[{"label":"A","text":"lengthy"},{"label":"B","text":"confusing"},{"label":"C","text":"technical"},{"label":"D","text":"lucid"}],"answer":"D","explanation":"Lucid writing is clear and understandable.","part":"Sentence Completion"},{"num":26,"prompt":"Rather than guessing, Omar used a _____ process: measure, record, compare, and then decide.","choices":[{"label":"A","text":"methodical"},{"label":"B","text":"casual"},{"label":"C","text":"sudden"},{"label":"D","text":"reckless"}],"answer":"A","explanation":"The ordered series of steps is methodical.","part":"Sentence Completion"},{"num":27,"prompt":"The engineers tested a _____ solution that used flexible panels instead of the usual rigid frame.","choices":[{"label":"A","text":"novel"},{"label":"B","text":"temporary"},{"label":"C","text":"minor"},{"label":"D","text":"traditional"}],"answer":"A","explanation":"A new and original solution is novel.","part":"Sentence Completion"},{"num":28,"prompt":"Because the directions were _____, two groups interpreted the final step differently.","choices":[{"label":"A","text":"precise"},{"label":"B","text":"brief"},{"label":"C","text":"obscure"},{"label":"D","text":"obvious"}],"answer":"C","explanation":"Directions that are difficult to understand are obscure.","part":"Sentence Completion"},{"num":29,"prompt":"Even after two failed attempts, the students chose to _____ until the robot could turn correctly.","choices":[{"label":"A","text":"scatter"},{"label":"B","text":"hesitate"},{"label":"C","text":"persist"},{"label":"D","text":"withdraw"}],"answer":"C","explanation":"Continuing despite failure means persisting.","part":"Sentence Completion"},{"num":30,"prompt":"The witness's comment was interesting but not _____ to the question the committee was trying to answer.","choices":[{"label":"A","text":"recent"},{"label":"B","text":"relevant"},{"label":"C","text":"visible"},{"label":"D","text":"polite"}],"answer":"B","explanation":"Relevant information directly relates to the issue.","part":"Sentence Completion"},{"num":31,"prompt":"The coastal plants are surprisingly _____ and often recover after strong winds bend their stems.","choices":[{"label":"A","text":"rigid"},{"label":"B","text":"resilient"},{"label":"C","text":"fragile"},{"label":"D","text":"temporary"}],"answer":"B","explanation":"Plants that recover after stress are resilient.","part":"Sentence Completion"},{"num":32,"prompt":"The repair required a _____ amount of time because several damaged parts had to be replaced.","choices":[{"label":"A","text":"uncertain"},{"label":"B","text":"brief"},{"label":"C","text":"substantial"},{"label":"D","text":"tiny"}],"answer":"C","explanation":"Several repairs would require a considerable amount of time.","part":"Sentence Completion"},{"num":33,"prompt":"The committee's schedule is still _____ because two speakers have not confirmed their arrival times.","choices":[{"label":"A","text":"final"},{"label":"B","text":"tentative"},{"label":"C","text":"rigid"},{"label":"D","text":"obvious"}],"answer":"B","explanation":"An unconfirmed schedule is tentative.","part":"Sentence Completion"},{"num":34,"prompt":"Before publishing the result, the students repeated the measurement to _____ their calculation.","choices":[{"label":"A","text":"guess"},{"label":"B","text":"verify"},{"label":"C","text":"conceal"},{"label":"D","text":"reverse"}],"answer":"B","explanation":"Repeating a measurement can verify a result.","part":"Sentence Completion"}]},"quantitative":{"minutes":35,"questions":[{"num":1,"prompt":"The pattern is 10, 15, 13, 18, 16, ___. The rule alternates +5, −2. What comes next?","choices":[{"label":"A","text":"22"},{"label":"B","text":"19"},{"label":"C","text":"21"},{"label":"D","text":"20"}],"answer":"C","explanation":"After subtracting 2, the next step is +5, giving 21."},{"num":2,"prompt":"The ratio of red tiles to blue tiles is 3:8. If there are 21 red tiles, how many blue tiles are there?","choices":[{"label":"A","text":"29"},{"label":"B","text":"56"},{"label":"C","text":"48"},{"label":"D","text":"64"}],"answer":"B","explanation":"The ratio was multiplied by 7, so blue tiles = 8×7=56."},{"num":3,"prompt":"If 5 × □ = 35, what number belongs in the box?","choices":[{"label":"A","text":"7"},{"label":"B","text":"5"},{"label":"C","text":"9"},{"label":"D","text":"30"}],"answer":"A","explanation":"35 ÷ 5 = 7."},{"num":4,"prompt":"If 8 × 6 = 48, which equation is in the same fact family?","choices":[{"label":"A","text":"48 ÷ 6 = 9"},{"label":"B","text":"48 - 8 = 6"},{"label":"C","text":"48 ÷ 8 = 6"},{"label":"D","text":"8 + 6 = 48"}],"answer":"C","explanation":"Multiplication and division are inverse operations."},{"num":5,"prompt":"What is the median of the data set 6, 9, 12, 15, 24?","choices":[{"label":"A","text":"13"},{"label":"B","text":"24"},{"label":"C","text":"6"},{"label":"D","text":"12"}],"answer":"D","explanation":"With five ordered values, the median is the middle value."},{"num":6,"prompt":"A number machine follows the rule “multiply the input by 2, then add 3.” What is the output when the input is 7?","choices":[{"label":"A","text":"10"},{"label":"B","text":"19"},{"label":"C","text":"14"},{"label":"D","text":"17"}],"answer":"D","explanation":"Apply the rule in order: multiply by 2, then add 3."},{"num":7,"prompt":"If (★ + ★ + 6) × 2 = 28, what is the value of ★?","choices":[{"label":"A","text":"6"},{"label":"B","text":"14"},{"label":"C","text":"8"},{"label":"D","text":"4"}],"answer":"D","explanation":"Divide by 2 first, subtract 6, then split the remainder equally between the two stars."},{"num":8,"prompt":"Which fraction has the smallest value?","choices":[{"label":"A","text":"3/8"},{"label":"B","text":"5/12"},{"label":"C","text":"2/5"},{"label":"D","text":"1/3"}],"answer":"D","explanation":"Compare the fractions by converting them to equivalent decimals or common denominators."},{"num":9,"prompt":"A box holds 72 beads. 3/4 are used for one project, and 6 more are used later. How many beads remain?","choices":[{"label":"A","text":"8"},{"label":"B","text":"6"},{"label":"C","text":"18"},{"label":"D","text":"12"}],"answer":"D","explanation":"3/4 of 72 is 54. Then 72−54−6=12."},{"num":10,"prompt":"A supply room receives 18 boxes with 12 markers in each box. After 65 markers are used, how many remain?","choices":[{"label":"A","text":"216"},{"label":"B","text":"281"},{"label":"C","text":"151"},{"label":"D","text":"65"}],"answer":"C","explanation":"Multiply to find the total number of markers, then subtract the number used."},{"num":11,"prompt":"The mean of five numbers is 20. Four are 15, 18, 21, 23. What is the fifth number?","choices":[{"label":"A","text":"25"},{"label":"B","text":"20"},{"label":"C","text":"23"},{"label":"D","text":"21"}],"answer":"C","explanation":"The total must be 100. Subtracting the four known values leaves 23."},{"num":12,"prompt":"Which fraction is equivalent to 3/5?","choices":[{"label":"A","text":"6/15"},{"label":"B","text":"4/6"},{"label":"C","text":"9/15"},{"label":"D","text":"6/7"}],"answer":"C","explanation":"Multiplying numerator and denominator by the same nonzero number creates an equivalent fraction."},{"num":13,"prompt":"Adult tickets cost $13 and child tickets cost $8. Which expression gives the cost for 3 adults and 4 children?","choices":[{"label":"A","text":"(13 × 4) + (8 × 3)"},{"label":"B","text":"(13 × 3) + (8 × 4)"},{"label":"C","text":"(13 + 8) × (3 + 4)"},{"label":"D","text":"(13 × 3) - (8 × 4)"}],"answer":"B","explanation":"Multiply each ticket price by the number of tickets of that type, then add."},{"num":14,"prompt":"Of 84 counters, 35 are red and the rest are blue. What fraction of the counters are blue?","choices":[{"label":"A","text":"49/84"},{"label":"B","text":"49/35"},{"label":"C","text":"84/49"},{"label":"D","text":"35/84"}],"answer":"A","explanation":"Subtract red counters from the total to find the number of blue counters, then place that over the total."},{"num":15,"prompt":"Which improper fraction equals 4 2/3?","choices":[{"label":"A","text":"12/3"},{"label":"B","text":"14/3"},{"label":"C","text":"14/4"},{"label":"D","text":"6/3"}],"answer":"B","explanation":"Multiply the whole number by the denominator and add the numerator."},{"num":16,"prompt":"Different shapes represent digits. If ○ + □ + □ = 15 and □ = 4, what digit does ○ represent?","choices":[{"label":"A","text":"7"},{"label":"B","text":"11"},{"label":"C","text":"4"},{"label":"D","text":"8"}],"answer":"A","explanation":"Subtract the value of the two squares from the total."},{"num":17,"prompt":"Which statement must be true about a net that folds into a cube?","choices":[{"label":"A","text":"It has one circular face."},{"label":"B","text":"It has exactly five faces."},{"label":"C","text":"It has six square faces."},{"label":"D","text":"It has four triangular faces."}],"answer":"C","explanation":"A cube has six square faces, so any valid cube net contains six squares."},{"num":18,"prompt":"A rectangle has length 17 meters and perimeter 52 meters. What is its width?","choices":[{"label":"A","text":"9"},{"label":"B","text":"26"},{"label":"C","text":"17"},{"label":"D","text":"11"}],"answer":"A","explanation":"For a rectangle, half the perimeter equals length plus width."},{"num":19,"prompt":"A circle graph is divided into 8 equal sectors. Three sectors represent students who chose art. What fraction chose art?","choices":[{"label":"A","text":"3/8"},{"label":"B","text":"3/5"},{"label":"C","text":"5/8"},{"label":"D","text":"1/3"}],"answer":"A","explanation":"Three of the eight equal sectors represent art."},{"num":20,"prompt":"A team has 12 women and 6 men. 24 balls are shared equally among the women and 24 balls equally among the men. Which statement is true?","choices":[{"label":"A","text":"Each man receives twice as many as each woman."},{"label":"B","text":"Each man receives one fewer than each woman."},{"label":"C","text":"Each woman receives twice as many as each man."},{"label":"D","text":"Each person receives the same number."}],"answer":"A","explanation":"Each woman gets 2; each man gets 4."},{"num":21,"prompt":"A bag contains 7 red, 3 blue, and 3 green counters. What is the probability of choosing a red or green counter?","choices":[{"label":"A","text":"10/13"},{"label":"B","text":"7/13"},{"label":"C","text":"9/13"},{"label":"D","text":"3/13"}],"answer":"A","explanation":"There are 10 favorable counters out of 13, so the probability is 10/13."},{"num":22,"prompt":"A triangle has base 8 units and height 5 units. What is its area?","choices":[{"label":"A","text":"10"},{"label":"B","text":"40"},{"label":"C","text":"13"},{"label":"D","text":"20"}],"answer":"D","explanation":"Triangle area is one-half × base × height."},{"num":23,"prompt":"A rectangular sheet is 96 mm long and 60 mm wide. One cut makes a square with side 60 mm. How much length is removed?","choices":[{"label":"A","text":"36"},{"label":"B","text":"156"},{"label":"C","text":"96"},{"label":"D","text":"60"}],"answer":"A","explanation":"Subtract the square's side length from the original length."},{"num":24,"prompt":"A rectangle has perimeter 52 units and width 9 units. What is its area?","choices":[{"label":"A","text":"153"},{"label":"B","text":"144"},{"label":"C","text":"162"},{"label":"D","text":"468"}],"answer":"A","explanation":"L+W=26, so L=17. The area is 17×9=153."},{"num":25,"prompt":"A dot pattern has 1 dot in Figure 1, 4 in Figure 2, 9 in Figure 3, and 16 in Figure 4. How many dots are in Figure 6?","choices":[{"label":"A","text":"36"},{"label":"B","text":"30"},{"label":"C","text":"25"},{"label":"D","text":"42"}],"answer":"A","explanation":"The figures follow square numbers: 1², 2², 3², and so on."},{"num":26,"prompt":"A workshop begins at 9:35 a.m. and lasts 105 minutes. What time does it end?","choices":[{"label":"A","text":"11:50"},{"label":"B","text":"11:05"},{"label":"C","text":"11:35"},{"label":"D","text":"11:20"}],"answer":"D","explanation":"Adding 105 minutes to 9:35 gives 11:20."},{"num":27,"prompt":"On a map, 1 centimeter represents 8 kilometers. Two towns are 6 centimeters apart. What is the actual distance?","choices":[{"label":"A","text":"14 km"},{"label":"B","text":"40 km"},{"label":"C","text":"56 km"},{"label":"D","text":"48 km"}],"answer":"D","explanation":"Multiply 6 by 8; the actual distance is 48 km."},{"num":28,"prompt":"An airplane has 60 seats. 24 are aisle seats and the rest are window seats. What is the probability of being assigned a window seat?","choices":[{"label":"A","text":"1/2"},{"label":"B","text":"2/5"},{"label":"C","text":"18/35"},{"label":"D","text":"3/5"}],"answer":"D","explanation":"Find the number of window seats, then divide by the total number of seats."},{"num":29,"prompt":"A design is reflected across a vertical line of symmetry. A star is 3 cm to the left of the line. Where must its matching star be?","choices":[{"label":"A","text":"6 cm to the right of the line"},{"label":"B","text":"on the line"},{"label":"C","text":"3 cm to the right of the line"},{"label":"D","text":"3 cm above the line"}],"answer":"C","explanation":"Reflected points are the same perpendicular distance from the line of symmetry."},{"num":30,"prompt":"A number is multiplied by 3, then 7 is subtracted. The result is 26. What was the original number?","choices":[{"label":"A","text":"10"},{"label":"B","text":"9"},{"label":"C","text":"12"},{"label":"D","text":"11"}],"answer":"D","explanation":"Undo the subtraction, then divide by 3: (26+7)÷3=11."},{"num":31,"prompt":"36 candles are divided equally among 4 bags, while 48 candles are divided equally among 8 cases. Which statement is true?","choices":[{"label":"A","text":"Each bag and case has the same number."},{"label":"B","text":"Each case has more candles than each bag."},{"label":"C","text":"Each case has twice as many as each bag."},{"label":"D","text":"Each bag has more candles than each case."}],"answer":"D","explanation":"Each bag gets 9 candles and each case gets 6."},{"num":32,"prompt":"Of 38 students, 21 chose art, 19 chose music, and 4 chose neither. How many chose both art and music?","choices":[{"label":"A","text":"7"},{"label":"B","text":"5"},{"label":"C","text":"4"},{"label":"D","text":"6"}],"answer":"D","explanation":"34 chose at least one. The overlap is 21+19−34=6."},{"num":33,"prompt":"A rectangle has side lengths 8 cm and 5 cm. A new rectangle keeps the 8-cm side but doubles the other side. By how many centimeters does that side increase?","choices":[{"label":"A","text":"8"},{"label":"B","text":"5"},{"label":"C","text":"10"},{"label":"D","text":"13"}],"answer":"B","explanation":"Doubling a length increases it by one original length."},{"num":34,"prompt":"A balanced scale represents 2○ + □ = 14. If ○ = 4, what is □?","choices":[{"label":"A","text":"7"},{"label":"B","text":"4"},{"label":"C","text":"6"},{"label":"D","text":"10"}],"answer":"C","explanation":"Subtract the value of two circles from the total."},{"num":35,"prompt":"A grid has 30 equal squares and 18 are shaded. What percentage is shaded?","choices":[{"label":"A","text":"40%"},{"label":"B","text":"70%"},{"label":"C","text":"60%"},{"label":"D","text":"50%"}],"answer":"C","explanation":"Divide the shaded squares by the total and convert to a percent."},{"num":36,"prompt":"The relationship is L = 3B. If B increases by 2, by how much does L increase?","choices":[{"label":"A","text":"8"},{"label":"B","text":"2"},{"label":"C","text":"6"},{"label":"D","text":"3"}],"answer":"C","explanation":"Because L is 3 times B, a 2-unit increase in B creates a 6-unit increase in L."},{"num":37,"prompt":"A box has 24 crayons that are not purple and some purple crayons. If the probability of choosing purple is 1/4, how many purple crayons are there?","choices":[{"label":"A","text":"6"},{"label":"B","text":"8"},{"label":"C","text":"10"},{"label":"D","text":"12"}],"answer":"B","explanation":"If purple is one-fourth of the total, the non-purple crayons make up three-fourths. The purple count is one-third of the non-purple count."},{"num":38,"prompt":"Each large cube has a volume of 1,000 cubic inches. What expression gives the volume of 20 such cubes?","choices":[{"label":"A","text":"20 × 100"},{"label":"B","text":"20 × 1,000"},{"label":"C","text":"1,000 ÷ 20"},{"label":"D","text":"20 + 1,000"}],"answer":"B","explanation":"Multiply the volume of one cube by the number of cubes."}]},"reading":{"minutes":25,"passages":[{"title":"The Night Garden","text":"Most people picture gardens as places that are meant to be enjoyed in daylight. Yet some gardeners deliberately choose plants that become especially noticeable after sunset. Pale flowers, silver leaves, and strongly scented blossoms can make a garden feel almost transformed at night.\n\nThe effect depends partly on how human vision changes in dim light. In bright conditions, our eyes detect color well. As light fades, we become less sensitive to color and more sensitive to differences between light and dark. White flowers and silvery leaves therefore stand out more clearly than deep red or purple blooms. Moonlight and porch lights can make these pale surfaces appear to glow.\n\nScent can become important too. Several flowers release their strongest fragrance in the evening. This is not simply for the benefit of people walking through a garden. Some of these plants are pollinated by moths and other nighttime insects. A strong scent can help guide those pollinators toward a flower even when the flower is difficult to see from a distance.\n\nDesigning a night garden does not require replacing a daytime garden. Gardeners often mix evening plants among ordinary ones, placing pale flowers near paths or seating areas. The result is a space that changes character as the day ends. Instead of becoming invisible after sunset, the garden offers a second experience—one built around contrast, fragrance, and the quiet activity of nighttime pollinators.\n\nNight-garden design can also create tradeoffs. Bright outdoor lighting may help people see paths, but strong light can make pale flowers less noticeable and can interfere with some nocturnal insects. Gardeners who want both safety and nighttime habitat may use low, shielded lights near walkways while leaving other areas darker. The most effective design therefore depends on balancing human needs with the conditions that make evening plants and pollinators distinctive.\n\nA designer also has to think about season and location. A pale flower that is highly visible in midsummer may bloom for only a few weeks, leaving a dark gap later. Gardeners often combine plants with different bloom times and leaf textures so that the nighttime effect continues across seasons. They may also observe where moonlight actually reaches after nearby trees leaf out. These choices show why a night garden is not simply a list of white flowers. It is a plan for how light, scent, timing, and movement work together in a particular place.","questions":[{"num":1,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Night gardens require replacing every daytime plant."},{"label":"B","text":"Night gardens use pale colors and evening scents to create a distinctive experience after sunset."},{"label":"C","text":"Night gardens are designed mainly to keep insects away."},{"label":"D","text":"Gardeners should use only electric lights after sunset."}],"answer":"B","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":2,"prompt":"Why can pale flowers appear especially bright at night?","choices":[{"label":"A","text":"Pale flowers produce their own light."},{"label":"B","text":"Human vision becomes more sensitive to light-dark contrast as daylight fades."},{"label":"C","text":"Night air changes white flowers into a lighter color."},{"label":"D","text":"Dark petals reflect more moonlight than white petals."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, the word “transformed” most nearly means","choices":[{"label":"A","text":"planted in rows"},{"label":"B","text":"hidden completely"},{"label":"C","text":"measured carefully"},{"label":"D","text":"changed greatly"}],"answer":"D","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":4,"prompt":"Why might a strongly scented flower be useful to a moth?","choices":[{"label":"A","text":"The scent makes the flower warmer."},{"label":"B","text":"The scent prevents the moth from landing."},{"label":"C","text":"The scent changes the flower's color."},{"label":"D","text":"The scent can help the moth locate the flower in low light."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":5,"prompt":"Which tension does the final paragraph introduce?","choices":[{"label":"A","text":"Night gardens can exist only without any artificial light."},{"label":"B","text":"Lighting that improves visibility can also reduce some qualities of a night garden."},{"label":"C","text":"Gardeners must choose between flowers and insects."},{"label":"D","text":"Pale flowers are dangerous near walkways."}],"answer":"B","explanation":"The paragraph explains that safety lighting can conflict with darkness that helps night-garden effects and insects."}]},{"title":"Why Bridges Expand","text":"A long bridge may look perfectly solid, but its materials are constantly responding to changes in temperature. Steel and concrete expand slightly when they become warmer and contract when they cool. The movement is tiny in a short object, but over the length of a large bridge it can add up to several inches.\n\nEngineers plan for this motion rather than trying to prevent it completely. Many bridges include expansion joints—small gaps or flexible connections placed between sections of the structure. These joints allow neighboring sections to move without pressing dangerously against one another. Some bridges also use bearings that let parts of the bridge deck slide a small distance as temperatures change.\n\nThe need for movement is easiest to notice in places with hot summers and cold winters, where the seasonal temperature range is large. But even in milder climates, daily heating from the sun and cooling at night can cause measurable changes.\n\nExpansion joints must be inspected and maintained. Dirt can clog them, metal can corrode, and rubber components can wear out. When a joint can no longer move as designed, stress may build in the surrounding structure. For this reason, bridge maintenance crews pay close attention to parts that are designed to move. A safe bridge is not one that never shifts at all; it is one that shifts in controlled ways that engineers have anticipated.\n\nEngineers also have to consider how one moving part affects another. A joint wide enough for winter contraction must not create an unsafe gap for tires, bicycles, or pedestrians. Drainage matters too, because water and road salt can collect near joints and speed corrosion. Designing for movement is therefore a compromise among structural freedom, durability, comfort, and maintenance.\n\nThe same principle appears in other structures. Railroad tracks, pipelines, and large buildings also need ways to accommodate thermal movement. The exact solution depends on material, length, expected temperatures, and how the structure is supported. Engineers use calculations to estimate movement, but they also inspect real structures because debris, wear, or an unexpected load can change how a joint behaves. Design predicts movement; maintenance checks whether the prediction is still working in practice.","questions":[{"num":6,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Cold weather is the main cause of bridge failure."},{"label":"B","text":"Concrete is the only material that changes with temperature."},{"label":"C","text":"Engineers design bridges with joints and bearings that safely accommodate temperature-related expansion and contraction."},{"label":"D","text":"Bridges are safest when engineers prevent all movement."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":7,"prompt":"What is the purpose of an expansion joint?","choices":[{"label":"A","text":"It makes the bridge surface warmer."},{"label":"B","text":"It permanently locks bridge sections together."},{"label":"C","text":"It stops a bridge from getting wet."},{"label":"D","text":"It gives bridge sections room to move as temperatures change."}],"answer":"D","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":8,"prompt":"In the passage, the word “anticipated” most nearly means","choices":[{"label":"A","text":"repaired afterward"},{"label":"B","text":"forgotten"},{"label":"C","text":"measured exactly"},{"label":"D","text":"expected in advance"}],"answer":"D","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":9,"prompt":"Why are expansion joints especially important where seasons vary greatly?","choices":[{"label":"A","text":"Cold climates never require bridge maintenance."},{"label":"B","text":"Large seasonal changes create larger shifts in bridge materials."},{"label":"C","text":"Expansion joints work only in summer."},{"label":"D","text":"Larger temperature changes produce more expansion and contraction."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":10,"prompt":"What does the final paragraph show about expansion-joint design?","choices":[{"label":"A","text":"Engineers can maximize movement without considering users."},{"label":"B","text":"Corrosion is unrelated to bridge movement."},{"label":"C","text":"All bridge joints should be as wide as possible."},{"label":"D","text":"A successful joint must balance movement with durability and safe use."}],"answer":"D","explanation":"The paragraph describes several competing requirements that must be balanced."}]},{"title":"The Lost Recipe Notebook","text":"When Elena's family moved her grandmother into a smaller apartment, everyone volunteered to sort boxes. Elena expected the work to be dull until she opened a dented tin and found a thin notebook wrapped in a dish towel.\n\nThe notebook did not look valuable. Its cover was stained, and several pages had come loose. Inside, however, were recipes written in her grandmother's looping handwriting. Some had exact measurements, but others included instructions such as “enough flour to make a soft dough” or “bake until the edges smell toasted.”\n\nElena asked her grandmother about the unusual directions. Her grandmother laughed and explained that she had learned many of the recipes by watching relatives cook. They rarely measured everything. Instead, they paid attention to texture, smell, and appearance. The notebook had been a way to capture those lessons without turning them into strict formulas.\n\nThat weekend, Elena chose a bread recipe and tried to follow it. Her first dough was too sticky. Rather than throw it away, her grandmother showed her how to add flour a little at a time and feel when the dough changed. The finished loaf was uneven, but it tasted familiar to her grandmother.\n\nElena later copied the recipes into a digital document so the family could share them. Still, she returned the original notebook to the dented tin. The typed version preserved the words, she realized, but the old pages preserved something else: evidence of the people who had cooked, corrected, and learned from one another long before Elena entered the kitchen.\n\nAs Elena typed more recipes, she faced a choice. She could replace every informal instruction with an exact measurement, but doing so would make the recipes easier to repeat while removing some of the judgment her grandmother considered important. Instead, Elena added notes describing what the dough should feel or smell like. The digital version became not a perfect translation of the notebook, but an attempt to preserve both precision and experience.\n\nElena's project also changes how she thinks about accuracy. At first, she assumes that the most exact recipe must be the most faithful one. Her grandmother points out that flour absorbs moisture differently depending on weather and brand, so an instruction such as “add flour until the dough feels soft but not sticky” can sometimes be more useful than a fixed number. Elena begins to see that precision is not always the same as usefulness; the best instruction depends on what a cook needs to notice.","questions":[{"num":11,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Old recipes should never be changed while cooking."},{"label":"B","text":"Elena learns that family cooking can preserve knowledge and history."},{"label":"C","text":"A family recipe notebook helps Elena understand that cooking knowledge can carry both practical instructions and family history."},{"label":"D","text":"Digital recipes are always better than handwritten ones."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":12,"prompt":"Why were some of the notebook's directions imprecise?","choices":[{"label":"A","text":"Her grandmother disliked measuring cups."},{"label":"B","text":"The recipes came from cooks who relied on experience, texture, smell, and appearance."},{"label":"C","text":"The recipes were copied from a restaurant."},{"label":"D","text":"The cooks learned by observation and judged texture, smell, and appearance."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":13,"prompt":"In the passage, the word “capture” most nearly means","choices":[{"label":"A","text":"erase"},{"label":"B","text":"compare"},{"label":"C","text":"hide"},{"label":"D","text":"record or preserve"}],"answer":"D","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":14,"prompt":"Why does Elena keep the original notebook after typing the recipes?","choices":[{"label":"A","text":"The original notebook carries memories and evidence of family history."},{"label":"B","text":"The physical notebook has sentimental and historical value that the digital copy does not."},{"label":"C","text":"She believes the typed recipes are inaccurate."},{"label":"D","text":"She plans to sell the notebook."}],"answer":"B","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":15,"prompt":"Why does Elena add descriptions of texture and smell to the digital recipes?","choices":[{"label":"A","text":"To make the recipes longer than the originals."},{"label":"B","text":"To avoid sharing the recipes with relatives."},{"label":"C","text":"To preserve forms of cooking judgment that exact measurements alone would miss."},{"label":"D","text":"To replace every measurement with a guess."}],"answer":"C","explanation":"The notes preserve sensory knowledge that was part of how her grandmother learned to cook."}]},{"title":"A Library for Tools","text":"Libraries are usually associated with books, but some communities have created lending libraries for a very different kind of item: tools. Instead of purchasing a drill, ladder, or garden spade for a single project, members can borrow one for a limited period and return it when the job is finished.\n\nTool libraries can reduce waste because the same item is used by many households. A power saw that might otherwise sit unused in a garage for most of the year can complete dozens of projects. Borrowing also lowers the cost of trying a new activity. Someone who wants to repair a shelf or start a small garden does not have to buy every tool before beginning.\n\nRunning a tool library requires more than shelves and a checkout desk. Staff members inspect equipment, replace damaged parts, and teach borrowers how to use unfamiliar tools safely. Some libraries offer short workshops on tasks such as patching drywall, sharpening garden tools, or using a sewing machine.\n\nThere are challenges. Tools wear out, popular items may be unavailable at busy times, and storage can be expensive. Still, supporters argue that tool libraries provide more than equipment. They can make practical skills easier to learn and encourage neighbors to share resources rather than each household owning rarely used items. In that sense, a tool library lends both objects and opportunities.\n\nSome tool libraries have discovered that lending policies can shape who benefits. A large deposit may protect expensive equipment but discourage families with limited cash. Very short loan periods can keep tools circulating but make weekend projects difficult. Managers therefore adjust rules by studying late returns, repair costs, and member feedback. Sharing resources fairly requires decisions about access as well as maintenance.\n\nTool libraries can also reveal a difference between owning an object and having reliable access to it. A member may not need a drill every day, but when a pipe breaks or a shelf needs repair, timing matters. Some libraries therefore allow reservations or keep a few commonly needed tools for urgent jobs. These policies can reduce frustration, but they also make scheduling more complex. Sharing works best when the system accounts for both efficiency and the fact that people's needs do not occur at perfectly convenient times.","questions":[{"num":16,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Libraries should replace books with machinery."},{"label":"B","text":"Every household should own a complete set of tools."},{"label":"C","text":"Tool libraries can share equipment, lower costs, and help people learn skills."},{"label":"D","text":"Tool libraries let communities share equipment while reducing costs, waste, and barriers to learning practical skills."}],"answer":"D","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":17,"prompt":"Why do tool libraries inspect equipment?","choices":[{"label":"A","text":"To keep equipment safe and working."},{"label":"B","text":"They need to keep borrowed tools safe and in working condition."},{"label":"C","text":"To make borrowed tools heavier."},{"label":"D","text":"To prevent people from learning repairs."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":18,"prompt":"In the passage, the word “barriers” most nearly means","choices":[{"label":"A","text":"shelves"},{"label":"B","text":"a sudden warning"},{"label":"C","text":"obstacles"},{"label":"D","text":"rewards"}],"answer":"C","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":19,"prompt":"Why might a workshop be useful to someone borrowing a tool?","choices":[{"label":"A","text":"Workshops make tools wear out faster."},{"label":"B","text":"Borrowers are required to become professional builders."},{"label":"C","text":"Borrowers may need help using unfamiliar equipment safely."},{"label":"D","text":"The borrower may need instruction to use an unfamiliar tool safely and effectively."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":20,"prompt":"Which idea is developed in the final paragraph?","choices":[{"label":"A","text":"Fair access depends partly on how lending rules are designed."},{"label":"B","text":"Repair costs are the only concern for tool libraries."},{"label":"C","text":"Members should keep tools as long as they want."},{"label":"D","text":"Expensive tools should never be loaned."}],"answer":"A","explanation":"Deposits and loan periods can affect who is able to use the service."}]},{"title":"Following the Shorebirds","text":"Every spring, thousands of shorebirds stop along certain coastlines during migrations that may span thousands of miles. To a casual observer, the birds seem to be resting randomly on beaches and mudflats. Biologists, however, know that many of these stopping places function like refueling stations.\n\nDuring migration, birds use enormous amounts of energy. At a productive stopover site, they feed intensively on small crabs, worms, insects, and other creatures exposed by the tides. A bird may remain for only a few days, but the food it gains can help power the next part of its journey.\n\nResearchers study these migrations in several ways. They count birds from the ground, place lightweight identification bands on some individuals, and increasingly use tiny tracking devices. When information from many years is combined, scientists can see which locations are used repeatedly and when the largest groups are likely to arrive.\n\nThis information matters because a beach that looks empty for much of the year may suddenly become essential during a brief migration window. Construction, heavy recreation, or changes to tidal habitat during that period can disturb feeding birds. Conservation plans therefore often focus not only on protecting a place, but also on protecting it at the right time.\n\nThe journeys of shorebirds reveal a larger lesson about migration. A route is only as useful as the places along it where travelers can safely stop, rest, and find what they need to continue.\n\nMigration research also reveals why protecting only one famous stopover may be insufficient. Birds do not all follow identical schedules, and storms can force them to land earlier or farther away than usual. A network of suitable sites gives migrating birds alternatives when conditions change. Conservationists increasingly think of the route as a connected system rather than a chain in which every bird uses exactly the same link.\n\nResearchers also have to interpret movement data carefully. A tracking device may show that a bird skipped a familiar beach one year, but that does not prove the site has become unimportant. Wind direction, storms, food availability, or the bird's condition may have changed that single journey. Biologists look for patterns across many birds and many seasons before concluding that a route has shifted. The challenge is to protect places based on strong patterns without waiting until every uncertainty has disappeared.","questions":[{"num":21,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Shorebird migration depends on important stopover sites that provide food at crucial times."},{"label":"B","text":"Shorebirds remain on one beach throughout the year."},{"label":"C","text":"Migration depends on stopover sites that provide food at the right times."},{"label":"D","text":"Tracking devices prevent shorebirds from migrating."}],"answer":"A","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":22,"prompt":"What do shorebirds mainly gain at productive stopover sites?","choices":[{"label":"A","text":"They avoid all other birds."},{"label":"B","text":"They gain food and energy for the next stage of migration."},{"label":"C","text":"They gain food and energy for the next stage."},{"label":"D","text":"They learn to build nests."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":23,"prompt":"In the passage, the word “intensively” most nearly means","choices":[{"label":"A","text":"with great effort or concentration"},{"label":"B","text":"without stopping"},{"label":"C","text":"at the same time every year"},{"label":"D","text":"a sudden warning"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":24,"prompt":"Why can a beach be important even if it is empty much of the year?","choices":[{"label":"A","text":"The beach may become crucial during a short migration period."},{"label":"B","text":"Only beaches with buildings attract shorebirds."},{"label":"C","text":"The beach is unsafe whenever it looks empty."},{"label":"D","text":"It may be heavily used by migrating birds during a short seasonal window."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":25,"prompt":"What larger idea does the final paragraph develop?","choices":[{"label":"A","text":"Storms make migration impossible."},{"label":"B","text":"Every migrating bird uses exactly the same beaches."},{"label":"C","text":"A connected network of stopovers can be more resilient than relying on one site."},{"label":"D","text":"Only famous stopovers deserve protection."}],"answer":"C","explanation":"The paragraph emphasizes alternative sites and a connected migration network."}]}]},"math":{"minutes":30,"questions":[{"num":1,"prompt":"What is 171 × 10?","choices":[{"label":"A","text":"1539"},{"label":"B","text":"1710"},{"label":"C","text":"1881"},{"label":"D","text":"1700"}],"answer":"B","explanation":"171 × 10 = 1710."},{"num":2,"prompt":"A hexagon has side lengths 7, 9, 11, 8, 6, 10 meters. What is its perimeter?","choices":[{"label":"A","text":"51"},{"label":"B","text":"66"},{"label":"C","text":"45"},{"label":"D","text":"57"}],"answer":"A","explanation":"Add all six side lengths."},{"num":3,"prompt":"A pictograph uses one house symbol to represent 8 houses. Brook Lane has 6 symbols and Pine Road has 4 symbols. How many more houses are on Brook Lane?","choices":[{"label":"A","text":"2"},{"label":"B","text":"48"},{"label":"C","text":"10"},{"label":"D","text":"16"}],"answer":"D","explanation":"The difference is 2 symbols, and each symbol represents 8 houses."},{"num":4,"prompt":"If ■ = 3 × (△ + 4), what is ■ when △ = 5?","choices":[{"label":"A","text":"30"},{"label":"B","text":"27"},{"label":"C","text":"15"},{"label":"D","text":"12"}],"answer":"B","explanation":"Substitute the value of △, add 4, then multiply by 3."},{"num":5,"prompt":"What is 594 ÷ 9?","choices":[{"label":"A","text":"66"},{"label":"B","text":"67"},{"label":"C","text":"57"},{"label":"D","text":"65"}],"answer":"A","explanation":"594 ÷ 9 = 66."},{"num":6,"prompt":"In August, Maya read 7 books and Jacob read 4 books. How many more books did Maya read?","choices":[{"label":"A","text":"3"},{"label":"B","text":"9"},{"label":"C","text":"5"},{"label":"D","text":"7"}],"answer":"A","explanation":"Subtract Jacob's total from Maya's total."},{"num":7,"prompt":"A number machine squares every input. What is the output for an input of 11?","choices":[{"label":"A","text":"121"},{"label":"B","text":"110"},{"label":"C","text":"22"},{"label":"D","text":"132"}],"answer":"A","explanation":"Squaring means multiplying the number by itself."},{"num":8,"prompt":"A pitcher holds 2 quarts and a jug holds 3 quarts. Which combination holds exactly 18 quarts?","choices":[{"label":"A","text":"3 pitchers and
