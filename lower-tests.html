s. Modern forecasting increasingly emphasizes impacts: what conditions might occur, how likely they are, and who is vulnerable to them. This approach does not make prediction perfect, but it can make uncertainty more useful by connecting probabilities to specific decisions.\n\nThis way of thinking changes how forecast quality is judged. A forecast can be useful even when the most likely outcome does not occur, provided the probabilities were well calibrated over many cases. For example, events given a 20 percent chance should happen sometimes, not never. Evaluating forecasts therefore requires a long record rather than a few memorable successes or failures. The standard is not perfect certainty; it is whether stated confidence matches what happens across repeated predictions.\n\nThat perspective also explains why one dramatic miss should not automatically outweigh hundreds of well-calibrated forecasts. Individual outcomes matter, but judging a prediction system requires examining whether its probabilities and confidence levels behave consistently over time.","questions":[{"num":6,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Weather forecasting uses models and evidence to estimate uncertain outcomes rather than guarantee one exact future."},{"label":"B","text":"Weather forecasts estimate uncertain outcomes using models and evidence."},{"label":"C","text":"A forecast is wrong whenever one backyard stays dry."},{"label":"D","text":"Computer models can now predict weather with complete certainty."}],"answer":"A","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":7,"prompt":"What does it suggest when most ensemble model runs agree?","choices":[{"label":"A","text":"Forecasters can have greater confidence in that predicted outcome."},{"label":"B","text":"Different model runs disagree completely."},{"label":"C","text":"All weather stations stop reporting."},{"label":"D","text":"Most model runs agree on a similar outcome."}],"answer":"A","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":8,"prompt":"In the passage, the word “ensemble” most nearly means","choices":[{"label":"A","text":"a sudden warning"},{"label":"B","text":"an error"},{"label":"C","text":"a collection or group"},{"label":"D","text":"a single measurement"}],"answer":"C","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":9,"prompt":"Why can a highly detailed list of every possible outcome still be a poor forecast message?","choices":[{"label":"A","text":"More detail always makes a forecast wrong."},{"label":"B","text":"It may be too difficult to use for practical decisions."},{"label":"C","text":"Meteorologists should give only one outcome."},{"label":"D","text":"Probabilities cannot describe uncertainty."}],"answer":"B","explanation":"A forecast must communicate uncertainty in a form that people can act on."},{"num":10,"prompt":"What is the central communication challenge described in the final paragraph?","choices":[{"label":"A","text":"Hiding disagreement among models."},{"label":"B","text":"Choosing a forecast that never changes."},{"label":"C","text":"Replacing probabilities with a single guaranteed outcome."},{"label":"D","text":"Presenting uncertainty honestly without making the forecast useless for decisions."}],"answer":"D","explanation":"Forecasters need to communicate uncertainty in a form people can still use."}]},{"title":"The Extra Chair","text":"At the beginning of every student-council meeting, Amira placed one extra chair at the end of the table. No one sat there. By October, several students had started joking that the chair was reserved for a ghost.\n\nWhen the council planned the winter festival, the conversation became unusually fast. Members debated music, food booths, decorations, and ticket prices. Each idea seemed to produce three more. Amira listened while keeping notes.\n\nFinally, she pointed to the empty chair. “We haven't heard from whoever is supposed to sit there,” she said.\n\nThe room went quiet.\n\nAmira explained that the chair represented students who were affected by council decisions but were not in the room. The group had planned a noisy evening festival without asking students who used mobility devices whether the gym entrances were convenient. They had discussed ticket prices without considering students who might not be able to afford them. They had chosen a date without checking the schedule of the school play.\n\nThe council did not cancel its plans. Instead, members divided up questions and spoke with classmates, teachers, and club leaders before the next meeting. Some festival details changed; others stayed the same because the group learned they worked well.\n\nAt the December meeting, no one joked about the extra chair. One member even moved a backpack off it before sitting down.\n\nAmira smiled but said nothing. The chair had never been meant to provide answers. Its job was to remind the group to notice whose questions had not yet been asked.\n\nThe symbol works partly because it changes behavior without pretending to speak for absent students. Amira does not argue that the council can imagine every perspective accurately. Instead, the empty chair reminds members to seek information from people who are not represented. In that sense, the chair represents a question—“Who have we not asked?”—rather than an answer the council already possesses.\n\nThe council later debates whether the chair has become too comfortable a symbol—something members can point to without actually changing how they work. Amira agrees that the symbol matters only if it leads to action. The group begins adding a short “missing voices” item to each agenda and recording whom members consulted before major decisions. The chair remains, but the procedure makes its purpose measurable. A reminder can start a habit; a habit becomes meaningful when it changes behavior consistently.\n\nThe new procedure also reveals limits. Consulting one classmate from a group does not guarantee that every member of that group agrees. The council begins recording disagreement rather than forcing comments into one “representative” opinion. This makes decisions slower, but it prevents consultation from becoming a box to check. The chair's deeper lesson is that representation is not solved once; it is a continuing practice of asking, listening, comparing perspectives, and explaining how choices were made.\n\nThe council eventually understands that a slower decision can sometimes be a better decision when it uncovers a problem early. Efficiency is no longer measured only by how quickly a meeting ends, but also by whether the resulting plan works for the people affected.","questions":[{"num":11,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"The winter festival should have been canceled."},{"label":"B","text":"An empty chair reminds a council to consider people not present in the room."},{"label":"C","text":"Student councils should always add extra furniture."},{"label":"D","text":"An empty chair reminds the student council to consider people affected by decisions even when those people are not present."}],"answer":"D","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":12,"prompt":"What does the council do after Amira explains the chair?","choices":[{"label":"A","text":"They remove the chair from the room."},{"label":"B","text":"They ignore the concern and vote immediately."},{"label":"C","text":"Members gather information from other students, teachers, and groups before finalizing plans."},{"label":"D","text":"They gather information from other students, teachers, and groups."}],"answer":"C","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":13,"prompt":"In the passage, the word “represented” most nearly means","choices":[{"label":"A","text":"argued against"},{"label":"B","text":"stood for or symbolized"},{"label":"C","text":"a sudden warning"},{"label":"D","text":"measured"}],"answer":"B","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":14,"prompt":"Why is it important that Amira does not claim the chair can speak for absent students?","choices":[{"label":"A","text":"Council members already know every perspective."},{"label":"B","text":"Absent students are unaffected by council decisions."},{"label":"C","text":"The chair is only decorative."},{"label":"D","text":"The council must seek real perspectives instead of assuming what others think."}],"answer":"D","explanation":"The symbol is a prompt to gather perspectives, not a substitute for them."},{"num":15,"prompt":"What does the author mean by saying the chair represents a question rather than an answer?","choices":[{"label":"A","text":"It lets the council guess what absent students think."},{"label":"B","text":"It proves every council decision is wrong."},{"label":"C","text":"It reminds members to seek perspectives they do not already have."},{"label":"D","text":"It replaces the need to speak with anyone outside the meeting."}],"answer":"C","explanation":"The symbol prompts the council to ask who is missing and gather information rather than assume it knows."}]},{"title":"A Second Life for Old Buildings","text":"When a factory, school, or warehouse is no longer used for its original purpose, a city faces a choice. The building can be demolished, left vacant, or adapted for something new. Converting an older structure for a new use is often called adaptive reuse.\n\nA former warehouse might become apartments. A train station might become a market. An old school can be converted into offices or community space. Reuse can preserve architectural details and local history while avoiding some of the waste created by demolition and new construction.\n\nThe process is not always simple. Older buildings may have outdated wiring, inefficient windows, or materials that require careful removal. Floor plans designed for machinery may not easily become comfortable homes. Accessibility and modern fire codes can require major changes.\n\nEven so, architects sometimes find that old features become advantages. High factory ceilings can create bright interior spaces. Thick masonry walls can provide thermal mass, helping moderate temperature changes. Large loading doors can become dramatic windows or entrances.\n\nAdaptive reuse is therefore not merely a matter of saving everything old. Designers must decide which parts are valuable, which can be altered, and whether the final building will actually serve its new purpose. When the balance works, a structure can keep traces of its past while becoming useful in a completely different way.\n\nAdaptive reuse can also create conflicts among worthy goals. Preserving an original staircase may protect historical character but fail modern accessibility standards. Replacing old windows may reduce energy use while changing the building's appearance. Architects sometimes solve these tensions with reversible additions or by preserving representative features rather than every detail. The work requires judgment because “save the old” and “make it useful” are not always identical instructions.\n\nFinancial calculations can complicate the choice further. Reusing a structure may save demolition waste and preserve character, yet hidden damage can make renovation unexpectedly expensive. Demolition may appear cheaper initially but carry environmental or cultural costs that are harder to price. Cities sometimes use tax credits, zoning changes, or preservation rules to influence the decision. Whether reuse is “worth it” therefore depends partly on which benefits and costs a community chooses to count.\n\nThese decisions can also change as a city changes. A warehouse that seemed too isolated for housing twenty years ago may become desirable after a transit line opens. A school preserved as offices may later be needed again for public use. Designers sometimes favor interventions that can be modified later rather than choices that permanently erase original features. Flexibility can be valuable because the future purpose of a long-lived building is itself uncertain.\n\nAs a result, adaptive reuse is best understood as a sequence of tradeoffs rather than a single rule. Historical value, cost, carbon, accessibility, safety, flexibility, and neighborhood needs may all point in different directions, so the final design reflects priorities as well as engineering.","questions":[{"num":16,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Every old building should be preserved without change."},{"label":"B","text":"Demolition is always cheaper than renovation."},{"label":"C","text":"Adaptive reuse can preserve valuable features of old buildings while converting them to meet new needs, though it requires careful design."},{"label":"D","text":"Adaptive reuse can preserve valuable old features while meeting new needs."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":17,"prompt":"What is one challenge of adaptive reuse mentioned in the passage?","choices":[{"label":"A","text":"Modern codes do not apply to reused buildings."},{"label":"B","text":"Older buildings may need major updates for wiring, accessibility, safety, or layout."},{"label":"C","text":"Older buildings may need major updates for systems, access, safety, or layout."},{"label":"D","text":"Old buildings never need safety updates."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":18,"prompt":"In the passage, the word “moderate” most nearly means","choices":[{"label":"A","text":"reduce or make less extreme"},{"label":"B","text":"a sudden warning"},{"label":"C","text":"measure exactly"},{"label":"D","text":"remove completely"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":19,"prompt":"Which example from the final paragraph best shows a conflict between two legitimate goals?","choices":[{"label":"A","text":"Preserving an original staircase that does not meet modern accessibility needs."},{"label":"B","text":"Painting a new wall."},{"label":"C","text":"Cleaning a vacant room."},{"label":"D","text":"Opening a window."}],"answer":"A","explanation":"Historical preservation and accessibility can both be worthwhile but may point toward different choices."},{"num":20,"prompt":"What broader point does the final paragraph make about adaptive reuse?","choices":[{"label":"A","text":"Accessibility should be ignored in historic buildings."},{"label":"B","text":"Every original feature must always be saved."},{"label":"C","text":"Preservation and practical use can conflict, requiring judgment and compromise."},{"label":"D","text":"New construction is always less expensive."}],"answer":"C","explanation":"The paragraph presents competing worthy goals that must be balanced."}]},{"title":"Reading Tree Rings Carefully","text":"The rings visible in a cut tree trunk can provide a record of growth, but interpreting that record requires care. In many temperate regions, a tree produces a new growth ring each year. A wide ring often indicates favorable growing conditions, while a narrow ring may reflect drought, competition, cold weather, or other stress.\n\nIt would be tempting to examine one tree and declare that every narrow ring marks a drought. Scientists avoid that shortcut. A tree growing in shade may form narrow rings even during a rainy year. Disease or damage can also slow growth. Researchers therefore compare ring patterns from many trees in the same region.\n\nThe patterns can be matched across living trees, old wooden buildings, and preserved logs. If a distinctive sequence of wide and narrow rings overlaps between samples, scientists can sometimes extend a regional timeline centuries into the past. This process is called crossdating.\n\nTree rings can also contain chemical information. Ratios of certain isotopes may provide clues about past moisture or temperature. Charcoal scars can indicate earlier fires. Together, these forms of evidence allow researchers to reconstruct parts of environmental history that were never written down.\n\nTree rings are powerful evidence precisely because scientists do not treat them as simple answers. A ring records how one tree grew in one year. Strong conclusions emerge only when that record is compared with other trees, other measurements, and knowledge of how trees respond to their surroundings.\n\nEven a strong ring chronology is not a complete climate record. Trees respond to several conditions at once, and different species may be limited by different factors. Researchers may compare tree-ring evidence with lake sediments, written records, ice cores, or modern weather measurements. Agreement among independent sources strengthens a reconstruction; disagreement can reveal that an apparently simple explanation needs revision.\n\nScientists also distinguish correlation from cause. A narrow ring may coincide with a dry year, but repeated agreement across many trees and independent drought records is stronger evidence than one coincidence. Even then, the relationship can vary by species or elevation. Researchers use statistical models to estimate how strongly growth responds to particular conditions and to express uncertainty around past reconstructions. The goal is not to turn imperfect evidence into certainty, but to make the reasoning from evidence to conclusion as transparent as possible.\n\nThis approach also helps scientists communicate limits. A reconstruction may show a likely range of past rainfall rather than one exact number. Wider ranges may appear less satisfying, but they can be more honest when evidence is sparse. Researchers may revise the range when new samples are found or when a better model explains how temperature and moisture interact. Scientific confidence grows not by ignoring uncertainty, but by measuring it and showing how conclusions change when assumptions change.\n\nThe strongest studies therefore make the chain of reasoning visible: what was measured, how samples were compared, which assumptions were used, and how uncertain the estimate remains. That transparency allows other researchers to test the conclusion rather than merely accept it.","questions":[{"num":21,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Tree rings can reveal environmental history, but strong conclusions require comparison and multiple evidence sources."},{"label":"B","text":"Tree rings can reveal environmental history, but reliable conclusions require comparison and multiple forms of evidence."},{"label":"C","text":"Every narrow tree ring proves that a drought occurred."},{"label":"D","text":"Tree-ring research is useful only for dating buildings."}],"answer":"B","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":22,"prompt":"Why do scientists compare ring patterns from many trees?","choices":[{"label":"A","text":"A single tree may be affected by shade, disease, or damage unrelated to regional climate."},{"label":"B","text":"A single tree's growth can be affected by local factors besides regional climate."},{"label":"C","text":"All trees grow at exactly the same rate."},{"label":"D","text":"Scientists need fewer samples to avoid confusion."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":23,"prompt":"In the passage, the word “reconstruct” most nearly means","choices":[{"label":"A","text":"predict without data"},{"label":"B","text":"build an understanding from function normalizeHighlightRanges(ranges,textLength){
 const cleaned=(Array.isArray(ranges)?ranges:[]).map(range=>({
  start:Math.max(0,Math.min(textLength,Number(range.start)||0)),
  end:Math.max(0,Math.min(textLength,Number(range.end)||0))
 })).filter(range=>range.end>range.start).sort((a,b)=>a.start-b.start||a.end-b.end);
 const merged=[];
 for(const range of cleaned){
  const last=merged[merged.length-1];
  if(last&&range.start<=last.end)last.end=Math.max(last.end,range.end);
  else merged.push({...range});
 }
 return merged.slice(0,60);
}

 }

 return html;

function passageSelectionOffsets(container){
 const selection=window.getSelection();
 if(!selection||selection.rangeCount===0||selection.isCollapsed)return null;
 const range=selection.getRangeAt(0);
 if(!container.contains(range.startContainer)||!container.contains(range.endContainer))return null;
 const before=range.cloneRange();
 before.selectNodeContents(container);
 before.setEnd(range.startContainer,range.startOffset);
 let start=before.toString().length;
 let end=start+range.toString().length;
 const text=container.textContent||'';
 while(start<end&&/\s/.test(text[start]||''))start++;
 while(end>start&&/\s/.test(text[end-1]||''))end--;
 if(end<=start)return null;
 return {start,end};
}

   state.highlights=state.highlights||{};

   );
   if(matchingIndex>=0){
    state.highlights[key]=current.filter((_,index)=>index!==matchingIndex);

  };

   const name=lowerConcept(sec,item),key=`${sec}:${name}`;
   if(!conceptMap[key])conceptMap[key]={name,section:LABELS[sec],correct:0,total:0};
   conceptMap[key].total++;
   if(state.answers[sec]?.[item.num]===item.answer)conceptMap[key].correct++;
  }
 }
 const concepts=Object.values(conceptMap).map(x=>({...x,percent:x.total?Math.round(x.correct/x.total*100):0,status:conceptStatus(x.total?Math.round(x.correct/x.total*100):0)})).sort((a,b)=>b.percent-a.percent||b.total-a.total);
 const total=sectionResults.reduce((n,x)=>n+x.correct,0),max=sectionResults.reduce((n,x)=>n+x.total,0);

 const strengths=concepts.filter(x=>x.percent>=70).slice(0,3);
 const focus=concepts.slice().sort((a,b)=>a.percent-b.percent||b.total-a.total).filter(x=>x.percent<85).slice(0,3);
 const fallbackStrengths=strengths.length?strengths:concepts.slice(0,Math.min(2,concepts.length));
 const fallbackFocus=focus.length?focus:concepts.slice(-1);
 const unanswered=sectionResults.reduce((n,x)=>n+x.unanswered,0);
 const flagged=sectionResults.reduce((n,x)=>n+x.flagged,0);
 const nextSteps=fallbackFocus.map(x=>`Practice ${x.name} and review missed questions from ${x.section}.`);
 if(unanswered)nextSteps.push(`Strengthen pacing and completion: ${unanswered} scored question${unanswered===1?' was':'s were'} unanswered.`);
 if(!nextSteps.length)nextSteps.push('Continue mixed practice to maintain performance across all scored sections.');
 const essayIncluded=completed.includes('essay');
 const words=(state.essayText.trim().match(/\S+/g)||[]).length;
 const paragraphs=state.essayText.trim()?state.essayText.trim().split(/\n\s*\n/).filter(Boolean).length:0;
 const writing=essayIncluded?{
  submitted:!!state.essayText.trim(),words,paragraphs,
  note:!state.essayText.trim()?'No essay response was saved.':words<150?'The response is brief; add specific examples and fuller paragraph development.':paragraphs<3?'The response has useful length; strengthen paragraph organization.':'The response includes a useful amount of writing and multiple paragraphs. Review clarity, evidence, and transitions.'
 }:null;
 const completedAt=state.completedAt||new Date().toISOString();
 return {
  id:state.assessmentId||state.attemptId||`lower-${Date.now()}`,
  level:'Lower Level',testId:selectedTestId,testTitle:TEST.title,

function lowerAssessmentModeKey(record){
 const mode=record?.mode||'';
 if(['timed','untimed','timedSection','section'].includes(mode))return mode;
 if(record?.sectionPractice)return record?.timed?'timedSection':'section';
 return record?.timed?'timed':'untimed';

function lowerAssessmentSectionLabel(record){

 });

function assessmentConceptRowsFor(concepts){
 return concepts.map(x=>`<div class="assessment-concept">

 </div>`).join('');
}
function lowerSectionAnalyses(record){
 return (record.sections||[]).map(section=>{
  const concepts=(record.concepts||[])
   .filter(x=>x.section===section.label)
   .sort((a,b)=>b.percent-a.percent||b.total-a.total);
  const strengths=concepts.filter(x=>x.percent>=70).slice(0,3);
  const improvement=concepts.slice()
   .sort((a,b)=>a.percent-b.percent||b.total-a.total)
   .filter(x=>x.percent<85)
   .slice(0,3);
  const nextSteps=improvement.map(x=>`Practice ${x.name} and review missed questions in this section.`);
  if(section.unanswered){
   nextSteps.push(`Work on pacing and completion: ${section.unanswered} question${section.unanswered===1?' was':'s were'} unanswered in this section.`);
  }
  if(!nextSteps.length){
   nextSteps.push(`Continue mixed ${section.label.toLowerCase()} practice to maintain this section's performance.`);
  }
  return {...section,concepts,strengths,improvement,nextSteps};
 });
}

 state.highlights=state.highlights||{};
 const choices=item.choices.map(c=>`<div class="choice-row ${elim.includes(c.label)?'eliminated':''}"><button class="eliminate-btn" data-eliminate="${c.label}" aria-label="Eliminate ${c.label}">×</button><button class="choice ${ans===c.label?'selected':''}" data-choice="${c.label}"><span class="choice-letter">${c.label}</span><span class="choice-content">${esc(c.text)}</span></button></div>`).join('');
 const qcard=`<section class="card question-card"><div class="question-meta"><span>Question ${item.num}</span><span>${state.qIndex+1} of ${qs.length}</span></div>${item.part?`<span class="badge part-label">${esc(item.part)}</span>`:''}<div class="question-prompt">${esc(item.prompt)}</div>${item.visual?`<div class="visual">${item.visual}</div>`:''}<p class="elimination-note">Choose the best answer, or use × to eliminate a choice.</p><div class="choices">${choices}</div><div class="nav-row"><div class="nav-left"><button class="btn btn-secondary" id="prev" ${state.qIndex===0?'disabled':''}>← Previous</button><button class="btn btn-secondary ${flag?'flagged':''}" id="flag">${flag?'★ Flagged':'☆ Flag for review'}</button></div><div class="nav-right"><button class="btn btn-secondary" id="review">Review section</button><button class="btn btn-primary" id="next">${state.qIndex===qs.length-1?'Finish section':'Next →'}</button></div></div></section>`;
 let main;
 if(sec==='reading'){
  const key=lowerPassageKey(item),hasHighlights=(state.highlights[key]||[]).length>0;
  main=`<div class="reading-layout"><section class="card passage-card"><span class="badge">Passage ${item.passageIndex+1} of 5</span><h2>${esc(item.passageTitle)}</h2><div class="reading-highlight-tools"><button class="btn btn-secondary" id="addReadingHighlight">Highlight selection</button><button class="btn btn-secondary" id="clearReadingHighlights" ${hasHighlights?'':'disabled'}>Clear all highlights</button></div><div class="passage-text reading-highlight-surface" id="readingPassageText">${renderLowerHighlightedPassage(item.passageText,key)}</div><p class="highlight-help">Highlights are saved with this test. Click highlighted text to remove that highlight.</p></section>${qcard}</div>`
 }else main=`<div class="question-layout">${qcard}</div>`;
 document.getElementById('app').innerHTML=`${topbar(sec)}<main class="container">${main}</main>`;
 bindQuestion(sec,qs,item);
 if(sec==='reading')bindLowerReadingHighlighter(item);
 startTimer();
}
function bindQuestion(sec,qs,item){
 document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{
  const lab=x.dataset.choice;
  state.answers[sec][item.num]=lab;
  state.eliminations[sec][item.num]=(state.eliminations[sec][item.num]||[]).filter(v=>v!==lab);
  save();renderQuestion();
 });
 document.querySelectorAll('[data-eliminate]').forEach(x=>x.onclick=()=>{
  const lab=x.dataset.eliminate,arr=state.eliminations[sec][item.num]||[];
  state.eliminations[sec][item.num]=arr.includes(lab)?arr.filter(v=>v!==lab):[...arr,lab];
  if(state.answers[sec][item.num]===lab)delete state.answers[sec][item.num];
  save();renderQuestion();
 });
 document.getElementById('prev').onclick=()=>{if(state.qIndex>0){state.qIndex--;save();renderQuestion()}};
 document.getElementById('flag').onclick=()=>{state.flags[sec][item.num]=!state.flags[sec][item.num];save();renderQuestion()};
 document.getElementById('review').onclick=()=>{stopTimer();state.screen='review';save();render()};
 document.getElementById('next').onclick=()=>{if(state.qIndex<qs.length-1){state.qIndex++;save();renderQuestion()}else{stopTimer();state.screen='review';save();render()}};
}
function review(){
 stopTimer();
 const sec=currentSec(),qs=currentQs(),unanswered=qs.filter(x=>!state.answers[sec]?.[x.num]).length;
 const flagged=qs.filter(x=>state.flags[sec]?.[x.num]).length;
 document.getElementById('app').innerHTML=`${topbar(sec)}<main class="container"><section class="card review-card"><span class="badge">Section review</span><h1>${LABELS[sec]}</h1><p><b>${answered(sec)} of ${qs.length}</b> answered · ${unanswered} unanswered · ${flagged} flagged</p><div class="review-grid">${qs.map((x,i)=>`<button class="review-dot ${state.answers[sec]?.[x.num]?'answered':'unanswered'} ${state.flags[sec]?.[x.num]?'flagged':''}" data-jump="${i}">${x.num}</button>`).join('')}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px"><button class="btn btn-primary" id="submit">Submit section</button><button class="btn btn-secondary" id="return">Return to questions</button></div></section></main>`;
 document.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>{state.qIndex=Number(x.dataset.jump);state.screen='question';save();render()});
 document.getElementById('return').onclick=()=>{state.screen='question';save();render()};
 document.getElementById('submit').onclick=()=>{if(unanswered&&!confirm(`${unanswered} questions are unanswered. Submit anyway?`))return;state.submitted[sec]=true;finishSection(false)};
}
function essay(){const sec='essay';document.getElementById('app').innerHTML=`${topbar(sec)}<main class="container"><section class="card essay-card"><span class="badge">Unscored writing sample</span><h1>Essay</h1><div class="essay-prompt">${esc(TEST.essay.prompt)}</div><p>${esc(TEST.essay.guidance)}</p><textarea class="essay-area" id="essayText" placeholder="Write your essay here...">${esc(state.essayText||'')}</textarea><div class="essay-tools"><span id="wordCount">0 words</span><div><button class="btn btn-secondary" id="essayReview">Review / submit</button></div></div></section></main>`;const area=document.getElementById('essayText');const update=()=>{state.essayText=area.value;document.getElementById('wordCount').textContent=`${(area.value.trim().match(/\S+/g)||[]).length} words`;save()};area.oninput=update;update();document.getElementById('essayReview').onclick=()=>{state.submitted.essay=true;finishSection(false)};startTimer()}
function finishSection(){stopTimer();const sec=currentSec();if(state.sectionPractice){state.completed=true;state.completedAt=state.completedAt||new Date().toISOString();state.screen='results';save();render();return}if(state.sectionIndex<SECTIONS.length-1){state.sectionIndex++;state.qIndex=0;state.screen='intro';save();render()}else{state.completed=true;state.completedAt=state.completedAt||new Date().toISOString();state.screen='results';save();render()}}
function results(){
 stopTimer();
 const completed=state.sectionPractice?[state.sectionPractice]:SECTIONS;
 const scored=completed.filter(x=>x!=='essay');
 const scores=scored.map(sec=>{const s=score(sec),t=sectionQuestions(sec).length,p=Math.round(s/t*100);return{sec,s,t,p,stanine:estStanine(p)}});
 const total=scores.reduce((a,x)=>a+x.s,0),max=scores.reduce((a,x)=>a+x.t,0),pct=max?Math.round(total/max*100):0;
 const assessment=captureLowerAssessment();
 let reviewHtml='';
 for(const sec of scored){
  for(const item of sectionQuestions(sec)){
   const ua=state.answers[sec]?.[item.num]||'—',ok=ua===item.answer;
   const wasFlagged=!!state.flags?.[sec]?.[item.num];
   reviewHtml+=`<article class="review-item"><h3>${LABELS[sec]} ${item.num}: ${esc(item.prompt)}</h3><div class="${ok?'answer-good':'answer-bad'}">Your answer: ${ua}${ok?' ✓':' ✗'}</div>${ok?'':`<div class="answer-good">Correct answer: ${item.answer}</div>`}${wasFlagged?'<span class="flag-result-tag">★ Flagged for review</span>':''}<p>${esc(item.explanation)}</p></article>`;
  }
 }
 document.getElementById('app').innerHTML=`<main class="container"><section class="card hero"><span class="badge">Completed</span><h1>${esc(state.student||'Student')}’s Results</h1>
  <div class="result-grid">${scores.map(x=>`<div class="score-box"><span>${LABELS[x.sec]}</span><b>${x.s}/${x.t}</b><small>${x.p}% · Est. stanine ${x.stanine}</small></div>`).join('')}</div>
  ${scored.length>1?`<div class="success-note"><b>Total scored sections:</b> ${total}/${max} (${pct}%). No overall stanine is calculated.</div>`:''}
  <div class="success-note" style="margin-top:10px"><b>Practice estimates only:</b> Official ISEE stanines use scaled scores and grade-specific norms.</div>
  ${lowerAssessmentHtml(assessment)}
  ${completed.includes('essay')?`<details style="margin-top:16px"><summary><b>Show essay response</b></summary><div class="essay-prompt" style="margin-top:12px">${esc(TEST.essay.prompt)}</div><div class="passage-text" style="margin-top:12px">${esc(state.essayText||'No essay response saved.')}</div></details>`:''}
  <div style="display:flex;gap:9px;flex-wrap:wrap;margin:18px 0"><button class="btn btn-primary" onclick="window.print()">Print results & assessment</button><button class="btn btn-secondary" id="assessmentHistoryResults">Assessment history</button><button class="btn btn-secondary" id="retake">Retake</button><button class="btn btn-secondary" id="home">Back to tests</button><button class="btn btn-secondary" id="main">⌂ Home</button></div>
  ${reviewHtml?`<h2>Answer review</h2>${reviewHtml}`:''}
 </section></main>`;
 document.getElementById('assessmentHistoryResults').onclick=showLowerAssessmentHistory;
 document.getElementById('retake').onclick=()=>{const st=state.student;RSPStorage.removeItem(key());state=freshState(st);home()};
 document.getElementById('home').onclick=home;
 document.getElementById('main').onclick=goMain;
}
function render(){if(state.screen==='home')home();else if(state.screen==='intro')intro();else if(state.screen==='question')renderQuestion();else if(state.screen==='review')review();else if(state.screen==='essay')essay();else if(state.screen==='results')results();else home()}
window.addEventListener('beforeunload',save);
const initialView=new URLSearchParams(location.search).get('view');
if(initialView==='history')showLowerAssessmentHistory();else home();
</script></body></html>
