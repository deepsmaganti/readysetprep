4 jugs"},{"label":"B","text":"4 pitchers and 5 jugs"},{"label":"C","text":"3 pitchers and 6 jugs"},{"label":"D","text":"5 pitchers and 5 jugs"}],"answer":"A","explanation":"3×2 + 4×3 = 18."},{"num":9,"prompt":"Which number is divisible by 6 with no remainder?","choices":[{"label":"A","text":"48"},{"label":"B","text":"53"},{"label":"C","text":"47"},{"label":"D","text":"50"}],"answer":"A","explanation":"48 ÷ 6 is a whole number."},{"num":10,"prompt":"In a town of 6,400 graduates, about 3/8 have earned an advanced degree. About how many graduates is that?","choices":[{"label":"A","text":"4,000"},{"label":"B","text":"800"},{"label":"C","text":"4,800"},{"label":"D","text":"2,400"}],"answer":"D","explanation":"Find one-eighth of the total, then multiply by 3."},{"num":11,"prompt":"$9,450 is divided evenly among 3 accounts. How much goes into each account?","choices":[{"label":"A","text":"$3,250"},{"label":"B","text":"$3,150"},{"label":"C","text":"$9,447"},{"label":"D","text":"$4,725"}],"answer":"B","explanation":"Divide the total amount by the number of accounts."},{"num":12,"prompt":"Point P is 3 units to the right of the origin and 9 units above the origin. What are its coordinates?","choices":[{"label":"A","text":"(3, -9)"},{"label":"B","text":"(-3, 9)"},{"label":"C","text":"(9, 3)"},{"label":"D","text":"(3, 9)"}],"answer":"D","explanation":"The x-coordinate gives horizontal position and the y-coordinate gives vertical position."},{"num":13,"prompt":"Point A is at 4 on a vertical number line. Point B is 7 units below A. Where is B?","choices":[{"label":"A","text":"11"},{"label":"B","text":"-4"},{"label":"C","text":"-3"},{"label":"D","text":"4"}],"answer":"C","explanation":"Moving down means subtracting."},{"num":14,"prompt":"What is the value of 11 + 6 × 2?","choices":[{"label":"A","text":"34"},{"label":"B","text":"68"},{"label":"C","text":"23"},{"label":"D","text":"29"}],"answer":"C","explanation":"Multiply first: 6×2=12; then add 11 to get 23."},{"num":15,"prompt":"Which fraction is equivalent to 0.25?","choices":[{"label":"A","text":"2/5"},{"label":"B","text":"1/4"},{"label":"C","text":"25/10"},{"label":"D","text":"1/2"}],"answer":"B","explanation":"Convert the decimal to a fraction and simplify."},{"num":16,"prompt":"What is 1/4 + 1/4?","choices":[{"label":"A","text":"1/4"},{"label":"B","text":"1/2"},{"label":"C","text":"1"},{"label":"D","text":"3/4"}],"answer":"B","explanation":"Use a common denominator; the sum is 1/2."},{"num":17,"prompt":"What is the mode of the data set 72, 84, 91, 84, 88, 84, 95?","choices":[{"label":"A","text":"95"},{"label":"B","text":"84"},{"label":"C","text":"72"},{"label":"D","text":"88"}],"answer":"B","explanation":"The mode is the value that appears most often."},{"num":18,"prompt":"A right triangle has one acute angle measuring 55°. What is the measure of the other acute angle?","choices":[{"label":"A","text":"125°"},{"label":"B","text":"55°"},{"label":"C","text":"145°"},{"label":"D","text":"35°"}],"answer":"D","explanation":"The two acute angles in a right triangle add to 90°."},{"num":19,"prompt":"A collector has 6 packs of baseball cards with 14 cards each and 5 packs of basketball cards with 12 cards each. Which expression finds the total number of cards?","choices":[{"label":"A","text":"(6+5)×(14+12)"},{"label":"B","text":"(6 × 14) + (5 × 12)"},{"label":"C","text":"(6×5)+(14×12)"},{"label":"D","text":"(6×14)-(5×12)"}],"answer":"B","explanation":"Find the total for each kind of card, then add the two totals."},{"num":20,"prompt":"What is 4 3/4 − 5/8?","choices":[{"label":"A","text":"3 7/8"},{"label":"B","text":"4 3/8"},{"label":"C","text":"5 3/8"},{"label":"D","text":"4 1/8"}],"answer":"D","explanation":"Use eighths to subtract. The result is 4 1/8."},{"num":21,"prompt":"A square has area 64 square centimeters. What is its perimeter?","choices":[{"label":"A","text":"16 centimeters"},{"label":"B","text":"8 centimeters"},{"label":"C","text":"32 centimeters"},{"label":"D","text":"64 centimeters"}],"answer":"C","explanation":"The side length is 8 cm because 8×8=64; perimeter is 4×8."},{"num":22,"prompt":"What is 4.4 × 1.8?","choices":[{"label":"A","text":"7.92"},{"label":"B","text":"7.42"},{"label":"C","text":"6.2"},{"label":"D","text":"8.42"}],"answer":"A","explanation":"Multiplying gives 7.92."},{"num":23,"prompt":"A triangle has base 12 cm and height 8 cm. What is its area?","choices":[{"label":"A","text":"40 cm²"},{"label":"B","text":"96 cm²"},{"label":"C","text":"20 cm²"},{"label":"D","text":"48 cm²"}],"answer":"D","explanation":"Use one-half × base × height."},{"num":24,"prompt":"A tank contains 120 liters at 0 minutes and loses 7 liters every 5 minutes. How much remains after 30 minutes?","choices":[{"label":"A","text":"71"},{"label":"B","text":"85"},{"label":"C","text":"78"},{"label":"D","text":"92"}],"answer":"C","explanation":"Thirty minutes contains six 5-minute intervals, so subtract the loss six times."},{"num":25,"prompt":"A driver passes 48 intersections and stops at about 1 out of every 4. About how many stops is that?","choices":[{"label":"A","text":"12"},{"label":"B","text":"36"},{"label":"C","text":"24"},{"label":"D","text":"4"}],"answer":"A","explanation":"One out of every four means one-fourth of the total."},{"num":26,"prompt":"Cards numbered 1 through 20 are equally likely to be selected. What is the probability of selecting a prime number?","choices":[{"label":"A","text":"6 out of 20"},{"label":"B","text":"12 out of 20"},{"label":"C","text":"10 out of 20"},{"label":"D","text":"8 out of 20"}],"answer":"D","explanation":"There are eight prime numbers from 1 through 20."},{"num":27,"prompt":"When it is 9:00 a.m. in City A, it is 1:00 p.m. in City B. When it is 7:00 p.m. in City B, what time is it in City A?","choices":[{"label":"A","text":"11:00 p.m."},{"label":"B","text":"3:00 p.m."},{"label":"C","text":"5:00 p.m."},{"label":"D","text":"11:00 a.m."}],"answer":"B","explanation":"City B is four hours ahead of City A, so subtract four hours."},{"num":28,"prompt":"Which quadrilateral must have all four sides equal?","choices":[{"label":"A","text":"parallelogram"},{"label":"B","text":"trapezoid"},{"label":"C","text":"rhombus"},{"label":"D","text":"rectangle"}],"answer":"C","explanation":"A rhombus is defined by having four equal side lengths."},{"num":29,"prompt":"How many whole numbers strictly between 50 and 90 are divisible by 5?","choices":[{"label":"A","text":"6"},{"label":"B","text":"9"},{"label":"C","text":"8"},{"label":"D","text":"7"}],"answer":"D","explanation":"List or count the multiples of 5 greater than 50 and less than 90."},{"num":30,"prompt":"A scientist records each plant's height, mass, number of leaves, and flower color. Which question is NOT statistical for this data set?","choices":[{"label":"A","text":"What color was Plant 7's flower?"},{"label":"B","text":"What fraction of the plants had red flowers?"},{"label":"C","text":"What was the typical plant height?"},{"label":"D","text":"How did mass vary among the plants?"}],"answer":"A","explanation":"A statistical question expects variability across multiple observations; asking for one specific plant's color does not."}]},"essay":{"prompt":"Describe a time when working with another person helped you solve a problem or complete something that would have been harder to do alone. Explain what each person contributed and what you learned from the experience.","guidance":"Organize your response with a clear beginning, middle, and ending. Use specific details and explain why the experience mattered.","minutes":30},"difficulty":{"label":"On-level","score":3,"description":"Stronger inference, connected reasoning, and multi-step quantitative work."}},"lower-test4":{"title":"Lower Level Practice Test #4","verbal":{"questions":[{"num":1,"prompt":"AMBIGUOUS:","choices":[{"label":"A","text":"generous"},{"label":"B","text":"definite"},{"label":"C","text":"unclear"},{"label":"D","text":"minor"}],"answer":"C","explanation":"Ambiguous means open to more than one interpretation.","part":"Synonyms"},{"num":2,"prompt":"AUSTERE:","choices":[{"label":"A","text":"playful"},{"label":"B","text":"ornate"},{"label":"C","text":"plain"},{"label":"D","text":"flexible"}],"answer":"C","explanation":"Austere means plain, severe, or without decoration.","part":"Synonyms"},{"num":3,"prompt":"BENEVOLENT:","choices":[{"label":"A","text":"kind"},{"label":"B","text":"timid"},{"label":"C","text":"careless"},{"label":"D","text":"hostile"}],"answer":"A","explanation":"Benevolent means kind and well meaning.","part":"Synonyms"},{"num":4,"prompt":"CREDIBLE:","choices":[{"label":"A","text":"secret"},{"label":"B","text":"temporary"},{"label":"C","text":"absurd"},{"label":"D","text":"believable"}],"answer":"D","explanation":"Credible means believable or trustworthy.","part":"Synonyms"},{"num":5,"prompt":"DEPLETE:","choices":[{"label":"A","text":"organize"},{"label":"B","text":"increase"},{"label":"C","text":"predict"},{"label":"D","text":"exhaust"}],"answer":"D","explanation":"To deplete is to use up much or all of something.","part":"Synonyms"},{"num":6,"prompt":"ERRATIC:","choices":[{"label":"A","text":"unpredictable"},{"label":"B","text":"precise"},{"label":"C","text":"steady"},{"label":"D","text":"simple"}],"answer":"A","explanation":"Erratic means irregular or unpredictable.","part":"Synonyms"},{"num":7,"prompt":"FEASIBLE:","choices":[{"label":"A","text":"remote"},{"label":"B","text":"ornamental"},{"label":"C","text":"impossible"},{"label":"D","text":"workable"}],"answer":"D","explanation":"Feasible means possible and practical to carry out.","part":"Synonyms"},{"num":8,"prompt":"IMPLICIT:","choices":[{"label":"A","text":"unrelated"},{"label":"B","text":"implied"},{"label":"C","text":"announced"},{"label":"D","text":"visible"}],"answer":"B","explanation":"Implicit means suggested without being directly stated.","part":"Synonyms"},{"num":9,"prompt":"METICULOUS:","choices":[{"label":"A","text":"ordinary"},{"label":"B","text":"careless"},{"label":"C","text":"precise"},{"label":"D","text":"rapid"}],"answer":"C","explanation":"Meticulous means very careful about details.","part":"Synonyms"},{"num":10,"prompt":"OBSOLETE:","choices":[{"label":"A","text":"outdated"},{"label":"B","text":"portable"},{"label":"C","text":"modern"},{"label":"D","text":"essential"}],"answer":"A","explanation":"Obsolete means no longer useful because something newer has replaced it.","part":"Synonyms"},{"num":11,"prompt":"PRUDENT:","choices":[{"label":"A","text":"loud"},{"label":"B","text":"temporary"},{"label":"C","text":"wise"},{"label":"D","text":"reckless"}],"answer":"C","explanation":"Prudent means showing good judgment and care.","part":"Synonyms"},{"num":12,"prompt":"RELUCTANT:","choices":[{"label":"A","text":"eager"},{"label":"B","text":"hesitant"},{"label":"C","text":"grateful"},{"label":"D","text":"certain"}],"answer":"B","explanation":"Reluctant means unwilling or hesitant.","part":"Synonyms"},{"num":13,"prompt":"RESILIENT:","choices":[{"label":"A","text":"fragile"},{"label":"B","text":"motionless"},{"label":"C","text":"tough"},{"label":"D","text":"vague"}],"answer":"C","explanation":"Resilient means able to recover after difficulty.","part":"Synonyms"},{"num":14,"prompt":"SCRUTINIZE:","choices":[{"label":"A","text":"scatter"},{"label":"B","text":"examine"},{"label":"C","text":"ignore"},{"label":"D","text":"summarize"}],"answer":"B","explanation":"To scrutinize is to examine very closely.","part":"Synonyms"},{"num":15,"prompt":"TENTATIVE:","choices":[{"label":"A","text":"vivid"},{"label":"B","text":"permanent"},{"label":"C","text":"provisional"},{"label":"D","text":"reckless"}],"answer":"C","explanation":"Tentative means not final or fully certain.","part":"Synonyms"},{"num":16,"prompt":"TRIVIAL:","choices":[{"label":"A","text":"lasting"},{"label":"B","text":"critical"},{"label":"C","text":"minor"},{"label":"D","text":"enormous"}],"answer":"C","explanation":"Trivial means of little importance.","part":"Synonyms"},{"num":17,"prompt":"VIGILANT:","choices":[{"label":"A","text":"relaxed"},{"label":"B","text":"distracted"},{"label":"C","text":"silent"},{"label":"D","text":"watchful"}],"answer":"D","explanation":"Vigilant means alert and watchful for possible problems.","part":"Synonyms"},{"num":18,"prompt":"The rule was _____ enough that two equally careful readers reached different conclusions about what it allowed.","choices":[{"label":"A","text":"generous"},{"label":"B","text":"definite"},{"label":"C","text":"ambiguous"},{"label":"D","text":"brief"}],"answer":"C","explanation":"A rule open to multiple interpretations is ambiguous.","part":"Sentence Completion"},{"num":19,"prompt":"The cabin's _____ interior contained bare wooden walls, a table, and little decoration.","choices":[{"label":"A","text":"austere"},{"label":"B","text":"ornate"},{"label":"C","text":"crowded"},{"label":"D","text":"playful"}],"answer":"A","explanation":"A plain, undecorated interior is austere.","part":"Sentence Completion"},{"num":20,"prompt":"Residents trusted the donor's motives because her earlier projects had been consistently _____.","choices":[{"label":"A","text":"secretive"},{"label":"B","text":"benevolent"},{"label":"C","text":"careless"},{"label":"D","text":"hostile"}],"answer":"B","explanation":"Benevolent actions are kind and well intentioned.","part":"Sentence Completion"},{"num":21,"prompt":"The historian considered the diary _____ because its dates and details matched several independent records.","choices":[{"label":"A","text":"decorative"},{"label":"B","text":"absurd"},{"label":"C","text":"temporary"},{"label":"D","text":"credible"}],"answer":"D","explanation":"Independent agreement makes a source more believable or credible.","part":"Sentence Completion"},{"num":22,"prompt":"Years of heavy pumping began to _____ the underground water supply.","choices":[{"label":"A","text":"predict"},{"label":"B","text":"restore"},{"label":"C","text":"deplete"},{"label":"D","text":"measure"}],"answer":"C","explanation":"Heavy use can deplete, or use up, a resource.","part":"Sentence Completion"},{"num":23,"prompt":"Because the wind was _____, the sailing team kept changing the angle of the sail.","choices":[{"label":"A","text":"faint"},{"label":"B","text":"erratic"},{"label":"C","text":"steady"},{"label":"D","text":"precise"}],"answer":"B","explanation":"Unpredictable wind is erratic.","part":"Sentence Completion"},{"num":24,"prompt":"The proposal was ambitious but still _____ because the materials, time, and budget were available.","choices":[{"label":"A","text":"impossible"},{"label":"B","text":"feasible"},{"label":"C","text":"remote"},{"label":"D","text":"ornamental"}],"answer":"B","explanation":"Available resources make the plan workable.","part":"Sentence Completion"},{"num":25,"prompt":"The coach never said that practice was optional; in fact, her repeated reminders carried the _____ expectation that everyone would attend.","choices":[{"label":"A","text":"implicit"},{"label":"B","text":"visible"},{"label":"C","text":"accidental"},{"label":"D","text":"irrelevant"}],"answer":"A","explanation":"An unstated but clearly suggested expectation is implicit.","part":"Sentence Completion"},{"num":26,"prompt":"The conservator was _____, using a tiny brush to remove dust without disturbing the fragile paint.","choices":[{"label":"A","text":"casual"},{"label":"B","text":"reckless"},{"label":"C","text":"rapid"},{"label":"D","text":"meticulous"}],"answer":"D","explanation":"Careful attention to tiny details is meticulous.","part":"Sentence Completion"},{"num":27,"prompt":"The old device became _____ after a newer system performed the same job faster and more safely.","choices":[{"label":"A","text":"essential"},{"label":"B","text":"durable"},{"label":"C","text":"portable"},{"label":"D","text":"obsolete"}],"answer":"D","explanation":"Technology replaced by a newer system can become obsolete.","part":"Sentence Completion"},{"num":28,"prompt":"Rather than spending the entire budget immediately, the director made the _____ decision to keep money for unexpected repairs.","choices":[{"label":"A","text":"prudent"},{"label":"B","text":"temporary"},{"label":"C","text":"reckless"},{"label":"D","text":"dramatic"}],"answer":"A","explanation":"Saving resources for possible repairs is prudent.","part":"Sentence Completion"},{"num":29,"prompt":"Although Maya wanted to join the debate, she was _____ to speak until she had checked the evidence.","choices":[{"label":"A","text":"reluctant"},{"label":"B","text":"eager"},{"label":"C","text":"certain"},{"label":"D","text":"carefree"}],"answer":"A","explanation":"Hesitation to speak is reluctance.","part":"Sentence Completion"},{"num":30,"prompt":"The plan proved _____: after the first supplier canceled, the team quickly found another way to obtain materials.","choices":[{"label":"A","text":"fragile"},{"label":"B","text":"resilient"},{"label":"C","text":"rigid"},{"label":"D","text":"vague"}],"answer":"B","explanation":"A plan that adapts to disruption is resilient.","part":"Sentence Completion"},{"num":31,"prompt":"The editor asked the writer to _____ the graph before using it as evidence because one label looked inconsistent.","choices":[{"label":"A","text":"ignore"},{"label":"B","text":"scrutinize"},{"label":"C","text":"decorate"},{"label":"D","text":"summarize"}],"answer":"B","explanation":"A suspicious label calls for close examination.","part":"Sentence Completion"},{"num":32,"prompt":"The agreement is _____ until the school board votes on it next week.","choices":[{"label":"A","text":"historic"},{"label":"B","text":"tentative"},{"label":"C","text":"obvious"},{"label":"D","text":"permanent"}],"answer":"B","explanation":"An agreement awaiting approval is provisional or tentative.","part":"Sentence Completion"},{"num":33,"prompt":"The debate focused on water safety, so the color of the meeting-room carpet was _____.","choices":[{"label":"A","text":"critical"},{"label":"B","text":"trivial"},{"label":"C","text":"lasting"},{"label":"D","text":"complex"}],"answer":"B","explanation":"The carpet color is unimportant to the issue.","part":"Sentence Completion"},{"num":34,"prompt":"During the overnight field study, researchers remained _____ for sudden changes in wind and temperature.","choices":[{"label":"A","text":"distracted"},{"label":"B","text":"careless"},{"label":"C","text":"vigilant"},{"label":"D","text":"relaxed"}],"answer":"C","explanation":"Researchers watching for changes are vigilant.","part":"Sentence Completion"}],"minutes":20},"quantitative":{"questions":[{"num":1,"prompt":"The pattern is 11, 17, 15, 21, 19, ___. The rule alternates +6, −2. What comes next?","choices":[{"label":"A","text":"24"},{"label":"B","text":"25"},{"label":"C","text":"26"},{"label":"D","text":"23"}],"answer":"B","explanation":"After subtracting 2, the next step is +6, giving 25."},{"num":2,"prompt":"The ratio of red tiles to blue tiles is 4:5. If there are 32 red tiles, how many blue tiles are there?","choices":[{"label":"A","text":"37"},{"label":"B","text":"45"},{"label":"C","text":"40"},{"label":"D","text":"35"}],"answer":"C","explanation":"The ratio was multiplied by 8, so blue tiles = 5×8=40."},{"num":3,"prompt":"The ratio of red beads to blue beads is 3:5. If there are 15 red beads, how many blue beads are there?","choices":[{"label":"A","text":"20"},{"label":"B","text":"25"},{"label":"C","text":"30"},{"label":"D","text":"35"}],"answer":"B","explanation":"The ratio is multiplied by 5: 3×5=15, so 5×5=25."},{"num":4,"prompt":"If 8 × 6 = 48, which equation belongs to the same fact family?","choices":[{"label":"A","text":"48 ÷ 8 = 6"},{"label":"B","text":"48 + 8 = 56"},{"label":"C","text":"8 + 6 = 14"},{"label":"D","text":"48 − 6 = 42"}],"answer":"A","explanation":"The multiplication and division facts with 8, 6, and 48 belong to the same fact family."},{"num":5,"prompt":"The numbers are 12, 18, 21, 25, and 30. What is the median?","choices":[{"label":"A","text":"18"},{"label":"B","text":"21"},{"label":"C","text":"25"},{"label":"D","text":"106"}],"answer":"B","explanation":"The middle value in the ordered list is 21."},{"num":6,"prompt":"A box holds 80 beads. 3/4 are used for one project, and 7 more are used later. How many beads remain?","choices":[{"label":"A","text":"13"},{"label":"B","text":"6"},{"label":"C","text":"9"},{"label":"D","text":"20"}],"answer":"A","explanation":"3/4 of 80 is 60. Then 80−60−7=13."},{"num":7,"prompt":"The mean of five numbers is 21. Four are 16, 19, 22, 24. What is the fifth number?","choices":[{"label":"A","text":"24"},{"label":"B","text":"22"},{"label":"C","text":"21"},{"label":"D","text":"26"}],"answer":"A","explanation":"The total must be 105. Subtracting the four known values leaves 24."},{"num":8,"prompt":"A bag contains 8 red, 3 blue, and 4 green counters. What is the probability of choosing a red or green counter?","choices":[{"label":"A","text":"4/15"},{"label":"B","text":"8/15"},{"label":"C","text":"4/5"},{"label":"D","text":"1/5"}],"answer":"C","explanation":"There are 12 favorable counters out of 15, so the probability is 4/5."},{"num":9,"prompt":"A rectangle has perimeter 56 units and width 10 units. What is its area?","choices":[{"label":"A","text":"190"},{"label":"B","text":"180"},{"label":"C","text":"170"},{"label":"D","text":"560"}],"answer":"B","explanation":"L+W=28, so L=18. The area is 18×10=180."},{"num":10,"prompt":"A workshop begins at 8:35 a.m. and lasts 115 minutes. What time does it end?","choices":[{"label":"A","text":"11:00"},{"label":"B","text":"10:15"},{"label":"C","text":"10:30"},{"label":"D","text":"10:45"}],"answer":"C","explanation":"Adding 115 minutes to 8:35 gives 10:30."},{"num":11,"prompt":"Which fraction is equivalent to 9/12?","choices":[{"label":"A","text":"2/3"},{"label":"B","text":"3/4"},{"label":"C","text":"4/5"},{"label":"D","text":"5/6"}],"answer":"B","explanation":"Divide numerator and denominator by 3: 9/12 = 3/4."},{"num":12,"prompt":"Adult tickets cost $11 and student tickets cost $7. Which expression gives the cost of a adult tickets and 4 student tickets?","choices":[{"label":"A","text":"11a + 28"},{"label":"B","text":"7a + 44"},{"label":"C","text":"18a + 4"},{"label":"D","text":"11(a + 4)"}],"answer":"A","explanation":"Adult tickets cost 11a and four student tickets cost 4×7=28."},{"num":13,"prompt":"Of 60 marbles, 18 are green. What fraction of the marbles are not green?","choices":[{"label":"A","text":"3/10"},{"label":"B","text":"7/10"},{"label":"C","text":"18/60"},{"label":"D","text":"42/18"}],"answer":"B","explanation":"42 are not green, and 42/60 simplifies to 7/10."},{"num":14,"prompt":"Which improper fraction is equal to 3 2/5?","choices":[{"label":"A","text":"15/5"},{"label":"B","text":"16/5"},{"label":"C","text":"17/5"},{"label":"D","text":"18/5"}],"answer":"C","explanation":"3×5+2=17, so the improper fraction is 17/5."},{"num":15,"prompt":"A two-digit number has a tens digit that is 3 more than its ones digit. The digits add to 11. What is the number?","choices":[{"label":"A","text":"47"},{"label":"B","text":"56"},{"label":"C","text":"74"},{"label":"D","text":"83"}],"answer":"C","explanation":"Let the ones digit be 4; then the tens digit is 7 and 7+4=11."},{"num":16,"prompt":"A rectangle has perimeter 46 cm and length 15 cm. What is its width?","choices":[{"label":"A","text":"8 cm"},{"label":"B","text":"11 cm"},{"label":"C","text":"16 cm"},{"label":"D","text":"31 cm"}],"answer":"A","explanation":"2(15+w)=46, so 15+w=23 and w=8."},{"num":17,"prompt":"In a survey, 30% chose soccer, 25% chose basketball, 20% chose swimming, and the rest chose tennis. What percent chose tennis?","choices":[{"label":"A","text":"15%"},{"label":"B","text":"20%"},{"label":"C","text":"25%"},{"label":"D","text":"35%"}],"answer":"C","explanation":"The listed percentages total 75%, so 25% remain."},{"num":18,"prompt":"Eight students share 56 markers equally. Then each student gives 2 markers to the teacher. How many markers does each student keep?","choices":[{"label":"A","text":"5"},{"label":"B","text":"7"},{"label":"C","text":"9"},{"label":"D","text":"12"}],"answer":"A","explanation":"Each gets 56÷8=7 markers and keeps 7−2=5."},{"num":19,"prompt":"On a map, 1 centimeter represents 9 kilometers. Two towns are 3 centimeters apart. What is the actual distance?","choices":[{"label":"A","text":"36 km"},{"label":"B","text":"12 km"},{"label":"C","text":"18 km"},{"label":"D","text":"27 km"}],"answer":"D","explanation":"Multiply 3 by 9; the actual distance is 27 km."},{"num":20,"prompt":"A triangle has base 12 cm and height 7 cm. What is its area?","choices":[{"label":"A","text":"19 cm²"},{"label":"B","text":"42 cm²"},{"label":"C","text":"84 cm²"},{"label":"D","text":"96 cm²"}],"answer":"B","explanation":"Triangle area is 1/2 × 12 × 7 = 42."},{"num":21,"prompt":"A number is multiplied by 3, then 8 is subtracted. The result is 28. What was the original number?","choices":[{"label":"A","text":"11"},{"label":"B","text":"10"},{"label":"C","text":"13"},{"label":"D","text":"12"}],"answer":"D","explanation":"Undo the subtraction, then divide by 3: (28+8)÷3=12."},{"num":22,"prompt":"A table follows this rule: 2 boxes → 18 pencils, 5 boxes → 45 pencils, 8 boxes → 72 pencils. Which rule matches the table?","choices":[{"label":"A","text":"Add 16 to the number of boxes."},{"label":"B","text":"Multiply the number of boxes by 9."},{"label":"C","text":"Multiply the number of boxes by 8."},{"label":"D","text":"Add 9 to the number of boxes."}],"answer":"B","explanation":"Each box corresponds to 9 pencils."},{"num":23,"prompt":"A dot pattern has 5 dots in Figure 1, 9 in Figure 2, 13 in Figure 3, and 17 in Figure 4. How many dots are in Figure 7?","choices":[{"label":"A","text":"25"},{"label":"B","text":"29"},{"label":"C","text":"31"},{"label":"D","text":"33"}],"answer":"B","explanation":"The pattern adds 4 each figure. Figure 7 has 17+3×4=29."},{"num":24,"prompt":"Of 40 students, 22 chose art, 20 chose music, and 4 chose neither. How many chose both art and music?","choices":[{"label":"A","text":"5"},{"label":"B","text":"6"},{"label":"C","text":"4"},{"label":"D","text":"7"}],"answer":"B","explanation":"36 chose at least one. The overlap is 22+20−36=6."},{"num":25,"prompt":"A bag contains 4 red, 3 blue, and 5 yellow tiles. What is the probability of choosing a blue tile at random?","choices":[{"label":"A","text":"1/4"},{"label":"B","text":"1/3"},{"label":"C","text":"3/5"},{"label":"D","text":"3/12"}],"answer":"A","explanation":"There are 12 tiles total and 3 are blue, so 3/12=1/4."},{"num":26,"prompt":"A board is 9 feet 11 inches long. How many inches long is it?","choices":[{"label":"A","text":"131"},{"label":"B","text":"107"},{"label":"C","text":"108"},{"label":"D","text":"119"}],"answer":"D","explanation":"9 feet = 108 inches; add 11 to get 119."},{"num":27,"prompt":"Segment AB is 18 units long. Point C lies between A and B. If AC = x + 2 and CB = 2x + 1, what is x?","choices":[{"label":"A","text":"3"},{"label":"B","text":"5"},{"label":"C","text":"6"},{"label":"D","text":"15"}],"answer":"B","explanation":"(x+2)+(2x+1)=18, so 3x+3=18 and x=5."},{"num":28,"prompt":"Three bags hold 24 candles each. Four boxes hold 18 candles each. Which statement is true?","choices":[{"label":"A","text":"The bags hold more candles in total."},{"label":"B","text":"The boxes hold more candles in total."},{"label":"C","text":"They hold the same total number of candles."},{"label":"D","text":"The difference is 18 candles."}],"answer":"C","explanation":"3×24=72 and 4×18=72."},{"num":29,"prompt":"After a 20% increase, an item costs $120. What was its original price?","choices":[{"label":"A","text":"$110"},{"label":"B","text":"$96"},{"label":"C","text":"$90"},{"label":"D","text":"$100"}],"answer":"D","explanation":"$120 represents 120% of the original price, so the original was $100."},{"num":30,"prompt":"A rectangular frame has perimeter 30 cm and one side is 9 cm. The unknown side is doubled for a new design. By how many centimeters does that side increase?","choices":[{"label":"A","text":"3"},{"label":"B","text":"6"},{"label":"C","text":"9"},{"label":"D","text":"12"}],"answer":"B","explanation":"2(9+w)=30 gives w=6. Doubling it to 12 increases it by 6."},{"num":31,"prompt":"The pattern is 12, 19, 17, 24, 22, ___. The rule alternates +7, −2. What comes next?","choices":[{"label":"A","text":"27"},{"label":"B","text":"28"},{"label":"C","text":"30"},{"label":"D","text":"29"}],"answer":"D","explanation":"After subtracting 2, the next step is +7, giving 29."},{"num":32,"prompt":"A floor grid has 40 equal squares. If 26 are shaded, what percent is shaded?","choices":[{"label":"A","text":"35%"},{"label":"B","text":"60%"},{"label":"C","text":"65%"},{"label":"D","text":"75%"}],"answer":"C","explanation":"26/40 = 0.65 = 65%."},{"num":33,"prompt":"Lena completes 3 pages for every 2 pages Noah completes. If Noah completes 14 pages, how many does Lena complete?","choices":[{"label":"A","text":"18"},{"label":"B","text":"21"},{"label":"C","text":"24"},{"label":"D","text":"28"}],"answer":"B","explanation":"14 is 7 groups of 2, so Lena completes 7×3=21."},{"num":34,"prompt":"A box has 6 black, 6 white, 4 green, and p purple counters. If the probability of purple is 1/5, how many purple counters are there?","choices":[{"label":"A","text":"3"},{"label":"B","text":"4"},{"label":"C","text":"5"},{"label":"D","text":"6"}],"answer":"B","explanation":"There are 16 non-purple counters. p/(16+p)=1/5 gives 5p=16+p, so p=4."},{"num":35,"prompt":"A cube has side length 4 cm. What is its volume?","choices":[{"label":"A","text":"16 cm³"},{"label":"B","text":"32 cm³"},{"label":"C","text":"64 cm³"},{"label":"D","text":"96 cm³"}],"answer":"C","explanation":"Cube volume is 4×4×4=64 cubic centimeters."},{"num":36,"prompt":"If 0 < n < 1, which is greater?","choices":[{"label":"A","text":"n²"},{"label":"B","text":"n"},{"label":"C","text":"They are equal"},{"label":"D","text":"Cannot be determined"}],"answer":"B","explanation":"For a positive number less than 1, squaring makes it smaller, so n is greater."},{"num":37,"prompt":"The ratio of red tiles to blue tiles is 5:7. If there are 45 red tiles, how many blue tiles are there?","choices":[{"label":"A","text":"70"},{"label":"B","text":"56"},{"label":"C","text":"63"},{"label":"D","text":"52"}],"answer":"C","explanation":"The ratio was multiplied by 9, so blue tiles = 7×9=63."},{"num":38,"prompt":"A school orders 9 packs of 24 pencils. It gives 68 pencils to Grade 5 and 79 pencils to Grade 6. How many pencils remain?","choices":[{"label":"A","text":"49"},{"label":"B","text":"59"},{"label":"C","text":"69"},{"label":"D","text":"147"}],"answer":"C","explanation":"9×24=216. Then 216−68−79=69."}],"minutes":35},"reading":{"passages":[{"title":"Cooling the City, One Tree at a Time","text":"On a summer afternoon, a city sidewalk can become much hotter than a nearby park. Concrete and asphalt absorb sunlight during the day and release heat slowly, while trees provide shade and cool the air as water evaporates from their leaves. This difference helps explain a problem known as the urban heat island effect: neighborhoods with many dark roofs, roads, and parking lots often stay warmer than areas with more vegetation.\n\nCity planners have begun using trees as part of their response. A row of mature trees can shade sidewalks and building walls, making outdoor spaces more comfortable and reducing the amount of energy needed to cool nearby buildings. Trees can also slow rainwater as it reaches the ground, which may reduce pressure on storm drains during heavy rain.\n\nPlanting trees, however, is not as simple as placing any tree in any open patch of soil. Young trees need water while their roots become established. Some species grow too large for spaces beneath power lines, while others struggle in compacted soil or in areas where winter salt collects. A tree that thrives in one neighborhood may fail in another.\n\nFor this reason, many cities now create detailed planting plans. They examine sunlight, soil, available space, and local climate before choosing a species. They may also focus planting in neighborhoods that have fewer trees and higher summer temperatures. The goal is not merely to make streets look greener. When trees are chosen carefully and maintained over time, they can become part of a city's infrastructure—working alongside drains, sidewalks, and buildings to make neighborhoods more comfortable and resilient.\n\nTree-planting plans can fail when officials count only the number of trees installed. A fast-growing species may provide shade quickly but struggle in compacted soil, while a slower native species may survive longer and support more insects. Planners also have to decide where shade is most needed. Measuring success years later—through survival, canopy size, cooling, and storm-water effects—can lead to different choices than simply celebrating a large planting day.\n\nEquity adds another layer to the decision. Wealthier neighborhoods may already have mature trees, while hotter areas may have less shade and fewer resources for watering new plantings. A city that distributes the same number of trees everywhere could appear fair while leaving the greatest heat risk largely unchanged. Some planners therefore combine temperature maps, health data, sidewalk conditions, and resident requests when setting priorities. The result is more complicated than planting where space is easiest to find, but it may better match the public goal of reducing heat exposure.","questions":[{"num":1,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Cities can use carefully selected and maintained trees to reduce heat and provide other practical benefits."},{"label":"B","text":"All city neighborhoods should plant the same species of tree."},{"label":"C","text":"Concrete sidewalks are more attractive than parks."},{"label":"D","text":"Trees completely eliminate the need for storm drains."}],"answer":"A","explanation":"The passage explains several benefits of urban trees and emphasizes careful planning and maintenance.","strand":"Main Idea"},{"num":2,"prompt":"Why does the author mention power lines and winter salt?","choices":[{"label":"A","text":"To show that city tree planting requires attention to local conditions."},{"label":"B","text":"To argue that cities should remove all power lines."},{"label":"C","text":"To explain why trees grow faster in winter."},{"label":"D","text":"To prove that young trees need no maintenance."}],"answer":"A","explanation":"These examples show that a tree species must fit the specific planting location.","strand":"Inference"},{"num":3,"prompt":"In the final paragraph, the word “infrastructure” most nearly refers to","choices":[{"label":"A","text":"systems and structures that help a city function."},{"label":"B","text":"decorations used only for appearance."},{"label":"C","text":"plants found only in forests."},{"label":"D","text":"temporary construction projects."}],"answer":"A","explanation":"The passage compares trees with drains, sidewalks, and buildings—parts of the systems that help a city function.","strand":"Vocabulary in Context"},{"num":4,"prompt":"According to the passage, trees can help during heavy rain by","choices":[{"label":"A","text":"making rain fall less often."},{"label":"B","text":"slowing water before it reaches storm drains."},{"label":"C","text":"absorbing all water before it reaches the ground."},{"label":"D","text":"preventing clouds from forming."}],"answer":"B","explanation":"The passage says trees can slow rainwater as it reaches the ground, reducing pressure on storm drains.","strand":"Supporting Ideas"},{"num":5,"prompt":"Why does the author contrast counting planted trees with measuring them years later?","choices":[{"label":"A","text":"To show that installation numbers alone may not reveal long-term success."},{"label":"B","text":"To prove native trees always grow faster."},{"label":"C","text":"To suggest canopy size is the only useful measure."},{"label":"D","text":"To argue that tree planting should stop."}],"answer":"A","explanation":"Long-term survival and effects can matter more than the number planted on one day."}]},{"title":"The Bell in the Back Room","text":"On her first Saturday volunteering at the Harbor Museum, Nia expected to spend the morning greeting visitors. Instead, Mr. Alvarez handed her a pair of cotton gloves and led her through a door marked STAFF ONLY.\n\n“We have a mystery,” he said.\n\nOn a padded table sat a small brass bell, darkened with age. A handwritten tag tied to its handle read, “Found near Pier 3, 1968.” Nothing else was known about it.\n\nNia wanted to polish the bell immediately, but Mr. Alvarez stopped her. Cleaning an old object, he explained, could erase clues. A scratch, a faded mark, or even a layer of dirt might help reveal where an object had been used.\n\nThey began by examining the bell under a bright lamp. Nia noticed three tiny letters stamped near the base: H.S.C. She searched the museum's digital records and found dozens of references to local companies, clubs, and ships, but none matched. Then she remembered a wall display about the harbor's old streetcars. One photograph showed a conductor holding a bell-shaped signal device.\n\nNia enlarged the photograph. On the side of the streetcar were the words Harbor Streetcar Company.\n\nThe letters matched.\n\nFurther research showed that conductors used small bells to signal a driver before electric buttons became common. The date on the tag suggested the bell had probably been discovered during construction near the old streetcar turnaround at Pier 3.\n\nMr. Alvarez smiled. “Not every mystery needs a dramatic answer,” he said. “Sometimes it needs a patient observer.”\n\nAt the end of her shift, Nia finally returned to the front desk. She had greeted no visitors at all, yet the museum suddenly felt much larger than it had that morning.\n\nNia later searches the center's records and discovers that H.S.C. stood for a neighborhood club that once used the building. The discovery does not prove exactly who rang the bell or why it was saved, but it changes the kind of question she asks. Instead of trying to restore the object until it looks new, she begins documenting scratches, repairs, and initials as evidence of the bell's history.\n\nMr. Alvarez encourages Nia to record what she knows separately from what she suspects. The initials are evidence; the idea that a particular club member owned the bell is only a possibility. Nia writes both in her notes but labels them differently. That distinction becomes important when another resident remembers seeing the bell at meetings but cannot identify its owner. The new memory supports part of the story without settling every detail, teaching Nia that historical research often grows by narrowing uncertainty rather than eliminating it all at once.","questions":[{"num":6,"prompt":"What is the main conflict in the passage?","choices":[{"label":"A","text":"Nia and Mr. Alvarez disagree about whether the museum should open."},{"label":"B","text":"Nia must determine what an unidentified old bell may have been used for."},{"label":"C","text":"The museum cannot find enough volunteers to greet visitors."},{"label":"D","text":"Nia wants to ride an old streetcar that no longer exists."}],"answer":"B","explanation":"The story centers on identifying the mysterious brass bell.","strand":"Main Idea"},{"num":7,"prompt":"Why does Mr. Alvarez stop Nia from polishing the bell?","choices":[{"label":"A","text":"He thinks the bell is too valuable to touch."},{"label":"B","text":"He wants to keep possible evidence from being removed."},{"label":"C","text":"He plans to give the bell to a visitor."},{"label":"D","text":"He believes brass should never be cleaned."}],"answer":"B","explanation":"He explains that cleaning could erase scratches, marks, or dirt that provide clues.","strand":"Supporting Ideas"},{"num":8,"prompt":"What can be inferred about Nia by the end of the passage?","choices":[{"label":"A","text":"She has become more interested in careful historical investigation."},{"label":"B","text":"She has decided museum work is too boring."},{"label":"C","text":"She is disappointed that the bell is not made of gold."},{"label":"D","text":"She prefers greeting visitors to solving questions."}],"answer":"A","explanation":"Her patient investigation solves the mystery, and the museum feels 'much larger' to her afterward.","strand":"Inference"},{"num":9,"prompt":"In the sentence “The letters matched,” the letters H.S.C. are important because they","choices":[{"label":"A","text":"identify the likely organization connected to the bell."},{"label":"B","text":"show the year the bell was manufactured."},{"label":"C","text":"prove the bell came from a ship."},{"label":"D","text":"give Nia permission to enter the back room."}],"answer":"A","explanation":"The initials match Harbor Streetcar Company, connecting the bell to local streetcar history.","strand":"Supporting Ideas"},{"num":10,"prompt":"How does Nia's goal change in the added paragraph?","choices":[{"label":"A","text":"She plans to sell the bell."},{"label":"B","text":"She shifts from making the bell look new to preserving evidence about its history."},{"label":"C","text":"She stops asking questions about the initials."},{"label":"D","text":"She decides the bell has no historical value."}],"answer":"B","explanation":"The new records lead her to value wear and markings as historical evidence."}]},{"title":"Messages from the Upper Air","text":"Long before weather satellites circled Earth, scientists still needed information about the atmosphere above the ground. A thermometer outside a laboratory could tell them the temperature at street level, but storms develop through layers of air that extend far above rooftops. To understand those layers, researchers began sending instruments upward.\n\nOne important tool was the weather balloon. Filled with a gas lighter than air, the balloon carried a small package of instruments called a radiosonde. As the balloon rose, the radiosonde measured conditions such as temperature, air pressure, and humidity. A radio transmitter then sent the measurements back to a station on the ground.\n\nThe balloon did not remain the same size during its journey. Air pressure decreases with altitude, so the gas inside the balloon expanded as it climbed. Eventually the balloon stretched so far that it burst. A small parachute slowed the instrument package as it fell back toward Earth.\n\nWeather balloons may seem old-fashioned beside modern satellites, but they still provide valuable information. Satellites can observe huge regions and track cloud systems from above. Balloons, however, can make direct measurements through a vertical slice of the atmosphere. Forecasters combine these different kinds of observations with information from radar, aircraft, ships, and ground stations.\n\nThousands of balloon launches around the world contribute to weather models each day. A single balloon travels only one path, yet its measurements can join a much larger network. This is one reason forecasting is a cooperative science: understanding tomorrow's weather often depends on observations collected by many people, instruments, and countries.\n\nThe value of balloon data also depends on timing and comparison. A measurement taken above one city can be useful on its own, but it becomes more powerful when forecasters compare it with balloons launched at the same hour elsewhere. Those vertical profiles help reveal where air masses differ and where a weather system may be changing faster than surface observations suggest.\n\nBalloon observations are also uneven in space. Launch sites are common near cities and weather stations but sparse over oceans, deserts, and remote mountains. Satellites help fill some of those gaps, yet they measure the atmosphere differently. Forecasters often get the strongest picture by combining instruments whose weaknesses are not the same. A balloon gives detailed measurements along one path; a satellite gives broad coverage. The fact that neither is complete is precisely why using both can be more powerful than choosing one as the “best” source.","questions":[{"num":11,"prompt":"Why were weather balloons useful before satellites existed?","choices":[{"label":"A","text":"They allowed scientists to collect measurements above ground level."},{"label":"B","text":"They prevented storms from reaching cities."},{"label":"C","text":"They could photograph the entire planet at once."},{"label":"D","text":"They replaced every ground weather station."}],"answer":"A","explanation":"Balloons carried instruments upward to measure conditions in higher layers of the atmosphere.","strand":"Supporting Ideas"},{"num":12,"prompt":"What causes a weather balloon to expand as it rises?","choices":[{"label":"A","text":"Air pressure becomes lower at higher altitudes."},{"label":"B","text":"The radiosonde becomes heavier."},{"label":"C","text":"Humidity always doubles above clouds."},{"label":"D","text":"The parachute pulls on the balloon."}],"answer":"A","explanation":"The passage directly states that lower air pressure allows the gas inside to expand.","strand":"Supporting Ideas"},{"num":13,"prompt":"The passage contrasts balloons with satellites mainly to show that","choices":[{"label":"A","text":"the two tools provide different kinds of useful information."},{"label":"B","text":"satellites have made all balloons unnecessary."},{"label":"C","text":"balloons can remain in the air longer than satellites."},{"label":"D","text":"satellites can measure only ground temperature."}],"answer":"A","explanation":"Satellites cover large regions, while balloons directly sample vertical layers; forecasters use both.","strand":"Organization & Logic"},{"num":14,"prompt":"In the last paragraph, “cooperative” most nearly means","choices":[{"label":"A","text":"dependent on people or groups working together."},{"label":"B","text":"unable to use modern equipment."},{"label":"C","text":"focused on one location."},{"label":"D","text":"easy to complete alone."}],"answer":"A","explanation":"The paragraph emphasizes measurements from many instruments, people, and countries working together.","strand":"Vocabulary in Context"},{"num":15,"prompt":"What does the final paragraph emphasize about balloon measurements?","choices":[{"label":"A","text":"They are most valuable when compared across locations and times."},{"label":"B","text":"One balloon can replace every other weather instrument."},{"label":"C","text":"Surface observations are unnecessary."},{"label":"D","text":"Weather balloons measure only wind speed."}],"answer":"A","explanation":"The paragraph explains that coordinated profiles reveal patterns a single observation cannot."}]},{"title":"Learning from a Gecko's Feet","text":"A gecko can race across a wall and even cling to a ceiling without using glue. For years, this ability puzzled scientists. The answer turned out to be hidden in structures far too small to see with the unaided eye.\n\nThe underside of a gecko's toe is covered with millions of microscopic hairs. Each hair branches into even smaller tips. When these tips come extremely close to a surface, weak attractions between molecules help the toe grip. One attraction is tiny, but millions acting together can create a surprisingly strong hold.\n\nResearchers studying this system became interested in biomimicry, the practice of designing materials or machines by studying solutions found in nature. Instead of copying a gecko's foot exactly, engineers try to understand the useful principle behind it. They have experimented with dry adhesives made of tiny synthetic structures that can attach to smooth surfaces without sticky liquid glue.\n\nSuch materials could have several advantages. Ordinary tape often collects dust or leaves residue. A gecko-inspired surface might be reusable and could potentially work in places where liquid adhesives are inconvenient. Researchers have explored possible uses in manufacturing, robotics, and equipment that must grip delicate surfaces.\n\nCreating a practical material is difficult, however. A laboratory sample that works on clean glass may not perform as well on rough, dusty, wet, or oily surfaces. It can also be challenging to manufacture microscopic structures cheaply and consistently.\n\nThe gecko, in other words, offers engineers a useful lesson, not a ready-made instruction manual. Nature can suggest an idea, but turning that idea into dependable technology still requires testing, redesign, and patience.\n\nThis research illustrates a common challenge in biomimicry: a natural system may solve several problems at once. Gecko toes grip, release quickly, tolerate repeated use, and function without liquid glue. A synthetic material that copies only the gripping force may still fail as a practical product if it is difficult to detach or expensive to manufacture. Engineers must decide which features are essential to copy and which can be simplified.\n\nResearchers also distinguish between a laboratory demonstration and a useful product. A material may hold a large weight once on perfectly clean glass, but a factory or rescue robot needs thousands of reliable attachment-and-release cycles. Engineers test how performance changes after dust, repeated use, temperature changes, and small manufacturing differences. This kind of testing can make an invention look less impressive at first because weaknesses become visible. Yet discovering those weaknesses is part of turning an interesting idea into dependable technology.","questions":[{"num":16,"prompt":"What is the passage mainly about?","choices":[{"label":"A","text":"How gecko feet inspired engineers to investigate reusable dry adhesives."},{"label":"B","text":"Why geckos are becoming less common in cities."},{"label":"C","text":"How ordinary tape is manufactured in factories."},{"label":"D","text":"Why scientists want robots to look exactly like geckos."}],"answer":"A","explanation":"The passage explains gecko adhesion and how that principle inspires engineered materials.","strand":"Main Idea"},{"num":17,"prompt":"Why can millions of weak molecular attractions create a strong grip?","choices":[{"label":"A","text":"Their combined effect becomes much larger."},{"label":"B","text":"They turn into liquid glue."},{"label":"C","text":"They make the gecko's toes heavier."},{"label":"D","text":"They permanently fuse the toe to the surface."}],"answer":"A","explanation":"The passage explains that each attraction is tiny, but millions together produce strong holding force.","strand":"Inference"},{"num":18,"prompt":"What does “biomimicry” mean as used in the passage?","choices":[{"label":"A","text":"Designing by studying useful ideas found in nature."},{"label":"B","text":"Protecting wild animals from technology."},{"label":"C","text":"Making exact plastic copies of animals."},{"label":"D","text":"Training animals to operate machines."}],"answer":"A","explanation":"The passage defines biomimicry as designing materials or machines by studying natural solutions.","strand":"Vocabulary in Context"},{"num":19,"prompt":"Why does the author discuss dusty, wet, and oily surfaces?","choices":[{"label":"A","text":"To explain challenges that a laboratory adhesive must overcome before practical use."},{"label":"B","text":"To prove geckos cannot climb outdoors."},{"label":"C","text":"To recommend using ordinary tape instead of new materials."},{"label":"D","text":"To show that all surfaces have identical properties."}],"answer":"A","explanation":"These conditions illustrate real-world difficulties that prototypes may face.","strand":"Organization & Logic"},{"num":20,"prompt":"What complication does the final paragraph add to the idea of biomimicry?","choices":[{"label":"A","text":"Gecko feet use liquid glue."},{"label":"B","text":"Manufacturing cost never matters."},{"label":"C","text":"Engineers must copy every natural structure exactly."},{"label":"D","text":"Copying one useful feature may not reproduce the full performance of the natural system."}],"answer":"D","explanation":"A practical design may need gripping, release, durability, and manufacturability, not just one copied feature."}]},{"title":"A Wall That Remembers","text":"When the Riverside Community Center planned to repaint a long blank wall beside its entrance, the first idea was simple: choose one cheerful color and finish the job in a weekend. Then local artist Elena Ruiz suggested something more ambitious. She proposed a mural based on stories from the neighborhood.\n\nRuiz began by inviting residents to bring photographs and memories to a series of meetings. An older resident described the small grocery store his parents had operated decades earlier. A teenager talked about the basketball court where three generations of her family had played. Others remembered a yearly street festival, a garden planted on an abandoned lot, and the creek that once ran visibly before part of it was routed underground.\n\nNot every memory could fit on the wall. Ruiz grouped the stories into themes—work, play, celebration, and change—and sketched a design that connected them. Instead of painting the old grocery store as one separate scene and the basketball court as another, she used a winding blue line representing the creek to lead the viewer from one part of the mural to the next.\n\nVolunteers helped paint large sections, while Ruiz handled faces and other detailed areas. The project took six weekends rather than one. It also required debate. Some residents worried that newer families would not see themselves in a mural focused on the past. In response, Ruiz added an unfinished-looking section near the end, where painted shapes gradually became outlines. She explained that the open space represented stories still being created.\n\nAfter the mural was completed, people often stopped to point out details to one another. The wall had become more than decoration. It gave neighbors a place to discuss what had changed, what had remained, and what they hoped would come next.\n\nMonths later, Ruiz returned to photograph the mural and noticed that residents had begun using the unfinished section during tours. Some pointed to the outlines when discussing new businesses or recent arrivals. Ruiz chose not to fill the space. By leaving part of the design visibly incomplete, she had created a feature whose meaning could change as the neighborhood changed.\n\nThe mural also raises a question about who gets to define a neighborhood's story. Ruiz had artistic authority, but she chose not to treat the meetings as a simple vote on which images were most popular. Instead, she looked for patterns, disagreements, and missing viewpoints. A memory mentioned by only one person could still matter if it represented a group rarely included in local histories. The project suggests that community art involves interpretation: listening widely, making choices, and being transparent about the fact that no wall can contain every story.","questions":[{"num":21,"prompt":"Why did Ruiz hold meetings with residents?","choices":[{"label":"A","text":"To collect stories and images that could shape the mural."},{"label":"B","text":"To ask residents to choose one wall color."},{"label":"C","text":"To sell photographs of the community center."},{"label":"D","text":"To decide whether the building should be demolished."}],"answer":"A","explanation":"The meetings gathered photographs and memories to inspire the mural.","strand":"Supporting Ideas"},{"num":22,"prompt":"Why did Ruiz use the blue creek line in the design?","choices":[{"label":"A","text":"To connect several different neighborhood stories into one composition."},{"label":"B","text":"To show where volunteers were allowed to paint."},{"label":"C","text":"To cover a mistake in the original wall color."},{"label":"D","text":"To prove the creek still flows beside the center."}],"answer":"A","explanation":"The creek visually links themes and scenes across the mural.","strand":"Organization & Logic"},{"num":23,"prompt":"What concern led Ruiz to add the unfinished-looking section?","choices":[{"label":"A","text":"Some residents felt a mural about the past might not include newer members of the community."},{"label":"B","text":"The paint supply was too small to finish the wall."},{"label":"C","text":"Older residents wanted the mural removed."},{"label":"D","text":"Volunteers refused to paint detailed faces."}],"answer":"A","explanation":"The open section was added in response to concern that newer families might not see themselves represented.","strand":"Supporting Ideas"},{"num":24,"prompt":"The phrase “stories still being created” suggests that the neighborhood","choices":[{"label":"A","text":"will continue to change and develop new experiences."},{"label":"B","text":"has forgotten everything about its past."},{"label":"C","text":"plans to erase the mural each year."},{"label":"D","text":"will soon stop welcoming new families."}],"answer":"A","explanation":"The open outlines represent future experiences and changes that have not happened yet.","strand":"Inference"},{"num":25,"prompt":"Why is the unfinished section especially effective in the final paragraph?","choices":[{"label":"A","text":"It allows its meaning to continue changing with the neighborhood."},{"label":"B","text":"It proves the mural was never completed."},{"label":"C","text":"It gives volunteers space to repaint the entire wall."},{"label":"D","text":"It hides the oldest stories."}],"answer":"A","explanation":"Residents use the open-looking section to connect the mural with new events and people."}]}],"minutes":25},"math":{"questions":[{"num":1,"prompt":"What is 188 × 11?","choices":[{"label":"A","text":"2256"},{"label":"B","text":"2057"},{"label":"C","text":"2068"},{"label":"D","text":"1880"}],"answer":"C","explanation":"188 × 11 = 2068."},{"num":2,"prompt":"A pentagon has side lengths 8 cm, 11 cm, 7 cm, 9 cm, and 10 cm. What is its perimeter?","choices":[{"label":"A","text":"35 cm"},{"label":"B","text":"40 cm"},{"label":"C","text":"45 cm"},{"label":"D","text":"55 cm"}],"answer":"C","explanation":"Add the side lengths: 8+11+7+9+10=45."},{"num":3,"prompt":"A pictograph uses one symbol to represent 4 books. If a row has 7 symbols, how many books does it represent?","choices":[{"label":"A","text":"11"},{"label":"B","text":"24"},{"label":"C","text":"28"},{"label":"D","text":"32"}],"answer":"C","explanation":"7 symbols × 4 books per symbol = 28 books."},{"num":4,"prompt":"If y = 5(x + 1), what is y when x = 7?","choices":[{"label":"A","text":"35"},{"label":"B","text":"40"},{"label":"C","text":"45"},{"label":"D","text":"70"}],"answer":"B","explanation":"5(7+1)=5×8=40."},{"num":5,"prompt":"What is 720 ÷ 10?","choices":[{"label":"A","text":"73"},{"label":"B","text":"62"},{"label":"C","text":"72"},{"label":"D","text":"71"}],"answer":"C","explanation":"720 ÷ 10 = 72."},{"num":6,"prompt":"A reading log shows Maya read 12 pages Monday, 18 Tuesday, 15 Wednesday, and 23 Thursday. How many more pages did she read Thursday than Monday?","choices":[{"label":"A","text":"8"},{"label":"B","text":"10"},{"label":"C","text":"11"},{"label":"D","text":"35"}],"answer":"C","explanation":"23−12=11."},{"num":7,"prompt":"A number machine squares its input. What is the output for an input of 13?","choices":[{"label":"A","text":"26"},{"label":"B","text":"39"},{"label":"C","text":"156"},{"label":"D","text":"169"}],"answer":"D","explanation":"13²=169."},{"num":8,"prompt":"A pitcher holds 3 quarts and a jug holds 5 quarts. Which combination holds exactly 19 quarts?","choices":[{"label":"A","text":"3 pitchers and 2 jugs"},{"label":"B","text":"2 pitchers and 2 jugs"},{"label":"C","text":"3 pitchers and 3 jugs"},{"label":"D","text":"1 pitcher and 4 jugs"}],"answer":"A","explanation":"3×3 + 2×5 = 9+10=19."},{"num":9,"prompt":"What is the value of 12 + 7 × 2?","choices":[{"label":"A","text":"33"},{"label":"B","text":"26"},{"label":"C","text":"86"},{"label":"D","text":"38"}],"answer":"B","explanation":"Multiply first: 7×2=14; then add 12 to get 26."},{"num":10,"prompt":"About 2/5 of 1,500 students ride the bus. About how many students is that?","choices":[{"label":"A","text":"300"},{"label":"B","text":"500"},{"label":"C","text":"600"},{"label":"D","text":"750"}],"answer":"C","explanation":"2/5×1,500=600."},{"num":11,"prompt":"$9,684 is divided equally among 3 accounts. How much goes into each account?","choices":[{"label":"A","text":"$3,128"},{"label":"B","text":"$3,228"},{"label":"C","text":"$3,328"},{"label":"D","text":"$6,684"}],"answer":"B","explanation":"9,684÷3=3,228."},{"num":12,"prompt":"Point P is located 4 units right of the y-axis and 6 units above the x-axis. What are its coordinates?","choices":[{"label":"A","text":"(4, 6)"},{"label":"B","text":"(6, 4)"},{"label":"C","text":"(-4, 6)"},{"label":"D","text":"(4, -6)"}],"answer":"A","explanation":"Right of the y-axis gives x=4 and above the x-axis gives y=6."},{"num":13,"prompt":"Point A is at 2 on a vertical number line. Point B is 7 units below A. Where is B?","choices":[{"label":"A","text":"-9"},{"label":"B","text":"-5"},{"label":"C","text":"5"},{"label":"D","text":"9"}],"answer":"B","explanation":"2−7=-5."},{"num":14,"prompt":"What is 1/2 + 3/8?","choices":[{"label":"A","text":"1/2"},{"label":"B","text":"1/8"},{"label":"C","text":"3/8"},{"label":"D","text":"7/8"}],"answer":"D","explanation":"Use a common denominator; the sum is 7/8."},{"num":15,"prompt":"Which fraction is equivalent to 0.35?","choices":[{"label":"A","text":"7/20"},{"label":"B","text":"3/5"},{"label":"C","text":"35/10"},{"label":"D","text":"1/35"}],"answer":"A","explanation":"0.35=35/100=7/20."},{"num":16,"prompt":"What is 5 3/4 − 5/8?","choices":[{"label":"A","text":"5 1/8"},{"label":"B","text":"5 3/8"},{"label":"C","text":"4 7/8"},{"label":"D","text":"6 3/8"}],"answer":"A","explanation":"Use eighths to subtract. The result is 5 1/8."},{"num":17,"prompt":"The scores are 82, 88, 91, 88, 95, 88, and 90. What is the mode?","choices":[{"label":"A","text":"82"},{"label":"B","text":"88"},{"label":"C","text":"90"},{"label":"D","text":"95"}],"answer":"B","explanation":"88 appears most often."},{"num":18,"prompt":"A triangle has angles of 35° and 65°. What is the third angle?","choices":[{"label":"A","text":"70°"},{"label":"B","text":"80°"},{"label":"C","text":"90°"},{"label":"D","text":"100°"}],"answer":"B","explanation":"Triangle angles sum to 180°, so 180−35−65=80."},{"num":19,"prompt":"Noah has 6 packs of 12 baseball cards and 4 packs of 15 soccer cards. Which expression finds the total number of cards?","choices":[{"label":"A","text":"6×12 + 4×15"},{"label":"B","text":"(6+4)×(12+15)"},{"label":"C","text":"6×(12+15)"},{"label":"D","text":"4×(12+15)"}],"answer":"A","explanation":"Multiply each number of packs by cards per pack, then add."},{"num":20,"prompt":"What is 4.8 × 1.9?","choices":[{"label":"A","text":"6.7"},{"label":"B","text":"8.62"},{"label":"C","text":"9.62"},{"label":"D","text":"9.12"}],"answer":"D","explanation":"Multiplying gives 9.12."},{"num":21,"prompt":"A square has area 81 cm². What is its perimeter?","choices":[{"label":"A","text":"18 cm"},{"label":"B","text":"27 cm"},{"label":"C","text":"36 cm"},{"label":"D","text":"81 cm"}],"answer":"C","explanation":"The side length is 9 cm, so perimeter is 4×9=36."},{"num":22,"prompt":"A triangle has base 12 units and height 9 units. What is its area?","choices":[{"label":"A","text":"108"},{"label":"B","text":"54"},{"label":"C","text":"45"},{"label":"D","text":"66"}],"answer":"B","explanation":"Area = 1/2 × 12 × 9 = 54 square units."},{"num":23,"prompt":"A triangle has base 14 m and height 9 m. What is its area?","choices":[{"label":"A","text":"23 m²"},{"label":"B","text":"63 m²"},{"label":"C","text":"126 m²"},{"label":"D","text":"252 m²"}],"answer":"B","explanation":"Area = 1/2×14×9=63."},{"num":24,"prompt":"A tank contains 120 liters. It loses 7 liters every 5 minutes. How much remains after 25 minutes?","choices":[{"label":"A","text":"78 L"},{"label":"B","text":"85 L"},{"label":"C","text":"92 L"},{"label":"D","text":"113 L"}],"answer":"B","explanation":"25 minutes is five intervals; 5×7=35 liters lost, so 120−35=85."},{"num":25,"prompt":"A driver passes 48 traffic lights and stops at about 1 out of every 6. About how many stops is that?","choices":[{"label":"A","text":"6"},{"label":"B","text":"8"},{"label":"C","text":"12"},{"label":"D","text":"42"}],"answer":"B","explanation":"48÷6=8."},{"num":26,"prompt":"Cards numbered 1 through 15 are in a bag. What is the probability of drawing a prime number?","choices":[{"label":"A","text":"5/15"},{"label":"B","text":"6/15"},{"label":"C","text":"7/15"},{"label":"D","text":"8/15"}],"answer":"B","explanation":"The primes are 2,3,5,7,11,13: 6 of 15."},{"num":27,"prompt":"When it is 10:00 a.m. in City A, it is 1:00 p.m. in City B. When it is 6:30 p.m. in City B, what time is it in City A?","choices":[{"label":"A","text":"2:30 p.m."},{"label":"B","text":"3:30 p.m."},{"label":"C","text":"4:30 p.m."},{"label":"D","text":"9:30 p.m."}],"answer":"B","explanation":"City B is 3 hours ahead, so 6:30 p.m. in B is 3:30 p.m. in A."},{"num":28,"prompt":"A rectangular prism measures 9 by 8 by 5 units. What is its volume?","choices":[{"label":"A","text":"365"},{"label":"B","text":"314"},{"label":"C","text":"72"},{"label":"D","text":"360"}],"answer":"D","explanation":"Volume = 9×8×5=360 cubic units."},{"num":29,"prompt":"How many integers between 40 and 70 are divisible by 6?","choices":[{"label":"A","text":"4"},{"label":"B","text":"5"},{"label":"C","text":"6"},{"label":"D","text":"7"}],"answer":"B","explanation":"The multiples are 42,48,54,60,66: five integers."},{"num":30,"prompt":"A scientist records the lengths, masses, and colors of 12 leaves. Which question is NOT statistical?","choices":[{"label":"A","text":"What is the average leaf length?"},{"label":"B","text":"Which color appears most often?"},{"label":"C","text":"What is the mass of Leaf #1?"},{"label":"D","text":"How much do leaf masses vary?"}],"answer":"C","explanation":"A statistical question expects variation across a group; the mass of one specific leaf is a single fixed value."}],"minutes":30},"essay":{"prompt":"Think of a skill or activity that seemed difficult when you first tried it but became easier with practice. Explain what helped you improve and what you learned from the experience.","guidance":"Organize your response clearly. Use specific details to describe the challenge, the steps you took, and what changed.","minutes":30},"difficulty":{"label":"Challenging","score":4,"description":"Denser passages, nuanced verbal clues, and more demanding quantitative relationships."}},"lower-test5":{"title":"Lower Level Practice Test #5","verbal":{"minutes":20,"questions":[{"num":1,"prompt":"ANOMALOUS:","choices":[{"label":"A","text":"unusual"},{"label":"B","text":"expected"},{"label":"C","text":"gradual"},{"label":"D","text":"orderly"}],"answer":"A","explanation":"Anomalous means different from what is normal or expected.","part":"Synonyms"},{"num":2,"prompt":"CORROBORATE:","choices":[{"label":"A","text":"postpone"},{"label":"B","text":"contradict"},{"label":"C","text":"confirm"},{"label":"D","text":"invent"}],"answer":"C","explanation":"To corroborate is to provide evidence that confirms something.","part":"Synonyms"},{"num":3,"prompt":"DISCERN:","choices":[{"label":"A","text":"divide"},{"label":"B","text":"ignore"},{"label":"C","text":"detect"},{"label":"D","text":"conceal"}],"answer":"C","explanation":"To discern is to notice or recognize something, often with care.","part":"Synonyms"},{"num":4,"prompt":"EQUIVOCAL:","choices":[{"label":"A","text":"uncertain"},{"label":"B","text":"definite"},{"label":"C","text":"generous"},{"label":"D","text":"obvious"}],"answer":"A","explanation":"Equivocal means unclear or open to more than one interpretation.","part":"Synonyms"},{"num":5,"prompt":"EXACERBATE:","choices":[{"label":"A","text":"worsen"},{"label":"B","text":"measure"},{"label":"C","text":"replace"},{"label":"D","text":"alleviate"}],"answer":"A","explanation":"To exacerbate is to make a problem worse.","part":"Synonyms"},{"num":6,"prompt":"FRUGAL:","choices":[{"label":"A","text":"economical"},{"label":"B","text":"elaborate"},{"label":"C","text":"wasteful"},{"label":"D","text":"impatient"}],"answer":"A","explanation":"Frugal means careful about using money or resources.","part":"Synonyms"},{"num":7,"prompt":"INHERENT:","choices":[{"label":"A","text":"accidental"},{"label":"B","text":"intrinsic"},{"label":"C","text":"external"},{"label":"D","text":"temporary"}],"answer":"B","explanation":"Inherent means existing as a natural or essential part of something.","part":"Synonyms"},{"num":8,"prompt":"LUCID:","choices":[{"label":"A","text":"ornamental"},{"label":"B","text":"intelligible"},{"label":"C","text":"confusing"},{"label":"D","text":"remote"}],"answer":"B","explanation":"Lucid means clear and easy to understand.","part":"Synonyms"},{"num":9,"prompt":"MITIGATE:","choices":[{"label":"A","text":"intensify"},{"label":"B","text":"predict"},{"label":"C","text":"lessen"},{"label":"D","text":"separate"}],"answer":"C","explanation":"To mitigate is to make something less severe.","part":"Synonyms"},{"num":10,"prompt":"NOVICE:","choices":[{"label":"A","text":"beginner"},{"label":"B","text":"leader"},{"label":"C","text":"expert"},{"label":"D","text":"critic"}],"answer":"A","explanation":"A novice is a person who is new to an activity.","part":"Synonyms"},{"num":11,"prompt":"PERVASIVE:","choices":[{"label":"A","text":"hidden"},{"label":"B","text":"brief"},{"label":"C","text":"limited"},{"label":"D","text":"widespread"}],"answer":"D","explanation":"Pervasive means spreading widely throughout an area or group.","part":"Synonyms"},{"num":12,"prompt":"PLAUSIBLE:","choices":[{"label":"A","text":"irrelevant"},{"label":"B","text":"temporary"},{"label":"C","text":"impossible"},{"label":"D","text":"credible"}],"answer":"D","explanation":"Plausible means reasonable or believable.","part":"Synonyms"},{"num":13,"prompt":"RIGOROUS:","choices":[{"label":"A","text":"casual"},{"label":"B","text":"fragile"},{"label":"C","text":"vague"},{"label":"D","text":"thorough"}],"answer":"D","explanation":"Rigorous means extremely thorough, careful, or demanding.","part":"Synonyms"},{"num":14,"prompt":"SPORADIC:","choices":[{"label":"A","text":"constant"},{"label":"B","text":"uniform"},{"label":"C","text":"occasional"},{"label":"D","text":"planned"}],"answer":"C","explanation":"Sporadic means occurring irregularly from time to time.","part":"Synonyms"},{"num":15,"prompt":"TENACIOUS:","choices":[{"label":"A","text":"persistent"},{"label":"B","text":"hesitant"},{"label":"C","text":"temporary"},{"label":"D","text":"careless"}],"answer":"A","explanation":"Tenacious means persistent and unwilling to give up.","part":"Synonyms"},{"num":16,"prompt":"UNDERMINE:","choices":[{"label":"A","text":"measure"},{"label":"B","text":"weaken"},{"label":"C","text":"clarify"},{"label":"D","text":"support"}],"answer":"B","explanation":"To undermine is to weaken something gradually or indirectly.","part":"Synonyms"},{"num":17,"prompt":"VERSATILE:","choices":[{"label":"A","text":"adaptable"},{"label":"B","text":"limited"},{"label":"C","text":"fragile"},{"label":"D","text":"ordinary"}],"answer":"A","explanation":"Versatile means able to be used effectively in many different ways.","part":"Synonyms"},{"num":18,"prompt":"The unusually warm reading looked _____, so the researchers checked the sensor before treating it as evidence.","choices":[{"label":"A","text":"expected"},{"label":"B","text":"gradual"},{"label":"C","text":"orderly"},{"label":"D","text":"anomalous"}],"answer":"D","explanation":"A result that differs from the pattern is anomalous.","part":"Sentence Completion"},{"num":19,"prompt":"One eyewitness account was not enough; the investigator searched for photographs that could _____ the claim.","choices":[{"label":"A","text":"postpone"},{"label":"B","text":"corroborate"},{"label":"C","text":"invent"},{"label":"D","text":"contradict"}],"answer":"B","explanation":"Independent evidence can corroborate, or confirm, a claim.","part":"Sentence Completion"},{"num":20,"prompt":"From the faint markings on the stone, the archaeologist could barely _____ the outline of a symbol.","choices":[{"label":"A","text":"discern"},{"label":"B","text":"conceal"},{"label":"C","text":"divide"},{"label":"D","text":"ignore"}],"answer":"A","explanation":"To discern is to detect something difficult to see.","part":"Sentence Completion"},{"num":21,"prompt":"The principal's response was _____: it sounded supportive, but it did not actually promise that the proposal would be approved.","choices":[{"label":"A","text":"definite"},{"label":"B","text":"equivocal"},{"label":"C","text":"generous"},{"label":"D","text":"enthusiastic"}],"answer":"B","explanation":"A response that remains unclear about its position is equivocal.","part":"Sentence Completion"},{"num":22,"prompt":"Removing vegetation from the slope could _____ erosion by allowing rain to strike bare soil directly.","choices":[{"label":"A","text":"exacerbate"},{"label":"B","text":"predict"},{"label":"C","text":"measure"},{"label":"D","text":"mitigate"}],"answer":"A","explanation":"The change could make erosion worse.","part":"Sentence Completion"},{"num":23,"prompt":"The club was _____ with its limited budget, repairing old equipment instead of replacing everything.","choices":[{"label":"A","text":"frugal"},{"label":"B","text":"elaborate"},{"label":"C","text":"wasteful"},{"label":"D","text":"impulsive"}],"answer":"A","explanation":"Careful use of money is frugal.","part":"Sentence Completion"},{"num":24,"prompt":"Some uncertainty is _____ in any forecast because no model can measure every future condition exactly.","choices":[{"label":"A","text":"inherent"},{"label":"B","text":"external"},{"label":"C","text":"accidental"},{"label":"D","text":"temporary"}],"answer":"A","explanation":"Uncertainty is a natural part of forecasting.","part":"Sentence Completion"},{"num":25,"prompt":"The judge's explanation was so _____ that even people unfamiliar with the rules understood the decision.","choices":[{"label":"A","text":"remote"},{"label":"B","text":"confusing"},{"label":"C","text":"lucid"},{"label":"D","text":"ornamental"}],"answer":"C","explanation":"A clear explanation is lucid.","part":"Sentence Completion"},{"num":26,"prompt":"Planting grasses along the stream bank may _____ erosion even though it cannot eliminate every flood risk.","choices":[{"label":"A","text":"mitigate"},{"label":"B","text":"separate"},{"label":"C","text":"predict"},{"label":"D","text":"intensify"}],"answer":"A","explanation":"Mitigate means reduce the severity of a problem.","part":"Sentence Completion"},{"num":27,"prompt":"As a _____ to woodworking, Eli practiced simple cuts before attempting a complicated cabinet.","choices":[{"label":"A","text":"novice"},{"label":"B","text":"critic"},{"label":"C","text":"leader"},{"label":"D","text":"expert"}],"answer":"A","explanation":"A beginner should start with simpler tasks.","part":"Sentence Completion"},{"num":28,"prompt":"Because the rumor was _____, students heard different versions of it in nearly every hallway.","choices":[{"label":"A","text":"brief"},{"label":"B","text":"hidden"},{"label":"C","text":"limited"},{"label":"D","text":"pervasive"}],"answer":"D","explanation":"Something spread widely is pervasive.","part":"Sentence Completion"},{"num":29,"prompt":"The explanation was _____, but the scientists wanted more evidence before accepting it as certain.","choices":[{"label":"A","text":"plausible"},{"label":"B","text":"irrelevant"},{"label":"C","text":"permanent"},{"label":"D","text":"impossible"}],"answer":"A","explanation":"A reasonable explanation can still require additional evidence.","part":"Sentence Completion"},{"num":30,"prompt":"The research team used a _____ method, repeating trials and checking measurements for possible errors.","choices":[{"label":"A","text":"casual"},{"label":"B","text":"rigorous"},{"label":"C","text":"fragile"},{"label":"D","text":"vague"}],"answer":"B","explanation":"Repeated trials and error checking indicate a rigorous method.","part":"Sentence Completion"},{"num":31,"prompt":"Rainfall had been _____ all summer: several storms were separated by long dry periods.","choices":[{"label":"A","text":"uniform"},{"label":"B","text":"constant"},{"label":"C","text":"sporadic"},{"label":"D","text":"scheduled"}],"answer":"C","explanation":"Irregular, occasional rainfall is sporadic.","part":"Sentence Completion"},{"num":32,"prompt":"The reporter was _____, continuing to request records even after several offices failed to respond.","choices":[{"label":"A","text":"tenacious"},{"label":"B","text":"hesitant"},{"label":"C","text":"temporary"},{"label":"D","text":"careless"}],"answer":"A","explanation":"Persistent effort despite obstacles is tenacious.","part":"Sentence Completion"},{"num":33,"prompt":"A single unexplained error could _____ confidence in the entire data set if researchers ignored it.","choices":[{"label":"A","text":"undermine"},{"label":"B","text":"strengthen"},{"label":"C","text":"measure"},{"label":"D","text":"clarify"}],"answer":"A","explanation":"An ignored error can weaken trust.","part":"Sentence Completion"},{"num":34,"prompt":"The small room was _____ enough to serve as a classroom in the morning and a rehearsal space after school.","choices":[{"label":"A","text":"fragile"},{"label":"B","text":"limited"},{"label":"C","text":"versatile"},{"label":"D","text":"ordinary"}],"answer":"C","explanation":"A space suitable for multiple uses is versatile.","part":"Sentence Completion"}]},"quantitative":{"minutes":35,"questions":[{"num":1,"prompt":"The pattern is 12, 19, 17, 24, 22, ___. The rule alternates +7, −2. What comes next?","choices":[{"label":"A","text":"28"},{"label":"B","text":"30"},{"label":"C","text":"29"},{"label":"D","text":"27"}],"answer":"C","explanation":"After subtracting 2, the next step is +7, giving 29."},{"num":2,"prompt":"The ratio of red tiles to blue tiles is 5:6. If there are 45 red tiles, how many blue tiles are there?","choices":[{"label":"A","text":"48"},{"label":"B","text":"54"},{"label":"C","text":"60"},{"label":"D","text":"51"}],"answer":"B","explanation":"The ratio was multiplied by 9, so blue tiles = 6×9=54."},{"num":3,"prompt":"If 5 × □ = 45, what number belongs in the box?","choices":[{"label":"A","text":"11"},{"label":"B","text":"7"},{"label":"C","text":"9"},{"label":"D","text":"40"}],"answer":"C","explanation":"45 ÷ 5 = 9."},{"num":4,"prompt":"If 10 × 7 = 70, which equation is in the same fact family?","choices":[{"label":"A","text":"70 - 10 = 7"},{"label":"B","text":"10 + 7 = 70"},{"label":"C","text":"70 ÷ 10 = 7"},{"label":"D","text":"70 ÷ 7 = 11"}],"answer":"C","explanation":"Multiplication and division are inverse operations."},{"num":5,"prompt":"What is the median of the data set 8, 11, 14, 17, 26?","choices":[{"label":"A","text":"26"},{"label":"B","text":"15"},{"label":"C","text":"8"},{"label":"D","text":"14"}],"answer":"D","explanation":"With five ordered values, the median is the middle value."},{"num":6,"prompt":"A box holds 110 beads. 2/5 are used for one project, and 8 more are used later. How many beads remain?","choices":[{"label":"A","text":"66"},{"label":"B","text":"50"},{"label":"C","text":"53"},{"label":"D","text":"58"}],"answer":"D","explanation":"2/5 of 110 is 44. Then 110−44−8=58."},{"num":7,"prompt":"The mean of five numbers is 22. Four are 17, 20, 23, 25. What is the fifth number?","choices":[{"label":"A","text":"27"},{"label":"B","text":"23"},{"label":"C","text":"25"},{"label":"D","text":"22"}],"answer":"C","explanation":"The t
