our school could add one new weekly activity for all students. What activity would you choose, and why would it be valuable?","guidance":"State your choice clearly, support it with specific reasons and examples, and organize your ideas into paragraphs.","minutes":30}},"lower-test6":{"title":"Lower Level Practice Test #6","verbal":{"minutes":20,"questions":[{"num":1,"prompt":"ADVERSE:","choices":[{"label":"A","text":"helpful"},{"label":"B","text":"ordinary"},{"label":"C","text":"unfavorable"},{"label":"D","text":"visible"}],"answer":"C","explanation":"Adverse means unfavorable or harmful.","part":"Synonyms"},{"num":2,"prompt":"BOLSTER:","choices":[{"label":"A","text":"criticize"},{"label":"B","text":"divide"},{"label":"C","text":"support"},{"label":"D","text":"wander"}],"answer":"C","explanation":"To bolster is to support or strengthen.","part":"Synonyms"},{"num":3,"prompt":"COHERENT:","choices":[{"label":"A","text":"colorful"},{"label":"B","text":"logical"},{"label":"C","text":"rapid"},{"label":"D","text":"secret"}],"answer":"B","explanation":"Coherent means logical and easy to follow.","part":"Synonyms"},{"num":4,"prompt":"DETER:","choices":[{"label":"A","text":"discourage"},{"label":"B","text":"invent"},{"label":"C","text":"praise"},{"label":"D","text":"repeat"}],"answer":"A","explanation":"To deter is to discourage someone from acting.","part":"Synonyms"},{"num":5,"prompt":"EXEMPLARY:","choices":[{"label":"A","text":"average"},{"label":"B","text":"excellent"},{"label":"C","text":"hidden"},{"label":"D","text":"unfinished"}],"answer":"B","explanation":"Exemplary means excellent and worthy of imitation.","part":"Synonyms"},{"num":6,"prompt":"FORMIDABLE:","choices":[{"label":"A","text":"challenging"},{"label":"B","text":"fragile"},{"label":"C","text":"ordinary"},{"label":"D","text":"tiny"}],"answer":"A","explanation":"Formidable means difficult, powerful, or intimidating.","part":"Synonyms"},{"num":7,"prompt":"HAPHAZARD:","choices":[{"label":"A","text":"careful"},{"label":"B","text":"random"},{"label":"C","text":"steady"},{"label":"D","text":"useful"}],"answer":"B","explanation":"Haphazard means lacking a plan or order; random.","part":"Synonyms"},{"num":8,"prompt":"INEVITABLE:","choices":[{"label":"A","text":"optional"},{"label":"B","text":"temporary"},{"label":"C","text":"unavoidable"},{"label":"D","text":"uncertain"}],"answer":"C","explanation":"Inevitable means certain to happen or unavoidable.","part":"Synonyms"},{"num":9,"prompt":"JUSTIFY:","choices":[{"label":"A","text":"defend"},{"label":"B","text":"delay"},{"label":"C","text":"measure"},{"label":"D","text":"remove"}],"answer":"A","explanation":"To justify is to give reasons that defend or explain something.","part":"Synonyms"},{"num":10,"prompt":"METICULOUS:","choices":[{"label":"A","text":"careful"},{"label":"B","text":"cheerful"},{"label":"C","text":"hasty"},{"label":"D","text":"rough"}],"answer":"A","explanation":"Meticulous means extremely careful and precise.","part":"Synonyms"},{"num":11,"prompt":"OBSCURE:","choices":[{"label":"A","text":"famous"},{"label":"B","text":"polished"},{"label":"C","text":"unclear"},{"label":"D","text":"valuable"}],"answer":"C","explanation":"Obscure can mean unclear or not well known.","part":"Synonyms"},{"num":12,"prompt":"PRECARIOUS:","choices":[{"label":"A","text":"comfortable"},{"label":"B","text":"predictable"},{"label":"C","text":"stable"},{"label":"D","text":"unstable"}],"answer":"D","explanation":"Precarious means unstable or risky.","part":"Synonyms"},{"num":13,"prompt":"REFUTE:","choices":[{"label":"A","text":"announce"},{"label":"B","text":"disprove"},{"label":"C","text":"encourage"},{"label":"D","text":"repeat"}],"answer":"B","explanation":"To refute is to prove an idea or claim wrong.","part":"Synonyms"},{"num":14,"prompt":"SKEPTICAL:","choices":[{"label":"A","text":"doubtful"},{"label":"B","text":"eager"},{"label":"C","text":"generous"},{"label":"D","text":"silent"}],"answer":"A","explanation":"Skeptical means doubtful or "The judge remained -------, refusing to favor either side despite strong public pressure.","choices":[{"label":"A","text":"impartial"},{"label":"B","text":"impatient"},{"label":"C","text":"optimistic"},{"label":"D","text":"secretive"}],"answer":"A","explanation":"Refusing to favor either side shows impartiality.","part":"Sentence Completion"},{"num":22,"prompt":"The scientist warned that a correlation between two events does not necessarily ------- that one event caused the other.","choices":[{"label":"A","text":"prove"},{"label":"B","text":"conceal"},{"label":"C","text":"repeat"},{"label":"D","text":"weaken"}],"answer":"A","explanation":"Correlation alone does not prove causation.","part":"Sentence Completion"},{"num":23,"prompt":"The hikers' water supply was -------, so they carefully rationed what remained.","choices":[{"label":"A","text":"abundant"},{"label":"B","text":"limited"},{"label":"C","text":"reliable"},{"label":"D","text":"unnecessary"}],"answer":"B","explanation":"Rationing is necessary when a supply is limited.","part":"Sentence Completion"},{"num":24,"prompt":"Although the proposal initially seemed -------, a small-scale trial showed that it could work.","choices":[{"label":"A","text":"impractical"},{"label":"B","text":"obvious"},{"label":"C","text":"routine"},{"label":"D","text":"simple"}],"answer":"A","explanation":"The trial demonstrating success contrasts with an initially impractical appearance.","part":"Sentence Completion"},{"num":25,"prompt":"The author uses humor to ------- the seriousness of the topic without dismissing its importance.","choices":[{"label":"A","text":"balance"},{"label":"B","text":"conceal"},{"label":"C","text":"increase"},{"label":"D","text":"replace"}],"answer":"A","explanation":"Humor can balance a serious topic.","part":"Sentence Completion"},{"num":26,"prompt":"The board requested a ------- explanation of the budget so that every expense could be traced.","choices":[{"label":"A","text":"transparent"},{"label":"B","text":"casual"},{"label":"C","text":"brief"},{"label":"D","text":"speculative"}],"answer":"A","explanation":"A transparent explanation makes details open and understandable.","part":"Sentence Completion"},{"num":27,"prompt":"The archaeological site is -------; even small disturbances could damage evidence that has survived for centuries.","choices":[{"label":"A","text":"fragile"},{"label":"B","text":"ordinary"},{"label":"C","text":"predictable"},{"label":"D","text":"spacious"}],"answer":"A","explanation":"A site easily damaged by disturbance is fragile.","part":"Sentence Completion"},{"num":28,"prompt":"Because the two measurements were nearly identical, researchers considered the results ------- with one another.","choices":[{"label":"A","text":"consistent"},{"label":"B","text":"hostile"},{"label":"C","text":"irrelevant"},{"label":"D","text":"random"}],"answer":"A","explanation":"Nearly identical results are consistent.","part":"Sentence Completion"},{"num":29,"prompt":"The captain chose to ------- the route after receiving a warning about severe weather ahead.","choices":[{"label":"A","text":"alter"},{"label":"B","text":"defend"},{"label":"C","text":"memorize"},{"label":"D","text":"preserve"}],"answer":"A","explanation":"Changing a route in response to weather means altering it.","part":"Sentence Completion"},{"num":30,"prompt":"The student's claim was ------- by data from the survey rather than by personal opinion.","choices":[{"label":"A","text":"substantiated"},{"label":"B","text":"confused"},{"label":"C","text":"limited"},{"label":"D","text":"postponed"}],"answer":"A","explanation":"Data that supports a claim substantiates it.","part":"Sentence Completion"},{"num":31,"prompt":"The negotiators searched for a ------- that would address the most important concerns of both groups.","choices":[{"label":"A","text":"compromise"},{"label":"B","text":"prediction"},{"label":"C","text":"rumor"},{"label":"D","text":"shortcut"}],"answer":"A","explanation":"A compromise seeks a solution acceptable to both sides.","part":"Sentence Completion"},{"num":32,"prompt":"The machine's failure was not -------; technicians had noticed several warning signs earlier in the week.","choices":[{"label":"A","text":"unexpected"},{"label":"B","text":"gradual"},{"label":"C","text":"minor"},{"label":"D","text":"repairable"}],"answer":"A","explanation":"Warning signs mean the failure was not unexpected.","part":"Sentence Completion"},{"num":33,"prompt":"The researcher was careful not to ------- from a small sample to an entire population.","choices":[{"label":"A","text":"generalize"},{"label":"B","text":"observe"},{"label":"C","text":"record"},{"label":"D","text":"verify"}],"answer":"A","explanation":"Generalizing from too small a sample can produce unsupported conclusions.","part":"Sentence Completion"},{"num":34,"prompt":"The final paragraph does not merely repeat the argument; it ------- the evidence and explains why the issue matters.","choices":[{"label":"A","text":"synthesizes"},{"label":"B","text":"conceals"},{"label":"C","text":"interrupts"},{"label":"D","text":"weakens"}],"answer":"A","explanation":"To synthesize is to combine ideas into a meaningful whole.","part":"Sentence Completion"}]},"quantitative":{"minutes":35,"questions":[{"num":1,"prompt":"The pattern is 15, 21, 27, 33, ___. What number comes next?","choices":[{"label":"A","text":"33"},{"label":"B","text":"45"},{"label":"C","text":"39"},{"label":"D","text":"40"}],"answer":"C","explanation":"The pattern increases by 6 each time."},{"num":2,"prompt":"A sequence begins 2, 6, 18, ___. Each term is found using the same rule. What is the next term?","choices":[{"label":"A","text":"18"},{"label":"B","text":"57"},{"label":"C","text":"54"},{"label":"D","text":"108"}],"answer":"C","explanation":"Each term is multiplied by 3."},{"num":3,"prompt":"If 5 × □ = 55, what number belongs in the box?","choices":[{"label":"A","text":"9"},{"label":"B","text":"11"},{"label":"C","text":"50"},{"label":"D","text":"13"}],"answer":"B","explanation":"55 ÷ 5 = 11."},{"num":4,"prompt":"If 12 × 8 = 96, which equation is in the same fact family?","choices":[{"label":"A","text":"96 ÷ 12 = 8"},{"label":"B","text":"12 + 8 = 96"},{"label":"C","text":"96 ÷ 8 = 13"},{"label":"D","text":"96 - 12 = 8"}],"answer":"A","explanation":"Multiplication and division are inverse operations."},{"num":5,"prompt":"What is the median of the data set 10, 13, 16, 19, 28?","choices":[{"label":"A","text":"17"},{"label":"B","text":"16"},{"label":"C","text":"28"},{"label":"D","text":"10"}],"answer":"B","explanation":"With five ordered values, the median is the middle value."},{"num":6,"prompt":"A number machine follows the rule “multiply the input by 2, then add 3.” What is the output when the input is 11?","choices":[{"label":"A","text":"27"},{"label":"B","text":"22"},{"label":"C","text":"25"},{"label":"D","text":"14"}],"answer":"C","explanation":"Apply the rule in order: multiply by 2, then add 3."},{"num":7,"prompt":"If (★ + ★ + 6) × 2 = 36, what is the value of ★?","choices":[{"label":"A","text":"12"},{"label":"B","text":"18"},{"label":"C","text":"8"},{"label":"D","text":"6"}],"answer":"D","explanation":"Divide by 2 first, subtract 6, then split the remainder equally between the two stars."},{"num":8,"prompt":"Which fraction has the smallest value?","choices":[{"label":"A","text":"2/5"},{"label":"B","text":"1/3"},{"label":"C","text":"5/12"},{"label":"D","text":"3/8"}],"answer":"B","explanation":"Compare the fractions by converting them to equivalent decimals or common denominators."},{"num":9,"prompt":"In the number 4.735, what is the value of the digit 7?","choices":[{"label":"A","text":"7"},{"label":"B","text":"7/1000"},{"label":"C","text":"7/100"},{"label":"D","text":"7/10"}],"answer":"D","explanation":"The first digit to the right of the decimal is in the tenths place."},{"num":10,"prompt":"A supply room receives 22 boxes with 12 markers in each box. After 73 markers are used, how many remain?","choices":[{"label":"A","text":"73"},{"label":"B","text":"264"},{"label":"C","text":"337"},{"label":"D","text":"191"}],"answer":"D","explanation":"Multiply to find the total number of markers, then subtract the number used."},{"num":11,"prompt":"A point is halfway between 3.15 and 4.15 on a number line. What number does it represent?","choices":[{"label":"A","text":"4.15"},{"label":"B","text":"3.90"},{"label":"C","text":"3.40"},{"label":"D","text":"3.65"}],"answer":"D","explanation":"The midpoint is the average of the two endpoint values."},{"num":12,"prompt":"Which fraction is equivalent to 5/7?","choices":[{"label":"A","text":"15/21"},{"label":"B","text":"10/21"},{"label":"C","text":"6/8"},{"label":"D","text":"8/9"}],"answer":"A","explanation":"Multiplying numerator and denominator by the same nonzero number creates an equivalent fraction."},{"num":13,"prompt":"Adult tickets cost $17 and child tickets cost $10. Which expression gives the cost for 3 adults and 4 children?","choices":[{"label":"A","text":"(17 × 4) + (10 × 3)"},{"label":"B","text":"(17 + 10) × (3 + 4)"},{"label":"C","text":"(17 × 3) + (10 × 4)"},{"label":"D","text":"(17 × 3) - (10 × 4)"}],"answer":"C","explanation":"Multiply each ticket price by the number of tickets of that type, then add."},{"num":14,"prompt":"Of 96 counters, 39 are red and the rest are blue. What fraction of the counters are blue?","choices":[{"label":"A","text":"57/96"},{"label":"B","text":"96/57"},{"label":"C","text":"57/39"},{"label":"D","text":"39/96"}],"answer":"A","explanation":"Subtract red counters from the total to find the number of blue counters, then place that over the total."},{"num":15,"prompt":"Which improper fraction equals 6 2/3?","choices":[{"label":"A","text":"20/3"},{"label":"B","text":"8/3"},{"label":"C","text":"18/3"},{"label":"D","text":"20/4"}],"answer":"A","explanation":"Multiply the whole number by the denominator and add the numerator."},{"num":16,"prompt":"Different shapes represent digits. If ○ + □ + □ = 19 and □ = 6, what digit does ○ represent?","choices":[{"label":"A","text":"8"},{"label":"B","text":"6"},{"label":"C","text":"13"},{"label":"D","text":"7"}],"answer":"D","explanation":"Subtract the value of the two squares from the total."},{"num":17,"prompt":"Which statement must be true about a net that folds into a cube?","choices":[{"label":"A","text":"It has four triangular faces."},{"label":"B","text":"It has one circular face."},{"label":"C","text":"It has six square faces."},{"label":"D","text":"It has exactly five faces."}],"answer":"C","explanation":"A cube has six square faces, so any valid cube net contains six squares."},{"num":18,"prompt":"A rectangle has length 21 meters and perimeter 64 meters. What is its width?","choices":[{"label":"A","text":"21"},{"label":"B","text":"11"},{"label":"C","text":"32"},{"label":"D","text":"13"}],"answer":"B","explanation":"For a rectangle, half the perimeter equals length plus width."},{"num":19,"prompt":"A circle graph is divided into 8 equal sectors. Three sectors represent students who chose art. What fraction chose art?","choices":[{"label":"A","text":"3/5"},{"label":"B","text":"5/8"},{"label":"C","text":"1/3"},{"label":"D","text":"3/8"}],"answer":"D","explanation":"Three of the eight equal sectors represent art."},{"num":20,"prompt":"A team has 16 women and 8 men. 32 balls are shared equally among the women and 32 balls equally among the men. Which statement is true?","choices":[{"label":"A","text":"Each man receives twice as many as each woman."},{"label":"B","text":"Each woman receives twice as many as each man."},{"label":"C","text":"Each person receives the same number."},{"label":"D","text":"Each man receives one fewer than each woman."}],"answer":"A","explanation":"Each woman gets 2; each man gets 4."},{"num":21,"prompt":"A factory uses 174 buttons for 29 identical shirts. At the same rate, how many buttons are needed for 44 shirts?","choices":[{"label":"A","text":"308"},{"label":"B","text":"220"},{"label":"C","text":"264"},{"label":"D","text":"174"}],"answer":"C","explanation":"Find the constant number of buttons per shirt, then multiply by the new number of shirts."},{"num":22,"prompt":"A triangle has base 12 units and height 7 units. What is its area?","choices":[{"label":"A","text":"84"},{"label":"B","text":"19"},{"label":"C","text":"42"},{"label":"D","text":"21"}],"answer":"C","explanation":"Triangle area is one-half × base × height."},{"num":23,"prompt":"A rectangular sheet is 108 mm long and 64 mm wide. One cut makes a square with side 64 mm. How much length is removed?","choices":[{"label":"A","text":"44"},{"label":"B","text":"108"},{"label":"C","text":"64"},{"label":"D","text":"172"}],"answer":"A","explanation":"Subtract the square's side length from the original length."},{"num":24,"prompt":"A table shows 3 boxes contain 540 pins and 6 boxes contain 1080 pins. Which rule describes the relationship?","choices":[{"label":"A","text":"pins = boxes + 360"},{"label":"B","text":"pins = boxes × 90"},{"label":"C","text":"pins = boxes + 180"},{"label":"D","text":"pins = boxes × 180"}],"answer":"D","explanation":"The number of pins per box is constant."},{"num":25,"prompt":"A dot pattern has 1 dot in Figure 1, 4 in Figure 2, 9 in Figure 3, and 16 in Figure 4. How many dots are in Figure 6?","choices":[{"label":"A","text":"30"},{"label":"B","text":"25"},{"label":"C","text":"42"},{"label":"D","text":"36"}],"answer":"D","explanation":"The figures follow square numbers: 1², 2², 3², and so on."},{"num":26,"prompt":"A rectangular prism has six faces. Which collection could be all of its faces?","choices":[{"label":"A","text":"four triangles and two circles"},{"label":"B","text":"three matching pairs of rectangles"},{"label":"C","text":"six circles"},{"label":"D","text":"one square and four triangles"}],"answer":"B","explanation":"Opposite faces of a rectangular prism form three matching pairs of rectangles."},{"num":27,"prompt":"Which best describes the set {1 1/2, 2 3/4, 4 1/5, 6 2/3}?","choices":[{"label":"A","text":"whole numbers"},{"label":"B","text":"prime numbers"},{"label":"C","text":"proper fractions"},{"label":"D","text":"mixed numbers"}],"answer":"D","explanation":"Each number contains a whole-number part and a fractional part."},{"num":28,"prompt":"An airplane has 80 seats. 32 are aisle seats and the rest are window seats. What is the probability of being assigned a window seat?","choices":[{"label":"A","text":"8/15"},{"label":"B","text":"3/5"},{"label":"C","text":"1/2"},{"label":"D","text":"2/5"}],"answer":"B","explanation":"Find the number of window seats, then divide by the total number of seats."},{"num":29,"prompt":"A design is reflected across a vertical line of symmetry. A star is 3 cm to the left of the line. Where must its matching star be?","choices":[{"label":"A","text":"6 cm to the right of the line"},{"label":"B","text":"3 cm above the line"},{"label":"C","text":"3 cm to the right of the line"},{"label":"D","text":"on the line"}],"answer":"C","explanation":"Reflected points are the same perpendicular distance from the line of symmetry."},{"num":30,"prompt":"Segment AC is 24 cm long. Point B lies between A and C, and AB is 9 cm. What is BC?","choices":[{"label":"A","text":"9"},{"label":"B","text":"24"},{"label":"C","text":"15"},{"label":"D","text":"33"}],"answer":"C","explanation":"Subtract AB from the whole segment AC."},{"num":31,"prompt":"54 candles are divided equally among 6 bags, while 60 candles are divided equally among 10 cases. Which statement is true?","choices":[{"label":"A","text":"Each bag has more candles than each case."},{"label":"B","text":"Each case has more candles than each bag."},{"label":"C","text":"Each case has twice as many as each bag."},{"label":"D","text":"Each bag and case has the same number."}],"answer":"A","explanation":"Each bag gets 9 candles and each case gets 6."},{"num":32,"prompt":"Three numbers in this set are multiples of 9: 27, 45, 72, 82. Which number does NOT belong?","choices":[{"label":"A","text":"82"},{"label":"B","text":"45"},{"label":"C","text":"72"},{"label":"D","text":"27"}],"answer":"A","explanation":"The first three values divide evenly by 9; 82 does not."},{"num":33,"prompt":"A rectangle has side lengths 12 cm and 7 cm. A new rectangle keeps the 12-cm side but doubles the other side. By how many centimeters does that side increase?","choices":[{"label":"A","text":"19"},{"label":"B","text":"12"},{"label":"C","text":"7"},{"label":"D","text":"14"}],"answer":"C","explanation":"Doubling a length increases it by one original length."},{"num":34,"prompt":"A balanced scale represents 2○ + □ = 20. If ○ = 6, what is □?","choices":[{"label":"A","text":"14"},{"label":"B","text":"8"},{"label":"C","text":"10"},{"label":"D","text":"6"}],"answer":"B","explanation":"Subtract the value of two circles from the total."},{"num":35,"prompt":"A grid has 40 equal squares and 28 are shaded. What percentage is shaded?","choices":[{"label":"A","text":"30%"},{"label":"B","text":"80%"},{"label":"C","text":"70%"},{"label":"D","text":"60%"}],"answer":"C","explanation":"Divide the shaded squares by the total and convert to a percent."},{"num":36,"prompt":"The relationship is L = 4B. If B increases by 2, by how much does L increase?","choices":[{"label":"A","text":"2"},{"label":"B","text":"8"},{"label":"C","text":"4"},{"label":"D","text":"10"}],"answer":"B","explanation":"Because L is 4 times B, a 2-unit increase in B creates a 8-unit increase in L."},{"num":37,"prompt":"A box has 36 crayons that are not purple and some purple crayons. If the probability of choosing purple is 1/4, how many purple crayons are there?","choices":[{"label":"A","text":"12"},{"label":"B","text":"9"},{"label":"C","text":"14"},{"label":"D","text":"10"}],"answer":"A","explanation":"If purple is one-fourth of the total, the non-purple crayons make up three-fourths. The purple count is one-third of the non-purple count."},{"num":38,"prompt":"Each large cube has a volume of 1,000 cubic inches. What expression gives the volume of 28 such cubes?","choices":[{"label":"A","text":"28 + 1,000"},{"label":"B","text":"1,000 ÷ 28"},{"label":"C","text":"28 × 1,000"},{"label":"D","text":"28 × 100"}],"answer":"C","explanation":"Multiply the volume of one cube by the number of cubes."}]},"reading":{"minutes":25,"passages":[{"title":"Why Some Lakes Turn Over","text":"A deep lake can behave very differently in summer than it does in spring or autumn. During warm months, sunlight heats the upper water. Warm water is less dense than colder water, so it tends to remain near the surface. Meanwhile, deeper water stays cool. The lake becomes divided into layers that do not mix easily.\n\nThis separation affects oxygen and nutrients. Surface water gains oxygen from the air and from photosynthetic organisms. Deeper water may gradually lose oxygen as organisms use it and as dead material decomposes. Nutrients released near the bottom can remain trapped there while the layers stay separate.\n\nIn autumn, surface water cools. As the temperature difference between upper and lower water shrinks, wind can mix the lake more thoroughly. This seasonal mixing is called turnover. It can carry oxygen downward and bring nutrients upward. A similar process may occur in spring after ice melts and water temperatures become more uniform.\n\nNot every lake turns over in exactly the same way. Depth, climate, wind exposure, and even the shape of a lake basin can affect mixing. Very shallow lakes may mix frequently, while some unusual deep lakes can remain layered for long periods.\n\nLake turnover shows how a small physical property—water's changing density—can influence an entire ecosystem. Fish habitat, algae growth, and the movement of nutrients are all connected to whether lake water is separated into layers or circulating from top to bottom.","questions":[{"num":1,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Turnover occurs because fish stir the water."},{"label":"B","text":"Seasonal temperature changes can mix lake layers and redistribute oxygen and nutrients."},{"label":"C","text":"Deep lakes always have the same temperature at every depth."},{"label":"D","text":"Seasonal temperature changes can cause lake layers to mix, redistributing oxygen and nutrients."}],"answer":"D","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":2,"prompt":"Why does deeper lake water often lose oxygen during summer layering?","choices":[{"label":"A","text":"Cold water cannot contain oxygen."},{"label":"B","text":"Sunlight removes all oxygen from deep water."},{"label":"C","text":"Organisms use oxygen and decomposition consumes it while little mixing replaces it."},{"label":"D","text":"Organisms use oxygen while little mixing replaces it."}],"answer":"C","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, the word “uniform” most nearly means","choices":[{"label":"A","text":"measured inaccurately"},{"label":"B","text":"moving rapidly"},{"label":"C","text":"similar throughout"},{"label":"D","text":"a sudden warning"}],"answer":"C","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":4,"prompt":"Why might a shallow lake mix more often than a very deep one?","choices":[{"label":"A","text":"Its water is easier for wind and temperature changes to mix from top to bottom."},{"label":"B","text":"Shallow lakes never experience wind."},{"label":"C","text":"The passage suggests that no further evidence is useful."},{"label":"D","text":"Deep lakes are always warmer than shallow lakes."}],"answer":"A","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":5,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"uncertain and hesitant"},{"label":"B","text":"angry and persuasive"},{"label":"C","text":"humorous and casual"},{"label":"D","text":"scientific and explanatory"}],"answer":"D","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"The Problem With Perfect Predictions","text":"Weather forecasts have improved dramatically because meteorologists can combine satellite observations, radar, ground measurements, and powerful computer models. Yet a forecast can still change from one day to the next. This does not necessarily mean that the earlier forecast was careless.\n\nThe atmosphere is a complex system. A small difference in temperature, humidity, or wind at one location can influence how conditions develop later. No observing network measures every point in the atmosphere perfectly, so computer models begin with estimates. Different models may also represent clouds, oceans, and land surfaces in slightly different ways.\n\nTo deal with uncertainty, meteorologists often run a model many times with slightly altered starting conditions. This collection is called an ensemble. If nearly all runs produce heavy rain in the same region, forecasters gain confidence. If the runs disagree widely, the forecast is less certain.\n\nThis is why a 40 percent chance of rain is not a failed prediction if a particular backyard stays dry. The percentage expresses uncertainty over an area and time period; it does not promise that rain will occur at every location.\n\nForecasting therefore involves more than selecting a single future from a computer screen. Meteorologists compare evidence, study patterns, and communicate how confident they are. A useful forecast is not always one that sounds perfectly certain. Sometimes the most accurate message is that several outcomes remain possible.","questions":[{"num":6,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Weather forecasting uses models and evidence to estimate uncertain outcomes rather than guarantee one exact future."},{"label":"B","text":"Weather forecasts estimate uncertain outcomes using models and evidence."},{"label":"C","text":"A forecast is wrong whenever one backyard stays dry."},{"label":"D","text":"Computer models can now predict weather with complete certainty."}],"answer":"A","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":7,"prompt":"What does it suggest when most ensemble model runs agree?","choices":[{"label":"A","text":"Forecasters can have greater confidence in that predicted outcome."},{"label":"B","text":"Different model runs disagree completely."},{"label":"C","text":"All weather stations stop reporting."},{"label":"D","text":"Most model runs agree on a similar outcome."}],"answer":"A","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":8,"prompt":"In the passage, the word “ensemble” most nearly means","choices":[{"label":"A","text":"a sudden warning"},{"label":"B","text":"an error"},{"label":"C","text":"a collection or group"},{"label":"D","text":"a single measurement"}],"answer":"C","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":9,"prompt":"Why can a forecast change when new observations arrive?","choices":[{"label":"A","text":"Updated starting conditions can lead models toward different future outcomes."},{"label":"B","text":"New observations can alter starting conditions and therefore model outcomes."},{"label":"C","text":"Forecasts should never be updated."},{"label":"D","text":"New observations make models less accurate by definition."}],"answer":"A","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":10,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"mocking and humorous"},{"label":"B","text":"alarmed and dramatic"},{"label":"C","text":"analytical and clarifying"},{"label":"D","text":"uncertain and hesitant"}],"answer":"C","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"The Extra Chair","text":"At the beginning of every student-council meeting, Amira placed one extra chair at the end of the table. No one sat there. By October, several students had started joking that the chair was reserved for a ghost.\n\nWhen the council planned the winter festival, the conversation became unusually fast. Members debated music, food booths, decorations, and ticket prices. Each idea seemed to produce three more. Amira listened while keeping notes.\n\nFinally, she pointed to the empty chair. “We haven't heard from whoever is supposed to sit there,” she said.\n\nThe room went quiet.\n\nAmira explained that the chair represented students who were affected by council decisions but were not in the room. The group had planned a noisy evening festival without asking students who used mobility devices whether the gym entrances were convenient. They had discussed ticket prices without considering students who might not be able to afford them. They had chosen a date without checking the schedule of the school play.\n\nThe council did not cancel its plans. Instead, members divided up questions and spoke with classmates, teachers, and club leaders before the next meeting. Some festival details changed; others stayed the same because the group learned they worked well.\n\nAt the December meeting, no one joked about the extra chair. One member even moved a backpack off it before sitting down.\n\nAmira smiled but said nothing. The chair had never been meant to provide answers. Its job was to remind the group to notice whose questions had not yet been asked.","questions":[{"num":11,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"The winter festival should have been canceled."},{"label":"B","text":"An empty chair reminds a council to consider people not present in the room."},{"label":"C","text":"Student councils should always add extra furniture."},{"label":"D","text":"An empty chair reminds the student council to consider people affected by decisions even when those people are not present."}],"answer":"D","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":12,"prompt":"What does the council do after Amira explains the chair?","choices":[{"label":"A","text":"They remove the chair from the room."},{"label":"B","text":"They ignore the concern and vote immediately."},{"label":"C","text":"Members gather information from other students, teachers, and groups before finalizing plans."},{"label":"D","text":"They gather information from other students, teachers, and groups."}],"answer":"C","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":13,"prompt":"In the passage, the word “represented” most nearly means","choices":[{"label":"A","text":"argued against"},{"label":"B","text":"stood for or symbolized"},{"label":"C","text":"a sudden warning"},{"label":"D","text":"measured"}],"answer":"B","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":14,"prompt":"Why does a member move a backpack off the empty chair at the December meeting?","choices":[{"label":"A","text":"The backpack is too heavy for the table."},{"label":"B","text":"The council now respects the meaning of the chair and the reminder it provides."},{"label":"C","text":"The group now respects the chair's meaning as a reminder."},{"label":"D","text":"The student wants to sit in the chair later."}],"answer":"B","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":15,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"comic and absurd"},{"label":"B","text":"angry and accusatory"},{"label":"C","text":"uncertain and hesitant"},{"label":"D","text":"thoughtful and quietly hopeful"}],"answer":"D","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"A Second Life for Old Buildings","text":"When a factory, school, or warehouse is no longer used for its original purpose, a city faces a choice. The building can be demolished, left vacant, or adapted for something new. Converting an older structure for a new use is often called adaptive reuse.\n\nA former warehouse might become apartments. A train station might become a market. An old school can be converted into offices or community space. Reuse can preserve architectural details and local history while avoiding some of the waste created by demolition and new construction.\n\nThe process is not always simple. Older buildings may have outdated wiring, inefficient windows, or materials that require careful removal. Floor plans designed for machinery may not easily become comfortable homes. Accessibility and modern fire codes can require major changes.\n\nEven so, architects sometimes find that old features become advantages. High factory ceilings can create bright interior spaces. Thick masonry walls can provide thermal mass, helping moderate temperature changes. Large loading doors can become dramatic windows or entrances.\n\nAdaptive reuse is therefore not merely a matter of saving everything old. Designers must decide which parts are valuable, which can be altered, and whether the final building will actually serve its new purpose. When the balance works, a structure can keep traces of its past while becoming useful in a completely different way.","questions":[{"num":16,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Every old building should be preserved without change."},{"label":"B","text":"Demolition is always cheaper than renovation."},{"label":"C","text":"Adaptive reuse can preserve valuable features of old buildings while converting them to meet new needs, though it requires careful design."},{"label":"D","text":"Adaptive reuse can preserve valuable old features while meeting new needs."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":17,"prompt":"What is one challenge of adaptive reuse mentioned in the passage?","choices":[{"label":"A","text":"Modern codes do not apply to reused buildings."},{"label":"B","text":"Older buildings may need major updates for wiring, accessibility, safety, or layout."},{"label":"C","text":"Older buildings may need major updates for systems, access, safety, or layout."},{"label":"D","text":"Old buildings never need safety updates."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":18,"prompt":"In the passage, the word “moderate” most nearly means","choices":[{"label":"A","text":"reduce or make less extreme"},{"label":"B","text":"a sudden warning"},{"label":"C","text":"measure exactly"},{"label":"D","text":"remove completely"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":19,"prompt":"Why might a designer preserve a factory's high ceilings?","choices":[{"label":"A","text":"They can become an attractive and useful feature in the building's new use."},{"label":"B","text":"High ceilings can become a useful and attractive feature in a new design."},{"label":"C","text":"Factories cannot be converted to other uses."},{"label":"D","text":"High ceilings must always be lowered."}],"answer":"A","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":20,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"hostile toward new construction"},{"label":"B","text":"nostalgic and unrealistic"},{"label":"C","text":"uncertain and hesitant"},{"label":"D","text":"balanced and practical"}],"answer":"D","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"Reading Tree Rings Carefully","text":"The rings visible in a cut tree trunk can provide a record of growth, but interpreting that record requires care. In many temperate regions, a tree produces a new growth ring each year. A wide ring often indicates favorable growing conditions, while a narrow ring may reflect drought, competition, cold weather, or other stress.\n\nIt would be tempting to examine one tree and declare that every narrow ring marks a drought. Scientists avoid that shortcut. A tree growing in shade may form narrow rings even during a rainy year. Disease or damage can also slow growth. Researchers therefore compare ring patterns from many trees in the same region.\n\nThe patterns can be matched across living trees, old wooden buildings, and preserved logs. If a distinctive sequence of wide and narrow rings overlaps between samples, scientists can sometimes extend a regional timeline centuries into the past. This process is called crossdating.\n\nTree rings can also contain chemical information. Ratios of certain isotopes may provide clues about past moisture or temperature. Charcoal scars can indicate earlier fires. Together, these forms of evidence allow researchers to reconstruct parts of environmental history that were never written down.\n\nTree rings are powerful evidence precisely because scientists do not treat them as simple answers. A ring records how one tree grew in one year. Strong conclusions emerge only when that record is compared with other trees, other measurements, and knowledge of how trees respond to their surroundings.","questions":[{"num":21,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Tree rings can reveal environmental history, but strong conclusions require comparison and multiple evidence sources."},{"label":"B","text":"Tree rings can reveal environmental history, but reliable conclusions require comparison and multiple forms of evidence."},{"label":"C","text":"Every narrow tree ring proves that a drought occurred."},{"label":"D","text":"Tree-ring research is useful only for dating buildings."}],"answer":"B","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":22,"prompt":"Why do scientists compare ring patterns from many trees?","choices":[{"label":"A","text":"A single tree may be affected by shade, disease, or damage unrelated to regional climate."},{"label":"B","text":"A single tree's growth can be affected by local factors besides regional climate."},{"label":"C","text":"All trees grow at exactly the same rate."},{"label":"D","text":"Scientists need fewer samples to avoid confusion."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":23,"prompt":"In the passage, the word “reconstruct” most nearly means","choices":[{"label":"A","text":"predict without data"},{"label":"B","text":"build an understanding from evidence"},{"label":"C","text":"destroy an old record"},{"label":"D","text":"build an understanding of something from available evidence"}],"answer":"D","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":24,"prompt":"Why is crossdating useful?","choices":[{"label":"A","text":"Matching overlapping ring patterns can extend timelines farther into the past."},{"label":"B","text":"Matching overlapping ring patterns can extend a timeline farther into the past."},{"label":"C","text":"Crossdating makes every ring wider."},{"label":"D","text":"Crossdating works only with living trees."}],"answer":"B","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":25,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"excited and exaggerated"},{"label":"B","text":"uncertain and hesitant"},{"label":"C","text":"careful and evidence-focused"},{"label":"D","text":"dismissive and skeptical"}],"answer":"C","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]}]},"math":{"minutes":30,"questions":[{"num":1,"prompt":"What is the value of the digit 2 in 628,175?","choices":[{"label":"A","text":"2,000"},{"label":"B","text":"200,000"},{"label":"C","text":"20,000"},{"label":"D","text":"2"}],"answer":"C","explanation":"The digit 2 is in the ten-thousands place."},{"num":2,"prompt":"A hexagon has side lengths 11, 13, 15, 12, 10, 14 meters. What is its perimeter?","choices":[{"label":"A","text":"69"},{"label":"B","text":"75"},{"label":"C","text":"90"},{"label":"D","text":"81"}],"answer":"B","explanation":"Add all six side lengths."},{"num":3,"prompt":"A pictograph uses one house symbol to represent 8 houses. Brook Lane has 6 symbols and Pine Road has 4 symbols. How many more houses are on Brook Lane?","choices":[{"label":"A","text":"10"},{"label":"B","text":"48"},{"label":"C","text":"16"},{"label":"D","text":"2"}],"answer":"C","explanation":"The difference is 2 symbols, and each symbol represents 8 houses."},{"num":4,"prompt":"If ■ = 3 × (△ + 4), what is ■ when △ = 7?","choices":[{"label":"A","text":"21"},{"label":"B","text":"36"},{"label":"C","text":"33"},{"label":"D","text":"14"}],"answer":"C","explanation":"Substitute the value of △, add 4, then multiply by 3."},{"num":5,"prompt":"What is 6,000 − 731?","choices":[{"label":"A","text":"5,369"},{"label":"B","text":"5,169"},{"label":"C","text":"5,269"},{"label":"D","text":"6,731"}],"answer":"C","explanation":"Subtract carefully by place value."},{"num":6,"prompt":"In August, Maya read 11 books and Jacob read 6 books. How many more books did Maya read?","choices":[{"label":"A","text":"7"},{"label":"B","text":"5"},{"label":"C","text":"11"},{"label":"D","text":"13"}],"answer":"B","explanation":"Subtract Jacob's total from Maya's total."},{"num":7,"prompt":"A number machine squares every input. What is the output for an input of 13?","choices":[{"label":"A","text":"156"},{"label":"B","text":"169"},{"label":"C","text":"182"},{"label":"D","text":"26"}],"answer":"B","explanation":"Squaring means multiplying the number by itself."},{"num":8,"prompt":"A pitcher holds 2 quarts and a jug holds 3 quarts. Which combination holds exactly 30 quarts?","choices":[{"label":"A","text":"6 pitchers and 6 jugs"},{"label":"B","text":"8 pitchers and 7 jugs"},{"label":"C","text":"7 pitchers and 7 jugs"},{"label":"D","text":"6 pitchers and 8 jugs"}],"answer":"A","explanation":"6×2 + 6×3 = 30."},{"num":9,"prompt":"Which number is divisible by 8 with no remainder?","choices":[{"label":"A","text":"69"},{"label":"B","text":"64"},{"label":"C","text":"66"},{"label":"D","text":"63"}],"answer":"B","explanation":"64 ÷ 8 is a whole number."},{"num":10,"prompt":"In a town of 8,000 graduates, about 3/8 have earned an advanced degree. About how many graduates is that?","choices":[{"label":"A","text":"3,000"},{"label":"B","text":"1,000"},{"label":"C","text":"6,000"},{"label":"D","text":"5,000"}],"answer":"A","explanation":"Find one-eighth of the total, then multiply by 3."},{"num":11,"prompt":"$10,650 is divided evenly among 3 accounts. How much goes into each account?","choices":[{"label":"A","text":"$5,325"},{"label":"B","text":"$10,647"},{"label":"C","text":"$3,550"},{"label":"D","text":"$3,650"}],"answer":"C","explanation":"Divide the total amount by the number of accounts."},{"num":12,"prompt":"Point P is 5 units to the right of the origin and 13 units above the origin. What are its coordinates?","choices":[{"label":"A","text":"(-5, 13)"},{"label":"B","text":"(13, 5)"},{"label":"C","text":"(5, 13)"},{"label":"D","text":"(5, -13)"}],"answer":"C","explanation":"The x-coordinate gives horizontal position and the y-coordinate gives vertical position."},{"num":13,"prompt":"Point A is at 6 on a vertical number line. Point B is 9 units below A. Where is B?","choices":[{"label":"A","text":"4"},{"label":"B","text":"15"},{"label":"C","text":"-6"},{"label":"D","text":"-3"}],"answer":"D","explanation":"Moving down means subtracting."},{"num":14,"prompt":"Express 31/4 as a mixed number.","choices":[{"label":"A","text":"6 3/4"},{"label":"B","text":"7 3/4"},{"label":"C","text":"7 1/4"},{"label":"D","text":"8 3/4"}],"answer":"B","explanation":"Divide the numerator by the denominator; the quotient is the whole number and the remainder becomes the numerator."},{"num":15,"prompt":"Which fraction is equivalent to 0.375?","choices":[{"label":"A","text":"37/100"},{"label":"B","text":"3/8"},{"label":"C","text":"5/8"},{"label":"D","text":"3/4"}],"answer":"B","explanation":"Convert the decimal to a fraction and simplify."},{"num":16,"prompt":"What is 3.80 + 1.95?","choices":[{"label":"A","text":"5.75"},{"label":"B","text":"5.65"},{"label":"C","text":"5.85"},{"label":"D","text":"1.85"}],"answer":"A","explanation":"Line up the decimal points and add by place value."},{"num":17,"prompt":"What is the mode of the data set 76, 88, 95, 88, 92, 88, 99?","choices":[{"label":"A","text":"92"},{"label":"B","text":"99"},{"label":"C","text":"76"},{"label":"D","text":"88"}],"answer":"D","explanation":"The mode is the value that appears most often."},{"num":18,"prompt":"A right triangle has one acute angle measuring 59°. What is the measure of the other acute angle?","choices":[{"label":"A","text":"121°"},{"label":"B","text":"31°"},{"label":"C","text":"149°"},{"label":"D","text":"59°"}],"answer":"B","explanation":"The two acute angles in a right triangle add to 90°."},{"num":19,"prompt":"A collector has 8 packs of baseball cards with 18 cards each and 7 packs of basketball cards with 16 cards each. Which expression finds the total number of cards?","choices":[{"label":"A","text":"(8 × 18) + (7 × 16)"},{"label":"B","text":"(8×7)+(18×16)"},{"label":"C","text":"(8×18)-(7×16)"},{"label":"D","text":"(8+7)×(18+16)"}],"answer":"A","explanation":"Find the total for each kind of card, then add the two totals."},{"num":20,"prompt":"What is the value of (22 × 4) − 7?","choices":[{"label":"A","text":"81"},{"label":"B","text":"6"},{"label":"C","text":"-66"},{"label":"D","text":"88"}],"answer":"A","explanation":"Multiply first, then subtract 7."},{"num":21,"prompt":"A square has area 100 square centimeters. What is its perimeter?","choices":[{"label":"A","text":"100 centimeters"},{"label":"B","text":"40 centimeters"},{"label":"C","text":"20 centimeters"},{"label":"D","text":"10 centimeters"}],"answer":"B","explanation":"The side length is 10 cm because 10×10=100; perimeter is 4×10."},{"num":22,"prompt":"In the decimal 0.68427, the digit 4 represents","choices":[{"label":"A","text":"4/100"},{"label":"B","text":"4/1,000"},{"label":"C","text":"4/10,000"},{"label":"D","text":"4/100,000"}],"answer":"B","explanation":"The 4 is the third digit to the right of the decimal, so it is in the thousandths place."},{"num":23,"prompt":"A triangle has base 16 cm and height 10 cm. What is its area?","choices":[{"label":"A","text":"52 cm²"},{"label":"B","text":"160 cm²"},{"label":"C","text":"26 cm²"},{"label":"D","text":"80 cm²"}],"answer":"D","explanation":"Use one-half × base × height."},{"num":24,"prompt":"A tank contains 140 liters at 0 minutes and loses 9 liters every 5 minutes. How much remains after 30 minutes?","choices":[{"label":"A","text":"95"},{"label":"B","text":"86"},{"label":"C","text":"104"},{"label":"D","text":"77"}],"answer":"B","explanation":"Thirty minutes contains six 5-minute intervals, so subtract the loss six times."},{"num":25,"prompt":"A driver passes 64 intersections and stops at about 1 out of every 4. About how many stops is that?","choices":[{"label":"A","text":"4"},{"label":"B","text":"32"},{"label":"C","text":"16"},{"label":"D","text":"48"}],"answer":"C","explanation":"One out of every four means one-fourth of the total."},{"num":26,"prompt":"Cards numbered 1 through 20 are equally likely to be selected. What is the probability of selecting a prime number?","choices":[{"label":"A","text":"8 out of 20"},{"label":"B","text":"6 out of 20"},{"label":"C","text":"10 out of 20"},{"label":"D","text":"12 out of 20"}],"answer":"A","explanation":"There are eight prime numbers from 1 through 20."},{"num":27,"prompt":"When it is 9:00 a.m. in City A, it is 1:00 p.m. in City B. When it is 7:00 p.m. in City B, what time is it in City A?","choices":[{"label":"A","text":"3:00 p.m."},{"label":"B","text":"11:00 a.m."},{"label":"C","text":"11:00 p.m."},{"label":"D","text":"5:00 p.m."}],"answer":"A","explanation":"City B is four hours ahead of City A, so subtract four hours."},{"num":28,"prompt":"Which quadrilateral must have all four sides equal?","choices":[{"label":"A","text":"rhombus"},{"label":"B","text":"rectangle"},{"label":"C","text":"parallelogram"},{"label":"D","text":"trapezoid"}],"answer":"A","explanation":"A rhombus is defined by having four equal side lengths."},{"num":29,"prompt":"How many whole numbers strictly between 62 and 106 are divisible by 7?","choices":[{"label":"A","text":"9"},{"label":"B","text":"6"},{"label":"C","text":"7"},{"label":"D","text":"8"}],"answer":"C","explanation":"List or count the multiples of 7 greater than 62 and less than 106."},{"num":30,"prompt":"A scientist records each plant's height, mass, number of leaves, and flower color. Which question is NOT statistical for this data set?","choices":[{"label":"A","text":"What was the typical plant height?"},{"label":"B","text":"What fraction of the plants had red flowers?"},{"label":"C","text":"How did mass vary among the plants?"},{"label":"D","text":"What color was Plant 7's flower?"}],"answer":"D","explanation":"A statistical question expects variability across multiple observations; asking for one specific plant's color does not."}]},"essay":{"prompt":"People sometimes learn more from a difficult attempt than from an easy success. Describe an experience or example that shows whether you agree or disagree with this idea.","guidance":"Develop a clear point of view. Use specific details or examples and explain how they support your response.","minutes":30}}};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function normalizeHighlightRanges(ranges,textLength){
 const cleaned=(Array.isArray(ranges)?ranges:[]).map(range=>({
  start:Math.max(0,Math.min(textLength,Number(range.start)||0)),
  end:Math.max(0,Math.min(textLength,Number(range.end)||0))
 })).filter(range=>range.end>range.start).sort((a,b)=>a.start-b.start||a.end-b.end);
 const merged=[];
 for(const range of cleaned){
  const last=merged[merged.length-1];
  if(last&&range.start<=last.end)last.end=Math.max(last.end,range.end);
  else merged.push({...range});
 }
 return merged.slice(0,60);
}
function lowerPassageKey(item){return `reading-${item.passageIndex}`}
function renderLowerHighlightedPassage(text,key){
 const ranges=normalizeHighlightRanges(state.highlights?.[key],text.length);
 let html='',cursor=0;
 for(const range of ranges){
  html+=esc(text.slice(cursor,range.start));
  html+=`<mark class="reading-highlight" data-highlight-start="${range.start}" data-highlight-end="${range.end}" title="Click to remove highlight">${esc(text.slice(range.start,range.end))}</mark>`;
  cursor=range.end;
 }
 html+=esc(text.slice(cursor));
 return html;
}
function passageSelectionOffsets(container){
 const selection=window.getSelection();
 if(!selection||selection.rangeCount===0||selection.isCollapsed)return null;
 const range=selection.getRangeAt(0);
 if(!container.contains(range.startContainer)||!container.contains(range.endContainer))return null;
 const before=range.cloneRange();
 before.selectNodeContents(container);
 before.setEnd(range.startContainer,range.startOffset);
 let start=before.toString().length;
 let end=start+range.toString().length;
 const text=container.textContent||'';
 while(start<end&&/\s/.test(text[start]||''))start++;
 while(end>start&&/\s/.test(text[end-1]||''))end--;
 if(end<=start)return null;
 return {start,end};
}
function bindLowerReadingHighlighter(item){
 const container=document.getElementById('readingPassageText');
 if(!container)return;
 const key=lowerPassageKey(item);
 const add=document.getElementById('addReadingHighlight');
 if(add){
  add.onmousedown=event=>event.preventDefault();
  add.onclick=()=>{
   const offsets=passageSelectionOffsets(container);
   if(!offsets){alert('Select words in the reading passage first.');return}
   state.highlights=state.highlights||{};
   const current=normalizeHighlightRanges(state.highlights[key],item.passageText.length);
   const matchingIndex=current.findIndex(range=>
    (offsets.start===range.start&&offsets.end===range.end)||
    (offsets.start>=range.start&&offsets.end<=range.end)
   );
   if(matchingIndex>=0){
    state.highlights[key]=current.filter((_,index)=>index!==matchingIndex);
   }else{
    state.highlights[key]=normalizeHighlightRanges([...current,offsets],item.passageText.length);
   }
   window.getSelection()?.removeAllRanges();
   save();renderQuestion();
  };
 }
 const clear=document.getElementById('clearReadingHighlights');
 if(clear)clear.onclick=()=>{
  const totalHighlights=Object.values(state.highlights||{}).reduce((count,ranges)=>count+(Array.isArray(ranges)?ranges.length:0),0);
  if(!totalHighlights)return;
  if(confirm('Remove all reading highlights from this test?')){
   state.highlights={};
   save();renderQuestion();
  }
 };
 document.querySelectorAll('[data-highlight-start]').forEach(mark=>mark.onclick=()=>{
  const start=Number(mark.dataset.highlightStart),end=Number(mark.dataset.highlightEnd);
  state.highlights[key]=normalizeHighlightRanges(state.highlights?.[key],item.passageText.length).filter(range=>range.start!==start||range.end!==end);
  save();renderQuestion();
 });
}

function playAlert(sec){if(state.alerted[sec])return;state.alerted[sec]=true;try{const A=window.AudioContext||window.webkitAudioContext;if(A){const ctx=new A();[0,.28].forEach((st,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=i?1046:880;g.gain.setValueAtTime(.001,ctx.currentTime+st);g.gain.exponentialRampToValueAtTime(.2,ctx.currentTime+st+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+st+.22);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+st);o.stop(ctx.currentTime+st+.24)});setTimeout(()=>ctx.close(),900)}}catch(e){}const n=document.createElement('div');n.className='minute-alert';n.innerHTML=`🔔 <b>1 minute remaining</b> in ${LABELS[sec]}`;document.body.appendChild(n);setTimeout(()=>n.remove(),5000);save()}
function startTimer(){stopTimer();const sec=currentSec();if(!state.timed||!['question','essay'].includes(state.screen))return;if(state.timeLeft[sec]===60)playAlert(sec);timerId=setInterval(()=>{state.timeLeft[sec]--;const el=document.querySelector('.timer');if(el){el.textContent=fmt(state.timeLeft[sec]);el.classList.toggle('warn',state.timeLeft[sec]<=60)}if(state.timeLeft[sec]===60)playAlert(sec);if(state.timeLeft[sec]<=0){stopTimer();state.submitted[sec]=true;save();alert(`Time is up for ${LABELS[sec]}.`);finishSection(true)}save()},1000)}
function selectTest(id){if(!LOWER_TESTS[id]||id===selectedTestId)return;stopTimer();save();selectedTestId=id;TEST=LOWER_TESTS[id];RSPStorage.setItem(TEST_SELECTION_KEY,id);state=load()||freshState(state.student||'');state.screen='home';home()}

const LOWER_ASSESSMENT_KEY='readysetprep:assessments:lower:v1';

function loadAssessmentHistory(){

 catch(e){return[]}
}
function saveAssessmentHistory(items){

function assessmentBand(percent){
 if(percent>=90)return {label:'Excellent practice performance',className:'excellent'};
 if(percent>=80)return {label:'Strong practice performance',className:'strong'};
 if(percent>=70)return {label:'On-track practice performance',className:'on-track'};
 if(percent>=60)return {label:'Developing practice performance',className:'developing'};
 return {label:'Foundational review recommended',className:'foundation'};
}
function lowerConcept(sec,item){
 const text=`${item.prompt||''} ${item.explanation||''}`.toLowerCase();
 if(sec==='verbal')return item.part==='Synonyms'?'Synonyms':'Sentence Completion';
 if(sec==='reading'){
  if(/main idea|mostly about|best title|summar/.test(text))return 'Main Idea';
  if(/word .* mean|phrase .* mean|meaning|context/.test(text))return 'Vocabulary in Context';
  if(/organized|paragraph|structure|purpose|function/.test(text))return 'Organization & Logic';
  if(/tone|attitude|figurative|comparison|metaphor|simile/.test(text))return 'Tone, Style & Figurative Language';
  if(/infer|most likely|suggest|imply|why/.test(text))return 'Inference';
  return 'Supporting Ideas';
 }
 if(/probability|chance|median|mean|mode|graph|table|data|survey/.test(text))return 'Data & Probability';
 if(/area|perimeter|volume|angle|triangle|rectangle|square|circle|solid|coordinate|shape/.test(text))return 'Geometry';
 if(/meter|liter|gram|inch|foot|yard|time|minute|hour|convert|measurement/.test(text))return 'Measurement';
 if(/fraction|decimal|percent|ratio|mixed number/.test(text))return 'Fractions, Decimals & Percents';
 if(/factor|multiple|divisible|prime|composite|remainder/.test(text))return 'Number Properties';
 if(/equation|expression|variable|unknown|value of [a-z]|rule|input|output/.test(text))return 'Algebraic Concepts';
 if(/pattern|sequence|comes next|prediction/.test(text))return 'Patterns & Relationships';
 if(/estimate|approximately|reasonable/.test(text))return 'Estimation';
 return sec==='quantitative'?'Problem Solving & Number Relationships':'Whole-Number Operations';
}
function conceptStatus(percent){
 if(percent>=85)return 'Strong';
 if(percent>=70)return 'Developing well';
 if(percent>=55)return 'Needs review';
 return 'Priority practice';
}
function formatAssessmentDate(value){
 try{return new Date(value).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
 catch(e){return value||''}
}
function buildLowerAssessment(){
 const completed=state.sectionPractice?[state.sectionPractice]:SECTIONS;
 const scored=completed.filter(sec=>sec!=='essay');
 const sectionResults=scored.map(sec=>{
  const questions=sectionQuestions(sec),total=questions.length,correct=score(sec),answeredCount=answered(sec);
  const flaggedQuestions=questions.filter(item=>state.flags?.[sec]?.[item.num]).map(item=>item.num);
  const percent=total?Math.round(correct/total*100):0;
  const allotted=TEST[sec].minutes*60;
  const timeUsed=state.timed?Math.max(0,allotted-(state.timeLeft[sec]??allotted)):null;
  return {sec,label:LABELS[sec],correct,total,answered:answeredCount,unanswered:total-answeredCount,flagged:flaggedQuestions.length,flaggedQuestions,percent,stanine:estStanine(percent),timeUsed};
 });
 const conceptMap={};
 for(const sec of scored){
  for(const item of sectionQuestions(sec)){
   const name=lowerConcept(sec,item),key=`${sec}:${name}`;
   if(!conceptMap[key])conceptMap[key]={name,section:LABELS[sec],correct:0,total:0};
   conceptMap[key].total++;
   if(state.answers[sec]?.[item.num]===item.answer)conceptMap[key].correct++;
  }
 }
 const concepts=Object.values(conceptMap).map(x=>({...x,percent:x.total?Math.round(x.correct/x.total*100):0,status:conceptStatus(x.total?Math.round(x.correct/x.total*100):0)})).sort((a,b)=>b.percent-a.percent||b.total-a.total);
 const total=sectionResults.reduce((n,x)=>n+x.correct,0),max=sectionResults.reduce((n,x)=>n+x.total,0);
 const overallPercent=max?Math.round(total/max*100):0;
 const strengths=concepts.filter(x=>x.percent>=70).slice(0,3);
 const focus=concepts.slice().sort((a,b)=>a.percent-b.percent||b.total-a.total).filter(x=>x.percent<85).slice(0,3);
 const fallbackStrengths=strengths.length?strengths:concepts.slice(0,Math.min(2,concepts.length));
 const fallbackFocus=focus.length?focus:concepts.slice(-1);
 const unanswered=sectionResults.reduce((n,x)=>n+x.unanswered,0);
 const flagged=sectionResults.reduce((n,x)=>n+x.flagged,0);
 const nextSteps=fallbackFocus.map(x=>`Practice ${x.name} and review missed questions from ${x.section}.`);
 if(unanswered)nextSteps.push(`Strengthen pacing and completion: ${unanswered} scored question${unanswered===1?' was':'s were'} unanswered.`);
 if(!nextSteps.length)nextSteps.push('Continue mixed practice to maintain performance across all scored sections.');
 const essayIncluded=completed.includes('essay');
 const words=(state.essayText.trim().match(/\S+/g)||[]).length;
 const paragraphs=state.essayText.trim()?state.essayText.trim().split(/\n\s*\n/).filter(Boolean).length:0;
 const writing=essayIncluded?{
  submitted:!!state.essayText.trim(),words,paragraphs,
  note:!state.essayText.trim()?'No essay response was saved.':words<150?'The response is brief; add specific examples and fuller paragraph development.':paragraphs<3?'The response has useful length; strengthen paragraph organization.':'The response includes a useful amount of writing and multiple paragraphs. Review clarity, evidence, and transitions.'
 }:null;
 const completedAt=state.completedAt||new Date().toISOString();
 return {
  id:state.assessmentId||state.attemptId||`lower-${Date.now()}`,
  level:'Lower Level',testId:selectedTestId,testTitle:TEST.title,
  student:state.student||'Student',completedAt,mode:state.mode||'practice',timed:!!state.timed,
  sectionPractice:state.sectionPractice||null,total,max,overallPercent,
  sections:sectionResults,concepts,strengths:fallbackStrengths,focus:fallbackFocus,
  nextSteps,unanswered,flagged,writing,band:assessmentBand(overallPercent)
 };
}
function captureLowerAssessment(){
 state.attemptId=state.attemptId||`lower-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
 state.assessmentId=state.assessmentId||state.attemptId;
 state.completedAt=state.completedAt||new Date().toISOString();
 const history=loadAssessmentHistory();
 const existing=history.find(x=>x.id===state.assessmentId);
 if(existing){save();return existing}
 const record=buildLowerAssessment();
 history.unshift(record);saveAssessmentHistory(history);save();return record;
}

let lowerAssessmentFilters={test:'all',timing:'all',scope:'all'};

function lowerAssessmentModeKey(record){
 const mode=record?.mode||'';
 if(['timed','untimed','timedSection','section'].includes(mode))return mode;
 if(record?.sectionPractice)return record?.timed?'timedSection':'section';
 return record?.timed?'timed':'untimed';
}
function lowerAssessmentTiming(record){
 const mode=lowerAssessmentModeKey(record);
 return mode==='timed'||mode==='timedSection'?'timed':'untimed';
}
function lowerAssessmentModeLabel(record){
 const mode=lowerAssessmentModeKey(record);
 return {
  timed:'Timed Full Test',
  untimed:'Untimed Full Test',
  timedSection:'Timed by Section',
  section:'Untimed by Section'
 }[mode]||'Practice';
}
function lowerAssessmentSectionLabel(record){
 if(record?.sectionPractice)return LABELS[record.sectionPractice]||record.sectionPractice;
 return 'All sections';
}
function lowerAssessmentScopeKey(record){
 return record?.sectionPractice||'full';
}
function lowerAssessmentTestLabel(record){
 return record?.testTitle||INFO[record?.testId]||record?.testId||'Practice Test';
}
function lowerAssessmentMetaHtml(record){
 return `<div class="assessment-meta-row">
  <span class="assessment-meta-chip">${esc(lowerAssessmentTestLabel(record))}</span>

 </div>`;
}
function lowerAssessmentSetupHtml(record){
 return `<div class="assessment-setup">
  <div class="assessment-setup-item"><span>Practice test</span><b>${esc(lowerAssessmentTestLabel(record))}</b></div>
  <div class="assessment-setup-item"><span>Timing and mode</span><b>${esc(lowerAssessmentModeLabel(record))}</b></div>
  <div class="assessment-setup-item"><span>Section scope</span><b>${esc(lowerAssessmentSectionLabel(record))}</b></div>
 </div>`;
}
function filteredLowerAssessments(history){
 return history.filter(record=>{
  const testMatch=lowerAssessmentFilters.test==='all'||record.testId===lowerAssessmentFilters.test;
  const timingMatch=lowerAssessmentFilters.timing==='all'||lowerAssessmentTiming(record)===lowerAssessmentFilters.timing;
  const scopeMatch=lowerAssessmentFilters.scope==='all'||lowerAssessmentScopeKey(record)===lowerAssessmentFilters.scope;
  return testMatch&&timingMatch&&scopeMatch;
 });
}

function assessmentConceptRowsFor(concepts){
 return concepts.map(x=>`<div class="assessment-concept">
  <div class="assessment-concept-name"><b>${esc(x.name)}</b><span>${x.status}</span></div>
  <div class="assessment-bar"><span style="width:${x.percent}%"></span></div>
  <div class="assessment-concept-score">${x.correct}/${x.total} · ${x.percent}%</div>
 </div>`).join('');
}
function lowerSectionAnalyses(record){
 return (record.sections||[]).map(section=>{
  const concepts=(record.concepts||[])
   .filter(x=>x.section===section.label)
   .sort((a,b)=>b.percent-a.percent||b.total-a.total);
  const strengths=concepts.filter(x=>x.percent>=70).slice(0,3);
  const improvement=concepts.slice()
   .sort((a,b)=>a.percent-b.percent||b.total-a.total)
   .filter(x=>x.percent<85)
   .slice(0,3);
  const nextSteps=improvement.map(x=>`Practice ${x.name} and review missed questions in this section.`);
  if(section.unanswered){
   nextSteps.push(`Work on pacing and completion: ${section.unanswered} question${section.unanswered===1?' was':'s were'} unanswered in this section.`);
  }
  if(!nextSteps.length){
   nextSteps.push(`Continue mixed ${section.label.toLowerCase()} practice to maintain this section's performance.`);
  }
  return {...section,concepts,strengths,improvement,nextSteps};
 });
}

    <div class="assessment-column"><h3>Improvement areas</h3><ul>${section.improvement.map(x=>`<li><b>${esc(x.name)}</b> — ${x.correct}/${x.total} (${x.percent}%)</li>`).join('')||`<li>No significant improvement area was identified in ${esc(section.label)}.</li>`}</ul></div>
   </div>

   <div class="assessment-next-steps"><b>${esc(section.label)} next steps</b><ul>${section.nextSteps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  </section>`).join('')}</div>`;
}
