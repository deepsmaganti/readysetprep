hrough a door marked STAFF ONLY.\n\n“We have a mystery,” he said.\n\nOn a padded table sat a small brass bell, darkened with age. A handwritten tag tied to its handle read, “Found near Pier 3, 1968.” Nothing else was known about it.\n\nNia wanted to polish the bell immediately, but Mr. Alvarez stopped her. Cleaning an old object, he explained, could erase clues. A scratch, a faded mark, or even a layer of dirt might help reveal where an object had been used.\n\nThey began by examining the bell under a bright lamp. Nia noticed three tiny letters stamped near the base: H.S.C. She searched the museum's digital records and found dozens of references to local companies, clubs, and ships, but none matched. Then she remembered a wall display about the harbor's old streetcars. One photograph showed a conductor holding a bell-shaped signal device.\n\nNia enlarged the photograph. On the side of the streetcar were the words Harbor Streetcar Company.\n\nThe letters matched.\n\nFurther research showed that conductors used small bells to signal a driver before electric buttons became common. The date on the tag suggested the bell had probably been discovered during construction near the old streetcar turnaround at Pier 3.\n\nMr. Alvarez smiled. “Not every mystery needs a dramatic answer,” he said. “Sometimes it needs a patient observer.”\n\nAt the end of her shift, Nia finally returned to the front desk. She had greeted no visitors at all, yet the museum suddenly felt much larger than it had that morning.","questions":[{"num":6,"prompt":"What is the main conflict in the passage?","choices":[{"label":"A","text":"Nia and Mr. Alvarez disagree about whether the museum should open."},{"label":"B","text":"Nia must determine what an unidentified old bell may have been used for."},{"label":"C","text":"The museum cannot find enough volunteers to greet visitors."},{"label":"D","text":"Nia wants to ride an old streetcar that no longer exists."}],"answer":"B","explanation":"The story centers on identifying the mysterious brass bell.","strand":"Main Idea"},{"num":7,"prompt":"Why does Mr. Alvarez stop Nia from polishing the bell?","choices":[{"label":"A","text":"He thinks the bell is too valuable to touch."},{"label":"B","text":"He wants to keep possible evidence from being removed."},{"label":"C","text":"He plans to give the bell to a visitor."},{"label":"D","text":"He believes brass should never be cleaned."}],"answer":"B","explanation":"He explains that cleaning could erase scratches, marks, or dirt that provide clues.","strand":"Supporting Ideas"},{"num":8,"prompt":"What can be inferred about Nia by the end of the passage?","choices":[{"label":"A","text":"She has become more interested in careful historical investigation."},{"label":"B","text":"She has decided museum work is too boring."},{"label":"C","text":"She is disappointed that the bell is not made of gold."},{"label":"D","text":"She prefers greeting visitors to solving questions."}],"answer":"A","explanation":"Her patient investigation solves the mystery, and the museum feels 'much larger' to her afterward.","strand":"Inference"},{"num":9,"prompt":"In the sentence “The letters matched,” the letters H.S.C. are important because they","choices":[{"label":"A","text":"identify the likely organization connected to the bell."},{"label":"B","text":"show the year the bell was manufactured."},{"label":"C","text":"prove the bell came from a ship."},{"label":"D","text":"give Nia permission to enter the back room."}],"answer":"A","explanation":"The initials match Harbor Streetcar Company, connecting the bell to local streetcar history.","strand":"Supporting Ideas"},{"num":10,"prompt":"The final sentence mainly suggests that Nia now","choices":[{"label":"A","text":"understands that museums contain many stories waiting to be discovered."},{"label":"B","text":"thinks the museum building has physically expanded."},{"label":"C","text":"wants the museum to build a larger front desk."},{"label":"D","text":"believes visitors should not be allowed in staff areas."}],"answer":"A","explanation":"The statement is figurative: her experience has expanded her understanding of what the museum contains.","strand":"Inference"}]},{"title":"Messages from the Upper Air","text":"Long before weather satellites circled Earth, scientists still needed information about the atmosphere above the ground. A thermometer outside a laboratory could tell them the temperature at street level, but storms develop through layers of air that extend far above rooftops. To understand those layers, researchers began sending instruments upward.\n\nOne important tool was the weather balloon. Filled with a gas lighter than air, the balloon carried a small package of instruments called a radiosonde. As the balloon rose, the radiosonde measured conditions such as temperature, air pressure, and humidity. A radio transmitter then sent the measurements back to a station on the ground.\n\nThe balloon did not remain the same size during its journey. Air pressure decreases with altitude, so the gas inside the balloon expanded as it climbed. Eventually the balloon stretched so far that it burst. A small parachute slowed the instrument package as it fell back toward Earth.\n\nWeather balloons may seem old-fashioned beside modern satellites, but they still provide valuable information. Satellites can observe huge regions and track cloud systems from above. Balloons, however, can make direct measurements through a vertical slice of the atmosphere. Forecasters combine these different kinds of observations with information from radar, aircraft, ships, and ground stations.\n\nThousands of balloon launches around the world contribute to weather models each day. A single balloon travels only one path, yet its measurements can join a much larger network. This is one reason forecasting is a cooperative science: understanding tomorrow's weather often depends on observations collected by many people, instruments, and countries.","questions":[{"num":11,"prompt":"Why were weather balloons useful before satellites existed?","choices":[{"label":"A","text":"They allowed scientists to collect measurements above ground level."},{"label":"B","text":"They prevented storms from reaching cities."},{"label":"C","text":"They could photograph the entire planet at once."},{"label":"D","text":"They replaced every ground weather station."}],"answer":"A","explanation":"Balloons carried instruments upward to measure conditions in higher layers of the atmosphere.","strand":"Supporting Ideas"},{"num":12,"prompt":"What causes a weather balloon to expand as it rises?","choices":[{"label":"A","text":"Air pressure becomes lower at higher altitudes."},{"label":"B","text":"The radiosonde becomes heavier."},{"label":"C","text":"Humidity always doubles above clouds."},{"label":"D","text":"The parachute pulls on the balloon."}],"answer":"A","explanation":"The passage directly states that lower air pressure allows the gas inside to expand.","strand":"Supporting Ideas"},{"num":13,"prompt":"The passage contrasts balloons with satellites mainly to show that","choices":[{"label":"A","text":"the two tools provide different kinds of useful information."},{"label":"B","text":"satellites have made all balloons unnecessary."},{"label":"C","text":"balloons can remain in the air longer than satellites."},{"label":"D","text":"satellites can measure only ground temperature."}],"answer":"A","explanation":"Satellites cover large regions, while balloons directly sample vertical layers; forecasters use both.","strand":"Organization & Logic"},{"num":14,"prompt":"In the last paragraph, “cooperative” most nearly means","choices":[{"label":"A","text":"dependent on people or groups working together."},{"label":"B","text":"unable to use modern equipment."},{"label":"C","text":"focused on one location."},{"label":"D","text":"easy to complete alone."}],"answer":"A","explanation":"The paragraph emphasizes measurements from many instruments, people, and countries working together.","strand":"Vocabulary in Context"},{"num":15,"prompt":"Which statement best summarizes the passage?","choices":[{"label":"A","text":"Weather balloons remain useful because they directly measure atmospheric conditions and add data to a larger forecasting system."},{"label":"B","text":"Weather balloons are more accurate than every other forecasting tool."},{"label":"C","text":"Scientists use balloons mainly to recover parachutes."},{"label":"D","text":"Modern forecasting depends only on satellites and radar."}],"answer":"A","explanation":"The passage explains how balloons work and why their direct measurements still matter.","strand":"Main Idea"}]},{"title":"Learning from a Gecko's Feet","text":"A gecko can race across a wall and even cling to a ceiling without using glue. For years, this ability puzzled scientists. The answer turned out to be hidden in structures far too small to see with the unaided eye.\n\nThe underside of a gecko's toe is covered with millions of microscopic hairs. Each hair branches into even smaller tips. When these tips come extremely close to a surface, weak attractions between molecules help the toe grip. One attraction is tiny, but millions acting together can create a surprisingly strong hold.\n\nResearchers studying this system became interested in biomimicry, the practice of designing materials or machines by studying solutions found in nature. Instead of copying a gecko's foot exactly, engineers try to understand the useful principle behind it. They have experimented with dry adhesives made of tiny synthetic structures that can attach to smooth surfaces without sticky liquid glue.\n\nSuch materials could have several advantages. Ordinary tape often collects dust or leaves residue. A gecko-inspired surface might be reusable and could potentially work in places where liquid adhesives are inconvenient. Researchers have explored possible uses in manufacturing, robotics, and equipment that must grip delicate surfaces.\n\nCreating a practical material is difficult, however. A laboratory sample that works on clean glass may not perform as well on rough, dusty, wet, or oily surfaces. It can also be challenging to manufacture microscopic structures cheaply and consistently.\n\nThe gecko, in other words, offers engineers a useful lesson, not a ready-made instruction manual. Nature can suggest an idea, but turning that idea into dependable technology still requires testing, redesign, and patience.","questions":[{"num":16,"prompt":"What is the passage mainly about?","choices":[{"label":"A","text":"How gecko feet inspired engineers to investigate reusable dry adhesives."},{"label":"B","text":"Why geckos are becoming less common in cities."},{"label":"C","text":"How ordinary tape is manufactured in factories."},{"label":"D","text":"Why scientists want robots to look exactly like geckos."}],"answer":"A","explanation":"The passage explains gecko adhesion and how that principle inspires engineered materials.","strand":"Main Idea"},{"num":17,"prompt":"Why can millions of weak molecular attractions create a strong grip?","choices":[{"label":"A","text":"Their combined effect becomes much larger."},{"label":"B","text":"They turn into liquid glue."},{"label":"C","text":"They make the gecko's toes heavier."},{"label":"D","text":"They permanently fuse the toe to the surface."}],"answer":"A","explanation":"The passage explains that each attraction is tiny, but millions together produce strong holding force.","strand":"Inference"},{"num":18,"prompt":"What does “biomimicry” mean as used in the passage?","choices":[{"label":"A","text":"Designing by studying useful ideas found in nature."},{"label":"B","text":"Protecting wild animals from technology."},{"label":"C","text":"Making exact plastic copies of animals."},{"label":"D","text":"Training animals to operate machines."}],"answer":"A","explanation":"The passage defines biomimicry as designing materials or machines by studying natural solutions.","strand":"Vocabulary in Context"},{"num":19,"prompt":"Why does the author discuss dusty, wet, and oily surfaces?","choices":[{"label":"A","text":"To explain challenges that a laboratory adhesive must overcome before practical use."},{"label":"B","text":"To prove geckos cannot climb outdoors."},{"label":"C","text":"To recommend using ordinary tape instead of new materials."},{"label":"D","text":"To show that all surfaces have identical properties."}],"answer":"A","explanation":"These conditions illustrate real-world difficulties that prototypes may face.","strand":"Organization & Logic"},{"num":20,"prompt":"The final paragraph emphasizes that","choices":[{"label":"A","text":"an idea from nature still requires engineering work before it becomes reliable technology."},{"label":"B","text":"engineers should stop studying animals."},{"label":"C","text":"gecko-inspired adhesives are already perfect."},{"label":"D","text":"nature always provides complete manufacturing instructions."}],"answer":"A","explanation":"The conclusion says nature offers a lesson, not a ready-made instruction manual.","strand":"Inference"}]},{"title":"A Wall That Remembers","text":"When the Riverside Community Center planned to repaint a long blank wall beside its entrance, the first idea was simple: choose one cheerful color and finish the job in a weekend. Then local artist Elena Ruiz suggested something more ambitious. She proposed a mural based on stories from the neighborhood.\n\nRuiz began by inviting residents to bring photographs and memories to a series of meetings. An older resident described the small grocery store his parents had operated decades earlier. A teenager talked about the basketball court where three generations of her family had played. Others remembered a yearly street festival, a garden planted on an abandoned lot, and the creek that once ran visibly before part of it was routed underground.\n\nNot every memory could fit on the wall. Ruiz grouped the stories into themes—work, play, celebration, and change—and sketched a design that connected them. Instead of painting the old grocery store as one separate scene and the basketball court as another, she used a winding blue line representing the creek to lead the viewer from one part of the mural to the next.\n\nVolunteers helped paint large sections, while Ruiz handled faces and other detailed areas. The project took six weekends rather than one. It also required debate. Some residents worried that newer families would not see themselves in a mural focused on the past. In response, Ruiz added an unfinished-looking section near the end, where painted shapes gradually became outlines. She explained that the open space represented stories still being created.\n\nAfter the mural was completed, people often stopped to point out details to one another. The wall had become more than decoration. It gave neighbors a place to discuss what had changed, what had remained, and what they hoped would come next.","questions":[{"num":21,"prompt":"Why did Ruiz hold meetings with residents?","choices":[{"label":"A","text":"To collect stories and images that could shape the mural."},{"label":"B","text":"To ask residents to choose one wall color."},{"label":"C","text":"To sell photographs of the community center."},{"label":"D","text":"To decide whether the building should be demolished."}],"answer":"A","explanation":"The meetings gathered photographs and memories to inspire the mural.","strand":"Supporting Ideas"},{"num":22,"prompt":"Why did Ruiz use the blue creek line in the design?","choices":[{"label":"A","text":"To connect several different neighborhood stories into one composition."},{"label":"B","text":"To show where volunteers were allowed to paint."},{"label":"C","text":"To cover a mistake in the original wall color."},{"label":"D","text":"To prove the creek still flows beside the center."}],"answer":"A","explanation":"The creek visually links themes and scenes across the mural.","strand":"Organization & Logic"},{"num":23,"prompt":"What concern led Ruiz to add the unfinished-looking section?","choices":[{"label":"A","text":"Some residents felt a mural about the past might not include newer members of the community."},{"label":"B","text":"The paint supply was too small to finish the wall."},{"label":"C","text":"Older residents wanted the mural removed."},{"label":"D","text":"Volunteers refused to paint detailed faces."}],"answer":"A","explanation":"The open section was added in response to concern that newer families might not see themselves represented.","strand":"Supporting Ideas"},{"num":24,"prompt":"The phrase “stories still being created” suggests that the neighborhood","choices":[{"label":"A","text":"will continue to change and develop new experiences."},{"label":"B","text":"has forgotten everything about its past."},{"label":"C","text":"plans to erase the mural each year."},{"label":"D","text":"will soon stop welcoming new families."}],"answer":"A","explanation":"The open outlines represent future experiences and changes that have not happened yet.","strand":"Inference"},{"num":25,"prompt":"Which best describes how the mural's purpose changes over the course of the passage?","choices":[{"label":"A","text":"It begins as a painting project and becomes a way for neighbors to reflect on shared history and future change."},{"label":"B","text":"It begins as a history lesson and becomes an advertisement for a grocery store."},{"label":"C","text":"It begins as a sports project and becomes a plan to uncover a creek."},{"label":"D","text":"It begins as a volunteer project and becomes a private artwork no one can discuss."}],"answer":"A","explanation":"The wall develops from a repainting project into a community conversation about memory and change.","strand":"Main Idea"}]}],"minutes":25},"math":{"questions":[{"num":1,"prompt":"What is the value of the 6 in 364,218?","choices":[{"label":"A","text":"6,000"},{"label":"B","text":"60,000"},{"label":"C","text":"600,000"},{"label":"D","text":"600"}],"answer":"B","explanation":"The 6 is in the ten-thousands place."},{"num":2,"prompt":"A pentagon has side lengths 8 cm, 11 cm, 7 cm, 9 cm, and 10 cm. What is its perimeter?","choices":[{"label":"A","text":"35 cm"},{"label":"B","text":"40 cm"},{"label":"C","text":"45 cm"},{"label":"D","text":"55 cm"}],"answer":"C","explanation":"Add the side lengths: 8+11+7+9+10=45."},{"num":3,"prompt":"A pictograph uses one symbol to represent 4 books. If a row has 7 symbols, how many books does it represent?","choices":[{"label":"A","text":"11"},{"label":"B","text":"24"},{"label":"C","text":"28"},{"label":"D","text":"32"}],"answer":"C","explanation":"7 symbols × 4 books per symbol = 28 books."},{"num":4,"prompt":"If y = 5(x + 1), what is y when x = 7?","choices":[{"label":"A","text":"35"},{"label":"B","text":"40"},{"label":"C","text":"45"},{"label":"D","text":"70"}],"answer":"B","explanation":"5(7+1)=5×8=40."},{"num":5,"prompt":"What is 8,000 − 647?","choices":[{"label":"A","text":"7,253"},{"label":"B","text":"7,353"},{"label":"C","text":"7,463"},{"label":"D","text":"8,647"}],"answer":"B","explanation":"8,000−647=7,353."},{"num":6,"prompt":"A reading log shows Maya read 12 pages Monday, 18 Tuesday, 15 Wednesday, and 23 Thursday. How many more pages did she read Thursday than Monday?","choices":[{"label":"A","text":"8"},{"label":"B","text":"10"},{"label":"C","text":"11"},{"label":"D","text":"35"}],"answer":"C","explanation":"23−12=11."},{"num":7,"prompt":"A number machine squares its input. What is the output for an input of 13?","choices":[{"label":"A","text":"26"},{"label":"B","text":"39"},{"label":"C","text":"156"},{"label":"D","text":"169"}],"answer":"D","explanation":"13²=169."},{"num":8,"prompt":"A pitcher holds 3 quarts and a jug holds 5 quarts. Which combination holds exactly 19 quarts?","choices":[{"label":"A","text":"3 pitchers and 2 jugs"},{"label":"B","text":"2 pitchers and 2 jugs"},{"label":"C","text":"3 pitchers and 3 jugs"},{"label":"D","text":"1 pitcher and 4 jugs"}],"answer":"A","explanation":"3×3 + 2×5 = 9+10=19."},{"num":9,"prompt":"Which number is divisible by 9?","choices":[{"label":"A","text":"54"},{"label":"B","text":"62"},{"label":"C","text":"74"},{"label":"D","text":"85"}],"answer":"A","explanation":"54÷9=6."},{"num":10,"prompt":"About 2/5 of 1,500 students ride the bus. About how many students is that?","choices":[{"label":"A","text":"300"},{"label":"B","text":"500"},{"label":"C","text":"600"},{"label":"D","text":"750"}],"answer":"C","explanation":"2/5×1,500=600."},{"num":11,"prompt":"$9,684 is divided equally among 3 accounts. How much goes into each account?","choices":[{"label":"A","text":"$3,128"},{"label":"B","text":"$3,228"},{"label":"C","text":"$3,328"},{"label":"D","text":"$6,684"}],"answer":"B","explanation":"9,684÷3=3,228."},{"num":12,"prompt":"Point P is located 4 units right of the y-axis and 6 units above the x-axis. What are its coordinates?","choices":[{"label":"A","text":"(4, 6)"},{"label":"B","text":"(6, 4)"},{"label":"C","text":"(-4, 6)"},{"label":"D","text":"(4, -6)"}],"answer":"A","explanation":"Right of the y-axis gives x=4 and above the x-axis gives y=6."},{"num":13,"prompt":"Point A is at 2 on a vertical number line. Point B is 7 units below A. Where is B?","choices":[{"label":"A","text":"-9"},{"label":"B","text":"-5"},{"label":"C","text":"5"},{"label":"D","text":"9"}],"answer":"B","explanation":"2−7=-5."},{"num":14,"prompt":"What is 23/4 written as a mixed number?","choices":[{"label":"A","text":"4 3/4"},{"label":"B","text":"5 1/4"},{"label":"C","text":"5 3/4"},{"label":"D","text":"6 1/4"}],"answer":"C","explanation":"23÷4=5 remainder 3, so 5 3/4."},{"num":15,"prompt":"Which fraction is equivalent to 0.35?","choices":[{"label":"A","text":"7/20"},{"label":"B","text":"3/5"},{"label":"C","text":"35/10"},{"label":"D","text":"1/35"}],"answer":"A","explanation":"0.35=35/100=7/20."},{"num":16,"prompt":"What is 4.75 + 2.6?","choices":[{"label":"A","text":"6.35"},{"label":"B","text":"7.25"},{"label":"C","text":"7.35"},{"label":"D","text":"7.85"}],"answer":"C","explanation":"4.75+2.60=7.35."},{"num":17,"prompt":"The scores are 82, 88, 91, 88, 95, 88, and 90. What is the mode?","choices":[{"label":"A","text":"82"},{"label":"B","text":"88"},{"label":"C","text":"90"},{"label":"D","text":"95"}],"answer":"B","explanation":"88 appears most often."},{"num":18,"prompt":"A triangle has angles of 35° and 65°. What is the third angle?","choices":[{"label":"A","text":"70°"},{"label":"B","text":"80°"},{"label":"C","text":"90°"},{"label":"D","text":"100°"}],"answer":"B","explanation":"Triangle angles sum to 180°, so 180−35−65=80."},{"num":19,"prompt":"Noah has 6 packs of 12 baseball cards and 4 packs of 15 soccer cards. Which expression finds the total number of cards?","choices":[{"label":"A","text":"6×12 + 4×15"},{"label":"B","text":"(6+4)×(12+15)"},{"label":"C","text":"6×(12+15)"},{"label":"D","text":"4×(12+15)"}],"answer":"A","explanation":"Multiply each number of packs by cards per pack, then add."},{"num":20,"prompt":"What is the value of 2³ × 5?","choices":[{"label":"A","text":"20"},{"label":"B","text":"30"},{"label":"C","text":"40"},{"label":"D","text":"80"}],"answer":"C","explanation":"2³=8 and 8×5=40."},{"num":21,"prompt":"A square has area 81 cm². What is its perimeter?","choices":[{"label":"A","text":"18 cm"},{"label":"B","text":"27 cm"},{"label":"C","text":"36 cm"},{"label":"D","text":"81 cm"}],"answer":"C","explanation":"The side length is 9 cm, so perimeter is 4×9=36."},{"num":22,"prompt":"In 5.60482, the digit 8 represents which value?","choices":[{"label":"A","text":"8/100"},{"label":"B","text":"8/1,000"},{"label":"C","text":"8/10,000"},{"label":"D","text":"8/100,000"}],"answer":"C","explanation":"The 8 is in the ten-thousandths place."},{"num":23,"prompt":"A triangle has base 14 m and height 9 m. What is its area?","choices":[{"label":"A","text":"23 m²"},{"label":"B","text":"63 m²"},{"label":"C","text":"126 m²"},{"label":"D","text":"252 m²"}],"answer":"B","explanation":"Area = 1/2×14×9=63."},{"num":24,"prompt":"A tank contains 120 liters. It loses 7 liters every 5 minutes. How much remains after 25 minutes?","choices":[{"label":"A","text":"78 L"},{"label":"B","text":"85 L"},{"label":"C","text":"92 L"},{"label":"D","text":"113 L"}],"answer":"B","explanation":"25 minutes is five intervals; 5×7=35 liters lost, so 120−35=85."},{"num":25,"prompt":"A driver passes 48 traffic lights and stops at about 1 out of every 6. About how many stops is that?","choices":[{"label":"A","text":"6"},{"label":"B","text":"8"},{"label":"C","text":"12"},{"label":"D","text":"42"}],"answer":"B","explanation":"48÷6=8."},{"num":26,"prompt":"Cards numbered 1 through 15 are in a bag. What is the probability of drawing a prime number?","choices":[{"label":"A","text":"5/15"},{"label":"B","text":"6/15"},{"label":"C","text":"7/15"},{"label":"D","text":"8/15"}],"answer":"B","explanation":"The primes are 2,3,5,7,11,13: 6 of 15."},{"num":27,"prompt":"When it is 10:00 a.m. in City A, it is 1:00 p.m. in City B. When it is 6:30 p.m. in City B, what time is it in City A?","choices":[{"label":"A","text":"2:30 p.m."},{"label":"B","text":"3:30 p.m."},{"label":"C","text":"4:30 p.m."},{"label":"D","text":"9:30 p.m."}],"answer":"B","explanation":"City B is 3 hours ahead, so 6:30 p.m. in B is 3:30 p.m. in A."},{"num":28,"prompt":"Which quadrilateral always has four equal sides?","choices":[{"label":"A","text":"kite"},{"label":"B","text":"rectangle"},{"label":"C","text":"rhombus"},{"label":"D","text":"trapezoid"}],"answer":"C","explanation":"A rhombus has four equal sides."},{"num":29,"prompt":"How many integers between 40 and 70 are divisible by 6?","choices":[{"label":"A","text":"4"},{"label":"B","text":"5"},{"label":"C","text":"6"},{"label":"D","text":"7"}],"answer":"B","explanation":"The multiples are 42,48,54,60,66: five integers."},{"num":30,"prompt":"A scientist records the lengths, masses, and colors of 12 leaves. Which question is NOT statistical?","choices":[{"label":"A","text":"What is the average leaf length?"},{"label":"B","text":"Which color appears most often?"},{"label":"C","text":"What is the mass of Leaf #1?"},{"label":"D","text":"How much do leaf masses vary?"}],"answer":"C","explanation":"A statistical question expects variation across a group; the mass of one specific leaf is a single fixed value."}],"minutes":30},"essay":{"prompt":"Think of a skill or activity that seemed difficult when you first tried it but became easier with practice. Explain what helped you improve and what you learned from the experience.","guidance":"Organize your response clearly. Use specific details to describe the challenge, the steps you took, and what changed.","minutes":30}},"lower-test5":{"title":"Lower Level Practice Test #5","verbal":{"minutes":20,"questions":[{"num":1,"prompt":"ABRUPT:","choices":[{"label":"A","text":"distant"},{"label":"B","text":"gradual"},{"label":"C","text":"sudden"},{"label":"D","text":"useful"}],"answer":"C","explanation":"Abrupt means sudden or unexpected.","part":"Synonyms"},{"num":2,"prompt":"BENEVOLENT:","choices":[{"label":"A","text":"kind"},{"label":"B","text":"ordinary"},{"label":"C","text":"strict"},{"label":"D","text":"timid"}],"answer":"A","explanation":"Benevolent means kind and generous.","part":"Synonyms"},{"num":3,"prompt":"CANDID:","choices":[{"label":"A","text":"brief"},{"label":"B","text":"honest"},{"label":"C","text":"polished"},{"label":"D","text":"secret"}],"answer":"B","explanation":"Candid means honest and straightforward.","part":"Synonyms"},{"num":4,"prompt":"DEVISE:","choices":[{"label":"A","text":"destroy"},{"label":"B","text":"invent"},{"label":"C","text":"observe"},{"label":"D","text":"repeat"}],"answer":"B","explanation":"To devise is to create or invent a plan or method.","part":"Synonyms"},{"num":5,"prompt":"ELUSIVE:","choices":[{"label":"A","text":"easy to explain"},{"label":"B","text":"hard to catch"},{"label":"C","text":"likely to grow"},{"label":"D","text":"ready to share"}],"answer":"B","explanation":"Elusive means difficult to find, catch, or understand.","part":"Synonyms"},{"num":6,"prompt":"FEASIBLE:","choices":[{"label":"A","text":"costly"},{"label":"B","text":"impossible"},{"label":"C","text":"possible"},{"label":"D","text":"temporary"}],"answer":"C","explanation":"Feasible means possible or practical.","part":"Synonyms"},{"num":7,"prompt":"GRIM:","choices":[{"label":"A","text":"cheerful"},{"label":"B","text":"fragile"},{"label":"C","text":"serious"},{"label":"D","text":"vague"}],"answer":"C","explanation":"Grim means serious, gloomy, or harsh.","part":"Synonyms"},{"num":8,"prompt":"IMPARTIAL:","choices":[{"label":"A","text":"fair"},{"label":"B","text":"famous"},{"label":"C","text":"hasty"},{"label":"D","text":"loyal"}],"answer":"A","explanation":"Impartial means fair and not favoring one side.","part":"Synonyms"},{"num":9,"prompt":"JEOPARDIZE:","choices":[{"label":"A","text":"decorate"},{"label":"B","text":"endanger"},{"label":"C","text":"measure"},{"label":"D","text":"restore"}],"answer":"B","explanation":"To jeopardize means to put at risk.","part":"Synonyms"},{"num":10,"prompt":"LUMINOUS:","choices":[{"label":"A","text":"bright"},{"label":"B","text":"narrow"},{"label":"C","text":"rough"},{"label":"D","text":"silent"}],"answer":"A","explanation":"Luminous means giving off or reflecting light.","part":"Synonyms"},{"num":11,"prompt":"MUNDANE:","choices":[{"label":"A","text":"dramatic"},{"label":"B","text":"ordinary"},{"label":"C","text":"rare"},{"label":"D","text":"splendid"}],"answer":"B","explanation":"Mundane means ordinary or commonplace.","part":"Synonyms"},{"num":12,"prompt":"NOTABLE:","choices":[{"label":"A","text":"careless"},{"label":"B","text":"hidden"},{"label":"C","text":"remarkable"},{"label":"D","text":"temporary"}],"answer":"C","explanation":"Notable means worthy of attention or remarkable.","part":"Synonyms"},{"num":13,"prompt":"OMIT:","choices":[{"label":"A","text":"combine"},{"label":"B","text":"leave out"},{"label":"C","text":"predict"},{"label":"D","text":"translate"}],"answer":"B","explanation":"To omit is to leave something out.","part":"Synonyms"},{"num":14,"prompt":"PRUDENT:","choices":[{"label":"A","text":"ancient"},{"label":"B","text":"eager"},{"label":"C","text":"wise"},{"label":"D","text":"reckless"}],"answer":"C","explanation":"Prudent means wise and careful.","part":"Synonyms"},{"num":15,"prompt":"RESILIENT:","choices":[{"label":"A","text":"able to recover"},{"label":"B","text":"difficult to move"},{"label":"C","text":"easy to predict"},{"label":"D","text":"likely to vanish"}],"answer":"A","explanation":"Resilient means able to recover after difficulty.","part":"Synonyms"},{"num":16,"prompt":"SCARCE:","choices":[{"label":"A","text":"abundant"},{"label":"B","text":"limited"},{"label":"C","text":"smooth"},{"label":"D","text":"valuable"}],"answer":"B","explanation":"Scarce means in short supply or limited.","part":"Synonyms"},{"num":17,"prompt":"TEDIOUS:","choices":[{"label":"A","text":"boring"},{"label":"B","text":"dangerous"},{"label":"C","text":"rapid"},{"label":"D","text":"unfair"}],"answer":"A","explanation":"Tedious means tiresome or boring.","part":"Synonyms"},{"num":18,"prompt":"The committee postponed its decision because the available information was too ------- to support a confident choice.","choices":[{"label":"A","text":"complete"},{"label":"B","text":"limited"},{"label":"C","text":"obvious"},{"label":"D","text":"precise"}],"answer":"B","explanation":"Limited information would make a confident decision difficult.","part":"Sentence Completion"},{"num":19,"prompt":"Although the first draft was disorganized, careful revision made the final essay much more -------.","choices":[{"label":"A","text":"coherent"},{"label":"B","text":"ordinary"},{"label":"C","text":"secretive"},{"label":"D","text":"tedious"}],"answer":"A","explanation":"Revision can make an essay coherent, or logically organized.","part":"Sentence Completion"},{"num":20,"prompt":"The ranger asked visitors to remain ------- because a bear had recently been seen near the trail.","choices":[{"label":"A","text":"alert"},{"label":"B","text":"carefree"},{"label":"C","text":"drowsy"},{"label":"D","text":"reckless"}],"answer":"A","explanation":"A nearby bear gives visitors a reason to remain alert.","part":"Sentence Completion"},{"num":21,"prompt":"Sofia's explanation was ------- by several examples from the experiment, making her conclusion convincing.","choices":[{"label":"A","text":"supported"},{"label":"B","text":"delayed"},{"label":"C","text":"ignored"},{"label":"D","text":"weakened"}],"answer":"A","explanation":"Examples that make a conclusion convincing support it.","part":"Sentence Completion"},{"num":22,"prompt":"The mayor's proposal was ------- at first, but support grew after residents learned how it would be funded.","choices":[{"label":"A","text":"controversial"},{"label":"B","text":"invisible"},{"label":"C","text":"ordinary"},{"label":"D","text":"unrelated"}],"answer":"A","explanation":"The contrast with later support suggests the proposal was controversial initially.","part":"Sentence Completion"},{"num":23,"prompt":"Rather than accept the rumor immediately, Theo remained ------- until he could verify the facts.","choices":[{"label":"A","text":"skeptical"},{"label":"B","text":"careless"},{"label":"C","text":"impressed"},{"label":"D","text":"relieved"}],"answer":"A","explanation":"Waiting for verification shows skepticism.","part":"Sentence Completion"},{"num":24,"prompt":"The two routes are nearly ------- in distance, so travel time will depend mostly on traffic.","choices":[{"label":"A","text":"equal"},{"label":"B","text":"opposite"},{"label":"C","text":"random"},{"label":"D","text":"temporary"}],"answer":"A","explanation":"If distance is nearly the same, equal is the best fit.","part":"Sentence Completion"},{"num":25,"prompt":"The historian tried to ------- between firsthand accounts and stories added many years later.","choices":[{"label":"A","text":"distinguish"},{"label":"B","text":"combine"},{"label":"C","text":"forget"},{"label":"D","text":"predict"}],"answer":"A","explanation":"The historian is separating two kinds of sources.","part":"Sentence Completion"},{"num":26,"prompt":"A single cloudy day is not enough evidence to ------- that the entire summer will be rainy.","choices":[{"label":"A","text":"conclude"},{"label":"B","text":"observe"},{"label":"C","text":"remember"},{"label":"D","text":"measure"}],"answer":"A","explanation":"One day is insufficient evidence for a broad conclusion.","part":"Sentence Completion"},{"num":27,"prompt":"The rescue team worked -------, checking every room before leaving the building.","choices":[{"label":"A","text":"methodically"},{"label":"B","text":"carelessly"},{"label":"C","text":"occasionally"},{"label":"D","text":"silently"}],"answer":"A","explanation":"Checking every room in an organized way is methodical.","part":"Sentence Completion"},{"num":28,"prompt":"The speaker used a familiar example to make the complicated idea more ------- to the audience.","choices":[{"label":"A","text":"accessible"},{"label":"B","text":"distant"},{"label":"C","text":"fragile"},{"label":"D","text":"mysterious"}],"answer":"A","explanation":"A familiar example can make a difficult idea easier to understand, or more accessible.","part":"Sentence Completion"},{"num":29,"prompt":"Although the antique vase appeared -------, experts discovered that it had been made only ten years earlier.","choices":[{"label":"A","text":"ancient"},{"label":"B","text":"durable"},{"label":"C","text":"ordinary"},{"label":"D","text":"valuable"}],"answer":"A","explanation":"Although signals contrast between seeming ancient and being recently made.","part":"Sentence Completion"},{"num":30,"prompt":"The coach was willing to ------- the practice schedule when several players had a school event.","choices":[{"label":"A","text":"adjust"},{"label":"B","text":"conceal"},{"label":"C","text":"memorize"},{"label":"D","text":"reject"}],"answer":"A","explanation":"Changing the schedule to fit circumstances means adjusting it.","part":"Sentence Completion"},{"num":31,"prompt":"The witness gave such a ------- description of the bicycle that officers could recognize it easily.","choices":[{"label":"A","text":"detailed"},{"label":"B","text":"vague"},{"label":"C","text":"brief"},{"label":"D","text":"unrelated"}],"answer":"A","explanation":"A detailed description provides enough information for recognition.","part":"Sentence Completion"},{"num":32,"prompt":"After months without rain, even a small storm brought ------- relief to farmers.","choices":[{"label":"A","text":"considerable"},{"label":"B","text":"harmful"},{"label":"C","text":"minor"},{"label":"D","text":"uncertain"}],"answer":"A","explanation":"After a long drought, rain could bring considerable relief.","part":"Sentence Completion"},{"num":33,"prompt":"Rather than ------- the opposing argument, the debater addressed its strongest point directly.","choices":[{"label":"A","text":"avoid"},{"label":"B","text":"repeat"},{"label":"C","text":"support"},{"label":"D","text":"translate"}],"answer":"A","explanation":"Addressing a strong opposing point means not avoiding it.","part":"Sentence Completion"},{"num":34,"prompt":"The discovery was ------- because it changed scientists' understanding of how the species migrated.","choices":[{"label":"A","text":"significant"},{"label":"B","text":"routine"},{"label":"C","text":"temporary"},{"label":"D","text":"unrelated"}],"answer":"A","explanation":"A finding that changes scientific understanding is significant.","part":"Sentence Completion"}]},"quantitative":{"minutes":35,"questions":[{"num":1,"prompt":"The pattern is 13, 18, 23, 28, ___. What number comes next?","choices":[{"label":"A","text":"33"},{"label":"B","text":"34"},{"label":"C","text":"28"},{"label":"D","text":"38"}],"answer":"A","explanation":"The pattern increases by 5 each time."},{"num":2,"prompt":"A sequence begins 3, 9, 27, ___. Each term is found using the same rule. What is the next term?","choices":[{"label":"A","text":"162"},{"label":"B","text":"81"},{"label":"C","text":"27"},{"label":"D","text":"84"}],"answer":"B","explanation":"Each term is multiplied by 3."},{"num":3,"prompt":"If 5 × □ = 45, what number belongs in the box?","choices":[{"label":"A","text":"11"},{"label":"B","text":"7"},{"label":"C","text":"9"},{"label":"D","text":"40"}],"answer":"C","explanation":"45 ÷ 5 = 9."},{"num":4,"prompt":"If 10 × 7 = 70, which equation is in the same fact family?","choices":[{"label":"A","text":"70 - 10 = 7"},{"label":"B","text":"10 + 7 = 70"},{"label":"C","text":"70 ÷ 10 = 7"},{"label":"D","text":"70 ÷ 7 = 11"}],"answer":"C","explanation":"Multiplication and division are inverse operations."},{"num":5,"prompt":"What is the median of the data set 8, 11, 14, 17, 26?","choices":[{"label":"A","text":"26"},{"label":"B","text":"15"},{"label":"C","text":"8"},{"label":"D","text":"14"}],"answer":"D","explanation":"With five ordered values, the median is the middle value."},{"num":6,"prompt":"A number machine follows the rule “multiply the input by 2, then add 3.” What is the output when the input is 9?","choices":[{"label":"A","text":"12"},{"label":"B","text":"21"},{"label":"C","text":"18"},{"label":"D","text":"23"}],"answer":"B","explanation":"Apply the rule in order: multiply by 2, then add 3."},{"num":7,"prompt":"If (★ + ★ + 6) × 2 = 32, what is the value of ★?","choices":[{"label":"A","text":"7"},{"label":"B","text":"16"},{"label":"C","text":"5"},{"label":"D","text":"10"}],"answer":"C","explanation":"Divide by 2 first, subtract 6, then split the remainder equally between the two stars."},{"num":8,"prompt":"Which fraction has the smallest value?","choices":[{"label":"A","text":"2/5"},{"label":"B","text":"1/3"},{"label":"C","text":"5/12"},{"label":"D","text":"3/8"}],"answer":"B","explanation":"Compare the fractions by converting them to equivalent decimals or common denominators."},{"num":9,"prompt":"In the number 4.735, what is the value of the digit 7?","choices":[{"label":"A","text":"7/1000"},{"label":"B","text":"7/100"},{"label":"C","text":"7/10"},{"label":"D","text":"7"}],"answer":"C","explanation":"The first digit to the right of the decimal is in the tenths place."},{"num":10,"prompt":"A supply room receives 20 boxes with 12 markers in each box. After 69 markers are used, how many remain?","choices":[{"label":"A","text":"240"},{"label":"B","text":"171"},{"label":"C","text":"309"},{"label":"D","text":"69"}],"answer":"B","explanation":"Multiply to find the total number of markers, then subtract the number used."},{"num":11,"prompt":"A point is halfway between 2.95 and 3.95 on a number line. What number does it represent?","choices":[{"label":"A","text":"3.45"},{"label":"B","text":"3.20"},{"label":"C","text":"3.95"},{"label":"D","text":"3.70"}],"answer":"A","explanation":"The midpoint is the average of the two endpoint values."},{"num":12,"prompt":"Which fraction is equivalent to 4/6?","choices":[{"label":"A","text":"12/18"},{"label":"B","text":"7/8"},{"label":"C","text":"5/7"},{"label":"D","text":"8/18"}],"answer":"A","explanation":"Multiplying numerator and denominator by the same nonzero number creates an equivalent fraction."},{"num":13,"prompt":"Adult tickets cost $15 and child tickets cost $9. Which expression gives the cost for 3 adults and 4 children?","choices":[{"label":"A","text":"(15 × 3) + (9 × 4)"},{"label":"B","text":"(15 × 4) + (9 × 3)"},{"label":"C","text":"(15 + 9) × (3 + 4)"},{"label":"D","text":"(15 × 3) - (9 × 4)"}],"answer":"A","explanation":"Multiply each ticket price by the number of tickets of that type, then add."},{"num":14,"prompt":"Of 90 counters, 37 are red and the rest are blue. What fraction of the counters are blue?","choices":[{"label":"A","text":"37/90"},{"label":"B","text":"53/90"},{"label":"C","text":"90/53"},{"label":"D","text":"53/37"}],"answer":"B","explanation":"Subtract red counters from the total to find the number of blue counters, then place that over the total."},{"num":15,"prompt":"Which improper fraction equals 5 2/3?","choices":[{"label":"A","text":"15/3"},{"label":"B","text":"17/4"},{"label":"C","text":"7/3"},{"label":"D","text":"17/3"}],"answer":"D","explanation":"Multiply the whole number by the denominator and add the numerator."},{"num":16,"prompt":"Different shapes represent digits. If ○ + □ + □ = 17 and □ = 5, what digit does ○ represent?","choices":[{"label":"A","text":"7"},{"label":"B","text":"8"},{"label":"C","text":"12"},{"label":"D","text":"5"}],"answer":"A","explanation":"Subtract the value of the two squares from the total."},{"num":17,"prompt":"Which statement must be true about a net that folds into a cube?","choices":[{"label":"A","text":"It has six square faces."},{"label":"B","text":"It has exactly five faces."},{"label":"C","text":"It has one circular face."},{"label":"D","text":"It has four triangular faces."}],"answer":"A","explanation":"A cube has six square faces, so any valid cube net contains six squares."},{"num":18,"prompt":"A rectangle has length 19 meters and perimeter 58 meters. What is its width?","choices":[{"label":"A","text":"29"},{"label":"B","text":"19"},{"label":"C","text":"10"},{"label":"D","text":"12"}],"answer":"C","explanation":"For a rectangle, half the perimeter equals length plus width."},{"num":19,"prompt":"A circle graph is divided into 8 equal sectors. Three sectors represent students who chose art. What fraction chose art?","choices":[{"label":"A","text":"3/5"},{"label":"B","text":"5/8"},{"label":"C","text":"3/8"},{"label":"D","text":"1/3"}],"answer":"C","explanation":"Three of the eight equal sectors represent art."},{"num":20,"prompt":"A team has 14 women and 7 men. 28 balls are shared equally among the women and 28 balls equally among the men. Which statement is true?","choices":[{"label":"A","text":"Each woman receives twice as many as each man."},{"label":"B","text":"Each man receives one fewer than each woman."},{"label":"C","text":"Each man receives twice as many as each woman."},{"label":"D","text":"Each person receives the same number."}],"answer":"C","explanation":"Each woman gets 2; each man gets 4."},{"num":21,"prompt":"A factory uses 162 buttons for 27 identical shirts. At the same rate, how many buttons are needed for 42 shirts?","choices":[{"label":"A","text":"210"},{"label":"B","text":"162"},{"label":"C","text":"294"},{"label":"D","text":"252"}],"answer":"D","explanation":"Find the constant number of buttons per shirt, then multiply by the new number of shirts."},{"num":22,"prompt":"A triangle has base 10 units and height 6 units. What is its area?","choices":[{"label":"A","text":"16"},{"label":"B","text":"60"},{"label":"C","text":"30"},{"label":"D","text":"15"}],"answer":"C","explanation":"Triangle area is one-half × base × height."},{"num":23,"prompt":"A rectangular sheet is 102 mm long and 62 mm wide. One cut makes a square with side 62 mm. How much length is removed?","choices":[{"label":"A","text":"164"},{"label":"B","text":"102"},{"label":"C","text":"40"},{"label":"D","text":"62"}],"answer":"C","explanation":"Subtract the square's side length from the original length."},{"num":24,"prompt":"A table shows 3 boxes contain 480 pins and 6 boxes contain 960 pins. Which rule describes the relationship?","choices":[{"label":"A","text":"pins = boxes × 160"},{"label":"B","text":"pins = boxes + 160"},{"label":"C","text":"pins = boxes + 320"},{"label":"D","text":"pins = boxes × 80"}],"answer":"A","explanation":"The number of pins per box is constant."},{"num":25,"prompt":"A dot pattern has 1 dot in Figure 1, 4 in Figure 2, 9 in Figure 3, and 16 in Figure 4. How many dots are in Figure 6?","choices":[{"label":"A","text":"36"},{"label":"B","text":"30"},{"label":"C","text":"25"},{"label":"D","text":"42"}],"answer":"A","explanation":"The figures follow square numbers: 1², 2², 3², and so on."},{"num":26,"prompt":"A rectangular prism has six faces. Which collection could be all of its faces?","choices":[{"label":"A","text":"one square and four triangles"},{"label":"B","text":"four triangles and two circles"},{"label":"C","text":"six circles"},{"label":"D","text":"three matching pairs of rectangles"}],"answer":"D","explanation":"Opposite faces of a rectangular prism form three matching pairs of rectangles."},{"num":27,"prompt":"Which best describes the set {1 1/2, 2 3/4, 4 1/5, 6 2/3}?","choices":[{"label":"A","text":"prime numbers"},{"label":"B","text":"whole numbers"},{"label":"C","text":"mixed numbers"},{"label":"D","text":"proper fractions"}],"answer":"C","explanation":"Each number contains a whole-number part and a fractional part."},{"num":28,"prompt":"An airplane has 70 seats. 28 are aisle seats and the rest are window seats. What is the probability of being assigned a window seat?","choices":[{"label":"A","text":"21/40"},{"label":"B","text":"3/5"},{"label":"C","text":"2/5"},{"label":"D","text":"1/2"}],"answer":"B","explanation":"Find the number of window seats, then divide by the total number of seats."},{"num":29,"prompt":"A design is reflected across a vertical line of symmetry. A star is 3 cm to the left of the line. Where must its matching star be?","choices":[{"label":"A","text":"6 cm to the right of the line"},{"label":"B","text":"3 cm to the right of the line"},{"label":"C","text":"on the line"},{"label":"D","text":"3 cm above the line"}],"answer":"B","explanation":"Reflected points are the same perpendicular distance from the line of symmetry."},{"num":30,"prompt":"Segment AC is 22 cm long. Point B lies between A and C, and AB is 8 cm. What is BC?","choices":[{"label":"A","text":"22"},{"label":"B","text":"8"},{"label":"C","text":"14"},{"label":"D","text":"30"}],"answer":"C","explanation":"Subtract AB from the whole segment AC."},{"num":31,"prompt":"45 candles are divided equally among 5 bags, while 54 candles are divided equally among 9 cases. Which statement is true?","choices":[{"label":"A","text":"Each case has twice as many as each bag."},{"label":"B","text":"Each case has more candles than each bag."},{"label":"C","text":"Each bag and case has the same number."},{"label":"D","text":"Each bag has more candles than each case."}],"answer":"D","explanation":"Each bag gets 9 candles and each case gets 6."},{"num":32,"prompt":"Three numbers in this set are multiples of 8: 24, 40, 64, 73. Which number does NOT belong?","choices":[{"label":"A","text":"64"},{"label":"B","text":"24"},{"label":"C","text":"73"},{"label":"D","text":"40"}],"answer":"C","explanation":"The first three values divide evenly by 8; 73 does not."},{"num":33,"prompt":"A rectangle has side lengths 10 cm and 6 cm. A new rectangle keeps the 10-cm side but doubles the other side. By how many centimeters does that side increase?","choices":[{"label":"A","text":"12"},{"label":"B","text":"10"},{"label":"C","text":"16"},{"label":"D","text":"6"}],"answer":"D","explanation":"Doubling a length increases it by one original length."},{"num":34,"prompt":"A balanced scale represents 2○ + □ = 17. If ○ = 5, what is □?","choices":[{"label":"A","text":"7"},{"label":"B","text":"12"},{"label":"C","text":"8"},{"label":"D","text":"5"}],"answer":"A","explanation":"Subtract the value of two circles from the total."},{"num":35,"prompt":"A grid has 35 equal squares and 21 are shaded. What percentage is shaded?","choices":[{"label":"A","text":"40%"},{"label":"B","text":"70%"},{"label":"C","text":"50%"},{"label":"D","text":"60%"}],"answer":"D","explanation":"Divide the shaded squares by the total and convert to a percent."},{"num":36,"prompt":"The relationship is L = 3B. If B increases by 2, by how much does L increase?","choices":[{"label":"A","text":"6"},{"label":"B","text":"3"},{"label":"C","text":"2"},{"label":"D","text":"8"}],"answer":"A","explanation":"Because L is 3 times B, a 2-unit increase in B creates a 6-unit increase in L."},{"num":37,"prompt":"A box has 30 crayons that are not purple and some purple crayons. If the probability of choosing purple is 1/4, how many purple crayons are there?","choices":[{"label":"A","text":"10"},{"label":"B","text":"8"},{"label":"C","text":"7"},{"label":"D","text":"12"}],"answer":"A","explanation":"If purple is one-fourth of the total, the non-purple crayons make up three-fourths. The purple count is one-third of the non-purple count."},{"num":38,"prompt":"Each large cube has a volume of 1,000 cubic inches. What expression gives the volume of 24 such cubes?","choices":[{"label":"A","text":"24 × 1,000"},{"label":"B","text":"1,000 ÷ 24"},{"label":"C","text":"24 × 100"},{"label":"D","text":"24 + 1,000"}],"answer":"A","explanation":"Multiply the volume of one cube by the number of cubes."}]},"reading":{"minutes":25,"passages":[{"title":"The Mathematics of Beehives","text":"A honeybee colony stores honey and raises young in sheets of wax cells. Viewed from the front, most of those cells form six-sided shapes called hexagons. People have admired this pattern for centuries, but the shape is useful for more than its appearance.\n\nCells need to fit together without leaving wasted gaps. Equilateral triangles, squares, and regular hexagons can all cover a flat surface in this way, but hexagons offer a useful balance. They provide a relatively large storage area while requiring less total wall material than many other possible arrangements. For bees, wall material matters because producing wax requires energy.\n\nThe cells are not perfectly simple geometric boxes. Their walls have thickness, and the backs of the cells meet in angled surfaces. Bees also build while crowded together in a warm hive, so real honeycomb contains small variations. Still, the repeated pattern is remarkably regular.\n\nScientists have debated exactly how bees create it. One explanation emphasizes instinctive building behavior: bees repeatedly place wax in ways that produce the familiar pattern. Another notes that warm wax can soften slightly, allowing neighboring roundish cells to press against one another and form straighter shared walls. The final honeycomb may result from both behavior and physical properties.\n\nWhatever the precise process, honeycomb is a reminder that geometry can emerge from practical constraints. The bees are not solving equations on paper, yet their need to store food efficiently has produced a structure that mathematicians find elegant.","questions":[{"num":1,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Scientists have proven bees calculate geometry equations."},{"label":"B","text":"Honeycomb's hexagonal pattern efficiently uses space and wax and may arise from behavior and wax properties."},{"label":"C","text":"Honeybees choose hexagons only because they look attractive."},{"label":"D","text":"Honeycomb's hexagonal pattern efficiently uses space and wax and may result from both bee behavior and wax properties."}],"answer":"D","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":2,"prompt":"Why does reducing wall material matter to bees?","choices":[{"label":"A","text":"Wax is poisonous in large amounts."},{"label":"B","text":"Wax cannot form shared walls."},{"label":"C","text":"Producing wax requires energy."},{"label":"D","text":"The passage says this happens only because of luck."}],"answer":"C","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, the word “constraints” most nearly means","choices":[{"label":"A","text":"a sudden warning"},{"label":"B","text":"limits or requirements"},{"label":"C","text":"solutions"},{"label":"D","text":"decorations"}],"answer":"B","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":4,"prompt":"Why does the author mention that real honeycomb has small variations?","choices":[{"label":"A","text":"Only human-made objects can follow geometric patterns."},{"label":"B","text":"To show that natural structures can follow a regular pattern without being perfectly geometric."},{"label":"C","text":"Natural structures can be regular without being perfectly geometric."},{"label":"D","text":"Bees deliberately make every cell a different size."}],"answer":"B","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":5,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"mocking and dismissive"},{"label":"B","text":"alarmed and urgent"},{"label":"C","text":"curious and explanatory"},{"label":"D","text":"uncertain and hesitant"}],"answer":"C","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"When a Map Is Not North-Up","text":"Most modern maps place north at the top, so the choice can seem like a rule of nature. It is not. A map is a designed representation, and mapmakers choose an orientation based on purpose, tradition, and audience.\n\nHistorical maps demonstrate this variety. Some medieval European maps placed east at the top because east held religious significance. Certain Islamic maps were drawn with south at the top. Navigational charts could be oriented to match a coastline or a travel route rather than a compass direction.\n\nEven today, north-up is not always the most useful choice. A transit map posted inside a station may rotate the local street grid so the direction a rider is facing appears at the top. A hiking map might be turned while someone walks so that the path ahead points upward. Digital map applications frequently rotate automatically when a user chooses turn-by-turn navigation.\n\nChanging orientation does not change the actual relationships among places, but it can change how quickly a reader understands them. A map that matches the viewer's direction can make “left” and “right” easier to interpret. On the other hand, a fixed north-up map makes it simpler to compare one map with another.\n\nGood map reading therefore requires more than recognizing symbols. It also requires checking orientation. The small compass arrow that many readers ignore may be the clue that prevents a very confident walk in exactly the wrong direction.","questions":[{"num":6,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Map orientation is a design choice, and different orientations can serve different purposes."},{"label":"B","text":"Map orientation is a design choice that can change with purpose and audience."},{"label":"C","text":"North must always appear at the top of every map."},{"label":"D","text":"Historical mapmakers did not understand directions."}],"answer":"A","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":7,"prompt":"Why might a station map be rotated?","choices":[{"label":"A","text":"It can match the direction a rider is facing and make nearby directions easier to understand."},{"label":"B","text":"To make north point downward on every map."},{"label":"C","text":"To match the direction a rider is facing."},{"label":"D","text":"To hide nearby streets."}],"answer":"A","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":8,"prompt":"In the passage, the word “orientation” most nearly means","choices":[{"label":"A","text":"the direction in which something is positioned"},{"label":"B","text":"the distance between two points"},{"label":"C","text":"a sudden warning"},{"label":"D","text":"the age of a map"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":9,"prompt":"Why is north-up useful when comparing maps?","choices":[{"label":"A","text":"A consistent north-up orientation makes maps easier to compare."},{"label":"B","text":"A consistent orientation makes locations easier to compare across different maps."},{"label":"C","text":"Rotating a map changes the real location of places."},{"label":"D","text":"North-up maps contain more accurate distances."}],"answer":"B","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":10,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"uncertain and hesitant"},{"label":"B","text":"solemn and tragic"},{"label":"C","text":"angry and argumentative"},{"label":"D","text":"informative with a lightly humorous ending"}],"answer":"D","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"The Bell in the Workshop","text":"Mr. Alvarez kept a small brass bell on the highest shelf of his bicycle-repair shop. Customers rarely noticed it, but twelve-year-old Priya did. She spent Saturday mornings helping sweep floors, sort bolts, and hand her uncle tools.\n\nOne rainy morning, Priya asked why the bell was dusty when nearly everything else in the shop was polished. Her uncle lifted it carefully. “It belonged to my first bicycle,” he said.\n\nAs a teenager, Mr. Alvarez had bought a broken bicycle at a yard sale. The chain slipped, one wheel wobbled, and the brakes barely worked. He had no money for a repair shop, so he borrowed a manual from the library and learned one adjustment at a time. The bell was almost the only part that worked from the beginning.\n\nPriya expected him to say that fixing the bicycle had inspired him to become a mechanic. Instead, he shook his head. “What mattered was learning not to be embarrassed when I didn't know something,” he said. “I asked questions. I made mistakes. Then I asked better questions.”\n\nLater that morning, a customer brought in a bicycle with a clicking sound Priya had never heard. She started to step aside, assuming her uncle would solve it. Then she remembered the bell. She listened, watched, and finally asked whether the sound changed when the rider shifted gears.\n\nHer uncle smiled. “Good question.”\n\nAt closing time, Priya climbed a stool and dusted the brass bell. She put it back on the shelf, but this time she understood why it had never been thrown away.","questions":[{"num":11,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"The bell helps Priya understand that learning involves asking questions and being willing not to know everything at first."},{"label":"B","text":"Old bicycle parts should always be saved."},{"label":"C","text":"A dusty bell teaches Priya that learning often begins with questions and mistakes."},{"label":"D","text":"Repair manuals are more useful than teachers."}],"answer":"A","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":12,"prompt":"How did Mr. Alvarez learn to repair his first bicycle?","choices":[{"label":"A","text":"He bought a new bicycle instead."},{"label":"B","text":"He attended a professional mechanics school."},{"label":"C","text":"He borrowed a manual and learned through questions and practice."},{"label":"D","text":"He borrowed a manual, asked questions, and learned one adjustment at a time."}],"answer":"D","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":13,"prompt":"In the passage, the word “inspired” most nearly means","choices":[{"label":"A","text":"motivated or encouraged"},{"label":"B","text":"prevented"},{"label":"C","text":"a sudden warning"},{"label":"D","text":"confused"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":14,"prompt":"Why does Priya ask about the clicking sound instead of stepping aside?","choices":[{"label":"A","text":"She already knows exactly what is wrong."},{"label":"B","text":"She wants to impress a customer."},{"label":"C","text":"She remembers her uncle's lesson about observing and asking questions."},{"label":"D","text":"She applies her uncle's lesson about learning by observing and asking questions."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":15,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"bitter and resentful"},{"label":"B","text":"uncertain and hesitant"},{"label":"C","text":"scientific and detached"},{"label":"D","text":"reflective and encouraging"}],"answer":"D","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"Restoring a Prairie","text":"A field can look empty after farmers stop using it, but that does not mean it will automatically return to the ecosystem that existed there before. In parts of North America, conservation groups are working to restore native prairie—grasslands once shaped by deep-rooted plants, grazing animals, and periodic fire.\n\nRestoration often begins with seeds. Workers may collect seeds from nearby prairie remnants so the new site includes plants adapted to local conditions. They sow a mixture rather than a single species because healthy prairies contain many grasses and flowering plants that grow at different times of year.\n\nThe first seasons can be disappointing. Fast-growing weeds may dominate, while some native plants spend more energy developing roots than producing visible leaves and flowers. Prairie roots can extend several feet into the soil, helping plants survive drought and storing carbon underground.\n\nManagers sometimes use controlled burns to mimic a natural process. Fire removes accumulated dead material and can limit woody plants that would otherwise turn grassland into shrubland or forest. These burns are planned carefully around weather, safety, and local regulations.\n\nPrairie restoration is therefore less like planting a lawn and more like rebuilding a community. Success may take years to become obvious. As plant diversity increases, insects, birds, and other animals may return as well. The goal is not simply a field that looks wild, but an ecosystem whose many parts can support one another over time.","questions":[{"num":16,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"A prairie can be restored simply by stopping farming."},{"label":"B","text":"Controlled burns should be avoided in every grassland."},{"label":"C","text":"Restoring native prairie is a long-term process that rebuilds a diverse ecosystem through seeds, management, and patience."},{"label":"D","text":"Prairie restoration is a long-term process of rebuilding a diverse ecosystem."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":17,"prompt":"Why can native prairie plants look unimpressive during their first seasons?","choices":[{"label":"A","text":"Weeds always disappear without management."},{"label":"B","text":"Some invest heavily in developing deep root systems before producing much visible growth."},{"label":"C","text":"Native plants cannot grow leaves in the first year."},{"label":"D","text":"Some plants invest energy in deep roots before visible growth."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":18,"prompt":"In the passage, the word “dominate” most nearly means","choices":[{"label":"A","text":"move underground"},{"label":"B","text":"become the most noticeable or abundant"},{"label":"C","text":"grow at the same speed"},{"label":"D","text":"a sudden warning"}],"answer":"B","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":19,"prompt":"Why are many plant species included in a restoration seed mix?","choices":[{"label":"A","text":"A diverse seed mix helps recreate a community with many ecological roles."},{"label":"B","text":"Plant diversity matters only for appearance."},{"label":"C","text":"A healthy prairie depends on diversity and plants that function at different times."},{"label":"D","text":"Only one grass species is needed for a healthy prairie."}],"answer":"C","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":20,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"uncertain and hesitant"},{"label":"B","text":"patient and informative"},{"label":"C","text":"sarcastic and dismissive"},{"label":"D","text":"fearful and urgent"}],"answer":"B","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"How Stage Crews Change a Scene","text":"When an audience watches a play, a room may become a forest, a kitchen, or a train station in only a few minutes. The actors receive most of the attention, but these transformations depend on a stage crew working with careful timing.\n\nSome scenery is mounted on wheels so it can roll quietly into place. Other pieces descend from above on systems of ropes, cables, and counterweights. Lighting can change the apparent time of day without moving any scenery at all. A pale blue wash may suggest morning, while a narrow beam can make one object suddenly become the center of attention.\n\nThe crew follows a sequence of cues. A cue might be a line spoken by an actor, the end of a song, or a signal from the stage manager. Each person must know not only what to move, but exactly when to move it. A set change completed ten seconds too early can reveal a surprise; one completed too late can leave actors waiting in darkness.\n\nSafety is equally important. Large scenic pieces can be heavy, and cables under tension must be inspected regularly. Before performances, crews rehearse complicated changes repeatedly, sometimes without actors, until everyone can complete the sequence smoothly.\n\nThe best stage work can be almost invisible. When a transformation feels effortless, the audience may focus entirely on the story. That apparent effortlessness, however, is usually the result of detailed planning, communication, and practice behind the scenes.","questions":[{"num":21,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Lighting is more important than all other theater work."},{"label":"B","text":"Smooth stage transformations depend on coordinated technical work and practice."},{"label":"C","text":"Smooth stage transformations depend on coordinated technical work, careful timing, rehearsal, and safety."},{"label":"D","text":"Actors are responsible for moving every piece of scenery."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":22,"prompt":"What can serve as a cue for a stage change?","choices":[{"label":"A","text":"A spoken line, song ending, or stage-manager signal."},{"label":"B","text":"Only the opening of the curtain."},{"label":"C","text":"The audience clapping at random."},{"label":"D","text":"A spoken line, the end of a song, or a stage manager's signal can trigger a cue."}],"answer":"D","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":23,"prompt":"In the passage, the word “apparent” most nearly means","choices":[{"label":"A","text":"seeming or appearing to be true"},{"label":"B","text":"hidden from view"},{"label":"C","text":"physically impossible"},{"label":"D","text":"a sudden warning"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":24,"prompt":"Why might crews rehearse changes without actors?","choices":[{"label":"A","text":"The crew does not need to know the timing."},{"label":"B","text":"Actors are not allowed to see scenery."},{"label":"C","text":"They can practice the technical sequence safely and precisely."},{"label":"D","text":"They can practice the technical sequence safely and precisely on its own."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":25,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"confused and uncertain"},{"label":"B","text":"admiring and explanatory"},{"label":"C","text":"critical and suspicious"},{"label":"D","text":"uncertain and hesitant"}],"answer":"B","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]}]},"math":{"minutes":30,"questions":[{"num":1,"prompt":"What is the value of the digit 7 in 573,942?","choices":[{"label":"A","text":"7,000"},{"label":"B","text":"700,000"},{"label":"C","text":"70,000"},{"label":"D","text":"7"}],"answer":"C","explanation":"The digit 7 is in the ten-thousands place."},{"num":2,"prompt":"A hexagon has side lengths 9, 11, 13, 10, 8, 12 meters. What is its perimeter?","choices":[{"label":"A","text":"69"},{"label":"B","text":"57"},{"label":"C","text":"63"},{"label":"D","text":"78"}],"answer":"C","explanation":"Add all six side lengths."},{"num":3,"prompt":"A pictograph uses one house symbol to represent 8 houses. Brook Lane has 6 symbols and Pine Road has 4 symbols. How many more houses are on Brook Lane?","choices":[{"label":"A","text":"2"},{"label":"B","text":"10"},{"label":"C","text":"16"},{"label":"D","text":"48"}],"answer":"C","explanation":"The difference is 2 symbols, and each symbol represents 8 houses."},{"num":4,"prompt":"If ■ = 3 × (△ + 4), what is ■ when △ = 6?","choices":[{"label":"A","text":"30"},{"label":"B","text":"13"},{"label":"C","text":"18"},{"label":"D","text":"33"}],"answer":"A","explanation":"Substitute the value of △, add 4, then multiply by 3."},{"num":5,"prompt":"What is 5,500 − 709?","choices":[{"label":"A","text":"4,691"},{"label":"B","text":"6,209"},{"label":"C","text":"4,891"},{"label":"D","text":"4,791"}],"answer":"D","explanation":"Subtract carefully by place value."},{"num":6,"prompt":"In August, Maya read 9 books and Jacob read 5 books. How many more books did Maya read?","choices":[{"label":"A","text":"11"},{"label":"B","text":"9"},{"label":"C","text":"6"},{"label":"D","text":"4"}],"answer":"D","explanation":"Subtract Jacob's total from Maya's total."},{"num":7,"prompt":"A number machine squares every input. What is the output for an input of 12?","choices":[{"label":"A","text":"132"},{"label":"B","text":"144"},{"label":"C","text":"156"},{"label":"D","text":"24"}],"answer":"B","explanation":"Squaring means multiplying the number by itself."},{"num":8,"prompt":"A pitcher holds 2 quarts and a jug holds 3 quarts. Which combination holds exactly 24 quarts?","choices":[{"label":"A","text":"5 pitchers and 7 jugs"},{"label":"B","text":"4 pitchers and 7 jugs"},{"label":"C","text":"3 pitchers and 8 jugs"},{"label":"D","text":"3 pitchers and 6 jugs"}],"answer":"D","explanation":"3×2 + 6×3 = 24."},{"num":9,"prompt":"Which number is divisible by 7 with no remainder?","choices":[{"label":"A","text":"58"},{"label":"B","text":"56"},{"label":"C","text":"61"},{"label":"D","text":"55"}],"answer":"B","explanation":"56 ÷ 7 is a whole number."},{"num":10,"prompt":"In a town of 7,200 graduates, about 3/8 have earned an advanced degree. About how many graduates is that?","choices":[{"label":"A","text":"4,500"},{"label":"B","text":"5,400"},{"label":"C","text":"900"},{"label":"D","text":"2,700"}],"answer":"D","explanation":"Find one-eighth of the total, then multiply by 3."},{"num":11,"prompt":"$10,050 is divided evenly among 3 accounts. How much goes into each account?","choices":[{"label":"A","text":"$10,047"},{"label":"B","text":"$5,025"},{"label":"C","text":"$3,450"},{"label":"D","text":"$3,350"}],"answer":"D","explanation":"Divide the total amount by the number of accounts."},{"num":12,"prompt":"Point P is 4 units to the right of the origin and 11 units above the origin. What are its coordinates?","choices":[{"label":"A","text":"(4, 11)"},{"label":"B","text":"(11, 4)"},{"label":"C","text":"(-4, 11)"},{"label":"D","text":"(4, -11)"}],"answer":"A","explanation":"The x-coordinate gives horizontal position and the y-coordinate gives vertical position."},{"num":13,"prompt":"Point A is at 5 on a vertical number line. Point B is 8 units below A. Where is B?","choices":[{"label":"A","text":"4"},{"label":"B","text":"-3"},{"label":"C","text":"13"},{"label":"D","text":"-5"}],"answer":"B","explanation":"Moving down means subtracting."},{"num":14,"prompt":"Express 27/4 as a mixed number.","choices":[{"label":"A","text":"6 1/4"},{"label":"B","text":"5 3/4"},{"label":"C","text":"6 3/4"},{"label":"D","text":"7 3/4"}],"answer":"C","explanation":"Divide the numerator by the denominator; the quotient is the whole number and the remainder becomes the numerator."},{"num":15,"prompt":"Which fraction is equivalent to 0.6?","choices":[{"label":"A","text":"1/6"},{"label":"B","text":"3/5"},{"label":"C","text":"2/3"},{"label":"D","text":"6/100"}],"answer":"B","explanation":"Convert the decimal to a fraction and simplify."},{"num":16,"prompt":"What is 3.60 + 1.85?","choices":[{"label":"A","text":"5.35"},{"label":"B","text":"5.55"},{"label":"C","text":"5.45"},{"label":"D","text":"1.75"}],"answer":"C","explanation":"Line up the decimal points and add by place value."},{"num":17,"prompt":"What is the mode of the data set 74, 86, 93, 86, 90, 86, 97?","choices":[{"label":"A","text":"97"},{"label":"B","text":"90"},{"label":"C","text":"86"},{"label":"D","text":"74"}],"answer":"C","explanation":"The mode is the value that appears most often."},{"num":18,"prompt":"A right triangle has one acute angle measuring 57°. What is the measure of the other acute angle?","choices":[{"label":"A","text":"147°"},{"label":"B","text":"33°"},{"label":"C","text":"123°"},{"label":"D","text":"57°"}],"answer":"B","explanation":"The two acute angles in a right triangle add to 90°."},{"num":19,"prompt":"A collector has 7 packs of baseball cards with 16 cards each and 6 packs of basketball cards with 14 cards each. Which expression finds the total number of cards?","choices":[{"label":"A","text":"(7×16)-(6×14)"},{"label":"B","text":"(7×6)+(16×14)"},{"label":"C","text":"(7 × 16) + (6 × 14)"},{"label":"D","text":"(7+6)×(16+14)"}],"answer":"C","explanation":"Find the total for each kind of card, then add the two totals."},{"num":20,"prompt":"What is the value of (20 × 4) − 7?","choices":[{"label":"A","text":"73"},{"label":"B","text":"12"},{"label":"C","text":"80"},{"label":"D","text":"-60"}],"answer":"A","explanation":"Multiply first, then subtract 7."},{"num":21,"prompt":"A square has area 81 square centimeters. What is its perimeter?","choices":[{"label":"A","text":"36 centimeters"},{"label":"B","text":"9 centimeters"},{"label":"C","text":"81 centimeters"},{"label":"D","text":"18 centimeters"}],"answer":"A","explanation":"The side length is 9 cm because 9×9=81; perimeter is 4×9."},{"num":22,"prompt":"In the decimal 0.68427, the digit 4 represents","choices":[{"label":"A","text":"4/100"},{"label":"B","text":"4/1,000"},{"label":"C","text":"4/10,000"},{"label":"D","text":"4/100,000"}],"answer":"B","explanation":"The 4 is the third digit to the right of the decimal, so it is in the thousandths place."},{"num":23,"prompt":"A triangle has base 14 cm and height 9 cm. What is its area?","choices":[{"label":"A","text":"23 cm²"},{"label":"B","text":"63 cm²"},{"label":"C","text":"46 cm²"},{"label":"D","text":"126 cm²"}],"answer":"B","explanation":"Use one-half × base × height."},{"num":24,"prompt":"A tank contains 130 liters at 0 minutes and loses 8 liters every 5 minutes. How much remains after 30 minutes?","choices":[{"label":"A","text":"98"},{"label":"B","text":"74"},{"label":"C","text":"90"},{"label":"D","text":"82"}],"answer":"D","explanation":"Thirty minutes contains six 5-minute intervals, so subtract the loss six times."},{"num":25,"prompt":"A driver passes 56 intersections and stops at about 1 out of every 4. About how many stops is that?","choices":[{"label":"A","text":"42"},{"label":"B","text":"4"},{"label":"C","text":"28"},{"label":"D","text":"14"}],"answer":"D","explanation":"One out of every four means one-fourth of the total."},{"num":26,"prompt":"Cards numbered 1 through 20 are equally likely to be selected. What is the probability of selecting a prime number?","choices":[{"label":"A","text":"10 out of 20"},{"label":"B","text":"8 out of 20"},{"label":"C","text":"12 out of 20"},{"label":"D","text":"6 out of 20"}],"answer":"B","explanation":"There are eight prime numbers from 1 through 20."},{"num":27,"prompt":"When it is 9:00 a.m. in City A, it is 1:00 p.m. in City B. When it is 7:00 p.m. in City B, what time is it in City A?","choices":[{"label":"A","text":"3:00 p.m."},{"label":"B","text":"11:00 p.m."},{"label":"C","text":"5:00 p.m."},{"label":"D","text":"11:00 a.m."}],"answer":"A","explanation":"City B is four hours ahead of City A, so subtract four hours."},{"num":28,"prompt":"Which quadrilateral must have all four sides equal?","choices":[{"label":"A","text":"parallelogram"},{"label":"B","text":"rhombus"},{"label":"C","text":"trapezoid"},{"label":"D","text":"rectangle"}],"answer":"B","explanation":"A rhombus is defined by having four equal side lengths."},{"num":29,"prompt":"How many whole numbers strictly between 56 and 98 are divisible by 6?","choices":[{"label":"A","text":"9"},{"label":"B","text":"7"},{"label":"C","text":"8"},{"label":"D","text":"6"}],"answer":"B","explanation":"List or count the multiples of 6 greater than 56 and less than 98."},{"num":30,"prompt":"A scientist records each plant's height, mass, number of leaves, and flower color. Which question is NOT statistical for this data set?","choices":[{"label":"A","text":"What was the typical plant height?"},{"label":"B","text":"What color was Plant 7's flower?"},{"label":"C","text":"How did mass vary among the plants?"},{"label":"D","text":"What fraction of the plants had red flowers?"}],"answer":"B","explanation":"A statistical question expects variability across multiple observations; asking for one specific plant's color does not."}]},"essay":{"prompt":"Imagine y
