notebooks cost $4.75 each. What is the total cost?","choices":[{"label":"A","text":"$8.75"},{"label":"B","text":"$12.25"},{"label":"C","text":"$14.25"},{"label":"D","text":"$15.75"}],"answer":"C","explanation":"3 × 4.75 = 14.25."},{"num":23,"prompt":"A theater has 18 rows with 24 seats each. Seven seats are broken, and the curtains are red. How many usable seats are there?","choices":[{"label":"A","text":"35"},{"label":"B","text":"432"},{"label":"C","text":"439"},{"label":"D","text":"425"}],"answer":"D","explanation":"Curtain color is irrelevant. 18 × 24 = 432; 432 - 7 = 425."},{"num":24,"prompt":"Which equation matches: Priya had p cards, bought 18 more, then gave away 9 and had 42 left?","choices":[{"label":"A","text":"p + 18 - 9 = 42"},{"label":"B","text":"p - 18 + 9 = 42"},{"label":"C","text":"p + 18 + 9 = 42"},{"label":"D","text":"p - 18 - 9 = 42"}],"answer":"A","explanation":"Buying adds and giving away subtracts."},{"num":25,"prompt":"If 12 × 5 = 60, which equation is NOT in the same fact family?","choices":[{"label":"A","text":"60 ÷ 12 = 5"},{"label":"B","text":"60 ÷ 5 = 10"},{"label":"C","text":"5 × 12 = 60"},{"label":"D","text":"60 ÷ 5 = 12"}],"answer":"B","explanation":"The quotient should be 12, not 10."},{"num":26,"prompt":"In a Venn diagram, region S lies in “Art” but outside “Music.” What does S represent?","choices":[{"label":"A","text":"Students in music but not art"},{"label":"B","text":"Students in both groups"},{"label":"C","text":"Students in art but not music"},{"label":"D","text":"Students in neither group"}],"answer":"C","explanation":"The region is inside only the Art circle.","visual":"<div class=\"venn\"><div>Art</div><div>Music</div><b style=\"left:30%\">S</b></div>"},{"num":27,"prompt":"Which point lies on the y-axis?","choices":[{"label":"A","text":"(6, 0)"},{"label":"B","text":"(2, 6)"},{"label":"C","text":"(-3, 4)"},{"label":"D","text":"(0, 6)"}],"answer":"D","explanation":"Points on the y-axis have x-coordinate 0."},{"num":28,"prompt":"Which transformation always preserves size and shape?","choices":[{"label":"A","text":"A reflection"},{"label":"B","text":"A stretch"},{"label":"C","text":"An enlargement"},{"label":"D","text":"A compression"}],"answer":"A","explanation":"A reflection is a rigid motion."},{"num":29,"prompt":"Which net could fold into a cube?","choices":[{"label":"A","text":"Four connected triangles"},{"label":"B","text":"Six squares arranged as four in a row with one above and one below a middle square"},{"label":"C","text":"One rectangle and two circles"},{"label":"D","text":"Three squares in a row only"}],"answer":"B","explanation":"A cube net must contain six squares in a foldable arrangement.","visual":"<div class=\"net-grid\"><span></span><span></span><span></span><span></span><i></i><i></i><span></span><i></i><i></i><i></i><span></span></div><div class=\"lower-visual-caption\">Six equal squares joined edge to edge</div>"},{"num":30,"prompt":"The pattern follows ×2, -3, ×2, -3. What comes after 5, 10, 7, 14, 11?","choices":[{"label":"A","text":"8"},{"label":"B","text":"18"},{"label":"C","text":"22"},{"label":"D","text":"25"}],"answer":"C","explanation":"After subtracting 3 to reach 11, multiply by 2."},{"num":31,"prompt":"A scale drawing uses 1 centimeter for 4 meters. A wall is 7.5 centimeters long in the drawing. What is the actual length?","choices":[{"label":"A","text":"11.5 meters"},{"label":"B","text":"26 meters"},{"label":"C","text":"32 meters"},{"label":"D","text":"30 meters"}],"answer":"D","explanation":"7.5 × 4 = 30."},{"num":32,"prompt":"A ferry leaves every 35 minutes. It leaves at 1:10, 1:45, and 2:20. When is the next departure?","choices":[{"label":"A","text":"2:55"},{"label":"B","text":"2:45"},{"label":"C","text":"3:05"},{"label":"D","text":"3:20"}],"answer":"A","explanation":"Add 35 minutes to 2:20."},{"num":33,"prompt":"A plant was 12 cm, then 16 cm, then 21 cm, then 27 cm tall. If the increases continue as +4, +5, +6, what is next?","choices":[{"label":"A","text":"32 cm"},{"label":"B","text":"34 cm"},{"label":"C","text":"33 cm"},{"label":"D","text":"35 cm"}],"answer":"B","explanation":"The next increase is +7."},{"num":34,"prompt":"Four students each shake hands with every other student once. How many handshakes occur?","choices":[{"label":"A","text":"4"},{"label":"B","text":"8"},{"label":"C","text":"6"},{"label":"D","text":"12"}],"answer":"C","explanation":"The pairs are AB, AC, AD, BC, BD, CD."},{"num":35,"prompt":"A store packs 95 oranges into bags of 8. How many bags are needed to hold all oranges?","choices":[{"label":"A","text":"11"},{"label":"B","text":"13"},{"label":"C","text":"87"},{"label":"D","text":"12"}],"answer":"D","explanation":"Eleven bags hold 88; a twelfth bag is needed for the rest."},{"num":36,"prompt":"Which value is smallest?","choices":[{"label":"A","text":"7/12"},{"label":"B","text":"3/5"},{"label":"C","text":"5/8"},{"label":"D","text":"2/3"}],"answer":"A","explanation":"7/12≈0.583, smaller than 0.6, 0.625, and 0.667."},{"num":37,"prompt":"A price rises from $50 to $60. What is the percent increase?","choices":[{"label":"A","text":"10%"},{"label":"B","text":"20%"},{"label":"C","text":"16%"},{"label":"D","text":"25%"}],"answer":"B","explanation":"The increase is 10; 10/50 = 20%."},{"num":38,"prompt":"A camp has 7 cabins with 6 beds each. Five beds are empty. Which expression gives the number of campers?","choices":[{"label":"A","text":"7 + 6 - 5"},{"label":"B","text":"7 × (6 - 5)"},{"label":"C","text":"7 × 6 - 5"},{"label":"D","text":"7 × 6 + 5"}],"answer":"C","explanation":"Find total beds, then subtract empty beds."}],"minutes":35},"reading":{"passages":[{"title":"Forests Beneath the Waves","text":"Along cool coastlines, giant brown algae called kelp can grow into underwater forests. Kelp is not a plant, but it uses sunlight in a similar way to make food. Some kinds can grow more than a foot in a single day when water, light, and nutrients are favorable.\n\nA kelp forest has layers, much like a forest on land. Rootlike structures called holdfasts anchor kelp to rocks, but they do not absorb water from soil. Long flexible stems rise toward the surface. At the top, leaflike blades spread into a floating canopy. Small gas-filled bulbs help lift the blades toward sunlight.\n\nMany animals depend on this habitat. Tiny snails and crabs crawl among the holdfasts. Fish hide between the stems. Sea otters rest in the canopy and sometimes wrap themselves in kelp so currents do not carry them away while they sleep. Kelp forests also soften waves and absorb carbon dioxide from the water.\n\nThe forest is held together by relationships among species. Sea urchins eat kelp. When too many urchins gather, they can chew through an entire forest and leave a nearly bare area called an urchin barren. Sea otters eat urchins, so healthy otter populations can prevent the grazers from becoming too numerous. In places without enough otters, large fish and sea stars may also help control urchins.\n\nKelp forests can recover after storms, but repeated heat waves or changes in animal populations may make recovery difficult. Scientists survey kelp from boats, underwater, and even from satellites. They also test ways to restore damaged forests by removing extra urchins or growing young kelp in nurseries. Protecting a kelp forest means understanding not just one species, but the web of relationships that allows the whole habitat to thrive. The floating canopy also slows waves near shore and creates calmer spaces where young fish can hide. For that reason, researchers examine both the kelp itself and the many animals that depend on different layers of the forest.","questions":[{"num":1,"prompt":"What is the main idea?","choices":[{"label":"A","text":"Kelp is a tree that grows in deep tropical water."},{"label":"B","text":"Kelp forests are productive habitats supported by physical features and relationships among species."},{"label":"C","text":"Sea urchins are the only animals in kelp forests."},{"label":"D","text":"Scientists have stopped studying coastal habitats."}],"answer":"B","explanation":"The passage explains kelp structure, ecological relationships, threats, and restoration.","strand":"Main Idea"},{"num":2,"prompt":"What is the function of a holdfast?","choices":[{"label":"A","text":"It carries soil into the water."},{"label":"B","text":"It produces gas for sea otters."},{"label":"C","text":"It anchors kelp to rock."},{"label":"D","text":"It measures the temperature."}],"answer":"C","explanation":"The second paragraph defines holdfasts as anchors.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, “barren” most nearly means—","choices":[{"label":"A","text":"filled with young kelp"},{"label":"B","text":"protected from waves"},{"label":"C","text":"too deep for sunlight"},{"label":"D","text":"nearly empty of living growth"}],"answer":"D","explanation":"An urchin barren is described as nearly bare.","strand":"Vocabulary"},{"num":4,"prompt":"Why can sea otters help a kelp forest remain healthy?","choices":[{"label":"A","text":"They eat sea urchins that might otherwise destroy too much kelp."},{"label":"B","text":"They plant kelp seeds in the rock."},{"label":"C","text":"They bring warmer water into the forest."},{"label":"D","text":"They prevent all storms from reaching the coast."}],"answer":"A","explanation":"Otter predation can keep urchin numbers under control.","strand":"Inference"},{"num":5,"prompt":"What does the final sentence emphasize?","choices":[{"label":"A","text":"Only kelp itself matters in a forest."},{"label":"B","text":"Restoration requires attention to connections throughout the habitat."},{"label":"C","text":"Satellite surveys can replace all underwater work."},{"label":"D","text":"Urchins should be removed from every coastline."}],"answer":"B","explanation":"The “web of relationships” is the key idea.","strand":"Organization/Logic"}]},{"title":"A Room for Every Reader","text":"For much of history, books were costly and difficult to copy. Private collections belonged mainly to rulers, religious institutions, universities, or wealthy families. A person who wanted to read a particular book might have no way to reach it.\n\nSubscription libraries offered one solution. Members paid a fee that allowed them to borrow from a shared collection. These libraries increased access, but the fee still excluded many people. During the nineteenth century, reformers in several countries began supporting public libraries funded by communities and open to all residents.\n\nEarly public libraries were not all alike. Some allowed visitors to browse shelves, while others required readers to request a title from a librarian. Many created separate rooms for newspapers, reference books, or children. Librarians developed catalog systems so a book could be located even as collections grew.\n\nSupporters argued that libraries helped workers continue learning after their school years. Critics worried that communities would spend money on books few people used, or that popular stories would distract readers from serious study. Libraries responded by tracking circulation, offering lectures, and choosing collections that mixed practical information, literature, history, and entertainment.\n\nOver time, public libraries expanded their role. They delivered books to rural areas, taught reading classes, and created children’s programs. Today, many lend digital materials and provide internet access, meeting rooms, or tools. Yet the central idea remains similar to the one promoted by early reformers: useful information should not belong only to people who can afford a private collection. A public library turns a community’s resources into a room—physical or digital—where every reader is invited. Some early libraries carried boxes of books to distant neighborhoods or used traveling book wagons. These services showed that access depended not only on owning books, but also on finding practical ways to bring them to readers.","questions":[{"num":1,"prompt":"Which statement best expresses the central idea?","choices":[{"label":"A","text":"Private libraries were always open to everyone."},{"label":"B","text":"Popular stories caused most libraries to close."},{"label":"C","text":"Public libraries developed to make shared information available to a wider community."},{"label":"D","text":"Catalog systems made books more expensive."}],"answer":"C","explanation":"The passage traces expanding public access to books and information.","strand":"Main Idea"},{"num":2,"prompt":"How did subscription libraries differ from later public libraries?","choices":[{"label":"A","text":"They contained only newspapers."},{"label":"B","text":"They never allowed borrowing."},{"label":"C","text":"They were funded by all residents."},{"label":"D","text":"They required members to pay a fee."}],"answer":"D","explanation":"The second paragraph states that subscription members paid.","strand":"Supporting Ideas"},{"num":3,"prompt":"The word “circulation” most nearly refers to—","choices":[{"label":"A","text":"the borrowing and return of materials"},{"label":"B","text":"the movement of air in a room"},{"label":"C","text":"the printing of new books"},{"label":"D","text":"the order of a lecture program"}],"answer":"A","explanation":"Libraries tracked how their materials were used and borrowed.","strand":"Vocabulary"},{"num":4,"prompt":"Why does the author mention critics’ concerns?","choices":[{"label":"A","text":"To prove communities refused to buy books"},{"label":"B","text":"To show that early public libraries had to explain and demonstrate their value"},{"label":"C","text":"To argue that fiction should be removed"},{"label":"D","text":"To describe how catalogs were invented"}],"answer":"B","explanation":"The concerns are followed by library responses.","strand":"Organization/Logic"},{"num":5,"prompt":"What can be inferred about the author’s view of modern library services?","choices":[{"label":"A","text":"Digital materials have replaced reading."},{"label":"B","text":"Meeting rooms are unrelated to library purposes."},{"label":"C","text":"New services continue the original goal of widening access to useful resources."},{"label":"D","text":"Only wealthy communities need internet access."}],"answer":"C","explanation":"The final paragraph connects modern services with the same central principle.","strand":"Inference"}]},{"title":"Mapping the Sound of a Neighborhood","text":"When students at Harbor School began studying sound, they first measured obvious noises: a ringing bell, a passing bus, and music from a speaker. Then their teacher asked a harder question. Which parts of the neighborhood were quiet, and which were noisy throughout the day?\n\nThe class divided a map into small sections. Teams visited each location at the same three times—morning, midday, and late afternoon. A sound meter recorded volume in decibels. Students also wrote down the source of each sound, such as traffic, construction, birds, conversation, or wind.\n\nThe first map was confusing. One team had stood beside a wall that reflected sound, while another had measured from inside a doorway. The class created a clearer procedure: hold the meter at the same height, stand away from large surfaces, and record for exactly one minute. They repeated the survey.\n\nPatterns appeared. Streets near the highway stayed loud all day. The playground was noisy at midday but quiet after school. A small park was usually calm, except when landscaping equipment operated on Thursday morning. Students learned that a single measurement could be misleading.\n\nThe class shared the map with a neighborhood planning group. The students did not claim that every loud place was harmful. A busy market, for example, was noisy because people gathered there. Instead, they suggested planting shrubs near one apartment building and changing the time when delivery trucks used a narrow street. Their project showed how careful data collection can turn an everyday experience into useful evidence for community decisions. The students also recorded wind and weather because rain or strong gusts could change a reading. By repeating measurements on several days, they could separate a lasting sound pattern from a brief event that happened only once. They then marked uncertain results for another visit before sharing the map.","questions":[{"num":1,"prompt":"What was the main goal of the class project?","choices":[{"label":"A","text":"To prove that all neighborhood noise was harmful"},{"label":"B","text":"To compare three brands of sound meters"},{"label":"C","text":"To eliminate sound from the school playground"},{"label":"D","text":"To identify sound patterns across locations and times in the neighborhood"}],"answer":"D","explanation":"The students mapped how sound changed by place and time.","strand":"Main Idea"},{"num":2,"prompt":"Why did the class repeat its first survey?","choices":[{"label":"A","text":"Different measuring methods made the original results difficult to compare."},{"label":"B","text":"The first map had been lost."},{"label":"C","text":"The neighborhood group demanded louder results."},{"label":"D","text":"Students forgot to record any sound sources."}],"answer":"A","explanation":"They standardized height, location, and time after noticing inconsistency.","strand":"Supporting Ideas"},{"num":3,"prompt":"The word “misleading” most nearly means—","choices":[{"label":"A","text":"extremely precise"},{"label":"B","text":"likely to create a wrong impression"},{"label":"C","text":"easy to repeat"},{"label":"D","text":"too quiet to measure"}],"answer":"B","explanation":"One measurement could give an inaccurate impression of typical conditions.","strand":"Vocabulary"},{"num":4,"prompt":"What can be inferred about the Thursday park measurement?","choices":[{"label":"A","text":"The park was always the loudest location."},{"label":"B","text":"Landscaping occurred every afternoon."},{"label":"C","text":"It represented a temporary event rather than the park’s usual sound level."},{"label":"D","text":"The meter could not record machinery."}],"answer":"C","explanation":"The passage says the park was usually calm except during landscaping.","strand":"Inference"},{"num":5,"prompt":"Why does the author mention the noisy market?","choices":[{"label":"A","text":"To prove markets should be moved beside highways"},{"label":"B","text":"To explain why the survey ignored people"},{"label":"C","text":"To show that noise meters cannot measure voices"},{"label":"D","text":"To show that data should be interpreted in context rather than treated as automatically good or bad"}],"answer":"D","explanation":"The class avoids assuming every loud place is harmful.","strand":"Tone/Style/Figurative Language"}]},{"title":"Pictures Built from Pieces","text":"A mosaic is an image made from many small pieces fitted together. The pieces, called tesserae, may be stone, glass, shell, ceramic, or other materials. From nearby, a mosaic can look like a collection of separate shapes. From farther away, colors and lines combine into figures, patterns, or entire scenes.\n\nMosaic artists plan carefully before attaching any pieces. They may draw the design at full size and divide it into sections. Large areas of background can be filled with fairly regular pieces, while faces, hands, and curved objects require smaller or specially shaped tesserae. The direction of the pieces can suggest movement. Rows that bend around a fish, for example, can make the water appear to flow.\n\nAncient mosaics have survived on floors and walls in many regions. Roman artists created scenes of animals, food, theater, and daily life. Byzantine artists often used colored glass and gold-backed pieces on walls and ceilings. Because the pieces reflected light from slightly different angles, figures seemed to shimmer as a viewer moved.\n\nMaking a durable mosaic requires more than arranging color. The surface beneath it must be stable. Mortar holds the pieces, and grout fills the narrow spaces between them. Outdoor mosaics must also withstand rain, heat, and freezing temperatures.\n\nContemporary artists use mosaics in parks, transit stations, schools, and community murals. Some projects invite hundreds of people to create individual tiles that become part of one image. This method suits the art especially well. A mosaic depends on differences: each piece keeps its own shape and color, yet also contributes to a larger design that no single piece could create alone. Artists often test several color arrangements before setting the pieces in mortar. A shade that looks too bright by itself may blend perfectly when surrounded by neighboring pieces and viewed from across a large room.","questions":[{"num":1,"prompt":"What is the passage mainly about?","choices":[{"label":"A","text":"How mosaic artists combine materials, planning, and technique to create images"},{"label":"B","text":"Why mosaics can be made only from glass"},{"label":"C","text":"How to remove old floors from buildings"},{"label":"D","text":"Why paintings last longer than mosaics"}],"answer":"A","explanation":"The passage explains design, materials, history, construction, and modern uses.","strand":"Main Idea"},{"num":2,"prompt":"How can the direction of tesserae affect an image?","choices":[{"label":"A","text":"It determines whether mortar will dry."},{"label":"B","text":"It can create an impression of motion or flow."},{"label":"C","text":"It makes every piece the same size."},{"label":"D","text":"It prevents viewers from seeing color."}],"answer":"B","explanation":"The fish example shows rows suggesting flowing water.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, “durable” most nearly means—","choices":[{"label":"A","text":"easy to carry"},{"label":"B","text":"quick to finish"},{"label":"C","text":"able to last despite wear or weather"},{"label":"D","text":"soft enough to bend"}],"answer":"C","explanation":"A durable mosaic withstands outdoor conditions.","strand":"Vocabulary"},{"num":4,"prompt":"Why did Byzantine mosaics seem to shimmer?","choices":[{"label":"A","text":"They were placed under moving water."},{"label":"B","text":"Artists repainted them every day."},{"label":"C","text":"The grout changed color when viewers moved."},{"label":"D","text":"Glass and gold-backed pieces reflected light at different angles."}],"answer":"D","explanation":"The third paragraph describes the changing reflections.","strand":"Supporting Ideas"},{"num":5,"prompt":"What does the final comparison between each piece and the larger image suggest?","choices":[{"label":"A","text":"Individual differences can contribute to a stronger shared creation."},{"label":"B","text":"Every piece should be identical."},{"label":"C","text":"A mosaic can be understood only from close range."},{"label":"D","text":"Community projects require one artist to do all the work."}],"answer":"A","explanation":"The ending uses the mosaic as a figurative idea about contribution.","strand":"Tone/Style/Figurative Language"}]},{"title":"The Long Way Around","text":"When the robotics club’s cart stopped in front of the auditorium, Jamal immediately blamed the left wheel. The cart had turned in circles during its final test, and the left wheel squeaked each time it moved.\n\n“We only have twenty minutes before the demonstration,” said Priya. “Let’s replace it.”\n\nJamal reached for the toolbox, but Elena knelt beside the cart. “A squeak tells us something is rubbing,” she said. “It doesn’t prove the wheel is causing the turning.” She placed two strips of tape on the floor and asked Jamal to push the cart forward without using its motor. It rolled nearly straight.\n\nNext, they lifted the cart so the wheels could spin freely. Priya switched on the motor. The left wheel turned quickly; the right one moved in short jerks. Jamal checked the wires and found them firmly connected. Elena noticed that a loop of ribbon from a decoration had slipped around the right axle.\n\nThey cut away the ribbon. Both wheels spun smoothly, but the cart still drifted slightly. The club adjusted the speed setting for the right motor, then tested the cart along the taped lines. This time it traveled straight to the auditorium doors.\n\nAfter the demonstration, Jamal admitted that replacing the squeaky wheel would have used most of their remaining time without solving the real problem. Elena pointed out that the squeak had not been useless; it had simply drawn their attention to the wrong side. “The quickest solution,” she said, “is not always the first idea. Sometimes the quickest route is the one that checks the evidence.”\n\nJamal laughed. “So the long way around was actually shorter.” The club wrote the cause and the successful fix in its project notebook. At the next meeting, members used the record to create a checklist for testing movement, wiring, decorations, and motor speed before future demonstrations.","questions":[{"num":1,"prompt":"What is the central conflict in the story?","choices":[{"label":"A","text":"The club has forgotten where the auditorium is."},{"label":"B","text":"The club must determine why the cart turns in circles before the demonstration."},{"label":"C","text":"Jamal refuses to attend the demonstration."},{"label":"D","text":"Elena wants to remove all decorations."}],"answer":"B","explanation":"The time-limited troubleshooting drives the story.","strand":"Main Idea"},{"num":2,"prompt":"What evidence showed that the left wheel was probably not the main cause?","choices":[{"label":"A","text":"The left wheel made a squeak."},{"label":"B","text":"Priya wanted to replace it."},{"label":"C","text":"The cart rolled nearly straight when pushed without the motor."},{"label":"D","text":"The auditorium doors were open."}],"answer":"C","explanation":"The manual test separated the wheels from the motor problem.","strand":"Supporting Ideas"},{"num":3,"prompt":"The word “drifted” most nearly means—","choices":[{"label":"A","text":"stopped without warning"},{"label":"B","text":"made a loud sound"},{"label":"C","text":"rolled backward rapidly"},{"label":"D","text":"moved gradually away from a straight course"}],"answer":"D","explanation":"After the ribbon was removed, the cart still moved slightly off course.","strand":"Vocabulary"},{"num":4,"prompt":"Why was the squeak “not useless”?","choices":[{"label":"A","text":"It encouraged investigation, even though it pointed attention toward the wrong wheel."},{"label":"B","text":"It caused the ribbon to wrap around the axle."},{"label":"C","text":"It proved the left wheel needed replacement."},{"label":"D","text":"It made the demonstration more entertaining."}],"answer":"A","explanation":"The clue mattered but was interpreted too quickly.","strand":"Inference"},{"num":5,"prompt":"What does Jamal mean when he says “the long way around was actually shorter”?","choices":[{"label":"A","text":"The cart traveled around the entire school."},{"label":"B","text":"Careful testing saved time by avoiding an unnecessary repair."},{"label":"C","text":"The demonstration route was shortened."},{"label":"D","text":"The students replaced both wheels at once."}],"answer":"B","explanation":"A systematic approach reached the solution faster overall.","strand":"Inference"}]}],"minutes":25},"math":{"questions":[{"num":1,"prompt":"Which number is written as 600,000 + 20,000 + 400 + 9?","choices":[{"label":"A","text":"602,409"},{"label":"B","text":"620,409"},{"label":"C","text":"620,049"},{"label":"D","text":"620,490"}],"answer":"B","explanation":"Combine each place value."},{"num":2,"prompt":"What is 47,826 + 9,975?","choices":[{"label":"A","text":"56,701"},{"label":"B","text":"57,701"},{"label":"C","text":"57,801"},{"label":"D","text":"58,801"}],"answer":"C","explanation":"Add by place value."},{"num":3,"prompt":"What is 30,000 - 18,746?","choices":[{"label":"A","text":"11,154"},{"label":"B","text":"12,254"},{"label":"C","text":"1 dult tickets cost $13 and child tickets cost $8. Which expression gives the cost for 3 adults and 4 children?","choices":[{"label":"A","text":"(13 × 4) + (8 × 3)"},{"label":"B","text":"(13 × 3) + (8 × 4)"},{"label":"C","text":"(13 + 8) × (3 + 4)"},{"label":"D","text":"(13 × 3) - (8 × 4)"}],"answer":"B","explanation":"Multiply each ticket price by the number of tickets of that type, then add."},{"num":14,"prompt":"Of 84 counters, 35 are red and the rest are blue. What fraction of the counters are blue?","choices":[{"label":"A","text":"49/84"},{"label":"B","text":"49/35"},{"label":"C","text":"84/49"},{"label":"D","text":"35/84"}],"answer":"A","explanation":"Subtract red counters from the total to find the number of blue counters, then place that over the total."},{"num":15,"prompt":"Which improper fraction equals 4 2/3?","choices":[{"label":"A","text":"12/3"},{"label":"B","text":"14/3"},{"label":"C","text":"14/4"},{"label":"D","text":"6/3"}],"answer":"B","explanation":"Multiply the whole number by the denominator and add the numerator."},{"num":16,"prompt":"Different shapes represent digits. If ○ + □ + □ = 15 and □ = 4, what digit does ○ represent?","choices":[{"label":"A","text":"7"},{"label":"B","text":"11"},{"label":"C","text":"4"},{"label":"D","text":"8"}],"answer":"A","explanation":"Subtract the value of the two squares from the total."},{"num":17,"prompt":"Which statement must be true about a net that folds into a cube?","choices":[{"label":"A","text":"It has one circular face."},{"label":"B","text":"It has exactly five faces."},{"label":"C","text":"It has six square faces."},{"label":"D","text":"It has four triangular faces."}],"answer":"C","explanation":"A cube has six square faces, so any valid cube net contains six squares."},{"num":18,"prompt":"A rectangle has length 17 meters and perimeter 52 meters. What is its width?","choices":[{"label":"A","text":"9"},{"label":"B","text":"26"},{"label":"C","text":"17"},{"label":"D","text":"11"}],"answer":"A","explanation":"For a rectangle, half the perimeter equals length plus width."},{"num":19,"prompt":"A circle graph is divided into 8 equal sectors. Three sectors represent students who chose art. What fraction chose art?","choices":[{"label":"A","text":"3/8"},{"label":"B","text":"3/5"},{"label":"C","text":"5/8"},{"label":"D","text":"1/3"}],"answer":"A","explanation":"Three of the eight equal sectors represent art."},{"num":20,"prompt":"A team has 12 women and 6 men. 24 balls are shared equally among the women and 24 balls equally among the men. Which statement is true?","choices":[{"label":"A","text":"Each man receives twice as many as each woman."},{"label":"B","text":"Each man receives one fewer than each woman."},{"label":"C","text":"Each woman receives twice as many as each man."},{"label":"D","text":"Each person receives the same number."}],"answer":"A","explanation":"Each woman gets 2; each man gets 4."},{"num":21,"prompt":"A factory uses 150 buttons for 25 identical shirts. At the same rate, how many buttons are needed for 40 shirts?","choices":[{"label":"A","text":"150"},{"label":"B","text":"200"},{"label":"C","text":"240"},{"label":"D","text":"280"}],"answer":"C","explanation":"Find the constant number of buttons per shirt, then multiply by the new number of shirts."},{"num":22,"prompt":"A triangle has base 8 units and height 5 units. What is its area?","choices":[{"label":"A","text":"10"},{"label":"B","text":"40"},{"label":"C","text":"13"},{"label":"D","text":"20"}],"answer":"D","explanation":"Triangle area is one-half × base × height."},{"num":23,"prompt":"A rectangular sheet is 96 mm long and 60 mm wide. One cut makes a square with side 60 mm. How much length is removed?","choices":[{"label":"A","text":"36"},{"label":"B","text":"156"},{"label":"C","text":"96"},{"label":"D","text":"60"}],"answer":"A","explanation":"Subtract the square's side length from the original length."},{"num":24,"prompt":"A table shows 3 boxes contain 420 pins and 6 boxes contain 840 pins. Which rule describes the relationship?","choices":[{"label":"A","text":"pins = boxes × 70"},{"label":"B","text":"pins = boxes + 280"},{"label":"C","text":"pins = boxes × 140"},{"label":"D","text":"pins = boxes + 140"}],"answer":"C","explanation":"The number of pins per box is constant."},{"num":25,"prompt":"A dot pattern has 1 dot in Figure 1, 4 in Figure 2, 9 in Figure 3, and 16 in Figure 4. How many dots are in Figure 6?","choices":[{"label":"A","text":"36"},{"label":"B","text":"30"},{"label":"C","text":"25"},{"label":"D","text":"42"}],"answer":"A","explanation":"The figures follow square numbers: 1², 2², 3², and so on."},{"num":26,"prompt":"A rectangular prism has six faces. Which collection could be all of its faces?","choices":[{"label":"A","text":"six circles"},{"label":"B","text":"three matching pairs of rectangles"},{"label":"C","text":"four triangles and two circles"},{"label":"D","text":"one square and four triangles"}],"answer":"B","explanation":"Opposite faces of a rectangular prism form three matching pairs of rectangles."},{"num":27,"prompt":"Which best describes the set {1 1/2, 2 3/4, 4 1/5, 6 2/3}?","choices":[{"label":"A","text":"whole numbers"},{"label":"B","text":"proper fractions"},{"label":"C","text":"prime numbers"},{"label":"D","text":"mixed numbers"}],"answer":"D","explanation":"Each number contains a whole-number part and a fractional part."},{"num":28,"prompt":"An airplane has 60 seats. 24 are aisle seats and the rest are window seats. What is the probability of being assigned a window seat?","choices":[{"label":"A","text":"1/2"},{"label":"B","text":"2/5"},{"label":"C","text":"18/35"},{"label":"D","text":"3/5"}],"answer":"D","explanation":"Find the number of window seats, then divide by the total number of seats."},{"num":29,"prompt":"A design is reflected across a vertical line of symmetry. A star is 3 cm to the left of the line. Where must its matching star be?","choices":[{"label":"A","text":"6 cm to the right of the line"},{"label":"B","text":"on the line"},{"label":"C","text":"3 cm to the right of the line"},{"label":"D","text":"3 cm above the line"}],"answer":"C","explanation":"Reflected points are the same perpendicular distance from the line of symmetry."},{"num":30,"prompt":"Segment AC is 20 cm long. Point B lies between A and C, and AB is 7 cm. What is BC?","choices":[{"label":"A","text":"13"},{"label":"B","text":"7"},{"label":"C","text":"20"},{"label":"D","text":"27"}],"answer":"A","explanation":"Subtract AB from the whole segment AC."},{"num":31,"prompt":"36 candles are divided equally among 4 bags, while 48 candles are divided equally among 8 cases. Which statement is true?","choices":[{"label":"A","text":"Each bag and case has the same number."},{"label":"B","text":"Each case has more candles than each bag."},{"label":"C","text":"Each case has twice as many as each bag."},{"label":"D","text":"Each bag has more candles than each case."}],"answer":"D","explanation":"Each bag gets 9 candles and each case gets 6."},{"num":32,"prompt":"Three numbers in this set are multiples of 7: 21, 35, 56, 64. Which number does NOT belong?","choices":[{"label":"A","text":"64"},{"label":"B","text":"21"},{"label":"C","text":"56"},{"label":"D","text":"35"}],"answer":"A","explanation":"The first three values divide evenly by 7; 64 does not."},{"num":33,"prompt":"A rectangle has side lengths 8 cm and 5 cm. A new rectangle keeps the 8-cm side but doubles the other side. By how many centimeters does that side increase?","choices":[{"label":"A","text":"8"},{"label":"B","text":"5"},{"label":"C","text":"10"},{"label":"D","text":"13"}],"answer":"B","explanation":"Doubling a length increases it by one original length."},{"num":34,"prompt":"A balanced scale represents 2○ + □ = 14. If ○ = 4, what is □?","choices":[{"label":"A","text":"7"},{"label":"B","text":"4"},{"label":"C","text":"6"},{"label":"D","text":"10"}],"answer":"C","explanation":"Subtract the value of two circles from the total."},{"num":35,"prompt":"A grid has 30 equal squares and 18 are shaded. What percentage is shaded?","choices":[{"label":"A","text":"40%"},{"label":"B","text":"70%"},{"label":"C","text":"60%"},{"label":"D","text":"50%"}],"answer":"C","explanation":"Divide the shaded squares by the total and convert to a percent."},{"num":36,"prompt":"The relationship is L = 3B. If B increases by 2, by how much does L increase?","choices":[{"label":"A","text":"8"},{"label":"B","text":"2"},{"label":"C","text":"6"},{"label":"D","text":"3"}],"answer":"C","explanation":"Because L is 3 times B, a 2-unit increase in B creates a 6-unit increase in L."},{"num":37,"prompt":"A box has 24 crayons that are not purple and some purple crayons. If the probability of choosing purple is 1/4, how many purple crayons are there?","choices":[{"label":"A","text":"6"},{"label":"B","text":"8"},{"label":"C","text":"10"},{"label":"D","text":"12"}],"answer":"B","explanation":"If purple is one-fourth of the total, the non-purple crayons make up three-fourths. The purple count is one-third of the non-purple count."},{"num":38,"prompt":"Each large cube has a volume of 1,000 cubic inches. What expression gives the volume of 20 such cubes?","choices":[{"label":"A","text":"20 × 100"},{"label":"B","text":"20 × 1,000"},{"label":"C","text":"1,000 ÷ 20"},{"label":"D","text":"20 + 1,000"}],"answer":"B","explanation":"Multiply the volume of one cube by the number of cubes."}]},"reading":{"minutes":25,"passages":[{"title":"The Night Garden","text":"Most people picture gardens as places that are meant to be enjoyed in daylight. Yet some gardeners deliberately choose plants that become especially noticeable after sunset. Pale flowers, silver leaves, and strongly scented blossoms can make a garden feel almost transformed at night.\n\nThe effect depends partly on how human vision changes in dim light. In bright conditions, our eyes detect color well. As light fades, we become less sensitive to color and more sensitive to differences between light and dark. White flowers and silvery leaves therefore stand out more clearly than deep red or purple blooms. Moonlight and porch lights can make these pale surfaces appear to glow.\n\nScent can become important too. Several flowers release their strongest fragrance in the evening. This is not simply for the benefit of people walking through a garden. Some of these plants are pollinated by moths and other nighttime insects. A strong scent can help guide those pollinators toward a flower even when the flower is difficult to see from a distance.\n\nDesigning a night garden does not require replacing a daytime garden. Gardeners often mix evening plants among ordinary ones, placing pale flowers near paths or seating areas. The result is a space that changes character as the day ends. Instead of becoming invisible after sunset, the garden offers a second experience—one built around contrast, fragrance, and the quiet activity of nighttime pollinators.","questions":[{"num":1,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Night gardens require replacing every daytime plant."},{"label":"B","text":"Night gardens use pale colors and evening scents to create a distinctive experience after sunset."},{"label":"C","text":"Night gardens are designed mainly to keep insects away."},{"label":"D","text":"Gardeners should use only electric lights after sunset."}],"answer":"B","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":2,"prompt":"Why can pale flowers appear especially bright at night?","choices":[{"label":"A","text":"Pale flowers produce their own light."},{"label":"B","text":"Human vision becomes more sensitive to light-dark contrast as daylight fades."},{"label":"C","text":"Night air changes white flowers into a lighter color."},{"label":"D","text":"Dark petals reflect more moonlight than white petals."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, the word “transformed” most nearly means","choices":[{"label":"A","text":"planted in rows"},{"label":"B","text":"hidden completely"},{"label":"C","text":"measured carefully"},{"label":"D","text":"changed greatly"}],"answer":"D","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":4,"prompt":"Why might a strongly scented flower be useful to a moth?","choices":[{"label":"A","text":"The scent makes the flower warmer."},{"label":"B","text":"The scent prevents the moth from landing."},{"label":"C","text":"The scent changes the flower's color."},{"label":"D","text":"The scent can help the moth locate the flower in low light."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":5,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"formal and argumentative"},{"label":"B","text":"confused and doubtful"},{"label":"C","text":"informative and appreciative"},{"label":"D","text":"critical and warning"}],"answer":"C","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"Why Bridges Expand","text":"A long bridge may look perfectly solid, but its materials are constantly responding to changes in temperature. Steel and concrete expand slightly when they become warmer and contract when they cool. The movement is tiny in a short object, but over the length of a large bridge it can add up to several inches.\n\nEngineers plan for this motion rather than trying to prevent it completely. Many bridges include expansion joints—small gaps or flexible connections placed between sections of the structure. These joints allow neighboring sections to move without pressing dangerously against one another. Some bridges also use bearings that let parts of the bridge deck slide a small distance as temperatures change.\n\nThe need for movement is easiest to notice in places with hot summers and cold winters, where the seasonal temperature range is large. But even in milder climates, daily heating from the sun and cooling at night can cause measurable changes.\n\nExpansion joints must be inspected and maintained. Dirt can clog them, metal can corrode, and rubber components can wear out. When a joint can no longer move as designed, stress may build in the surrounding structure. For this reason, bridge maintenance crews pay close attention to parts that are designed to move. A safe bridge is not one that never shifts at all; it is one that shifts in controlled ways that engineers have anticipated.","questions":[{"num":6,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Cold weather is the main cause of bridge failure."},{"label":"B","text":"Concrete is the only material that changes with temperature."},{"label":"C","text":"Engineers design bridges with joints and bearings that safely accommodate temperature-related expansion and contraction."},{"label":"D","text":"Bridges are safest when engineers prevent all movement."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":7,"prompt":"What is the purpose of an expansion joint?","choices":[{"label":"A","text":"It makes the bridge surface warmer."},{"label":"B","text":"It permanently locks bridge sections together."},{"label":"C","text":"It stops a bridge from getting wet."},{"label":"D","text":"It gives bridge sections room to move as temperatures change."}],"answer":"D","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":8,"prompt":"In the passage, the word “anticipated” most nearly means","choices":[{"label":"A","text":"repaired afterward"},{"label":"B","text":"forgotten"},{"label":"C","text":"measured exactly"},{"label":"D","text":"expected in advance"}],"answer":"D","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":9,"prompt":"Why are expansion joints especially important where seasons vary greatly?","choices":[{"label":"A","text":"Cold climates never require bridge maintenance."},{"label":"B","text":"Large seasonal changes create larger shifts in bridge materials."},{"label":"C","text":"Expansion joints work only in summer."},{"label":"D","text":"Larger temperature changes produce more expansion and contraction."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":10,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"explanatory and practical"},{"label":"B","text":"humorous and playful"},{"label":"C","text":"angry and critical"},{"label":"D","text":"mysterious and suspenseful"}],"answer":"A","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"The Lost Recipe Notebook","text":"When Elena's family moved her grandmother into a smaller apartment, everyone volunteered to sort boxes. Elena expected the work to be dull until she opened a dented tin and found a thin notebook wrapped in a dish towel.\n\nThe notebook did not look valuable. Its cover was stained, and several pages had come loose. Inside, however, were recipes written in her grandmother's looping handwriting. Some had exact measurements, but others included instructions such as “enough flour to make a soft dough” or “bake until the edges smell toasted.”\n\nElena asked her grandmother about the unusual directions. Her grandmother laughed and explained that she had learned many of the recipes by watching relatives cook. They rarely measured everything. Instead, they paid attention to texture, smell, and appearance. The notebook had been a way to capture those lessons without turning them into strict formulas.\n\nThat weekend, Elena chose a bread recipe and tried to follow it. Her first dough was too sticky. Rather than throw it away, her grandmother showed her how to add flour a little at a time and feel when the dough changed. The finished loaf was uneven, but it tasted familiar to her grandmother.\n\nElena later copied the recipes into a digital document so the family could share them. Still, she returned the original notebook to the dented tin. The typed version preserved the words, she realized, but the old pages preserved something else: evidence of the people who had cooked, corrected, and learned from one another long before Elena entered the kitchen.","questions":[{"num":11,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Old recipes should never be changed while cooking."},{"label":"B","text":"Elena learns that family cooking can preserve knowledge and history."},{"label":"C","text":"A family recipe notebook helps Elena understand that cooking knowledge can carry both practical instructions and family history."},{"label":"D","text":"Digital recipes are always better than handwritten ones."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":12,"prompt":"Why were some of the notebook's directions imprecise?","choices":[{"label":"A","text":"Her grandmother disliked measuring cups."},{"label":"B","text":"The recipes came from cooks who relied on experience, texture, smell, and appearance."},{"label":"C","text":"The recipes were copied from a restaurant."},{"label":"D","text":"The cooks learned by observation and judged texture, smell, and appearance."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":13,"prompt":"In the passage, the word “capture” most nearly means","choices":[{"label":"A","text":"erase"},{"label":"B","text":"compare"},{"label":"C","text":"hide"},{"label":"D","text":"record or preserve"}],"answer":"D","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":14,"prompt":"Why does Elena keep the original notebook after typing the recipes?","choices":[{"label":"A","text":"The original notebook carries memories and evidence of family history."},{"label":"B","text":"The physical notebook has sentimental and historical value that the digital copy does not."},{"label":"C","text":"She believes the typed recipes are inaccurate."},{"label":"D","text":"She plans to sell the notebook."}],"answer":"B","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":15,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"cold and technical"},{"label":"B","text":"uncertain and hesitant"},{"label":"C","text":"frustrated and sarcastic"},{"label":"D","text":"warm and reflective"}],"answer":"D","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"A Library for Tools","text":"Libraries are usually associated with books, but some communities have created lending libraries for a very different kind of item: tools. Instead of purchasing a drill, ladder, or garden spade for a single project, members can borrow one for a limited period and return it when the job is finished.\n\nTool libraries can reduce waste because the same item is used by many households. A power saw that might otherwise sit unused in a garage for most of the year can complete dozens of projects. Borrowing also lowers the cost of trying a new activity. Someone who wants to repair a shelf or start a small garden does not have to buy every tool before beginning.\n\nRunning a tool library requires more than shelves and a checkout desk. Staff members inspect equipment, replace damaged parts, and teach borrowers how to use unfamiliar tools safely. Some libraries offer short workshops on tasks such as patching drywall, sharpening garden tools, or using a sewing machine.\n\nThere are challenges. Tools wear out, popular items may be unavailable at busy times, and storage can be expensive. Still, supporters argue that tool libraries provide more than equipment. They can make practical skills easier to learn and encourage neighbors to share resources rather than each household owning rarely used items. In that sense, a tool library lends both objects and opportunities.","questions":[{"num":16,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Libraries should replace books with machinery."},{"label":"B","text":"Every household should own a complete set of tools."},{"label":"C","text":"Tool libraries can share equipment, lower costs, and help people learn skills."},{"label":"D","text":"Tool libraries let communities share equipment while reducing costs, waste, and barriers to learning practical skills."}],"answer":"D","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":17,"prompt":"Why do tool libraries inspect equipment?","choices":[{"label":"A","text":"To keep equipment safe and working."},{"label":"B","text":"They need to keep borrowed tools safe and in working condition."},{"label":"C","text":"To make borrowed tools heavier."},{"label":"D","text":"To prevent people from learning repairs."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":18,"prompt":"In the passage, the word “barriers” most nearly means","choices":[{"label":"A","text":"shelves"},{"label":"B","text":"a sudden warning"},{"label":"C","text":"obstacles"},{"label":"D","text":"rewards"}],"answer":"C","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":19,"prompt":"Why might a workshop be useful to someone borrowing a tool?","choices":[{"label":"A","text":"Workshops make tools wear out faster."},{"label":"B","text":"Borrowers are required to become professional builders."},{"label":"C","text":"Borrowers may need help using unfamiliar equipment safely."},{"label":"D","text":"The borrower may need instruction to use an unfamiliar tool safely and effectively."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":20,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"uncertain and hesitant"},{"label":"B","text":"balanced but favorable"},{"label":"C","text":"hostile and dismissive"},{"label":"D","text":"uncertain and fearful"}],"answer":"B","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]},{"title":"Following the Shorebirds","text":"Every spring, thousands of shorebirds stop along certain coastlines during migrations that may span thousands of miles. To a casual observer, the birds seem to be resting randomly on beaches and mudflats. Biologists, however, know that many of these stopping places function like refueling stations.\n\nDuring migration, birds use enormous amounts of energy. At a productive stopover site, they feed intensively on small crabs, worms, insects, and other creatures exposed by the tides. A bird may remain for only a few days, but the food it gains can help power the next part of its journey.\n\nResearchers study these migrations in several ways. They count birds from the ground, place lightweight identification bands on some individuals, and increasingly use tiny tracking devices. When information from many years is combined, scientists can see which locations are used repeatedly and when the largest groups are likely to arrive.\n\nThis information matters because a beach that looks empty for much of the year may suddenly become essential during a brief migration window. Construction, heavy recreation, or changes to tidal habitat during that period can disturb feeding birds. Conservation plans therefore often focus not only on protecting a place, but also on protecting it at the right time.\n\nThe journeys of shorebirds reveal a larger lesson about migration. A route is only as useful as the places along it where travelers can safely stop, rest, and find what they need to continue.","questions":[{"num":21,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Shorebird migration depends on important stopover sites that provide food at crucial times."},{"label":"B","text":"Shorebirds remain on one beach throughout the year."},{"label":"C","text":"Migration depends on stopover sites that provide food at the right times."},{"label":"D","text":"Tracking devices prevent shorebirds from migrating."}],"answer":"A","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":22,"prompt":"What do shorebirds mainly gain at productive stopover sites?","choices":[{"label":"A","text":"They avoid all other birds."},{"label":"B","text":"They gain food and energy for the next stage of migration."},{"label":"C","text":"They gain food and energy for the next stage."},{"label":"D","text":"They learn to build nests."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":23,"prompt":"In the passage, the word “intensively” most nearly means","choices":[{"label":"A","text":"with great effort or concentration"},{"label":"B","text":"without stopping"},{"label":"C","text":"at the same time every year"},{"label":"D","text":"a sudden warning"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":24,"prompt":"Why can a beach be important even if it is empty much of the year?","choices":[{"label":"A","text":"The beach may become crucial during a short migration period."},{"label":"B","text":"Only beaches with buildings attract shorebirds."},{"label":"C","text":"The beach is unsafe whenever it looks empty."},{"label":"D","text":"It may be heavily used by migrating birds during a short seasonal window."}],"answer":"D","explanation":"This conclusion follows from details in the passage.","strand":"Inference"},{"num":25,"prompt":"Which description best matches the author's tone?","choices":[{"label":"A","text":"comic and exaggerated"},{"label":"B","text":"uncertain and hesitant"},{"label":"C","text":"angry toward scientists"},{"label":"D","text":"informative with a conservation focus"}],"answer":"D","explanation":"The passage's word choice and presentation best fit this tone.","strand":"Tone"}]}]},"math":{"minutes":30,"questions":[{"num":1,"prompt":"What is the value of the digit 8 in 482,731?","choices":[{"label":"A","text":"8,000"},{"label":"B","text":"8"},{"label":"C","text":"800,000"},{"label":"D","text":"80,000"}],"answer":"D","explanation":"The digit 8 is in the ten-thousands place."},{"num":2,"prompt":"A hexagon has side lengths 7, 9, 11, 8, 6, 10 meters. What is its perimeter?","choices":[{"label":"A","text":"51"},{"label":"B","text":"66"},{"label":"C","text":"45"},{"label":"D","text":"57"}],"answer":"A","explanation":"Add all six side lengths."},{"num":3,"prompt":"A pictograph uses one house symbol to represent 8 houses. Brook Lane has 6 symbols and Pine Road has 4 symbols. How many more houses are on Brook Lane?","choices":[{"label":"A","text":"2"},{"label":"B","text":"48"},{"label":"C","text":"10"},{"label":"D","text":"16"}],"answer":"D","explanation":"The difference is 2 symbols, and each symbol represents 8 houses."},{"num":4,"prompt":"If ■ = 3 × (△ + 4), what is ■ when △ = 5?","choices":[{"label":"A","text":"30"},{"label":"B","text":"27"},{"label":"C","text":"15"},{"label":"D","text":"12"}],"answer":"B","explanation":"Substitute the value of △, add 4, then multiply by 3."},{"num":5,"prompt":"What is 5,000 − 687?","choices":[{"label":"A","text":"5,687"},{"label":"B","text":"4,313"},{"label":"C","text":"4,413"},{"label":"D","text":"4,213"}],"answer":"B","explanation":"Subtract carefully by place value."},{"num":6,"prompt":"In August, Maya read 7 books and Jacob read 4 books. How many more books did Maya read?","choices":[{"label":"A","text":"3"},{"label":"B","text":"9"},{"label":"C","text":"5"},{"label":"D","text":"7"}],"answer":"A","explanation":"Subtract Jacob's total from Maya's total."},{"num":7,"prompt":"A number machine squares every input. What is the output for an input of 11?","choices":[{"label":"A","text":"121"},{"label":"B","text":"110"},{"label":"C","text":"22"},{"label":"D","text":"132"}],"answer":"A","explanation":"Squaring means multiplying the number by itself."},{"num":8,"prompt":"A pitcher holds 2 quarts and a jug holds 3 quarts. Which combination holds exactly 18 quarts?","choices":[{"label":"A","text":"3 pitchers and 4 jugs"},{"label":"B","text":"4 pitchers and 5 jugs"},{"label":"C","text":"3 pitchers and 6 jugs"},{"label":"D","text":"5 pitchers and 5 jugs"}],"answer":"A","explanation":"3×2 + 4×3 = 18."},{"num":9,"prompt":"Which number is divisible by 6 with no remainder?","choices":[{"label":"A","text":"48"},{"label":"B","text":"53"},{"label":"C","text":"47"},{"label":"D","text":"50"}],"answer":"A","explanation":"48 ÷ 6 is a whole number."},{"num":10,"prompt":"In a town of 6,400 graduates, about 3/8 have earned an advanced degree. About how many graduates is that?","choices":[{"label":"A","text":"4,000"},{"label":"B","text":"800"},{"label":"C","text":"4,800"},{"label":"D","text":"2,400"}],"answer":"D","explanation":"Find one-eighth of the total, then multiply by 3."},{"num":11,"prompt":"$9,450 is divided evenly among 3 accounts. How much goes into each account?","choices":[{"label":"A","text":"$3,250"},{"label":"B","text":"$3,150"},{"label":"C","text":"$9,447"},{"label":"D","text":"$4,725"}],"answer":"B","explanation":"Divide the total amount by the number of accounts."},{"num":12,"prompt":"Point P is 3 units to the right of the origin and 9 units above the origin. What are its coordinates?","choices":[{"label":"A","text":"(3, -9)"},{"label":"B","text":"(-3, 9)"},{"label":"C","text":"(9, 3)"},{"label":"D","text":"(3, 9)"}],"answe  plant's color does not."}]},"essay":{"prompt":"Describe a time when working with another person helped you solve a problem or complete something that would have been harder to do alone. Explain what each person contributed and what you learned from the experience.","guidance":"Organize your response with a clear beginning, middle, and ending. Use specific details and explain why the experience mattered.","minutes":30}},"lower-test4":{"title":"Lower Level Practice Test #4","verbal":{"questions":[{"num":1,"prompt":"CAUTIOUS:","choices":[{"label":"A","text":"careful"},{"label":"B","text":"cheerful"},{"label":"C","text":"foolish"},{"label":"D","text":"rapid"}],"answer":"A","explanation":"Cautious means careful about avoiding danger or mistakes.","part":"Synonyms"},{"num":2,"prompt":"DROWSY:","choices":[{"label":"A","text":"angry"},{"label":"B","text":"sleepy"},{"label":"C","text":"useful"},{"label":"D","text":"wealthy"}],"answer":"B","explanation":"Drowsy means sleepy.","part":"Synonyms"},{"num":3,"prompt":"EAGER:","choices":[{"label":"A","text":"anxious to begin"},{"label":"B","text":"difficult to find"},{"label":"C","text":"likely to break"},{"label":"D","text":"slow to decide"}],"answer":"A","explanation":"Eager means strongly wanting to do or have something.","part":"Synonyms"},{"num":4,"prompt":"FRAGILE:","choices":[{"label":"A","text":"easily broken"},{"label":"B","text":"highly polished"},{"label":"C","text":"very expensive"},{"label":"D","text":"widely known"}],"answer":"A","explanation":"Fragile means easily damaged or broken.","part":"Synonyms"},{"num":5,"prompt":"GLIMPSE:","choices":[{"label":"A","text":"brief look"},{"label":"B","text":"loud sound"},{"label":"C","text":"long journey"},{"label":"D","text":"small payment"}],"answer":"A","explanation":"A glimpse is a quick or brief look.","part":"Synonyms"},{"num":6,"prompt":"HOSTILE:","choices":[{"label":"A","text":"friendly"},{"label":"B","text":"unfriendly"},{"label":"C","text":"patient"},{"label":"D","text t"},{"label":"C","text":"shallow"},{"label":"D","text":"vacant"}],"answer":"A","explanation":"Waiting for final scores can make an audience tense.","part":"Sentence Completion"},{"num":32,"prompt":"Lena's model was simple but -------; every moving part worked exactly as intended.","choices":[{"label":"A","text":"effective"},{"label":"B","text":"fragile"},{"label":"C","text":"hasty"},{"label":"D","text":"remote"}],"answer":"A","explanation":"A model that works as intended is effective.","part":"Sentence Completion"},{"num":33,"prompt":"The scientist repeated the measurement to ------- that the first result was reliable.","choices":[{"label":"A","text":"confirm"},{"label":"B","text":"divide"},{"label":"C","text":"escape"},{"label":"D","text":"pretend"}],"answer":"A","explanation":"Repeating a measurement can confirm a result.","part":"Sentence Completion"},{"num":34,"prompt":"Rather than choosing the first idea, the committee ------- several possibilities before deciding.","choices":[{"label":"A","text":"considered"},{"label":"B","text":"destroyed"},{"label":"C","text":"forgot"},{"label":"D","text":"whispered"}],"answer":"A","explanation":"A committee deciding among options would consider several possibilities.","part":"Sentence Completion"}],"minutes":20},"quantitative":{"questions":[{"num":1,"prompt":"The pattern is 14, 19, 24, 29, ___. What number comes next?","choices":[{"label":"A","text":"32"},{"label":"B","text":"34"},{"label":"C","text":"35"},{"label":"D","text":"39"}],"answer":"B","explanation":"The pattern adds 5 each time."},{"num":2,"prompt":"A number machine multiplies each input by 3 and then subtracts 2. What is the output when the input is 7?","choices":[{"label":"A","text":"19"},{"label":"B","text":"21"},{"label":"C","text":"23"},{"label":"D","text":"12"}],"answer":"A","explanation":"3 × 7 − 2 = 19."},{"num":3,"prompt":"The ratio of red beads to blue beads is 3:5. If there are 15 red beads, how many blue beads are there?","choices":[{"label":"A","text":"20"},{"label":"B","text":"25"},{"label":"C","text":"30"},{"label":"D","text":"35"}],"answer":"B","explanation":"The ratio is multiplied by 5: 3×5=15, so 5×5=25."},{"num":4,"prompt":"If 8 × 6 = 48, which equation belongs to the same fact family?","choices":[{"label":"A","text":"48 ÷ 8 = 6"},{"label":"B","text":"48 + 8 = 56"},{"label":"C","text":"8 + 6 = 14"},{"label":"D","text":"48 − 6 = 42"}],"answer":"A","explanation":"The multiplication and division facts with 8, 6, and 48 belong to the same fact family."},{"num":5,"prompt":"The numbers are 12, 18, 21, 25, and 30. What is the median?","choices":[{"label":"A","text":"18"},{"label":"B","text":"21"},{"label":"C","text":"25"},{"label":"D","text":"106"}],"answer":"B","explanation":"The middle value in the ordered list is 21."},{"num":6,"prompt":"Four notebooks cost $12. At the same rate, how much do 7 notebooks cost?","choices":[{"label":"A","text":"$18"},{"label":"B","text":"$20"},{"label":"C","text":"$21"},{"label":"D","text":"$24"}],"answer":"C","explanation":"Each notebook costs $3, so 7 cost $21."},{"num":7,"prompt":"Which fraction is greatest?","choices":[{"label":"A","text":"3/8"},{"label":"B","text":"5/12"},{"label":"C","text":"7/16"},{"label":"D","text":"1/2"}],"answer":"D","explanation":"One-half equals 0.5, which is greater than the other fractions."},{"num":8,"prompt":"Which digit is in the thousandths place in 6.4827?","choices":[{"label":"A","text":"4"},{"label":"B","text":"8"},{"label":"C","text":"2"},{"label":"D","text":"7"}],"answer":"C","explanation":"In 6.4827, the digits after the decimal are tenths 4, hundredths 8, thousandths 2, ten-thousandths 7."},{"num":9,"prompt":"What value of x makes 4x + 3 = 27 true?","choices":[{"label":"A","text":"5"},{"label":"B","text":"6"},{"label":"C","text":"7"},{"label":"D","text":"8"}],"answer":"B","explanation":"Subtract 3 to get 24, then divide by 4: x=6."},{"num":10,"prompt":"Point P is halfway between 2.4 and 3.0 on a number line. What number does P represent?","choices":[{"label":"A","text":"2.6"},{"label":"B","text":"2.7"},{"label":"C","text":"2.8"},{"label":"D","text":"2.9"}],"answer":"B","explanation":"The midpoint of 2.4 and 3.0 is 2.7."},{"num":11,"prompt":"Which fraction is equivalent to 9/12?","choices":[{"label":"A","text":"2/3"},{"label":"B","text":"3/4"},{"label":"C","text":"4/5"},{"label":"D","text":"5/6"}],"answer":"B","explanation":"Divide numerator and denominator by 3: 9/12 = 3/4."},{"num":12,"prompt":"Adult tickets cost $11 and student tickets cost $7. Which expression gives the cost of a adult tickets and 4 student tickets?","choices":[{"label":"A","text":"11a + 28"},{"label":"B","text":"7a + 44"},{"label":"C","text":"18a + 4"},{"label":"D","text":"11(a + 4)"}],"answer":"A","explanation":"Adult tickets cost 11a and four student tickets cost 4×7=28."},{"num":13,"prompt":"Of 60 marbles, 18 are green. What fraction of the marbles are not green?","choices":[{"label":"A","text":"3/10"},{"label":"B","text":"7/10"},{"label":"C","text":"18/60"},{"label":"D","text":"42/18"}],"answer":"B","explanation":"42 are not green, and 42/60 simplifies to 7/10."},{"num":14,"prompt":"Which improper fraction is equal to 3 2/5?","choices":[{"label":"A","text":"15/5"},{"label":"B","text":"16/5"},{"label":"C","text":"17/5"},{"label":"D","text":"18/5"}],"answer":"C","explanation":"3×5+2=17, so the improper fraction is 17/5."},{"num":15,"prompt":"A two-digit number has a tens digit that is 3 more than its ones digit. The digits add to 11. What is the number?","choices":[{"label":"A","text":"47"},{"label":"B","text":"56"},{"label":"C","text":"74"},{"label":"D","text":"83"}],"answer":"C","explanation":"Let the ones digit be 4; then the tens digit is 7 and 7+4=11."},{"num":16,"prompt":"A rectangle has perimeter 46 cm and length 15 cm. What is its width?","choices":[{"label":"A","text":"8 cm"},{"label":"B","text":"11 cm"},{"label":"C","text":"16 cm"},{"label":"D","text":"31 cm"}],"answer":"A","explanation":"2(15+w)=46, so 15+w=23 and w=8."},{"num":17,"prompt":"In a survey, 30% chose soccer, 25% chose basketball, 20% chose swimming, and the rest chose tennis. What percent chose tennis?","choices":[{"label":"A","text":"15%"},{"label":"B","text":"20%"},{"label":"C","text":"25%"},{"label":"D","text":"35%"}],"answer":"C","explanation":"The listed percentages total 75%, so 25% remain."},{"num":18,"prompt":"Eight students share 56 markers equally. Then each student gives 2 markers to the teacher. How many markers does each student keep?","choices":[{"label":"A","text":"5"},{"label":"B","text":"7"},{"label":"C","text":"9"},{"label":"D","text":"12"}],"answer":"A","explanation":"Each gets 56÷8=7 markers and keeps 7−2=5."},{"num":19,"prompt":"A machine produces 36 parts in 4 hours at a constant rate. How many parts does it produce in 7 hours?","choices":[{"label":"A","text":"54"},{"label":"B","text":"63"},{"label":"C","text":"72"},{"label":"D","text":"84"}],"answer":"B","explanation":"The rate is 9 parts per hour, so 7 hours gives 63 parts."},{"num":20,"prompt":"A triangle has base 12 cm and height 7 cm. What is its area?","choices":[{"label":"A","text":"19 cm²"},{"label":"B","text":"42 cm²"},{"label":"C","text":"84 cm²"},{"label":"D","text":"96 cm²"}],"answer":"B","explanation":"Triangle area is 1/2 × 12 × 7 = 42."},{"num":21,"prompt":"A 95-cm strip is cut so that one piece is a 38-cm square side. How much length remains?","choices":[{"label":"A","text":"47 cm"},{"label":"B","text":"57 cm"},{"label":"C","text":"63 cm"},{"label":"D","text":"133 cm"}],"answer":"B","explanation":"95−38=57."},{"num":22,"prompt":"A table follows this rule: 2 boxes → 18 pencils, 5 boxes → 45 pencils, 8 boxes → 72 pencils. Which rule matches the table?","choices":[{"label":"A","text":"Add 16 to the number of boxes."},{"label":"B","text":"Multiply the number of boxes by 9."},{"label":"C","text":"Multiply the number of boxes by 8."},{"label":"D","text":"Add 9 to the number of boxes."}],"answer":"B","explanation":"Each box corresponds to 9 pencils."},{"num":23,"prompt":"A dot pattern has 5 dots in Figure 1, 9 in Figure 2, 13 in Figure 3, and 17 in Figure 4. How many dots are in Figure 7?","choices":[{"label":"A","text":"25"},{"label":"B","text":"29"},{"label":"C","text":"31"},{"label":"D","text":"33"}],"answer":"B","explanation":"The pattern adds 4 each figure. Figure 7 has 17+3×4=29."},{"num":24,"prompt":"Which number is prime?","choices":[{"label":"A","text":"39"},{"label":"B","text":"51"},{"label":"C","text":"53"},{"label":"D","text":"57"}],"answer":"C","explanation":"53 has no positive factors other than 1 and 53."},{"num":25,"prompt":"A bag contains 4 red, 3 blue, and 5 yellow tiles. What is the probability of choosing a blue tile at random?","choices":[{"label":"A","text":"1/4"},{"label":"B","text":"1/3"},{"label":"C","text":"3/5"},{"label":"D","text":"3/12"}],"answer":"A","explanation":"There are 12 tiles total and 3 are blue, so 3/12=1/4."},{"num":26,"prompt":"A design has exactly one vertical line of symmetry. Which change would preserve that symmetry?","choices":[{"label":"A","text":"Add matching stars at equal distances on both sides of the vertical line."},{"label":"B","text":"Add one star only to the left side."},{"label":"C","text":"Move the vertical line to one edge."},{"label":"D","text":"Rotate only the right half."}],"answer":"A","explanation":"Matching changes on both sides preserve vertical symmetry."},{"num":27,"prompt":"Segment AB is 18 units long. Point C lies between A and B. If AC = x + 2 and CB = 2x + 1, what is x?","choices":[{"label":"A","text":"3"},{"label":"B","text":"5"},{"label":"C","text":"6"},{"label":"D","text":"15"}],"answer":"B","explanation":"(x+2)+(2x+1)=18, so 3x+3=18 and x=5."},{"num":28,"prompt":"Three bags hold 24 candles each. Four boxes hold 18 candles each. Which statement is true?","choices":[{"label":"A","text":"The bags hold more candles in total."},{"label":"B","text":"The boxes hold more candles in total."},{"label":"C","text":"They hold the same total number of candles."},{"label":"D","text":"The difference is 18 candles."}],"answer":"C","explanation":"3×24=72 and 4×18=72."},{"num":29,"prompt":"Which number does NOT belong with the others?","choices":[{"label":"A","text":"12"},{"label":"B","text":"18"},{"label":"C","text":"24"},{"label":"D","text":"35"}],"answer":"D","explanation":"12, 18, and 24 are divisible by 6; 35 is not."},{"num":30,"prompt":"A rectangular frame has perimeter 30 cm and one side is 9 cm. The unknown side is doubled for a new design. By how many centimeters does that side increase?","choices":[{"label":"A","text":"3"},{"label":"B","text":"6"},{"label":"C","text":"9"},{"label":"D","text":"12"}],"answer":"B","explanation":"2(9+w)=30 gives w=6. Doubling it to 12 increases it by 6."},{"num":31,"prompt":"A balanced scale represents 2 squares + 1 circle = 17 and 1 square = 5. What is the value of the circle?","choices":[{"label":"A","text":"5"},{"label":"B","text":"7"},{"label":"C","text":"10"},{"label":"D","text":"12"}],"answer":"B","explanation":"2×5 + circle = 17, so the circle equals 7."},{"num":32,"prompt":"A floor grid has 40 equal squares. If 26 are shaded, what percent is shaded?","choices":[{"label":"A","text":"35%"},{"label":"B","text":"60%"},{"label":"C","text":"65%"},{"label":"D","text":"75%"}],"answer":"C","explanation":"26/40 = 0.65 = 65%."},{"num":33,"prompt":"Lena completes 3 pages for every 2 pages Noah completes. If Noah completes 14 pages, how many does Lena complete?","choices":[{"label":"A","text":"18"},{"label":"B","text":"21"},{"label":"C","text":"24"},{"label":"D","text":"28"}],"answer":"B","explanation":"14 is 7 groups of 2, so Lena completes 7×3=21."},{"num":34,"prompt":"A box has 6 black, 6 white, 4 green, and p purple counters. If the probability of purple is 1/5, how many purple counters are there?","choices":[{"label":"A","text":"3"},{"label":"B","text":"4"},{"label":"C","text":"5"},{"label":"D","text":"6"}],"answer":"B","explanation":"There are 16 non-purple counters. p/(16+p)=1/5 gives 5p=16+p, so p=4."},{"num":35,"prompt":"A cube has side length 4 cm. What is its volume?","choices":[{"label":"A","text":"16 cm³"},{"label":"B","text":"32 cm³"},{"label":"C","text":"64 cm³"},{"label":"D","text":"96 cm³"}],"answer":"C","explanation":"Cube volume is 4×4×4=64 cubic centimeters."},{"num":36,"prompt":"If 0 < n < 1, which is greater?","choices":[{"label":"A","text":"n²"},{"label":"B","text":"n"},{"label":"C","text":"They are equal"},{"label":"D","text":"Cannot be determined"}],"answer":"B","explanation":"For a positive number less than 1, squaring makes it smaller, so n is greater."},{"num":37,"prompt":"Point A is at (2, 5). It moves 4 units right and 3 units down. What are the new coordinates?","choices":[{"label":"A","text":"(6, 2)"},{"label":"B","text":"(6, 8)"},{"label":"C","text":"(-2, 2)"},{"label":"D","text":"(5, 1)"}],"answer":"A","explanation":"Moving right adds 4 to x and moving down subtracts 3 from y."},{"num":38,"prompt":"A school orders 9 packs of 24 pencils. It gives 68 pencils to Grade 5 and 79 pencils to Grade 6. How many pencils remain?","choices":[{"label":"A","text":"49"},{"label":"B","text":"59"},{"label":"C","text":"69"},{"label":"D","text":"147"}],"answer":"C","explanation":"9×24=216. Then 216−68−79=69."}],"minutes":35},"reading":{"passages":[{"title":"Cooling the City, One Tree at a Time","text":"On a summer afternoon, a city sidewalk can become much hotter than a nearby park. Concrete and asphalt absorb sunlight during the day and release heat slowly, while trees provide shade and cool the air as water evaporates from their leaves. This difference helps explain a problem known as the urban heat island effect: neighborhoods with many dark roofs, roads, and parking lots often stay warmer than areas with more vegetation.\n\nCity planners have begun using trees as part of their response. A row of mature trees can shade sidewalks and building walls, making outdoor spaces more comfortable and reducing the amount of energy needed to cool nearby buildings. Trees can also slow rainwater as it reaches the ground, which may reduce pressure on storm drains during heavy rain.\n\nPlanting trees, however, is not as simple as placing any tree in any open patch of soil. Young trees need water while their roots become established. Some species grow too large for spaces beneath power lines, while others struggle in compacted soil or in areas where winter salt collects. A tree that thrives in one neighborhood may fail in another.\n\nFor this reason, many cities now create detailed planting plans. They examine sunlight, soil, available space, and local climate before choosing a species. They may also focus planting in neighborhoods that have fewer trees and higher summer temperatures. The goal is not merely to make streets look greener. When trees are chosen carefully and maintained over time, they can become part of a city's infrastructure—working alongside drains, sidewalks, and buildings to make neighborhoods more comfortable and resilient.","questions":[{"num":1,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Cities can use carefully selected and maintained trees to reduce heat and provide other practical benefits."},{"label":"B","text":"All city neighborhoods should plant the same species of tree."},{"label":"C","text":"Concrete sidewalks are more attractive than parks."},{"label":"D","text":"Trees completely eliminate the need for storm drains."}],"answer":"A","explanation":"The passage explains several benefits of urban trees and emphasizes careful planning and maintenance.","strand":"Main Idea"},{"num":2,"prompt":"Why does the author mention power lines and winter salt?","choices":[{"label":"A","text":"To show that city tree planting requires attention to local conditions."},{"label":"B","text":"To argue that cities should remove all power lines."},{"label":"C","text":"To explain why trees grow faster in winter."},{"label":"D","text":"To prove that young trees need no maintenance."}],"answer":"A","explanation":"These examples show that a tree species must fit the specific planting location.","strand":"Inference"},{"num":3,"prompt":"In the final paragraph, the word “infrastructure” most nearly refers to","choices":[{"label":"A","text":"systems and structures that help a city function."},{"label":"B","text":"decorations used only for appearance."},{"label":"C","text":"plants found only in forests."},{"label":"D","text":"temporary construction projects."}],"answer":"A","explanation":"The passage compares trees with drains, sidewalks, and buildings—parts of the systems that help a city function.","strand":"Vocabulary in Context"},{"num":4,"prompt":"According to the passage, trees can help during heavy rain by","choices":[{"label":"A","text":"making rain fall less often."},{"label":"B","text":"slowing water before it reaches storm drains."},{"label":"C","text":"absorbing all water before it reaches the ground."},{"label":"D","text":"preventing clouds from forming."}],"answer":"B","explanation":"The passage says trees can slow rainwater as it reaches the ground, reducing pressure on storm drains.","strand":"Supporting Ideas"},{"num":5,"prompt":"Which statement best describes the author's attitude toward urban tree planting?","choices":[{"label":"A","text":"Supportive, but aware that successful planting requires planning."},{"label":"B","text":"Opposed because trees create too much shade."},{"label":"C","text":"Uncertain whether trees have any practical value."},{"label":"D","text":"Amused by cities that spend time studying soil."}],"answer":"A","explanation":"The author presents tree planting positively while explaining the need for careful selection and maintenance.","strand":"Tone"}]},{"title":"The Bell in the Back Room","text":"On her first Saturday volunteering at the Harbor Museum, Nia expected to spend the morning greeting visitors. Instead, Mr. Alvarez handed her a pair of cotton gloves and led her t
