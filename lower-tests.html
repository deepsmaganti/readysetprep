otal must be 110. Subtracting the four known values leaves 25."},{"num":8,"prompt":"A bag contains 9 red, 3 blue, and 4 green counters. What is the probability of choosing a red or green counter?","choices":[{"label":"A","text":"3/16"},{"label":"B","text":"13/16"},{"label":"C","text":"1/4"},{"label":"D","text":"9/16"}],"answer":"B","explanation":"There are 13 favorable counters out of 16, so the probability is 13/16."},{"num":9,"prompt":"A rectangle has perimeter 60 units and width 11 units. What is its area?","choices":[{"label":"A","text":"198"},{"label":"B","text":"209"},{"label":"C","text":"660"},{"label":"D","text":"220"}],"answer":"B","explanation":"L+W=30, so L=19. The area is 19×11=209."},{"num":10,"prompt":"A supply room receives 20 boxes with 12 markers in each box. After 69 markers are used, how many remain?","choices":[{"label":"A","text":"240"},{"label":"B","text":"171"},{"label":"C","text":"309"},{"label":"D","text":"69"}],"answer":"B","explanation":"Multiply to find the total number of markers, then subtract the number used."},{"num":11,"prompt":"A workshop begins at 9:35 a.m. and lasts 125 minutes. What time does it end?","choices":[{"label":"A","text":"11:25"},{"label":"B","text":"11:40"},{"label":"C","text":"11:55"},{"label":"D","text":"12:10"}],"answer":"B","explanation":"Adding 125 minutes to 9:35 gives 11:40."},{"num":12,"prompt":"On a map, 1 centimeter represents 10 kilometers. Two towns are 4 centimeters apart. What is the actual distance?","choices":[{"label":"A","text":"30 km"},{"label":"B","text":"50 km"},{"label":"C","text":"40 km"},{"label":"D","text":"14 km"}],"answer":"C","explanation":"Multiply 4 by 10; the actual distance is 40 km."},{"num":13,"prompt":"Adult tickets cost $15 and child tickets cost $9. Which expression gives the cost for 3 adults and 4 children?","choices":[{"label":"A","text":"(15 × 3) + (9 × 4)"},{"label":"B","text":"(15 × 4) + (9 × 3)"},{"label":"C","text":"(15 + 9) × (3 + 4)"},{"label":"D","text":"(15 × 3) - (9 × 4)"}],"answer":"A","explanation":"Multiply each ticket price by the number of tickets of that type, then add."},{"num":14,"prompt":"Of 90 counters, 37 are red and the rest are blue. What fraction of the counters are blue?","choices":[{"label":"A","text":"37/90"},{"label":"B","text":"53/90"},{"label":"C","text":"90/53"},{"label":"D","text":"53/37"}],"answer":"B","explanation":"Subtract red counters from the total to find the number of blue counters, then place that over the total."},{"num":15,"prompt":"A number is multiplied by 4, then 9 is subtracted. The result is 43. What was the original number?","choices":[{"label":"A","text":"14"},{"label":"B","text":"12"},{"label":"C","text":"13"},{"label":"D","text":"11"}],"answer":"C","explanation":"Undo the subtraction, then divide by 4: (43+9)÷4=13."},{"num":16,"prompt":"Different shapes represent digits. If ○ + □ + □ = 17 and □ = 5, what digit does ○ represent?","choices":[{"label":"A","text":"7"},{"label":"B","text":"8"},{"label":"C","text":"12"},{"label":"D","text":"5"}],"answer":"A","explanation":"Subtract the value of the two squares from the total."},{"num":17,"prompt":"Which statement must be true about a net that folds into a cube?","choices":[{"label":"A","text":"It has six square faces."},{"label":"B","text":"It has exactly five faces."},{"label":"C","text":"It has one circular face."},{"label":"D","text":"It has four triangular faces."}],"answer":"A","explanation":"A cube has six square faces, so any valid cube net contains six squares."},{"num":18,"prompt":"A rectangle has length 19 meters and perimeter 58 meters. What is its width?","choices":[{"label":"A","text":"29"},{"label":"B","text":"19"},{"label":"C","text":"10"},{"label":"D","text":"12"}],"answer":"C","explanation":"For a rectangle, half the perimeter equals length plus width."},{"num":19,"prompt":"A circle graph is divided into 8 equal sectors. Three sectors represent students who chose art. What fraction chose art?","choices":[{"label":"A","text":"3/5"},{"label":"B","text":"5/8"},{"label":"C","text":"3/8"},{"label":"D","text":"1/3"}],"answer":"C","explanation":"Three of the eight equal sectors represent art."},{"num":20,"prompt":"A team has 14 women and 7 men. 28 balls are shared equally among the women and 28 balls equally among the men. Which statement is true?","choices":[{"label":"A","text":"Each woman receives twice as many as each man."},{"label":"B","text":"Each man receives one fewer than each woman."},{"label":"C","text":"Each man receives twice as many as each woman."},{"label":"D","text":"Each person receives the same number."}],"answer":"C","explanation":"Each woman gets 2; each man gets 4."},{"num":21,"prompt":"Of 42 students, 23 chose art, 21 chose music, and 4 chose neither. How many chose both art and music?","choices":[{"label":"A","text":"5"},{"label":"B","text":"7"},{"label":"C","text":"6"},{"label":"D","text":"4"}],"answer":"C","explanation":"38 chose at least one. The overlap is 23+21−38=6."},{"num":22,"prompt":"A triangle has base 10 units and height 6 units. What is its area?","choices":[{"label":"A","text":"16"},{"label":"B","text":"60"},{"label":"C","text":"30"},{"label":"D","text":"15"}],"answer":"C","explanation":"Triangle area is one-half × base × height."},{"num":23,"prompt":"A board is 10 feet 7 inches long. How many inches long is it?","choices":[{"label":"A","text":"139"},{"label":"B","text":"115"},{"label":"C","text":"120"},{"label":"D","text":"127"}],"answer":"D","explanation":"10 feet = 120 inches; add 7 to get 127."},{"num":24,"prompt":"After a 25% increase, an item costs $137. What was its original price?","choices":[{"label":"A","text":"$127"},{"label":"B","text":"$100"},{"label":"C","text":"$110"},{"label":"D","text":"$120"}],"answer":"C","explanation":"$137 represents 125% of the original price, so the original was $110."},{"num":25,"prompt":"The pattern is 13, 21, 19, 27, 25, ___. The rule alternates +8, −2. What comes next?","choices":[{"label":"A","text":"34"},{"label":"B","text":"32"},{"label":"C","text":"33"},{"label":"D","text":"31"}],"answer":"C","explanation":"After subtracting 2, the next step is +8, giving 33."},{"num":26,"prompt":"The ratio of red tiles to blue tiles is 3:8. If there are 30 red tiles, how many blue tiles are there?","choices":[{"label":"A","text":"88"},{"label":"B","text":"80"},{"label":"C","text":"72"},{"label":"D","text":"38"}],"answer":"B","explanation":"The ratio was multiplied by 10, so blue tiles = 8×10=80."},{"num":27,"prompt":"A box holds 115 beads. 2/5 are used for one project, and 8 more are used later. How many beads remain?","choices":[{"label":"A","text":"69"},{"label":"B","text":"56"},{"label":"C","text":"61"},{"label":"D","text":"53"}],"answer":"C","explanation":"2/5 of 115 is 46. Then 115−46−8=61."},{"num":28,"prompt":"An airplane has 70 seats. 28 are aisle seats and the rest are window seats. What is the probability of being assigned a window seat?","choices":[{"label":"A","text":"21/40"},{"label":"B","text":"3/5"},{"label":"C","text":"2/5"},{"label":"D","text":"1/2"}],"answer":"B","explanation":"Find the number of window seats, then divide by the total number of seats."},{"num":29,"prompt":"The mean of five numbers is 23. Four are 17, 21, 23, 26. What is the fifth number?","choices":[{"label":"A","text":"28"},{"label":"B","text":"25"},{"label":"C","text":"30"},{"label":"D","text":"26"}],"answer":"A","explanation":"The total must be 115. Subtracting the four known values leaves 28."},{"num":30,"prompt":"A bag contains 10 red, 4 blue, and 4 green counters. What is the probability of choosing a red or green counter?","choices":[{"label":"A","text":"5/9"},{"label":"B","text":"4/9"},{"label":"C","text":"2/9"},{"label":"D","text":"7/9"}],"answer":"D","explanation":"There are 14 favorable counters out of 18, so the probability is 7/9."},{"num":31,"prompt":"45 candles are divided equally among 5 bags, while 54 candles are divided equally among 9 cases. Which statement is true?","choices":[{"label":"A","text":"Each case has twice as many as each bag."},{"label":"B","text":"Each case has more candles than each bag."},{"label":"C","text":"Each bag and case has the same number."},{"label":"D","text":"Each bag has more candles than each case."}],"answer":"D","explanation":"Each bag gets 9 candles and each case gets 6."},{"num":32,"prompt":"A rectangle has perimeter 64 units and width 12 units. What is its area?","choices":[{"label":"A","text":"252"},{"label":"B","text":"240"},{"label":"C","text":"228"},{"label":"D","text":"768"}],"answer":"B","explanation":"L+W=32, so L=20. The area is 20×12=240."},{"num":33,"prompt":"A rectangle has side lengths 10 cm and 6 cm. A new rectangle keeps the 10-cm side but doubles the other side. By how many centimeters does that side increase?","choices":[{"label":"A","text":"12"},{"label":"B","text":"10"},{"label":"C","text":"16"},{"label":"D","text":"6"}],"answer":"D","explanation":"Doubling a length increases it by one original length."},{"num":34,"prompt":"A balanced scale represents 2○ + □ = 17. If ○ = 5, what is □?","choices":[{"label":"A","text":"7"},{"label":"B","text":"12"},{"label":"C","text":"8"},{"label":"D","text":"5"}],"answer":"A","explanation":"Subtract the value of two circles from the total."},{"num":35,"prompt":"A grid has 35 equal squares and 21 are shaded. What percentage is shaded?","choices":[{"label":"A","text":"40%"},{"label":"B","text":"70%"},{"label":"C","text":"50%"},{"label":"D","text":"60%"}],"answer":"D","explanation":"Divide the shaded squares by the total and convert to a percent."},{"num":36,"prompt":"The relationship is L = 3B. If B increases by 2, by how much does L increase?","choices":[{"label":"A","text":"6"},{"label":"B","text":"3"},{"label":"C","text":"2"},{"label":"D","text":"8"}],"answer":"A","explanation":"Because L is 3 times B, a 2-unit increase in B creates a 6-unit increase in L."},{"num":37,"prompt":"A box has 30 crayons that are not purple and some purple crayons. If the probability of choosing purple is 1/4, how many purple crayons are there?","choices":[{"label":"A","text":"10"},{"label":"B","text":"8"},{"label":"C","text":"7"},{"label":"D","text":"12"}],"answer":"A","explanation":"If purple is one-fourth of the total, the non-purple crayons make up three-fourths. The purple count is one-third of the non-purple count."},{"num":38,"prompt":"Each large cube has a volume of 1,000 cubic inches. What expression gives the volume of 24 such cubes?","choices":[{"label":"A","text":"24 × 1,000"},{"label":"B","text":"1,000 ÷ 24"},{"label":"C","text":"24 × 100"},{"label":"D","text":"24 + 1,000"}],"answer":"A","explanation":"Multiply the volume of one cube by the number of cubes."}]},"reading":{"minutes":25,"passages":[{"title":"The Mathematics of Beehives","text":"A honeybee colony stores honey and raises young in sheets of wax cells. Viewed from the front, most of those cells form six-sided shapes called hexagons. People have admired this pattern for centuries, but the shape is useful for more than its appearance.\n\nCells need to fit together without leaving wasted gaps. Equilateral triangles, squares, and regular hexagons can all cover a flat surface in this way, but hexagons offer a useful balance. They provide a relatively large storage area while requiring less total wall material than many other possible arrangements. For bees, wall material matters because producing wax requires energy.\n\nThe cells are not perfectly simple geometric boxes. Their walls have thickness, and the backs of the cells meet in angled surfaces. Bees also build while crowded together in a warm hive, so real honeycomb contains small variations. Still, the repeated pattern is remarkably regular.\n\nScientists have debated exactly how bees create it. One explanation emphasizes instinctive building behavior: bees repeatedly place wax in ways that produce the familiar pattern. Another notes that warm wax can soften slightly, allowing neighboring roundish cells to press against one another and form straighter shared walls. The final honeycomb may result from both behavior and physical properties.\n\nWhatever the precise process, honeycomb is a reminder that geometry can emerge from practical constraints. The bees are not solving equations on paper, yet their need to store food efficiently has produced a structure that mathematicians find elegant.\n\nThe honeycomb example is sometimes simplified into the claim that bees consciously choose the mathematically “best” shape. That wording can be misleading. Natural selection can favor behaviors and structures that use resources effectively without any individual animal comparing formulas. Scientists therefore separate two questions: why a structure is efficient and how the behavior that produces it developed. The geometry helps answer the first question, but not the second by itself.\n\nMathematical models add another caution. A model may show that one idealized cell shape uses less wall material, but a real hive must also be built, repaired, heated, and filled by living insects. Small deviations from the ideal may make construction easier or the structure more tolerant of irregular spaces. This is a broader lesson about optimization: the “best” solution depends on which costs and constraints are included. A shape that is optimal under one assumption may not be optimal when another practical factor is added.\n\nThis distinction matters when readers encounter claims that nature has “solved” an engineering problem perfectly. Such language can be useful shorthand, but it can also hide assumptions. Researchers test efficiency under specific conditions, compare alternative structures, and remain open to the possibility that a feature serves several functions at once. The more realistic the model becomes, the more carefully words such as “optimal” have to be defined.","questions":[{"num":1,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Scientists have proven bees calculate geometry equations."},{"label":"B","text":"Honeycomb's hexagonal pattern efficiently uses space and wax and may arise from behavior and wax properties."},{"label":"C","text":"Honeybees choose hexagons only because they look attractive."},{"label":"D","text":"Honeycomb's hexagonal pattern efficiently uses space and wax and may result from both bee behavior and wax properties."}],"answer":"D","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":2,"prompt":"Why does reducing wall material matter to bees?","choices":[{"label":"A","text":"Wax is poisonous in large amounts."},{"label":"B","text":"Wax cannot form shared walls."},{"label":"C","text":"Producing wax requires energy."},{"label":"D","text":"The passage says this happens only because of luck."}],"answer":"C","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, the word “constraints” most nearly means","choices":[{"label":"A","text":"a sudden warning"},{"label":"B","text":"limits or requirements"},{"label":"C","text":"solutions"},{"label":"D","text":"decorations"}],"answer":"B","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":4,"prompt":"Why does the author caution against saying that bees consciously choose the mathematically “best” shape?","choices":[{"label":"A","text":"Bees cannot build hexagons."},{"label":"B","text":"Efficiency can arise from behavior shaped over time without bees comparing formulas."},{"label":"C","text":"Wax has no physical properties."},{"label":"D","text":"Honeycomb is actually made of squares."}],"answer":"B","explanation":"The passage distinguishes structural efficiency from conscious mathematical decision-making."},{"num":5,"prompt":"What distinction does the final paragraph ask readers to make?","choices":[{"label":"A","text":"Between geometry and every form of biology."},{"label":"B","text":"Between wax and honey."},{"label":"C","text":"Between bees and all other insects."},{"label":"D","text":"Between the efficiency of honeycomb and the process by which bee behavior evolved."}],"answer":"D","explanation":"The paragraph separates why a structure is efficient from how the behavior producing it developed."}]},{"title":"When a Map Is Not North-Up","text":"Most modern maps place north at the top, so the choice can seem like a rule of nature. It is not. A map is a designed representation, and mapmakers choose an orientation based on purpose, tradition, and audience.\n\nHistorical maps demonstrate this variety. Some medieval European maps placed east at the top because east held religious significance. Certain Islamic maps were drawn with south at the top. Navigational charts could be oriented to match a coastline or a travel route rather than a compass direction.\n\nEven today, north-up is not always the most useful choice. A transit map posted inside a station may rotate the local street grid so the direction a rider is facing appears at the top. A hiking map might be turned while someone walks so that the path ahead points upward. Digital map applications frequently rotate automatically when a user chooses turn-by-turn navigation.\n\nChanging orientation does not change the actual relationships among places, but it can change how quickly a reader understands them. A map that matches the viewer's direction can make “left” and “right” easier to interpret. On the other hand, a fixed north-up map makes it simpler to compare one map with another.\n\nGood map reading therefore requires more than recognizing symbols. It also requires checking orientation. The small compass arrow that many readers ignore may be the clue that prevents a very confident walk in exactly the wrong direction.\n\nOrientation can also influence judgment, not just navigation. Studies of map reading suggest that people may treat locations shown “above” others as more important or farther north even when the map has been rotated. Designers therefore have to consider whether a convenient orientation could also create a mistaken impression. A map is useful partly because it simplifies reality, but every simplification directs attention in particular ways.\n\nMapmakers face a similar issue with scale and detail. A transit map may distort distance so that stations and transfer points remain readable. That distortion can help a rider plan connections while making the map poor for estimating how far apart neighborhoods really are. A map is therefore not merely a smaller copy of the world. It is an argument about which relationships matter for a particular task. Skilled readers ask what the map was designed to help them see—and what it may make harder to notice.\n\nThe same map can therefore be excellent for one task and misleading for another. A commuter may want quick transfer information; a city planner may need accurate distance and direction. Neither reader is necessarily using the “better” map. The important question is whether the design matches the purpose. Evaluating a map means examining both what it reveals efficiently and what it intentionally leaves out.","questions":[{"num":6,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Map orientation is a design choice, and different orientations can serve different purposes."},{"label":"B","text":"Map orientation is a design choice that can change with purpose and audience."},{"label":"C","text":"North must always appear at the top of every map."},{"label":"D","text":"Historical mapmakers did not understand directions."}],"answer":"A","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":7,"prompt":"Why might a station map be rotated?","choices":[{"label":"A","text":"It can match the direction a rider is facing and make nearby directions easier to understand."},{"label":"B","text":"To make north point downward on every map."},{"label":"C","text":"To match the direction a rider is facing."},{"label":"D","text":"To hide nearby streets."}],"answer":"A","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":8,"prompt":"In the passage, the word “orientation” most nearly means","choices":[{"label":"A","text":"the direction in which something is positioned"},{"label":"B","text":"the distance between two points"},{"label":"C","text":"a sudden warning"},{"label":"D","text":"the age of a map"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":9,"prompt":"How does the added paragraph complicate the earlier claim that orientation can help readers?","choices":[{"label":"A","text":"Orientation changes the actual locations of places."},{"label":"B","text":"North-up maps cannot be compared."},{"label":"C","text":"A rotated map always becomes impossible to read."},{"label":"D","text":"A convenient orientation can also create misleading impressions."}],"answer":"D","explanation":"The paragraph shows that orientation can improve usability while also influencing perception."},{"num":10,"prompt":"What concern does the final paragraph raise about map orientation?","choices":[{"label":"A","text":"Rotated maps cannot show distance."},{"label":"B","text":"Orientation can influence a reader's judgments as well as directions."},{"label":"C","text":"People never notice compass arrows."},{"label":"D","text":"North-up maps are always inaccurate."}],"answer":"B","explanation":"The paragraph explains that layout can shape impressions of importance or location."}]},{"title":"The Bell in the Workshop","text":"Mr. Alvarez kept a small brass bell on the highest shelf of his bicycle-repair shop. Customers rarely noticed it, but twelve-year-old Priya did. She spent Saturday mornings helping sweep floors, sort bolts, and hand her uncle tools.\n\nOne rainy morning, Priya asked why the bell was dusty when nearly everything else in the shop was polished. Her uncle lifted it carefully. “It belonged to my first bicycle,” he said.\n\nAs a teenager, Mr. Alvarez had bought a broken bicycle at a yard sale. The chain slipped, one wheel wobbled, and the brakes barely worked. He had no money for a repair shop, so he borrowed a manual from the library and learned one adjustment at a time. The bell was almost the only part that worked from the beginning.\n\nPriya expected him to say that fixing the bicycle had inspired him to become a mechanic. Instead, he shook his head. “What mattered was learning not to be embarrassed when I didn't know something,” he said. “I asked questions. I made mistakes. Then I asked better questions.”\n\nLater that morning, a customer brought in a bicycle with a clicking sound Priya had never heard. She started to step aside, assuming her uncle would solve it. Then she remembered the bell. She listened, watched, and finally asked whether the sound changed when the rider shifted gears.\n\nHer uncle smiled. “Good question.”\n\nAt closing time, Priya climbed a stool and dusted the brass bell. She put it back on the shelf, but this time she understood why it had never been thrown away.\n\nPriya eventually realizes that the bell represents a method rather than a memory alone. Her uncle's first bicycle did not teach him one permanent answer to every mechanical problem. It taught him how to approach unfamiliar problems: observe carefully, ask a question, test an idea, and revise it. The object matters because it points to a habit of learning that can transfer from one repair to another.\n\nThat habit also changes the relationship between expertise and uncertainty. Priya once assumed that an expert mechanic should recognize every sound immediately. Watching her uncle, she notices that he sometimes pauses, repeats a test, or says, “I'm not sure yet.” His expertise lies partly in knowing how to investigate uncertainty without pretending it is already solved. Priya begins to understand that asking a precise question can be evidence of knowledge rather than evidence of ignorance.\n\nBy the end of the summer, Priya begins keeping a repair notebook of her own. Instead of recording only successful fixes, she writes down tests that failed and the clues that caused her to change direction. Those notes become useful because they preserve the reasoning between the problem and the solution. A list of correct answers would tell her what worked once; the investigation record helps her approach a problem she has never seen before.","questions":[{"num":11,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"The bell helps Priya understand that learning involves asking questions and being willing not to know everything at first."},{"label":"B","text":"Old bicycle parts should always be saved."},{"label":"C","text":"A dusty bell teaches Priya that learning often begins with questions and mistakes."},{"label":"D","text":"Repair manuals are more useful than teachers."}],"answer":"A","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":12,"prompt":"How did Mr. Alvarez learn to repair his first bicycle?","choices":[{"label":"A","text":"He bought a new bicycle instead."},{"label":"B","text":"He attended a professional mechanics school."},{"label":"C","text":"He borrowed a manual and learned through questions and practice."},{"label":"D","text":"He borrowed a manual, asked questions, and learned one adjustment at a time."}],"answer":"D","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":13,"prompt":"In the passage, the word “inspired” most nearly means","choices":[{"label":"A","text":"motivated or encouraged"},{"label":"B","text":"prevented"},{"label":"C","text":"a sudden warning"},{"label":"D","text":"confused"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":14,"prompt":"Which idea best connects the bell to Priya's later behavior?","choices":[{"label":"A","text":"Both represent learning by observing, asking, testing, and revising."},{"label":"B","text":"Both suggest experts should work alone."},{"label":"C","text":"Both prove bicycles are easy to repair."},{"label":"D","text":"Both show that old objects should be polished."}],"answer":"A","explanation":"Priya applies the same problem-solving habits her uncle learned from his first bicycle."},{"num":15,"prompt":"What does the bell come to symbolize for Priya?","choices":[{"label":"A","text":"A rule that experts should never ask questions."},{"label":"B","text":"A repeatable way of approaching unfamiliar problems."},{"label":"C","text":"A reason to avoid difficult repairs."},{"label":"D","text":"A bicycle part that should be replaced."}],"answer":"B","explanation":"Priya understands that the bell represents observation, questioning, testing, and revision."}]},{"title":"Restoring a Prairie","text":"A field can look empty after farmers stop using it, but that does not mean it will automatically return to the ecosystem that existed there before. In parts of North America, conservation groups are working to restore native prairie—grasslands once shaped by deep-rooted plants, grazing animals, and periodic fire.\n\nRestoration often begins with seeds. Workers may collect seeds from nearby prairie remnants so the new site includes plants adapted to local conditions. They sow a mixture rather than a single species because healthy prairies contain many grasses and flowering plants that grow at different times of year.\n\nThe first seasons can be disappointing. Fast-growing weeds may dominate, while some native plants spend more energy developing roots than producing visible leaves and flowers. Prairie roots can extend several feet into the soil, helping plants survive drought and storing carbon underground.\n\nManagers sometimes use controlled burns to mimic a natural process. Fire removes accumulated dead material and can limit woody plants that would otherwise turn grassland into shrubland or forest. These burns are planned carefully around weather, safety, and local regulations.\n\nPrairie restoration is therefore less like planting a lawn and more like rebuilding a community. Success may take years to become obvious. As plant diversity increases, insects, birds, and other animals may return as well. The goal is not simply a field that looks wild, but an ecosystem whose many parts can support one another over time.\n\nManagers also debate what counts as a successful restoration. One site may contain many native plant species but still lack the insects that pollinate them. Another may support birds quickly even though weeds remain common. Because ecosystems develop at different rates, a single measure—such as flower count in one summer—can give an incomplete picture. Long-term monitoring helps managers distinguish temporary setbacks from deeper problems.\n\nRestoration goals can even conflict. A manager who burns frequently to control shrubs may reduce habitat needed by an insect during part of its life cycle. Delaying a burn may help that species but allow woody plants to spread. Managers sometimes divide a site into sections and treat them at different times so that not every area changes at once. Such strategies recognize that an ecosystem contains many needs that cannot always be maximized simultaneously.\n\nFor this reason, restoration teams often set several goals and revisit them over time. They may track native plant cover, soil condition, pollinator activity, bird use, and the return of invasive species. A site can improve on one measure while declining on another. Rather than treating that mixed result as failure, managers use it to decide which intervention should come next and which parts of the system may need more time.","questions":[{"num":16,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"A prairie can be restored simply by stopping farming."},{"label":"B","text":"Controlled burns should be avoided in every grassland."},{"label":"C","text":"Restoring native prairie is a long-term process that rebuilds a diverse ecosystem through seeds, management, and patience."},{"label":"D","text":"Prairie restoration is a long-term process of rebuilding a diverse ecosystem."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":17,"prompt":"Why can native prairie plants look unimpressive during their first seasons?","choices":[{"label":"A","text":"Weeds always disappear without management."},{"label":"B","text":"Some invest heavily in developing deep root systems before producing much visible growth."},{"label":"C","text":"Native plants cannot grow leaves in the first year."},{"label":"D","text":"Some plants invest energy in deep roots before visible growth."}],"answer":"B","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":18,"prompt":"In the passage, the word “dominate” most nearly means","choices":[{"label":"A","text":"move underground"},{"label":"B","text":"become the most noticeable or abundant"},{"label":"C","text":"grow at the same speed"},{"label":"D","text":"a sudden warning"}],"answer":"B","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":19,"prompt":"Which example best illustrates the final paragraph's warning about judging restoration too quickly?","choices":[{"label":"A","text":"A prairie contains both grasses and flowers."},{"label":"B","text":"A site has few flowers one summer but develops strong roots and more species later."},{"label":"C","text":"A site is measured every year."},{"label":"D","text":"Managers use more than one indicator."}],"answer":"B","explanation":"A weak-looking early season may not reveal long-term recovery."},{"num":20,"prompt":"Why does the author argue against using a single measure of restoration success?","choices":[{"label":"A","text":"Restoration should end after one season."},{"label":"B","text":"Different parts of an ecosystem can recover at different rates."},{"label":"C","text":"Birds are the only useful indicator."},{"label":"D","text":"Flower counts are always inaccurate."}],"answer":"B","explanation":"One measure can miss other parts of ecosystem recovery, so multiple measures over time are more informative."}]},{"title":"How Stage Crews Change a Scene","text":"When an audience watches a play, a room may become a forest, a kitchen, or a train station in only a few minutes. The actors receive most of the attention, but these transformations depend on a stage crew working with careful timing.\n\nSome scenery is mounted on wheels so it can roll quietly into place. Other pieces descend from above on systems of ropes, cables, and counterweights. Lighting can change the apparent time of day without moving any scenery at all. A pale blue wash may suggest morning, while a narrow beam can make one object suddenly become the center of attention.\n\nThe crew follows a sequence of cues. A cue might be a line spoken by an actor, the end of a song, or a signal from the stage manager. Each person must know not only what to move, but exactly when to move it. A set change completed ten seconds too early can reveal a surprise; one completed too late can leave actors waiting in darkness.\n\nSafety is equally important. Large scenic pieces can be heavy, and cables under tension must be inspected regularly. Before performances, crews rehearse complicated changes repeatedly, sometimes without actors, until everyone can complete the sequence smoothly.\n\nThe best stage work can be almost invisible. When a transformation feels effortless, the audience may focus entirely on the story. That apparent effortlessness, however, is usually the result of detailed planning, communication, and practice behind the scenes.\n\nA complicated change may be redesigned even after it works correctly. If six crew members can complete a transition safely but four can do it with fewer crossings in the dark, the simpler version may be more reliable. Stage managers therefore evaluate not only whether a cue succeeds once, but whether it can be repeated night after night under pressure. Consistency is part of the design.\n\nCommunication systems are designed with the same concern for failure. A cue may be given through a headset, but crews also learn what to do if the headset stops working or a scenic piece jams. The safest plan includes a controlled way to pause, skip, or modify a transition. This kind of contingency planning does not assume that mistakes are inevitable; it recognizes that live performance has limited opportunities to stop and reset. Reliability depends partly on preparing for conditions that rehearsals cannot perfectly predict.\n\nThe audience rarely sees these calculations, and that is part of the craft. Technical crews create the conditions under which the story can appear spontaneous. Their work combines physical skill with systems thinking: each person has a task, each task depends on cues, and each cue has consequences for the next. A successful transition is therefore less like moving furniture and more like executing a carefully rehearsed sequence with built-in ways to recover.","questions":[{"num":21,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Lighting is more important than all other theater work."},{"label":"B","text":"Smooth stage transformations depend on coordinated technical work and practice."},{"label":"C","text":"Smooth stage transformations depend on coordinated technical work, careful timing, rehearsal, and safety."},{"label":"D","text":"Actors are responsible for moving every piece of scenery."}],"answer":"C","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":22,"prompt":"What can serve as a cue for a stage change?","choices":[{"label":"A","text":"A spoken line, song ending, or stage-manager signal."},{"label":"B","text":"Only the opening of the curtain."},{"label":"C","text":"The audience clapping at random."},{"label":"D","text":"A spoken line, the end of a song, or a stage manager's signal can trigger a cue."}],"answer":"D","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":23,"prompt":"In the passage, the word “apparent” most nearly means","choices":[{"label":"A","text":"seeming or appearing to be true"},{"label":"B","text":"hidden from view"},{"label":"C","text":"physically impossible"},{"label":"D","text":"a sudden warning"}],"answer":"A","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":24,"prompt":"Why might a crew redesign a scene change that already works?","choices":[{"label":"A","text":"A simpler method may be safer and more repeatable over many performances."},{"label":"B","text":"Fewer crew members always make a show faster."},{"label":"C","text":"Actors prefer visible technical work."},{"label":"D","text":"Every successful cue must be changed."}],"answer":"A","explanation":"Reliability over repeated performances can justify redesign even after one successful attempt."},{"num":25,"prompt":"What idea is emphasized in the final paragraph?","choices":[{"label":"A","text":"Actors should control all technical cues."},{"label":"B","text":"Scene changes should never be redesigned after rehearsal."},{"label":"C","text":"The largest crew is always the safest."},{"label":"D","text":"A transition should be judged by repeatable safety and reliability, not just one successful attempt."}],"answer":"D","explanation":"The paragraph focuses on repeatability and reducing unnecessary complexity."}]}]},"math":{"minutes":30,"questions":[{"num":1,"prompt":"What is 205 × 12?","choices":[{"label":"A","text":"2665"},{"label":"B","text":"2448"},{"label":"C","text":"2255"},{"label":"D","text":"2460"}],"answer":"D","explanation":"205 × 12 = 2460."},{"num":2,"prompt":"A hexagon has side lengths 9, 11, 13, 10, 8, 12 meters. What is its perimeter?","choices":[{"label":"A","text":"69"},{"label":"B","text":"57"},{"label":"C","text":"63"},{"label":"D","text":"78"}],"answer":"C","explanation":"Add all six side lengths."},{"num":3,"prompt":"A pictograph uses one house symbol to represent 8 houses. Brook Lane has 6 symbols and Pine Road has 4 symbols. How many more houses are on Brook Lane?","choices":[{"label":"A","text":"2"},{"label":"B","text":"10"},{"label":"C","text":"16"},{"label":"D","text":"48"}],"answer":"C","explanation":"The difference is 2 symbols, and each symbol represents 8 houses."},{"num":4,"prompt":"If ■ = 3 × (△ + 4), what is ■ when △ = 6?","choices":[{"label":"A","text":"30"},{"label":"B","text":"13"},{"label":"C","text":"18"},{"label":"D","text":"33"}],"answer":"A","explanation":"Substitute the value of △, add 4, then multiply by 3."},{"num":5,"prompt":"What is 858 ÷ 11?","choices":[{"label":"A","text":"67"},{"label":"B","text":"77"},{"label":"C","text":"78"},{"label":"D","text":"79"}],"answer":"C","explanation":"858 ÷ 11 = 78."},{"num":6,"prompt":"In August, Maya read 9 books and Jacob read 5 books. How many more books did Maya read?","choices":[{"label":"A","text":"11"},{"label":"B","text":"9"},{"label":"C","text":"6"},{"label":"D","text":"4"}],"answer":"D","explanation":"Subtract Jacob's total from Maya's total."},{"num":7,"prompt":"A number machine squares every input. What is the output for an input of 12?","choices":[{"label":"A","text":"132"},{"label":"B","text":"144"},{"label":"C","text":"156"},{"label":"D","text":"24"}],"answer":"B","explanation":"Squaring means multiplying the number by itself."},{"num":8,"prompt":"A pitcher holds 2 quarts and a jug holds 3 quarts. Which combination holds exactly 24 quarts?","choices":[{"label":"A","text":"5 pitchers and 7 jugs"},{"label":"B","text":"4 pitchers and 7 jugs"},{"label":"C","text":"3 pitchers and 8 jugs"},{"label":"D","text":"3 pitchers and 6 jugs"}],"answer":"D","explanation":"3×2 + 6×3 = 24."},{"num":9,"prompt":"What is the value of 13 + 8 × 2?","choices":[{"label":"A","text":"106"},{"label":"B","text":"29"},{"label":"C","text":"42"},{"label":"D","text":"37"}],"answer":"B","explanation":"Multiply first: 8×2=16; then add 13 to get 29."},{"num":10,"prompt":"In a town of 7,200 graduates, about 3/8 have earned an advanced degree. About how many graduates is that?","choices":[{"label":"A","text":"4,500"},{"label":"B","text":"5,400"},{"label":"C","text":"900"},{"label":"D","text":"2,700"}],"answer":"D","explanation":"Find one-eighth of the total, then multiply by 3."},{"num":11,"prompt":"What is 3/4 + 3/8?","choices":[{"label":"A","text":"7/8"},{"label":"B","text":"1 1/8"},{"label":"C","text":"1 3/8"},{"label":"D","text":"1"}],"answer":"B","explanation":"Use a common denominator; the sum is 1 1/8."},{"num":12,"prompt":"Point P is 4 units to the right of the origin and 11 units above the origin. What are its coordinates?","choices":[{"label":"A","text":"(4, 11)"},{"label":"B","text":"(11, 4)"},{"label":"C","text":"(-4, 11)"},{"label":"D","text":"(4, -11)"}],"answer":"A","explanation":"The x-coordinate gives horizontal position and the y-coordinate gives vertical position."},{"num":13,"prompt":"Point A is at 5 on a vertical number line. Point B is 8 units below A. Where is B?","choices":[{"label":"A","text":"4"},{"label":"B","text":"-3"},{"label":"C","text":"13"},{"label":"D","text":"-5"}],"answer":"B","explanation":"Moving down means subtracting."},{"num":14,"prompt":"What is 5 3/4 − 5/8?","choices":[{"label":"A","text":"4 7/8"},{"label":"B","text":"6 3/8"},{"label":"C","text":"5 3/8"},{"label":"D","text":"5 1/8"}],"answer":"D","explanation":"Use eighths to subtract. The result is 5 1/8."},{"num":15,"prompt":"Which fraction is equivalent to 0.6?","choices":[{"label":"A","text":"1/6"},{"label":"B","text":"3/5"},{"label":"C","text":"2/3"},{"label":"D","text":"6/100"}],"answer":"B","explanation":"Convert the decimal to a fraction and simplify."},{"num":16,"prompt":"What is 5.2 × 2.0?","choices":[{"label":"A","text":"7.2"},{"label":"B","text":"10.4"},{"label":"C","text":"10.9"},{"label":"D","text":"9.9"}],"answer":"B","explanation":"Multiplying gives 10.4."},{"num":17,"prompt":"What is the mode of the data set 74, 86, 93, 86, 90, 86, 97?","choices":[{"label":"A","text":"97"},{"label":"B","text":"90"},{"label":"C","text":"86"},{"label":"D","text":"74"}],"answer":"C","explanation":"The mode is the value that appears most often."},{"num":18,"prompt":"A right triangle has one acute angle measuring 57°. What is the measure of the other acute angle?","choices":[{"label":"A","text":"147°"},{"label":"B","text":"33°"},{"label":"C","text":"123°"},{"label":"D","text":"57°"}],"answer":"B","explanation":"The two acute angles in a right triangle add to 90°."},{"num":19,"prompt":"A collector has 7 packs of baseball cards with 16 cards each and 6 packs of basketball cards with 14 cards each. Which expression finds the total number of cards?","choices":[{"label":"A","text":"(7×16)-(6×14)"},{"label":"B","text":"(7×6)+(16×14)"},{"label":"C","text":"(7 × 16) + (6 × 14)"},{"label":"D","text":"(7+6)×(16+14)"}],"answer":"C","explanation":"Find the total for each kind of card, then add the two totals."},{"num":20,"prompt":"A triangle has base 13 units and height 10 units. What is its area?","choices":[{"label":"A","text":"78"},{"label":"B","text":"55"},{"label":"C","text":"130"},{"label":"D","text":"65"}],"answer":"D","explanation":"Area = 1/2 × 13 × 10 = 65 square units."},{"num":21,"prompt":"A square has area 81 square centimeters. What is its perimeter?","choices":[{"label":"A","text":"36 centimeters"},{"label":"B","text":"9 centimeters"},{"label":"C","text":"81 centimeters"},{"label":"D","text":"18 centimeters"}],"answer":"A","explanation":"The side length is 9 cm because 9×9=81; perimeter is 4×9."},{"num":22,"prompt":"A rectangular prism measures 10 by 9 by 5 units. What is its volume?","choices":[{"label":"A","text":"455"},{"label":"B","text":"90"},{"label":"C","text":"370"},{"label":"D","text":"450"}],"answer":"D","explanation":"Volume = 10×9×5=450 cubic units."},{"num":23,"prompt":"A triangle has base 14 cm and height 9 cm. What is its area?","choices":[{"label":"A","text":"23 cm²"},{"label":"B","text":"63 cm²"},{"label":"C","text":"46 cm²"},{"label":"D","text":"126 cm²"}],"answer":"B","explanation":"Use one-half × base × height."},{"num":24,"prompt":"A tank contains 130 liters at 0 minutes and loses 8 liters every 5 minutes. How much remains after 30 minutes?","choices":[{"label":"A","text":"98"},{"label":"B","text":"74"},{"label":"C","text":"90"},{"label":"D","text":"82"}],"answer":"D","explanation":"Thirty minutes contains six 5-minute intervals, so subtract the loss six times."},{"num":25,"prompt":"A driver passes 56 intersections and stops at about 1 out of every 4. About how many stops is that?","choices":[{"label":"A","text":"42"},{"label":"B","text":"4"},{"label":"C","text":"28"},{"label":"D","text":"14"}],"answer":"D","explanation":"One out of every four means one-fourth of the total."},{"num":26,"prompt":"Cards numbered 1 through 20 are equally likely to be selected. What is the probability of selecting a prime number?","choices":[{"label":"A","text":"10 out of 20"},{"label":"B","text":"8 out of 20"},{"label":"C","text":"12 out of 20"},{"label":"D","text":"6 out of 20"}],"answer":"B","explanation":"There are eight prime numbers from 1 through 20."},{"num":27,"prompt":"When it is 9:00 a.m. in City A, it is 1:00 p.m. in City B. When it is 7:00 p.m. in City B, what time is it in City A?","choices":[{"label":"A","text":"3:00 p.m."},{"label":"B","text":"11:00 p.m."},{"label":"C","text":"5:00 p.m."},{"label":"D","text":"11:00 a.m."}],"answer":"A","explanation":"City B is four hours ahead of City A, so subtract four hours."},{"num":28,"prompt":"The mean of five scores is 23. Four scores are 17, 21, 24, 28. What is the fifth score?","choices":[{"label":"A","text":"22"},{"label":"B","text":"25"},{"label":"C","text":"27"},{"label":"D","text":"23"}],"answer":"B","explanation":"The total of five scores is 115; subtract the four known scores to get 25."},{"num":29,"prompt":"A jacket costs $130 and is discounted 15%. What is the sale price?","choices":[{"label":"A","text":"$101"},{"label":"B","text":"$121"},{"label":"C","text":"$111"},{"label":"D","text":"$115"}],"answer":"C","explanation":"The discount is $19; $130−$19=$111."},{"num":30,"prompt":"A scientist records each plant's height, mass, number of leaves, and flower color. Which question is NOT statistical for this data set?","choices":[{"label":"A","text":"What was the typical plant height?"},{"label":"B","text":"What color was Plant 7's flower?"},{"label":"C","text":"How did mass vary among the plants?"},{"label":"D","text":"What fraction of the plants had red flowers?"}],"answer":"B","explanation":"A statistical question expects variability across multiple observations; asking for one specific plant's color does not."}]},"essay":{"prompt":"Imagine your school could add one new weekly activity for all students. What activity would you choose, and why would it be valuable?","guidance":"State your choice clearly, support it with specific reasons and examples, and organize your ideas into paragraphs.","minutes":30},"difficulty":{"label":"Advanced","score":5,"description":"More abstract vocabulary, competing evidence, and multi-condition math and reasoning."}},"lower-test6":{"title":"Lower Level Practice Test #6","verbal":{"minutes":20,"questions":[{"num":1,"prompt":"ACQUIESCE:","choices":[{"label":"A","text":"withdraw"},{"label":"B","text":"consent"},{"label":"C","text":"predict"},{"label":"D","text":"protest"}],"answer":"B","explanation":"To acquiesce is to accept something without further resistance.","part":"Synonyms"},{"num":2,"prompt":"ASSIDUOUS:","choices":[{"label":"A","text":"sporadic"},{"label":"B","text":"careless"},{"label":"C","text":"diligent"},{"label":"D","text":"vague"}],"answer":"C","explanation":"Assiduous means showing persistent, careful effort.","part":"Synonyms"},{"num":3,"prompt":"CIRCUMSPECT:","choices":[{"label":"A","text":"cautious"},{"label":"B","text":"cheerful"},{"label":"C","text":"obvious"},{"label":"D","text":"reckless"}],"answer":"A","explanation":"Circumspect means careful to consider possible consequences.","part":"Synonyms"},{"num":4,"prompt":"CONJECTURE:","choices":[{"label":"A","text":"measurement"},{"label":"B","text":"certainty"},{"label":"C","text":"refusal"},{"label":"D","text":"supposition"}],"answer":"D","explanation":"A conjecture is a conclusion or idea based on incomplete evidence.","part":"Synonyms"},{"num":5,"prompt":"DELINEATE:","choices":[{"label":"A","text":"describe"},{"label":"B","text":"interrupt"},{"label":"C","text":"distort"},{"label":"D","text":"conceal"}],"answer":"A","explanation":"To delineate is to describe or outline precisely.","part":"Synonyms"},{"num":6,"prompt":"EPHEMERAL:","choices":[{"label":"A","text":"predictable"},{"label":"B","text":"substantial"},{"label":"C","text":"permanent"},{"label":"D","text":"short-lived"}],"answer":"D","explanation":"Ephemeral means lasting for a very short time.","part":"Synonyms"},{"num":7,"prompt":"FORTUITOUS:","choices":[{"label":"A","text":"deliberate"},{"label":"B","text":"harmful"},{"label":"C","text":"ordinary"},{"label":"D","text":"fortunate"}],"answer":"D","explanation":"Fortuitous means happening by chance in a favorable way.","part":"Synonyms"},{"num":8,"prompt":"INCONGRUOUS:","choices":[{"label":"A","text":"necessary"},{"label":"B","text":"inconsistent"},{"label":"C","text":"identical"},{"label":"D","text":"harmonious"}],"answer":"B","explanation":"Incongruous means out of place or not in harmony with its surroundings.","part":"Synonyms"},{"num":9,"prompt":"JUDICIOUS:","choices":[{"label":"A","text":"impulsive"},{"label":"B","text":"secretive"},{"label":"C","text":"sensible"},{"label":"D","text":"minor"}],"answer":"C","explanation":"Judicious means showing careful and sensible judgment.","part":"Synonyms"},{"num":10,"prompt":"NUANCED:","choices":[{"label":"A","text":"subtle"},{"label":"B","text":"simple"},{"label":"C","text":"obvious"},{"label":"D","text":"rigid"}],"answer":"A","explanation":"Nuanced means containing fine distinctions or subtle differences.","part":"Synonyms"},{"num":11,"prompt":"PRAGMATIC:","choices":[{"label":"A","text":"idealistic"},{"label":"B","text":"practical"},{"label":"C","text":"uncertain"},{"label":"D","text":"ornamental"}],"answer":"B","explanation":"Pragmatic means focused on practical results.","part":"Synonyms"},{"num":12,"prompt":"RECONCILE:","choices":[{"label":"A","text":"conceal"},{"label":"B","text":"separate"},{"label":"C","text":"resolve"},{"label":"D","text":"intensify"}],"answer":"C","explanation":"To reconcile can mean to resolve differences or make ideas consistent.","part":"Synonyms"},{"num":13,"prompt":"SALIENT:","choices":[{"label":"A","text":"irrelevant"},{"label":"B","text":"temporary"},{"label":"C","text":"prominent"},{"label":"D","text":"hidden"}],"answer":"C","explanation":"Salient means especially noticeable or important.","part":"Synonyms"},{"num":14,"prompt":"SYNTHESIZE:","choices":[{"label":"A","text":"divide"},{"label":"B","text":"obscure"},{"label":"C","text":"integrate"},{"label":"D","text":"memorize"}],"answer":"C","explanation":"To synthesize is to combine parts or ideas into a coherent whole.","part":"Synonyms"},{"num":15,"prompt":"TENUOUS:","choices":[{"label":"A","text":"obvious"},{"label":"B","text":"weak"},{"label":"C","text":"permanent"},{"label":"D","text":"robust"}],"answer":"B","explanation":"Tenuous means weak, slight, or not strongly supported.","part":"Synonyms"},{"num":16,"prompt":"UBIQUITOUS:","choices":[{"label":"A","text":"uncertain"},{"label":"B","text":"rare"},{"label":"C","text":"ancient"},{"label":"D","text":"widespread"}],"answer":"D","explanation":"Ubiquitous means present or found almost everywhere.","part":"Synonyms"},{"num":17,"prompt":"VINDICATE:","choices":[{"label":"A","text":"justify"},{"label":"B","text":"confuse"},{"label":"C","text":"accuse"},{"label":"D","text":"weaken"}],"answer":"A","explanation":"To vindicate is to show that someone or something was justified or correct.","part":"Synonyms"},{"num":18,"prompt":"After hours of debate, the smaller group chose to _____ to the majority's plan, though several members still had reservations.","choices":[{"label":"A","text":"acquiesce"},{"label":"B","text":"withdraw"},{"label":"C","text":"protest"},{"label":"D","text":"predict"}],"answer":"A","explanation":"To acquiesce is to accept a decision without further resistance.","part":"Sentence Completion"},{"num":19,"prompt":"Her _____ research habits were evident in the carefully labeled notes she had kept for three years.","choices":[{"label":"A","text":"vague"},{"label":"B","text":"careless"},{"label":"C","text":"sporadic"},{"label":"D","text":"assiduous"}],"answer":"D","explanation":"Persistent, careful work is assiduous.","part":"Sentence Completion"},{"num":20,"prompt":"Because the evidence was incomplete, the committee took a _____ approach and avoided making a sweeping claim.","choices":[{"label":"A","text":"cheerful"},{"label":"B","text":"circumspect"},{"label":"C","text":"obvious"},{"label":"D","text":"reckless"}],"answer":"B","explanation":"A circumspect approach carefully considers uncertainty and consequences.","part":"Sentence Completion"},{"num":21,"prompt":"The idea that the missing birds had changed migration routes remained a _____ until tracking data could test it.","choices":[{"label":"A","text":"conjecture"},{"label":"B","text":"refusal"},{"label":"C","text":"certainty"},{"label":"D","text":"measurement"}],"answer":"A","explanation":"A conjecture is an idea based on incomplete evidence.","part":"Sentence Completion"},{"num":22,"prompt":"The report first _____ the boundaries of the problem before evaluating possible solutions.","choices":[{"label":"A","text":"distorts"},{"label":"B","text":"delineates"},{"label":"C","text":"conceals"},{"label":"D","text":"interrupts"}],"answer":"B","explanation":"To delineate is to describe or outline precisely.","part":"Sentence Completion"},{"num":23,"prompt":"The brilliant colors were _____, fading within minutes as the thin ice crystals melted in sunlight.","choices":[{"label":"A","text":"substantial"},{"label":"B","text":"ephemeral"},{"label":"C","text":"permanent"},{"label":"D","text":"predictable"}],"answer":"B","explanation":"Something that lasts only briefly is ephemeral.","part":"Sentence Completion"},{"num":24,"prompt":"Finding the forgotten spare part in a nearby cabinet was _____; without it, the repair would have taken another week.","choices":[{"label":"A","text":"ordinary"},{"label":"B","text":"harmful"},{"label":"C","text":"fortuitous"},{"label":"D","text":"deliberate"}],"answer":"C","explanation":"A fortunate event that happened by chance is fortuitous.","part":"Sentence Completion"},{"num":25,"prompt":"The cheerful music seemed _____ during the solemn memorial ceremony.","choices":[{"label":"A","text":"harmonious"},{"label":"B","text":"necessary"},{"label":"C","text":"incongruous"},{"label":"D","text":"identical"}],"answer":"C","explanation":"The music was out of place with the solemn setting.","part":"Sentence Completion"},{"num":26,"prompt":"Rather than choosing the cheapest material automatically, the engineer made a _____ decision after comparing cost, strength, and durability.","choices":[{"label":"A","text":"impulsive"},{"label":"B","text":"secretive"},{"label":"C","text":"judicious"},{"label":"D","text":"minor"}],"answer":"C","explanation":"A careful decision weighing several factors is judicious.","part":"Sentence Completion"},{"num":27,"prompt":"The author's position is _____: she supports the project overall but questions two parts of its design.","choices":[{"label":"A","text":"rigid"},{"label":"B","text":"simple"},{"label":"C","text":"obvious"},{"label":"D","text":"nuanced"}],"answer":"D","explanation":"A position containing careful distinctions is nuanced.","part":"Sentence Completion"},{"num":28,"prompt":"The committee adopted a _____ compromise that solved the immediate scheduling problem even though it was not everyone's ideal choice.","choices":[{"label":"A","text":"uncertain"},{"label":"B","text":"pragmatic"},{"label":"C","text":"theoretical"},{"label":"D","text":"ornamental"}],"answer":"B","explanation":"A practical solution focused on results is pragmatic.","part":"Sentence Completion"},{"num":29,"prompt":"The researcher tried to _____ two studies that appeared to disagree by examining how their methods differed.","choices":[{"label":"A","text":"intensify"},{"label":"B","text":"separate"},{"label":"C","text":"conceal"},{"label":"D","text":"reconcile"}],"answer":"D","explanation":"To reconcile conflicting findings is to show how they can be made consistent.","part":"Sentence Completion"},{"num":30,"prompt":"The most _____ fact in the report was not the total cost but the sharp increase from the previous year.","choices":[{"label":"A","text":"temporary"},{"label":"B","text":"hidden"},{"label":"C","text":"irrelevant"},{"label":"D","text":"salient"}],"answer":"D","explanation":"The most important or noticeable fact is salient.","part":"Sentence Completion"},{"num":31,"prompt":"A strong conclusion should _____ evidence from several sources rather than simply list each source separately.","choices":[{"label":"A","text":"memorize"},{"label":"B","text":"synthesize"},{"label":"C","text":"divide"},{"label":"D","text":"obscure"}],"answer":"B","explanation":"To synthesize is to combine evidence into a coherent whole.","part":"Sentence Completion"},{"num":32,"prompt":"The claim rested on a _____ connection between two events that occurred months apart and had no known link.","choices":[{"label":"A","text":"permanent"},{"label":"B","text":"tenuous"},{"label":"C","text":"robust"},{"label":"D","text":"obvious"}],"answer":"B","explanation":"A weakly supported connection is tenuous.","part":"Sentence Completion"},{"num":33,"prompt":"Digital clocks are so _____ that people may encounter them in cars, ovens, phones, and classroom walls.","choices":[{"label":"A","text":"ubiquitous"},{"label":"B","text":"uncertain"},{"label":"C","text":"rare"},{"label":"D","text":"ancient"}],"answer":"A","explanation":"Something found almost everywhere is ubiquitous.","part":"Sentence Completion"},{"num":34,"prompt":"The newly discovered records helped _____ the engineer's decision, showing that her safety concerns had been justified.","choices":[{"label":"A","text":"accuse"},{"label":"B","text":"weaken"},{"label":"C","text":"confuse"},{"label":"D","text":"vindicate"}],"answer":"D","explanation":"Evidence that proves a decision was justified can vindicate it.","part":"Sentence Completion"}]},"quantitative":{"minutes":35,"questions":[{"num":1,"prompt":"The pattern is 13, 21, 19, 27, 25, ___. The rule alternates +8, −2. What comes next?","choices":[{"label":"A","text":"32"},{"label":"B","text":"33"},{"label":"C","text":"34"},{"label":"D","text":"31"}],"answer":"B","explanation":"After subtracting 2, the next step is +8, giving 33."},{"num":2,"prompt":"The ratio of red tiles to blue tiles is 3:7. If there are 30 red tiles, how many blue tiles are there?","choices":[{"label":"A","text":"70"},{"label":"B","text":"77"},{"label":"C","text":"37"},{"label":"D","text":"63"}],"answer":"A","explanation":"The ratio was multiplied by 10, so blue tiles = 7×10=70."},{"num":3,"prompt":"If 5 × □ = 55, what number belongs in the box?","choices":[{"label":"A","text":"9"},{"label":"B","text":"11"},{"label":"C","text":"50"},{"label":"D","text":"13"}],"answer":"B","explanation":"55 ÷ 5 = 11."},{"num":4,"prompt":"If 12 × 8 = 96, which equation is in the same fact family?","choices":[{"label":"A","text":"96 ÷ 12 = 8"},{"label":"B","text":"12 + 8 = 96"},{"label":"C","text":"96 ÷ 8 = 13"},{"label":"D","text":"96 - 12 = 8"}],"answer":"A","explanation":"Multiplication and division are inverse operations."},{"num":5,"prompt":"A box holds 120 beads. 2/5 are used for one project, and 9 more are used later. How many beads remain?","choices":[{"label":"A","text":"54"},{"label":"B","text":"72"},{"label":"C","text":"63"},{"label":"D","text":"58"}],"answer":"C","explanation":"2/5 of 120 is 48. Then 120−48−9=63."},{"num":6,"prompt":"The mean of five numbers is 23. Four are 18, 21, 24, 26. What is the fifth number?","choices":[{"label":"A","text":"24"},{"label":"B","text":"26"},{"label":"C","text":"23"},{"label":"D","text":"28"}],"answer":"B","explanation":"The total must be 115. Subtracting the four known values leaves 26."},{"num":7,"prompt":"A bag contains 10 red, 3 blue, and 5 green counters. What is the probability of choosing a red or green counter?","choices":[{"label":"A","text":"5/18"},{"label":"B","text":"5/9"},{"label":"C","text":"1/6"},{"label":"D","text":"5/6"}],"answer":"D","explanation":"There are 15 favorable counters out of 18, so the probability is 5/6."},{"num":8,"prompt":"A rectangle has perimeter 64 units and width 12 units. What is its area?","choices":[{"label":"A","text":"240"},{"label":"B","text":"252"},{"label":"C","text":"768"},{"label":"D","text":"228"}],"answer":"A","explanation":"L+W=32, so L=20. The area is 20×12=240."},{"num":9,"prompt":"A workshop begins at 8:35 a.m. and lasts 135 minutes. What time does it end?","choices":[{"label":"A","text":"11:20"},{"label":"B","text":"10:35"},{"label":"C","text":"10:50"},{"label":"D","text":"11:05"}],"answer":"C","explanation":"Adding 135 minutes to 8:35 gives 10:50."},{"num":10,"prompt":"On a map, 1 centimeter represents 11 kilometers. Two towns are 5 centimeters apart. What is the actual distance?","choices":[{"label":"A","text":"44 km"},{"label":"B","text":"16 km"},{"label":"C","text":"55 km"},{"label":"D","text":"66 km"}],"answer":"C","explanation":"Multiply 5 by 11; the actual distance is 55 km."},{"num":11,"prompt":"A number is multiplied by 4, then 10 is subtracted. The result is 46. What was the original number?","choices":[{"label":"A","text":"13"},{"label":"B","text":"15"},{"label":"C","text":"14"},{"label":"D","text":"12"}],"answer":"C","explanation":"Undo the subtraction, then divide by 4: (46+10)÷4=14."},{"num":12,"prompt":"Of 44 students, 24 chose art, 22 chose music, and 4 chose neither. How many chose both art and music?","choices":[{"label":"A","text":"6"},{"label":"B","text":"5"},{"label":"C","text":"4"},{"label":"D","text":"7"}],"answer":"A","explanation":"40 chose at least one. The overlap is 24+22−40=6."},{"num":13,"prompt":"Adult tickets cost $17 and child tickets cost $10. Which expression gives the cost for 3 adults and 4 children?","choices":[{"label":"A","text":"(17 × 4) + (10 × 3)"},{"label":"B","text":"(17 + 10) × (3 + 4)"},{"label":"C","text":"(17 × 3) + (10 × 4)"},{"label":"D","text":"(17 × 3) - (10 × 4)"}],"answer":"C","explanation":"Multiply each ticket price by the number of tickets of that type, then add."},{"num":14,"prompt":"Of 96 counters, 39 are red and the rest are blue. What fraction of the counters are blue?","choices":[{"label":"A","text":"57/96"},{"label":"B","text":"96/57"},{"label":"C","text":"57/39"},{"label":"D","text":"39/96"}],"answer":"A","explanation":"Subtract red counters from the total to find the number of blue counters, then place that over the total."},{"num":15,"prompt":"A board is 11 feet 8 inches long. How many inches long is it?","choices":[{"label":"A","text":"128"},{"label":"B","text":"132"},{"label":"C","text":"152"},{"label":"D","text":"140"}],"answer":"D","explanation":"11 feet = 132 inches; add 8 to get 140."},{"num":16,"prompt":"Different shapes represent digits. If ○ + □ + □ = 19 and □ = 6, what digit does ○ represent?","choices":[{"label":"A","text":"8"},{"label":"B","text":"6"},{"label":"C","text":"13"},{"label":"D","text":"7"}],"answer":"D","explanation":"Subtract the value of the two squares from the total."},{"num":17,"prompt":"Which statement must be true about a net that folds into a cube?","choices":[{"label":"A","text":"It has four triangular faces."},{"label":"B","text":"It has one circular face."},{"label":"C","text":"It has six square faces."},{"label":"D","text":"It has exactly five faces."}],"answer":"C","explanation":"A cube has six square faces, so any valid cube net contains six squares."},{"num":18,"prompt":"A rectangle has length 21 meters and perimeter 64 meters. What is its width?","choices":[{"label":"A","text":"21"},{"label":"B","text":"11"},{"label":"C","text":"32"},{"label":"D","text":"13"}],"answer":"B","explanation":"For a rectangle, half the perimeter equals length plus width."},{"num":19,"prompt":"A circle graph is divided into 8 equal sectors. Three sectors represent students who chose art. What fraction chose art?","choices":[{"label":"A","text":"3/5"},{"label":"B","text":"5/8"},{"label":"C","text":"1/3"},{"label":"D","text":"3/8"}],"answer":"D","explanation":"Three of the eight equal sectors represent art."},{"num":20,"prompt":"A team has 16 women and 8 men. 32 balls are shared equally among the women and 32 balls equally among the men. Which statement is true?","choices":[{"label":"A","text":"Each man receives twice as many as each woman."},{"label":"B","text":"Each woman receives twice as many as each man."},{"label":"C","text":"Each person receives the same number."},{"label":"D","text":"Each man receives one fewer than each woman."}],"answer":"A","explanation":"Each woman gets 2; each man gets 4."},{"num":21,"prompt":"After a 25% increase, an item costs $150. What was its original price?","choices":[{"label":"A","text":"$130"},{"label":"B","text":"$140"},{"label":"C","text":"$110"},{"label":"D","text":"$120"}],"answer":"D","explanation":"$150 represents 125% of the original price, so the original was $120."},{"num":22,"prompt":"The pattern is 14, 23, 21, 30, 28, ___. The rule alternates +9, −2. What comes next?","choices":[{"label":"A","text":"35"},{"label":"B","text":"36"},{"label":"C","text":"38"},{"label":"D","text":"37"}],"answer":"D","explanation":"After subtracting 2, the next step is +9, giving 37."},{"num":23,"prompt":"The ratio of red tiles to blue tiles is 4:5. If there are 44 red tiles, how many blue tiles are there?","choices":[{"label":"A","text":"60"},{"label":"B","text":"49"},{"label":"C","text":"55"},{"label":"D","text":"50"}],"answer":"C","explanation":"The ratio was multiplied by 11, so blue tiles = 5×11=55."},{"num":24,"prompt":"A box holds 125 beads. 2/5 are used for one project, and 9 more are used later. How many beads remain?","choices":[{"label":"A","text":"66"},{"label":"B","text":"61"},{"label":"C","text":"75"},{"label":"D","text":"57"}],"answer":"A","explanation":"2/5 of 125 is 50. Then 125−50−9=66."},{"num":25,"prompt":"The mean of five numbers is 24. Four are 18, 22, 24, 27. What is the fifth number?","choices":[{"label":"A","text":"26"},{"label":"B","text":"29"},{"label":"C","text":"31"},{"label":"D","text":"27"}],"answer":"B","explanation":"The total must be 120. Subtracting the four known values leaves 29."},{"num":26,"prompt":"A bag contains 11 red, 4 blue, and 5 green counters. What is the probability of choosing a red or green counter?","choices":[{"label":"A","text":"1/4"},{"label":"B","text":"4/5"},{"label":"C","text":"11/20"},{"label":"D","text":"1/5"}],"answer":"B","explanation":"There are 16 favorable counters out of 20, so the probability is 4/5."},{"num":27,"prompt":"A rectangle has perimeter 68 units and width 13 units. What is its area?","choices":[{"label":"A","text":"273"},{"label":"B","text":"286"},{"label":"C","text":"260"},{"label":"D","text":"884"}],"answer":"A","explanation":"L+W=34, so L=21. The area is 21×13=273."},{"num":28,"prompt":"An airplane has 80 seats. 32 are aisle seats and the rest are window seats. What is the probability of being assigned a window seat?","choices":[{"label":"A","text":"8/15"},{"label":"B","text":"3/5"},{"label":"C","text":"1/2"},{"label":"D","text":"2/5"}],"answer":"B","explanation":"Find the number of window seats, then divide by the total number of seats."},{"num":29,"prompt":"A workshop begins at 9:35 a.m. and lasts 150 minutes. What time does it end?","choices":[{"label":"A","text":"12:35"},{"label":"B","text":"12:20"},{"label":"C","text":"12:05"},{"label":"D","text":"11:50"}],"answer":"C","explanation":"Adding 150 minutes to 9:35 gives 12:05."},{"num":30,"prompt":"On a map, 1 centimeter represents 12 kilometers. Two towns are 6 centimeters apart. What is the actual distance?","choices":[{"label":"A","text":"60 km"},{"label":"B","text":"84 km"},{"label":"C","text":"72 km"},{"label":"D","text":"18 km"}],"answer":"C","explanation":"Multiply 6 by 12; the actual distance is 72 km."},{"num":31,"prompt":"54 candles are divided equally among 6 bags, while 60 candles are divided equally among 10 cases. Which statement is true?","choices":[{"label":"A","text":"Each bag has more candles than each case."},{"label":"B","text":"Each case has more candles than each bag."},{"label":"C","text":"Each case has twice as many as each bag."},{"label":"D","text":"Each bag and case has the same number."}],"answer":"A","explanation":"Each bag gets 9 candles and each case gets 6."},{"num":32,"prompt":"A number is multiplied by 4, then 11 is subtracted. The result is 49. What was the original number?","choices":[{"label":"A","text":"13"},{"label":"B","text":"15"},{"label":"C","text":"16"},{"label":"D","text":"14"}],"answer":"B","explanation":"Undo the subtraction, then divide by 4: (49+11)÷4=15."},{"num":33,"prompt":"Of 46 students, 25 chose art, 23 chose music, and 5 chose neither. How many chose both art and music?","choices":[{"label":"A","text":"7"},{"label":"B","text":"5"},{"label":"C","text":"6"},{"label":"D","text":"8"}],"answer":"A","explanation":"41 chose at least one. The overlap is 25+23−41=7."},{"num":34,"prompt":"A balanced scale represents 2○ + □ = 20. If ○ = 6, what is □?","choices":[{"label":"A","text":"14"},{"label":"B","text":"8"},{"label":"C","text":"10"},{"label":"D","text":"6"}],"answer":"B","explanation":"Subtract the value of two circles from the total."},{"num":35,"prompt":"A grid has 40 equal squares and 28 are shaded. What percentage is shaded?","choices":[{"label":"A","text":"30%"},{"label":"B","text":"80%"},{"label":"C","text":"70%"},{"label":"D","text":"60%"}],"answer":"C","explanation":"Divide the shaded squares by the total and convert to a percent."},{"num":36,"prompt":"The relationship is L = 4B. If B increases by 2, by how much does L increase?","choices":[{"label":"A","text":"2"},{"label":"B","text":"8"},{"label":"C","text":"4"},{"label":"D","text":"10"}],"answer":"B","explanation":"Because L is 4 times B, a 2-unit increase in B creates a 8-unit increase in L."},{"num":37,"prompt":"A box has 36 crayons that are not purple and some purple crayons. If the probability of choosing purple is 1/4, how many purple crayons are there?","choices":[{"label":"A","text":"12"},{"label":"B","text":"9"},{"label":"C","text":"14"},{"label":"D","text":"10"}],"answer":"A","explanation":"If purple is one-fourth of the total, the non-purple crayons make up three-fourths. The purple count is one-third of the non-purple count."},{"num":38,"prompt":"Each large cube has a volume of 1,000 cubic inches. What expression gives the volume of 28 such cubes?","choices":[{"label":"A","text":"28 + 1,000"},{"label":"B","text":"1,000 ÷ 28"},{"label":"C","text":"28 × 1,000"},{"label":"D","text":"28 × 100"}],"answer":"C","explanation":"Multiply the volume of one cube by the number of cubes."}]},"reading":{"minutes":25,"passages":[{"title":"Why Some Lakes Turn Over","text":"A deep lake can behave very differently in summer than it does in spring or autumn. During warm months, sunlight heats the upper water. Warm water is less dense than colder water, so it tends to remain near the surface. Meanwhile, deeper water stays cool. The lake becomes divided into layers that do not mix easily.\n\nThis separation affects oxygen and nutrients. Surface water gains oxygen from the air and from photosynthetic organisms. Deeper water may gradually lose oxygen as organisms use it and as dead material decomposes. Nutrients released near the bottom can remain trapped there while the layers stay separate.\n\nIn autumn, surface water cools. As the temperature difference between upper and lower water shrinks, wind can mix the lake more thoroughly. This seasonal mixing is called turnover. It can carry oxygen downward and bring nutrients upward. A similar process may occur in spring after ice melts and water temperatures become more uniform.\n\nNot every lake turns over in exactly the same way. Depth, climate, wind exposure, and even the shape of a lake basin can affect mixing. Very shallow lakes may mix frequently, while some unusual deep lakes can remain layered for long periods.\n\nLake turnover shows how a small physical property—water's changing density—can influence an entire ecosystem. Fish habitat, algae growth, and the movement of nutrients are all connected to whether lake water is separated into layers or circulating from top to bottom.\n\nScientists studying a lake cannot assume that observing one turnover reveals a permanent pattern. A warm autumn can delay mixing, unusual winds can deepen it, and changes in water clarity can alter how far sunlight penetrates. Climate trends may shift these relationships over decades. Researchers therefore combine temperature sensors, oxygen measurements, weather records, and repeated observations rather than treating “turnover” as a single event that happens identically every year.\n\nThese complications matter when scientists compare lakes. Two lakes at the same latitude can respond differently because one is deep and sheltered while the other is shallow and exposed to wind. Even the same lake can behave differently in separate basins. Researchers therefore avoid treating the label “deep lake” as a complete explanation. They build models that connect physical measurements to biological effects, then test those models against observations. When a model fails, the failure can reveal an overlooked process rather than simply a bad measurement.\n\nLong records become especially valuable when scientists ask whether a recent change is unusual. One late turnover may result from an unusual season; a shift that repeats across decades may point to a larger trend. Even then, researchers compare multiple lakes and consider local changes such as shoreline development or water withdrawal. Separating regional climate effects from local influences requires evidence at several scales, and conclusions are usually strongest when different lines of evidence point in the same direction.\n\nBecause these questions involve interacting causes, researchers may reach different interpretations from the same early data. Productive disagreement focuses on which measurements would distinguish the explanations, turning uncertainty into a guide for the next round of observation.","questions":[{"num":1,"prompt":"What is the main idea of the passage?","choices":[{"label":"A","text":"Turnover occurs because fish stir the water."},{"label":"B","text":"Seasonal temperature changes can mix lake layers and redistribute oxygen and nutrients."},{"label":"C","text":"Deep lakes always have the same temperature at every depth."},{"label":"D","text":"Seasonal temperature changes can cause lake layers to mix, redistributing oxygen and nutrients."}],"answer":"D","explanation":"This choice best summarizes the passage as a whole.","strand":"Main Idea"},{"num":2,"prompt":"Why does deeper lake water often lose oxygen during summer layering?","choices":[{"label":"A","text":"Cold water cannot contain oxygen."},{"label":"B","text":"Sunlight removes all oxygen from deep water."},{"label":"C","text":"Organisms use oxygen and decomposition consumes it while little mixing replaces it."},{"label":"D","text":"Organisms use oxygen while little mixing replaces it."}],"answer":"C","explanation":"This answer is stated or directly supported by the passage.","strand":"Supporting Ideas"},{"num":3,"prompt":"In the passage, the word “uniform” most nearly means","choices":[{"label":"A","text":"measured inaccurately"},{"label":"B","text":"moving rapidly"},{"label":"C","text":"similar throughout"},{"label":"D","text":"a sudden warning"}],"answer":"C","explanation":"The surrounding context supports this meaning.","strand":"Vocabulary in Context"},{"num":4,"prompt":"Which statement best explains why a single autumn's turnover cannot establish a permanent rule for a lake?","choices":[{"label":"A","text":"Mixing depends on several conditions that can change across years."},{"label":"B","text":"Temperature has no effect on density."},{"label":"C","text":"Turnover never repeats."},{"label":"D","text":"Lake depth changes every season."}],"answer":"A","explanation":"Weather, wind, clarity, and long-term trends can change mixing patterns."},{"num":5,"prompt":"Why does the author emphasize repeated observations in the final paragraph?","choices":[{"label":"A","text":"Because a lake's mixing pattern can vary from year to year and with long-term conditions."},{"label":"B","text":"Because weather has no relationship to mixing."},{"label":"C","text":"Because one sensor can measure every part of a lake."},{"label":"D","text":"Because turnover occurs only once in a lake's history."}],"answer":"A","explanation":"The paragraph explains that several changing factors can alter the timing and depth of mixing."}]},{"title":"The Problem With Perfect Predictions","text":"Weather forecasts have improved dramatically because meteorologists can combine satellite observations, radar, ground measurements, and powerful computer models. Yet a forecast can still change from one day to the next. This does not necessarily mean that the earlier forecast was careless.\n\nThe atmosphere is a complex system. A small difference in temperature, humidity, or wind at one location can influence how conditions develop later. No observing network measures every point in the atmosphere perfectly, so computer models begin with estimates. Different models may also represent clouds, oceans, and land surfaces in slightly different ways.\n\nTo deal with uncertainty, meteorologists often run a model many times with slightly altered starting conditions. This collection is called an ensemble. If nearly all runs produce heavy rain in the same region, forecasters gain confidence. If the runs disagree widely, the forecast is less certain.\n\nThis is why a 40 percent chance of rain is not a failed prediction if a particular backyard stays dry. The percentage expresses uncertainty over an area and time period; it does not promise that rain will occur at every location.\n\nForecasting therefore involves more than selecting a single future from a computer screen. Meteorologists compare evidence, study patterns, and communicate how confident they are. A useful forecast is not always one that sounds perfectly certain. Sometimes the most accurate message is that several outcomes remain possible.\n\nUncertainty also creates a communication problem. A forecast that lists every possible outcome may be technically careful but practically useless, while a single confident statement may hide meaningful risk. Forecasters often summarize a range of model results into probabilities and impact statements. The goal is not to eliminate uncertainty from the message, but to express it in a form that helps people make decisions despite incomplete knowledge.\n\nDecision makers may also care about different parts of the same forecast. A farmer may focus on the chance of overnight frost, while an airport manager cares about visibility and wind. A single statement such as “bad weather is possible” hides these difference
